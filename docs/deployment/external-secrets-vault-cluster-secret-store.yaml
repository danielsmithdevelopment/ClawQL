# Cluster-wide Vault backing store for External Secrets Operator.
#
# Prerequisites: install External Secrets Operator (see docs/deployment/external-secrets-operator-install.md).
# Customize:
# - spec.provider.vault.server (TLS URL in prod)
# - auth.kubernetes.mountPath / role / audiences (Vault 1.21+ audiences required)
# - serviceAccountRef: must match your ESO controller ServiceAccount from:
#     kubectl get sa -n external-secrets
#
# Typical install: Helm release name "external-secrets" → SA name "external-secrets" in ns "external-secrets".
#
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: clawql-vault-kv
spec:
  provider:
    vault:
      # In-cluster Helm release clawql deploys svc/clawql-hashicorpvault in namespace clawql.
      # DNS is case-normalized — prefer lowercase FQDN in production.
      server: "http://clawql-hashicorpvault.clawql.svc.cluster.local:8200"
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "clawql-eso-read"
          serviceAccountRef:
            name: "external-secrets"
            namespace: "external-secrets"
            # Required with Vault 1.21+ when the Vault role sets audience=vault (see bootstrap script).
            audiences:
              - vault
