apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: clawql-provider-env
  namespace: clawql
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: clawql-vault-kv
    kind: ClusterSecretStore
  target:
    name: clawql-provider-env
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    # Vault KV path: secret/clawql/providers → fields githubToken/slackToken/onyxApiToken
    # (write with: kubectl exec … vault kv put … — see docs/deployment/external-secrets-operator-install.md)
    - secretKey: CLAWQL_GITHUB_TOKEN
      remoteRef:
        key: clawql/providers
        property: githubToken
    - secretKey: CLAWQL_SLACK_TOKEN
      remoteRef:
        key: clawql/providers
        property: slackToken
    - secretKey: ONYX_API_TOKEN
      remoteRef:
        key: clawql/providers
        property: onyxApiToken
