apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: clawql-provider-env
  namespace: clawql
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: clawql-vault-kv
    kind: ClusterSecretStore
  target:
    name: clawql-provider-env
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    # Vault KV path: secret/clawql/providers — full catalog ([#241](https://github.com/danielsmithdevelopment/ClawQL/issues/241)).
    # Prefer Helm `secretSourcing.externalSecrets.enabled=true` or `make bootstrap-vault-eso` for release-templated URLs.
    - secretKey: CLAWQL_GITHUB_TOKEN
      remoteRef:
        key: clawql/providers
        property: githubToken
    - secretKey: CLAWQL_SLACK_TOKEN
      remoteRef:
        key: clawql/providers
        property: slackToken
    - secretKey: ONYX_API_TOKEN
      remoteRef:
        key: clawql/providers
        property: onyxApiToken
    - secretKey: PAPERLESS_API_TOKEN
      remoteRef:
        key: clawql/providers
        property: paperlessApiToken
    - secretKey: STIRLING_API_KEY
      remoteRef:
        key: clawql/providers
        property: stirlingApiKey
    - secretKey: DOCLING_API_KEY
      remoteRef:
        key: clawql/providers
        property: doclingApiKey
    - secretKey: NEXTCLOUD_USERNAME
      remoteRef:
        key: clawql/providers
        property: nextcloudUsername
    - secretKey: NEXTCLOUD_APP_PASSWORD
      remoteRef:
        key: clawql/providers
        property: nextcloudAppPassword
    - secretKey: CONESHARE_API_TOKEN
      remoteRef:
        key: clawql/providers
        property: coneshareApiToken
    - secretKey: CLAWQL_CLOUDFLARE_API_TOKEN
      remoteRef:
        key: clawql/providers
        property: cloudflareApiToken
    - secretKey: CLAWQL_GOOGLE_ACCESS_TOKEN
      remoteRef:
        key: clawql/providers
        property: googleAccessToken
    - secretKey: CLAWQL_ATLASSIAN_TOKEN
      remoteRef:
        key: clawql/providers
        property: atlassianApiToken
    - secretKey: CLAWQL_LABEL_STUDIO_API_TOKEN
      remoteRef:
        key: clawql/providers
        property: labelStudioApiToken
    - secretKey: CLAWQL_HITL_WEBHOOK_TOKEN
      remoteRef:
        key: clawql/providers
        property: hitlWebhookToken
    - secretKey: CLAWQL_CONESHARE_WEBHOOK_TOKEN
      remoteRef:
        key: clawql/providers
        property: coneshareWebhookToken
