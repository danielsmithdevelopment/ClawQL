# IDP B-2.3 smoke stack — compose-able DEFAULT_IDP_PIPELINE vendors.
# Used by scripts/dev/smoke-idp-pipeline-b23.sh (tier=compose).
#
# Included: tika, gotenberg, stirling, paperless (+postgres/redis), nextcloud,
#           onyx (OpenSearch + redis + indexing model — ingest needs vector DB),
#           coneshare (open-source conesharedev/coneshare + postgres/redis)
# Optional profile `docling`: quay.io/docling-project/docling-serve-cpu (large ~4GiB)
#
# Onyx note: DISABLE_VECTOR_DB=true (Helm fullVectorStack=false / Onyx Lite) does
# NOT expose usable POST /onyx-api/ingestion (require_vector_db → 501 / route miss).
# Smoke therefore boots a trimmed vector stack (no Vespa/MinIO/background/web).

name: clawql-idp-smoke

services:
  tika:
    image: apache/tika:2.9.2.1
    container_name: clawql-idp-tika
    ports:
      - "9998:9998"

  gotenberg:
    image: gotenberg/gotenberg:8.8
    container_name: clawql-idp-gotenberg
    command: ["gotenberg", "--api-timeout=60s"]
    ports:
      - "3000:3000"

  stirling:
    image: frooodle/s-pdf:0.45.0
    container_name: clawql-idp-stirling
    environment:
      DOCKER_ENABLE_SECURITY: "false"
      SECURITY_ENABLE_LOGIN: "false"
      # Match Helm lab default when auth is off — empty key is fine for smoke.
      API_KEY: ""
    ports:
      - "18080:8080"

  redis:
    image: redis:7-alpine
    container_name: clawql-idp-redis

  postgres:
    image: postgres:16-alpine
    container_name: clawql-idp-postgres
    environment:
      POSTGRES_DB: paperless
      POSTGRES_USER: paperless
      POSTGRES_PASSWORD: paperless
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paperless -d paperless"]
      interval: 5s
      timeout: 5s
      retries: 12

  paperless-ngx:
    image: ghcr.io/paperless-ngx/paperless-ngx:2.15.0
    container_name: clawql-idp-paperless
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      tika:
        condition: service_started
      gotenberg:
        condition: service_started
    environment:
      # Host URL — CSRF / absolute links when hitting published port 8000
      PAPERLESS_URL: http://127.0.0.1:8000
      PAPERLESS_CSRF_TRUSTED_ORIGINS: http://127.0.0.1:8000,http://localhost:8000
      PAPERLESS_ALLOWED_HOSTS: localhost,127.0.0.1,paperless-ngx
      PAPERLESS_TIKA_ENABLED: "1"
      PAPERLESS_TIKA_ENDPOINT: http://tika:9998
      PAPERLESS_TIKA_GOTENBERG_ENDPOINT: http://gotenberg:3000
      PAPERLESS_REDIS: redis://redis:6379
      PAPERLESS_DBHOST: postgres
      PAPERLESS_DBPORT: "5432"
      PAPERLESS_DBNAME: paperless
      PAPERLESS_DBUSER: paperless
      PAPERLESS_DBPASS: paperless
      PAPERLESS_SECRET_KEY: clawql-idp-smoke-secret
      PAPERLESS_ADMIN_USER: admin
      PAPERLESS_ADMIN_PASSWORD: admin
      PAPERLESS_ADMIN_MAIL: admin@localhost
      # Faster first boot on GHA (skip heavy OCR worker spin-up for smoke)
      PAPERLESS_WORKER_TIMEOUT: "60"
      PAPERLESS_TASK_WORKERS: "1"
      PAPERLESS_THREADS_PER_WORKER: "1"
    volumes:
      - paperless-data:/usr/src/paperless/data
      - paperless-media:/usr/src/paperless/media
      - paperless-export:/usr/src/paperless/export
      - paperless-consume:/usr/src/paperless/consume
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000"]
      interval: 10s
      timeout: 5s
      retries: 36
      start_period: 90s

  nextcloud:
    image: nextcloud:29-apache
    container_name: clawql-idp-nextcloud
    environment:
      SQLITE_DATABASE: nextcloud
      NEXTCLOUD_ADMIN_USER: admin
      NEXTCLOUD_ADMIN_PASSWORD: admin
      NEXTCLOUD_TRUSTED_DOMAINS: localhost 127.0.0.1 nextcloud
    ports:
      - "18081:80"

  # --- Onyx (trimmed vector stack for POST /onyx-api/ingestion) ---
  # Matches upstream compose search backend (OpenSearch), not Vespa. No web UI,
  # MinIO, or Celery background — API indexes in-process for upsert smoke.
  onyx-postgres:
    image: postgres:15.2-alpine
    container_name: clawql-idp-onyx-postgres
    environment:
      POSTGRES_DB: onyx
      POSTGRES_USER: onyx
      POSTGRES_PASSWORD: onyx
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U onyx -d onyx"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - onyx-pg-data:/var/lib/postgresql/data

  onyx-redis:
    image: redis:7.4-alpine
    container_name: clawql-idp-onyx-redis
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  onyx-opensearch:
    image: opensearchproject/opensearch:3.6.0
    container_name: clawql-idp-onyx-opensearch
    environment:
      discovery.type: single-node
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: StrongPassword123!
      # Small heap for GHA (~7 GiB free after stopping Paperless/Stirling/Tika).
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
      bootstrap.memory_lock: "true"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      # Host probe only (smoke script); not required by Onyx API (uses Docker DNS).
      - "19200:9200"

  # Single model server for indexing embeddings (inference host points here too).
  onyx-indexing-model:
    image: onyxdotapp/onyx-model-server:latest
    container_name: clawql-idp-onyx-indexing-model
    environment:
      INDEXING_ONLY: "True"
    volumes:
      - onyx-indexing-hf-cache:/app/.cache/huggingface/
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9000/api/health')",
        ]
      interval: 20s
      timeout: 10s
      retries: 60
      start_period: 600s

  onyx-api:
    image: onyxdotapp/onyx-backend:latest
    container_name: clawql-idp-onyx-api
    depends_on:
      onyx-postgres:
        condition: service_healthy
      onyx-redis:
        condition: service_healthy
      onyx-opensearch:
        condition: service_started
      onyx-indexing-model:
        condition: service_started
    command:
      - /bin/sh
      - -c
      - >
        alembic upgrade head &&
        echo "Starting Onyx Api Server" &&
        uvicorn onyx.main:app --host 0.0.0.0 --port 8080
    environment:
      AUTH_TYPE: basic
      USER_AUTH_SECRET: clawql-idp-smoke-onyx-user-auth-secret
      POSTGRES_HOST: onyx-postgres
      POSTGRES_USER: onyx
      POSTGRES_PASSWORD: onyx
      POSTGRES_DB: onyx
      # Vector DB required for upsert_ingestion_doc (Onyx Lite hides/gates it).
      DISABLE_VECTOR_DB: "false"
      FILE_STORE_BACKEND: postgres
      # redis required when DISABLE_VECTOR_DB=false
      CACHE_BACKEND: redis
      AUTH_BACKEND: redis
      REDIS_HOST: onyx-redis
      OPENSEARCH_HOST: onyx-opensearch
      OPENSEARCH_ADMIN_PASSWORD: StrongPassword123!
      OPENSEARCH_USE_SSL: "true"
      OPENSEARCH_VERIFY_CERTS: "false"
      # Hostnames only — client prepends http://
      MODEL_SERVER_HOST: onyx-indexing-model
      INDEXING_MODEL_SERVER_HOST: onyx-indexing-model
      NUM_RETRIES_ON_STARTUP: "60"
      ENABLE_CRAFT: "false"
      ENABLE_PUBLIC_DOCS: "true"
      # Self-hosted: avoid Business-tier gate on /admin/api-key; use session cookie for ingest.
      LICENSE_ENFORCEMENT_ENABLED: "false"
      ENABLE_PAID_ENTERPRISE_EDITION_FEATURES: "true"
      REQUIRE_EMAIL_VERIFICATION: "false"
    ports:
      - "18082:8080"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')",
        ]
      interval: 15s
      timeout: 10s
      retries: 60
      start_period: 300s

  # --- ConeShare (open-source: https://github.com/coneshare/coneshare-compose) ---
  coneshare-postgres:
    image: postgres:14-bullseye
    container_name: clawql-idp-coneshare-postgres
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - coneshare-pg-data:/var/lib/postgresql/data

  coneshare-redis:
    image: redis:6.2.14-alpine
    container_name: clawql-idp-coneshare-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    volumes:
      - coneshare-redis-data:/data

  coneshare-web:
    image: conesharedev/coneshare:rolling
    container_name: clawql-idp-coneshare-web
    env_file:
      - ./coneshare-smoke.env
    depends_on:
      coneshare-postgres:
        condition: service_healthy
      coneshare-redis:
        condition: service_healthy
    volumes:
      - coneshare-data:/data
      - coneshare-media:/home/coneshare/app/media
      - coneshare-logs:/home/coneshare/logs
    ports:
      - "8999:80"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1/api/v1/_health/"]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 120s

  coneshare-celery:
    image: conesharedev/coneshare:rolling
    container_name: clawql-idp-coneshare-celery
    env_file:
      - ./coneshare-smoke.env
    command: celery -A backend worker --loglevel=info -Q celery --concurrency=1
    depends_on:
      coneshare-postgres:
        condition: service_healthy
      coneshare-redis:
        condition: service_healthy
      coneshare-web:
        condition: service_started
    volumes:
      - coneshare-data:/data
      - coneshare-media:/home/coneshare/app/media
      - coneshare-logs:/home/coneshare/logs

  # Optional — enable with: docker compose --profile docling up -d
  docling:
    profiles: ["docling"]
    image: quay.io/docling-project/docling-serve-cpu:v1.14.3
    container_name: clawql-idp-docling
    ports:
      - "5001:5001"

volumes:
  paperless-data:
  paperless-media:
  paperless-export:
  paperless-consume:
  onyx-pg-data:
  onyx-indexing-hf-cache:
  coneshare-pg-data:
  coneshare-redis-data:
  coneshare-data:
  coneshare-media:
  coneshare-logs:
