# Full product demo for Lab 5b — celld Worker stays slim; clawql-mcp + mcp-api-adapter
# run as sidecars (the production shape). Prefer the local process smoke for CI:
#   STREAMS_CELLD_SMOKE_REQUIRED=1 bash docs/examples/streams-celld/scripts/full-stack-smoke.sh
#
# Container path (from repo root):
#   docker compose -f docs/examples/streams-celld/docker-compose.full.yml up --build
#
# Then in another terminal, point celld at the published ports (or run celld on the host):
#   CLAWQL_MCP_URL=http://127.0.0.1:8080/mcp \
#   CLAWQL_MCP_ADAPTER_URL=http://127.0.0.1:8090 \
#   INFERENCE_URL=http://127.0.0.1:8081 \
#   celld dev --port 9876

services:
  clawql-mcp-http:
    build:
      context: ../..
      dockerfile: docker/Dockerfile
      target: runtime
    image: clawql-mcp:streams-celld-full
    container_name: streams-celld-mcp
    environment:
      PORT: "8080"
      MCP_PATH: /mcp
      CLAWQL_ALLOW_NO_ENFORCEMENT: "1"
      CLAWQL_ENABLE_MEMORY: "1"
      CLAWQL_OBSIDIAN_VAULT_PATH: /vault
      CLAWQL_STREAMABLE_HTTP_JSON_RESPONSE: "1"
      # Workers/cells: no MCP session affinity
      CLAWQL_MCP_STATELESS: "1"
    volumes:
      - streams-celld-vault:/vault
    ports:
      - "8080:8080"

  mcp-api-adapter:
    build:
      context: ../..
      dockerfile: docker/Dockerfile
      target: runtime
    image: clawql-mcp:streams-celld-full
    container_name: streams-celld-adapter
    depends_on:
      - clawql-mcp-http
    command:
      [
        "packages/mcp-api-adapter/bin/mcp-api-adapter.mjs",
        "--mcp-url",
        "http://clawql-mcp-http:8080/mcp",
        "--listen",
        "0.0.0.0:8090",
        "--no-grpc",
        "--no-mcp-ui",
        "--title",
        "streams-celld-full-stack",
      ]
    ports:
      - "8090:8090"

  # Optional: real inference gateway (needs provider keys in env).
  # Cells today only probe /healthz in the skeleton — stub is enough for smoke.
  clawql-inference:
    profiles: ["with-inference"]
    build:
      context: ../..
      dockerfile: docker/Dockerfile
      target: runtime
    image: clawql-mcp:streams-celld-full
    container_name: streams-celld-inference
    command: ["packages/clawql-inference/bin/clawql-inference.mjs"]
    environment:
      CLAWQL_INFERENCE_PORT: "8080"
      CLAWQL_INFERENCE_HOST: "0.0.0.0"
      CLAWQL_HOME: /clawql-home
    volumes:
      - streams-celld-home:/clawql-home
    ports:
      - "8081:8080"

volumes:
  streams-celld-vault:
  streams-celld-home:
