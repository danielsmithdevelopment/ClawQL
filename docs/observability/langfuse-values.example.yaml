# Example Langfuse Helm values (BYO or bundled profile subchart — not embedded in clawql-mcp)
#
# Tracking: #252 — ADR 0005: Langfuse is the default work-trace store (opt-out emission).
# Guides: docs/observability/bundled-observability.md, docs/observability/bring-your-own-observability.md
# Upstream chart: https://github.com/langfuse/langfuse-k8s (verify version/license before prod).
#
# Usage (illustrative — adjust for your cluster):
#   helm repo add langfuse https://langfuse.github.io/langfuse-k8s
#   helm upgrade --install langfuse langfuse/langfuse \
#     -f docs/observability/langfuse-values.example.yaml \
#     --namespace langfuse --create-namespace

langfuse:
  # Public URL agents use (in-cluster DNS or ingress)
  nextauth:
    url: http://langfuse.langfuse.svc.cluster.local:3000

  # Generate via Langfuse UI or helm secrets — never commit real keys
  salt:
    value: "REPLACE_ME"
  encryptionKey:
    value: "REPLACE_ME"

postgresql:
  auth:
    password: "REPLACE_ME"

clickhouse:
  auth:
    password: "REPLACE_ME"

# Optional: expose /metrics for Grafana when your Langfuse chart supports it
serviceMonitor:
  enabled: false
  labels:
    release: kube-prometheus-stack

# ClawQL MCP + Agent env (set in deployments, not only Agent):
#   LANGFUSE_HOST=https://langfuse.example.com
#   LANGFUSE_PUBLIC_KEY=pk-lf-...
#   LANGFUSE_SECRET_KEY=sk-lf-...
# Opt-out work-trace export: CLAWQL_DISABLE_LANGFUSE=1
