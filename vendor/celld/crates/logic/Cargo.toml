[package]
name = "celld-logic"
version = "0.1.0"
edition = "2021"
rust-version = "1.94.1"
license = "Apache-2.0"

# Pure decision core: no async, I/O, clocks, randomness, locks, or dependencies.
[lib]
path = "lib.rs"
test = false

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ["cfg(celld_internal_tests)"]
