\* Target: checkpointed resume never re-runs completed steps;
\* host send only after durable intent ack.

CONSTANTS
  MaxSteps = 3
  MaxCrashes = 2
  WriteSteps = {2}
  WeakAllowCompletedRerun = FALSE
  WeakAllowSendWithoutDurableAck = FALSE

INIT Init
NEXT Next
INVARIANT Safety
CONSTRAINT StateConstraint
CHECK_DEADLOCK FALSE
