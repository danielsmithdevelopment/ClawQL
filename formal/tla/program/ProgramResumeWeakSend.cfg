\* Weak: host send before durable intent ack — must counterexample
\* IntentDurablyAckedBeforeSend / Safety.

CONSTANTS
  MaxSteps = 3
  MaxCrashes = 2
  WriteSteps = {2}
  WeakAllowCompletedRerun = FALSE
  WeakAllowSendWithoutDurableAck = TRUE

INIT Init
NEXT Next
INVARIANT Safety
CONSTRAINT StateConstraint
CHECK_DEADLOCK FALSE
