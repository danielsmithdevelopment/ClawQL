\* TLC config — small model, two gateway replicas.
\* Default: target atomic consume (WeakConsume <- FALSE).
\* Flip to TRUE to reproduce today's double-execute race.

CONSTANTS
  Replicas = {"r1", "r2"}
  MaxEids = 2
  Digests = {"d1", "d2"}
  Principals = {"agent", "operator"}
  WeakConsume = FALSE

INIT Init
NEXT Next
INVARIANT Safety
\* Optional: INVARIANT AtMostOneSideEffect alone when debugging WeakConsume

\* Bound clock so Tick does not diverge forever
CONSTRAINT clock <= 5
