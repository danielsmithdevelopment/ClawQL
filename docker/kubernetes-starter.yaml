apiVersion: v1
kind: Namespace
metadata:
  name: clawql
---
# Create before applying the Deployment:
#   kubectl -n clawql create secret generic clawql-mcp-auth --from-literal=api-key="$(openssl rand -hex 32)"
apiVersion: v1
kind: Secret
metadata:
  name: clawql-mcp-auth
  namespace: clawql
type: Opaque
stringData:
  # Replace before production use — kubectl create/apply will not rotate this placeholder.
  api-key: "replace-me-before-production"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: clawql-mcp-http
  namespace: clawql
  labels:
    app: clawql-mcp-http
spec:
  replicas: 1
  selector:
    matchLabels:
      app: clawql-mcp-http
  template:
    metadata:
      labels:
        app: clawql-mcp-http
    spec:
      containers:
        - name: clawql-mcp-http
          image: clawql-mcp:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: CLAWQL_PROVIDER
              value: all-providers
            - name: PORT
              value: "8080"
            - name: MCP_PATH
              value: /mcp
            # Bind all interfaces inside the pod (host publish / Service need this).
            - name: MCP_HOST
              value: "0.0.0.0"
            - name: CLAWQL_AUTH_MODE
              value: apiKey
            - name: CLAWQL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: clawql-mcp-auth
                  key: api-key
            - name: CLAWQL_BUNDLED_OFFLINE
              value: "1"
            - name: CLAWQL_OBSIDIAN_VAULT_PATH
              value: /vault
            - name: NODE_OPTIONS
              value: "--max-old-space-size=1536"
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            failureThreshold: 36
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "2Gi"
          volumeMounts:
            - name: obsidian-vault
              mountPath: /vault
      volumes:
        - name: obsidian-vault
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: clawql-mcp-http
  namespace: clawql
  labels:
    app: clawql-mcp-http
spec:
  # Switch to Ingress if your cluster standardizes on that.
  type: LoadBalancer
  selector:
    app: clawql-mcp-http
  ports:
    - name: http
      port: 80
      targetPort: 8080
