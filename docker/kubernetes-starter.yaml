apiVersion: v1
kind: Namespace
metadata:
  name: clawql
---
# Create the auth Secret before applying the Deployment (audit 7.05 — no committed api-key material):
#   kubectl -n clawql create secret generic clawql-mcp-auth \
#     --from-literal=api-key="$(openssl rand -hex 32)"
apiVersion: apps/v1
kind: Deployment
metadata:
  name: clawql-mcp-http
  namespace: clawql
  labels:
    app: clawql-mcp-http
spec:
  replicas: 1
  selector:
    matchLabels:
      app: clawql-mcp-http
  template:
    metadata:
      labels:
        app: clawql-mcp-http
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: clawql-mcp-http
          image: clawql-mcp:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: CLAWQL_PROVIDER
              value: all-providers
            - name: PORT
              value: "8080"
            - name: MCP_PATH
              value: /mcp
            # Bind all interfaces inside the pod (host publish / Service need this).
            - name: MCP_HOST
              value: "0.0.0.0"
            - name: CLAWQL_AUTH_MODE
              value: apiKey
            - name: CLAWQL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: clawql-mcp-auth
                  key: api-key
            - name: CLAWQL_BUNDLED_OFFLINE
              value: "1"
            - name: CLAWQL_OBSIDIAN_VAULT_PATH
              value: /vault
            - name: NODE_OPTIONS
              value: "--max-old-space-size=1536"
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            failureThreshold: 36
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "2Gi"
          volumeMounts:
            - name: obsidian-vault
              mountPath: /vault
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: obsidian-vault
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: clawql-mcp-http
  namespace: clawql
  labels:
    app: clawql-mcp-http
spec:
  # ClusterIP by default (audit 7.02). Expose via Ingress/Gateway + TLS, or set type: LoadBalancer for labs.
  type: ClusterIP
  selector:
    app: clawql-mcp-http
  ports:
    - name: http
      port: 80
      targetPort: 8080
