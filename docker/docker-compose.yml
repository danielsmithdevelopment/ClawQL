services:
  clawql-mcp-http:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: runtime
    image: clawql-mcp:local
    container_name: clawql-mcp-http
    restart: unless-stopped
    environment:
      CLAWQL_PROVIDER: github
      CLAWQL_OBSIDIAN_VAULT_PATH: /vault
      PORT: 8080
      MCP_HOST: 0.0.0.0
      # Bound to loopback on the host (see ports). Set a real key before exposing further.
      CLAWQL_AUTH_MODE: apiKey
      CLAWQL_API_KEY: ${CLAWQL_API_KEY:-change-me-local-dev-only}
    volumes:
      # Host Obsidian vault (memory_ingest / memory_recall). Override with CLAWQL_VAULT_HOST_PATH.
      - ${CLAWQL_VAULT_HOST_PATH:-${HOME}/.ClawQL}:/vault
    ports:
      # Publish on loopback only (audit 2.04). Use docker-compose.sandbox-docker.yml for Docker socket.
      - "127.0.0.1:8080:8080"
