# Placeholder __TARGET_NAMESPACE__ — full desktop stack only (aligned with charts/clawql-mcp values-docker-desktop when all subcharts enabled).
# Service names assume Helm fullnameOverride: clawql-mcp-http (charts/clawql-mcp defaults for local-k8s-up).
---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: clawql-paperless-localhost
  namespace: __TARGET_NAMESPACE__
spec:
  hosts:
    - paperless.localhost
  gateways:
    - istio-ingress/clawql-mcp-gateway
  http:
    - route:
        - destination:
            host: clawql-mcp-http-paperless
            port:
              number: 8000
---
