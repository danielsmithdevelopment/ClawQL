---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: clawql-onyx-localhost
  namespace: __TARGET_NAMESPACE__
spec:
  hosts:
    - onyx.localhost
  gateways:
    - istio-ingress/clawql-mcp-gateway
  http:
    # Mirror nginx Ingress for onyx (/api stripped for backend paths).
    - match:
        - uri:
            prefix: /api/
      rewrite:
        uriRegexRewrite:
          match: "^/api/(.*)"
          rewrite: "/\\1"
      route:
        - destination:
            host: clawql-mcp-http-onyx
            port:
              number: 8080
    - match:
        - uri:
            exact: /api
      rewrite:
        uri: /
      route:
        - destination:
            host: clawql-mcp-http-onyx
            port:
              number: 8080
    - route:
        - destination:
            host: clawql-mcp-http-onyx-web
            port:
              number: 3000
