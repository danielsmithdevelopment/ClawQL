# Placeholder __TARGET_NAMESPACE__ is replaced by scripts/kubernetes/local-k8s-docker-desktop.sh
# Routes clawql.localhost to the Helm-deployed dashboard service inside the cluster.
---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: clawql-dashboard-localhost
  namespace: __TARGET_NAMESPACE__
spec:
  hosts:
    - clawql.localhost
  gateways:
    - istio-ingress/clawql-mcp-gateway
  http:
    - route:
        - destination:
            host: clawql-mcp-http-dashboard.__TARGET_NAMESPACE__.svc.cluster.local
            port:
              number: 3040
