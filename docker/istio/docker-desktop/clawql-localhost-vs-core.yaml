# Placeholder __TARGET_NAMESPACE__ is replaced by scripts/kubernetes/local-k8s-docker-desktop.sh
# Applies when Istio clawql-mcp-ingress binds node :80 (hostNetwork).
# Routes bundled docs UI (Helm svc clawql-mcp-http-ui → image ghcr.io/.../clawql-website).
---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: clawql-docs-ui-localhost
  namespace: __TARGET_NAMESPACE__
spec:
  hosts:
    - clawql.localhost
  gateways:
    - istio-ingress/clawql-mcp-gateway
  http:
    - route:
        - destination:
            host: clawql-mcp-http-ui
            port:
              number: 3000
