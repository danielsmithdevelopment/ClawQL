# istio/gateway chart — classic sidecar injection (namespace istio-injection=enabled).
# Release name must stay clawql-mcp-ingress.
autoscaling:
  enabled: false
# Chart default requests.cpu=100m; lower for single-node local scheduling (limits keep burst room).
resources:
  requests:
    cpu: 25m
    memory: 256Mi
  limits:
    cpu: 2000m
    memory: 1024Mi
service:
  type: LoadBalancer
  ports:
    - name: status-port
      port: 15021
      protocol: TCP
      targetPort: 15021
    - name: http2
      port: 80
      protocol: TCP
      targetPort: 80
      nodePort: 31488
    - name: https
      port: 443
      protocol: TCP
      targetPort: 443
    - name: tcp-grpc-mcp
      port: 50051
      protocol: TCP
      targetPort: 50051
