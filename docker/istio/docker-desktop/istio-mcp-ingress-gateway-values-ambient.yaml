# istio/gateway chart — ambient dataplane (no sidecar; ztunnel handles HBONE).
# Release name must stay clawql-mcp-ingress (Gateway selector istio+app match release).
# Service is ClusterIP: north-south HTTP/gRPC binds via pod hostNetwork (see install-istio-docker-desktop.sh).
autoscaling:
  enabled: false
labels:
  istio.io/dataplane-mode: ambient
podAnnotations:
  prometheus.io/port: "15020"
  prometheus.io/scrape: "true"
  prometheus.io/path: "/stats/prometheus"
  inject.istio.io/templates: "gateway"
  sidecar.istio.io/inject: "false"
resources:
  requests:
    cpu: 25m
    memory: 256Mi
  limits:
    cpu: 2000m
    memory: 1024Mi
service:
  type: ClusterIP
  ports:
    - name: status-port
      port: 15021
      protocol: TCP
      targetPort: 15021
    - name: http2
      port: 80
      protocol: TCP
      targetPort: 80
    - name: https
      port: 443
      protocol: TCP
      targetPort: 443
    - name: tcp-grpc-mcp
      port: 50051
      protocol: TCP
      targetPort: 50051
