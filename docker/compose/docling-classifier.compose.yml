# Docling + classifier + LangExtract — local Compose ([#248](https://github.com/danielsmithdevelopment/ClawQL/issues/248), [#246](https://github.com/danielsmithdevelopment/ClawQL/issues/246))
#
# Usage:
#   docker compose -f docker/compose/docling-classifier.compose.yml up -d
#   curl -s http://localhost:5001/health
#   curl -s http://localhost:8080/health
#   curl -s http://localhost:8090/health
#
# Point ClawQL MCP at:
#   DOCLING_BASE_URL=http://localhost:5001
#   CLASSIFIER_BASE_URL=http://localhost:8080
#   LANGEXTRACT_BASE_URL=http://localhost:8090
#   CLAWQL_ENABLE_IDP_CLASSIFIER=1
#   CLAWQL_ENABLE_LANGEXTRACT=1
#   CLAWQL_ENABLE_PDF_INSPECTOR=1
#   CLAWQL_ENABLE_ANYDOC=1

services:
  docling:
    image: quay.io/docling-project/docling-serve-cpu:v1.14.3
    ports:
      - "5001:5001"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5001/health"]
      interval: 30s
      timeout: 5s
      retries: 12
      start_period: 60s

  classifier:
    build:
      context: ../../docs/examples/idp/classifier-http
    ports:
      - "8080:8080"
    environment:
      MODEL_VERSION: reference-heuristic-v1
      CLASSIFIER_MIN_CONFIDENCE: "0.85"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 15s
      timeout: 3s
      retries: 5

  # Audit U4: LangExtract live backend is ollama — run the runtime in-compose.
  ollama:
    image: ollama/ollama:0.6.5
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  langextract:
    build:
      context: ../../docs/examples/idp/langextract-http
    ports:
      - "8090:8090"
    environment:
      LANGEXTRACT_MODE: demo
      LANGEXTRACT_BACKEND: ollama
      LANGEXTRACT_MODEL_ID: llama3.2
      OLLAMA_BASE_URL: http://ollama:11434
      LANGEXTRACT_ARTIFACTS_DIR: /vault/langextract-artifacts
      # Live mode: set LANGEXTRACT_MODE=live (demo mode does not call Ollama).
    depends_on:
      ollama:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8090/health"]
      interval: 15s
      timeout: 3s
      retries: 5

volumes:
  ollama-data:
