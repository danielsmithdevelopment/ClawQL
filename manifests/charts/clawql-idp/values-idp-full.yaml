# Full IDP stack profile for k3s / single-node labs (MS-A2 class: ≥ 8 GiB RAM recommended, 12–16 GiB for Onyx).
# Install:
#   helm dependency update manifests/charts/clawql-idp
#   helm upgrade --install clawql-idp manifests/charts/clawql-idp \
#     -f manifests/charts/clawql-idp/values-idp-full.yaml \
#     --namespace clawql --create-namespace \
#     --set clawql-mcp.envFromSecret=clawql-provider-env
#
# BYO: Argo Workflows controller, Argo CD, Langfuse, Label Studio — see docs/deployment/clawql-idp-helm.md

clawql-mcp:
  fullnameOverride: clawql-mcp-http
  deploymentStrategy:
    type: Recreate

  provider: all-providers
  nodeOptions: "--max-old-space-size=768"

  enableMemory: true
  enableDocuments: true
  enableGrpc: true
  enableSandbox: true
  enableNotify: true
  enableOnyx: true
  enableOuroboros: true
  enableWorkflow: true
  enableArgoCd: true
  # 8.0 converter cut: Anydoc stays flag-gated and is no longer part of the recommended full stack —
  # Docling already covers the default convert path. Flip to true only if you have a named job for it
  # (see docs/releases/8.0.0-purge-inventory-spec-v0.1.md — "Document convert" row).
  enableAnydoc: false
  # pdf-inspector stays opt-in — needs a unique job (e.g. signature/metadata inspection) before being
  # auto-kept in the recommended stack. Not demoted from this profile's explicit opt-in (operator choice),
  # but no longer promoted as "recommended" alongside Docling.
  enablePdfInspector: true
  enableIdpClassifier: true
  enableLangextract: true
  enablePrivacyFilter: true
  enableIdpPipeline: true

  workflow:
    namespaceAllowlist:
      - clawql
      - argo
    defaultNamespace: clawql
    notifyOnTerminal: true

  argocd:
    namespaceAllowlist:
      - argocd
    defaultNamespace: argocd
    allowSync: false

  documentPipeline:
    enabled: true
    docling:
      enabled: true
      resources:
        requests:
          cpu: 250m
          memory: 2Gi
        limits:
          cpu: "2"
          memory: 6Gi
    # 8.0 converter cut defaults these to off upstream (opt-in only); this comprehensive "full" profile
    # still exercises the complete stack, including the JVM/LibreOffice converters, explicitly.
    tika:
      enabled: true
    gotenberg:
      enabled: true
    stirling:
      enabled: true
    classifier:
      enabled: true
    langextract:
      enabled: true
    privacyFilter:
      enabled: true

  idpCollaboration:
    enabled: true

  nats:
    enabled: true
    appIntegration:
      publish: true
      embeddedConsumer: true
    worker:
      enabled: true
      idpPipeline: true
      coneshareFollowup: true
    # Set nats.keda.enabled=true when KEDA is installed in the cluster.
    keda:
      enabled: false
      bootstrapConsumer: true

  ouroborosPostgres:
    enabled: true
    auth:
      password: "change-me"

  openclaw:
    enabled: true
    chatBridge:
      enabled: true

  dashboard:
    enabled: true

  metrics:
    prometheusScrapeAnnotations:
      enabled: true
    serviceMonitor:
      enabled: true
      labels:
        release: kube-prometheus-stack

  envFromSecret: clawql-provider-env
