{{- if .Values.secretSourcing.externalSecrets.enabled }}
{{- $storeName := .Values.secretSourcing.externalSecrets.clusterSecretStoreName | default (printf "%s-vault-kv" (include "clawql-mcp.fullname" .)) }}
{{- $secretName := .Values.secretSourcing.externalSecrets.secretName | default .Values.envFromSecret | default "clawql-provider-env" }}
{{- $vaultPath := .Values.secretSourcing.externalSecrets.vaultKvPath | default "clawql/providers" }}
{{- $esoSa := .Values.secretSourcing.externalSecrets.esoServiceAccount }}
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: {{ $storeName }}
  labels:
    {{- include "clawql-mcp.labels" . | nindent 4 }}
spec:
  provider:
    vault:
      server: {{ .Values.secretSourcing.externalSecrets.vaultServer | default (include "clawql-mcp.vaultServiceUrl" .) | quote }}
      path: {{ .Values.secretSourcing.externalSecrets.vaultMount | default "secret" | quote }}
      version: "v2"
      auth:
        kubernetes:
          mountPath: {{ .Values.secretSourcing.externalSecrets.kubernetesAuthMount | default "kubernetes" | quote }}
          role: {{ .Values.secretSourcing.externalSecrets.vaultAuthRole | default "clawql-eso-read" | quote }}
          serviceAccountRef:
            name: {{ $esoSa.name | default "external-secrets" | quote }}
            namespace: {{ $esoSa.namespace | default "external-secrets" | quote }}
            audiences:
              - vault
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "clawql-mcp.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.secretSourcing.externalSecrets.refreshInterval | default "5m" }}
  secretStoreRef:
    name: {{ $storeName }}
    kind: ClusterSecretStore
  target:
    name: {{ $secretName }}
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    {{- range .Values.secretSourcing.providerEnvMapping }}
    - secretKey: {{ .envKey }}
      remoteRef:
        key: {{ $vaultPath }}
        property: {{ .property }}
    {{- end }}
{{- end }}
