{{/*
  Audit Pass 7 — refuse insecure chart defaults outside explicit lab overlays.
  Set values.devAllowWeakSecrets=true only in local overlays (e.g. values-docker-desktop).
*/}}
{{- if not .Values.devAllowWeakSecrets }}
{{- /* 7.05 — no plaintext CLAWQL_API_KEY from Helm values (Vault/envFromSecret is the prod path) */ -}}
{{- if and (not .Values.gatewayAuth.existingSecret) .Values.gatewayAuth.apiKey }}
{{- fail "gatewayAuth.apiKey plaintext is refused (audit 7.05). Set gatewayAuth.existingSecret or inject CLAWQL_API_KEY via envFromSecret (Vault). Labs: devAllowWeakSecrets=true" }}
{{- end }}
{{- $hasEnvFrom := or .Values.envFromSecret .Values.envFromSecrets }}
{{- if and (eq (.Values.gatewayAuth.mode | default "apiKey") "apiKey") (not .Values.gatewayAuth.existingSecret) (not .Values.gatewayAuth.apiKey) (not $hasEnvFrom) }}
{{- fail "gatewayAuth.existingSecret (or envFromSecret / Vault-synced secret containing CLAWQL_API_KEY) is required when gatewayAuth.mode=apiKey" }}
{{- end }}

{{- /* 7.01 — refuse placeholder Postgres password for document-pipeline stores */ -}}
{{- if and .Values.documentPipeline.enabled .Values.stores.postgres.enabled (not .Values.stores.postgres.auth.existingSecret) }}
{{- $pw := .Values.stores.postgres.auth.password | default "" }}
{{- if or (eq $pw "") (eq $pw "change-me") }}
{{- fail "stores.postgres.auth.existingSecret (or a non-placeholder password with devAllowWeakSecrets=true) is required when documentPipeline+stores.postgres are enabled" }}
{{- end }}
{{- end }}

{{- /* 7.11 — refuse Onyx demo credentials */ -}}
{{- if .Values.onyx.enabled }}
{{- if and (not .Values.onyx.postgres.auth.existingSecret) (or (eq (.Values.onyx.postgres.auth.password | default "") "") (eq .Values.onyx.postgres.auth.password "change-me")) }}
{{- fail "onyx.postgres.auth.existingSecret (or a non-placeholder password with devAllowWeakSecrets=true) is required when onyx.enabled=true" }}
{{- end }}
{{- if or (eq (.Values.onyx.userAuthSecret | default "") "") (eq .Values.onyx.userAuthSecret "change-me-onyx-user-auth-secret") }}
{{- fail "onyx.userAuthSecret must be set to a non-placeholder value when onyx.enabled=true (or use devAllowWeakSecrets=true)" }}
{{- end }}
{{- if and .Values.onyx.fullVectorStack (not .Values.onyx.opensearch.auth.existingSecret) (or (eq (.Values.onyx.opensearch.auth.adminPassword | default "") "") (eq .Values.onyx.opensearch.auth.adminPassword "StrongPassword123!")) }}
{{- fail "onyx.opensearch.auth.existingSecret (or a non-demo adminPassword with devAllowWeakSecrets=true) is required when onyx.fullVectorStack=true" }}
{{- end }}
{{- if and .Values.onyx.fullVectorStack (not .Values.onyx.minio.auth.existingSecret) (or (eq (.Values.onyx.minio.auth.rootUser | default "") "") (eq (.Values.onyx.minio.auth.rootPassword | default "") "") (eq .Values.onyx.minio.auth.rootUser "minioadmin") (eq .Values.onyx.minio.auth.rootPassword "minioadmin")) }}
{{- fail "onyx.minio.auth.existingSecret (or non-demo root credentials with devAllowWeakSecrets=true) is required when onyx.fullVectorStack=true" }}
{{- end }}
{{- end }}
{{- end }}

{{- /* 7.03 — host Docker socket is lab-only (always enforced) */ -}}
{{- if and .Values.enableSandbox .Values.sandboxDocker.enabled (not .Values.sandboxDocker.allowHostDockerSocket) }}
{{- fail "sandboxDocker.enabled requires sandboxDocker.allowHostDockerSocket=true (local clusters only — audit 7.03)" }}
{{- end }}

{{- /* 7.04 — regulated tier must carry OIDC + remote WORM Object Lock + default-deny NP */ -}}
{{- if eq (.Values.pluginTiers.tier | default "") "regulated" }}
{{- if ne (.Values.gatewayAuth.mode | default "") "oidc" }}
{{- fail "pluginTiers.tier=regulated requires gatewayAuth.mode=oidc (audit 7.04)" }}
{{- end }}
{{- /* Effective env: same append-wins merge as clawql-mcp.mergedExtraEnv (H3). */ -}}
{{- $eff := dict -}}
{{- range (.Values.extraEnv | default list) -}}
{{- $_ := set $eff .name (.value | default "" | toString) -}}
{{- end -}}
{{- range (.Values.extraEnvAppend | default list) -}}
{{- $_ := set $eff .name (.value | default "" | toString) -}}
{{- end -}}
{{- $oidcJwks := index $eff "CLAWQL_AUTH_OIDC_JWKS_URL" | default "" -}}
{{- $oidcIssuer := index $eff "CLAWQL_AUTH_OIDC_ISSUER" | default "" -}}
{{- $oidcAud := index $eff "CLAWQL_AUTH_OIDC_AUDIENCE" | default "" -}}
{{- $wormLock := index $eff "CLAWQL_WORM_S3_OBJECT_LOCK" | default "" -}}
{{- $wormRemote := index $eff "CLAWQL_WORM_REMOTE" | default "" -}}
{{- if or (eq $oidcJwks "") (eq $oidcIssuer "") (eq $oidcAud "") }}
{{- fail "pluginTiers.tier=regulated requires CLAWQL_AUTH_OIDC_JWKS_URL / ISSUER / AUDIENCE in extraEnv or extraEnvAppend (audit 7.04)" }}
{{- end }}
{{- if ne $wormRemote "s3" }}
{{- fail "pluginTiers.tier=regulated requires CLAWQL_WORM_REMOTE=s3 in extraEnv or extraEnvAppend (audit 7.04)" }}
{{- end }}
{{- if and (ne $wormLock "compliance") (ne $wormLock "governance") }}
{{- fail "pluginTiers.tier=regulated requires CLAWQL_WORM_S3_OBJECT_LOCK=compliance|governance (audit 7.04)" }}
{{- end }}
{{- if not (and .Values.networkPolicy .Values.networkPolicy.defaultDeny .Values.networkPolicy.defaultDeny.enabled) }}
{{- fail "pluginTiers.tier=regulated requires networkPolicy.defaultDeny.enabled=true (audit 7.04)" }}
{{- end }}
{{- /* H3 — refuse overlays that weaken regulated flags via extraEnvAppend. */ -}}
{{- $mustOne := list
  "CLAWQL_WORM_ENABLED"
  "CLAWQL_WORM_REQUIRED"
  "CLAWQL_WORM_S3_VERIFY_OBJECT_LOCK"
  "CLAWQL_INFERENCE_LOCAL_ONLY"
  "CLAWQL_INFERENCE_KEYS_ENABLED"
  "CLAWQL_PANGUARD_PROXY_PLUGIN"
  "CLAWQL_PANGUARD_IN_PROCESS"
-}}
{{- range $mustOne }}
{{- $v := index $eff . | default "" | toString | trim }}
{{- if ne $v "1" }}
{{- fail (printf "pluginTiers.tier=regulated refuses weakened %s=%q (must be \"1\"; audit H3). Runtime refusals remain the backstop for envFromSecret." . $v) }}
{{- end }}
{{- end }}
{{- $mustOff := list
  "CLAWQL_ALLOW_NO_ENFORCEMENT"
  "CLAWQL_ALLOW_UNAUTHENTICATED"
  "CLAWQL_WEBHOOK_ALLOW_UNAUTHENTICATED"
  "CLAWQL_HTTP_GRAPHQL"
  "CLAWQL_SOURCES_ALLOW_HTTP"
-}}
{{- range $mustOff }}
{{- /* L2: trim before truthy check so " 1" / " True " cannot sneak through. */ -}}
{{- $v := index $eff . | default "" | toString | trim | lower }}
{{- if or (eq $v "1") (eq $v "true") (eq $v "yes") (eq $v "on") }}
{{- fail (printf "pluginTiers.tier=regulated refuses truthy %s=%q (audit H3). Runtime refusals remain the backstop for envFromSecret." . $v) }}
{{- end }}
{{- end }}
{{- end }}
