    {{- include "clawql-mcp.labels" . | nindent 4 }}
    app.kubernetes.io/component: paperless
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.documentPipeline.paperless.persistence.consumeSize }}
  {{- if .Values.documentPipeline.paperless.persistence.storageClass }}
  storageClassName: {{ .Values.documentPipeline.paperless.persistence.storageClass | quote }}
  {{- end }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "clawql-mcp.tikaName" . }}
  labels:
    {{- include "clawql-mcp.labels" . | nindent 4 }}
    app.kubernetes.io/component: tika
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ include "clawql-mcp.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: tika
  ports:
    - name: http
      port: {{ .Values.documentPipeline.tika.service.port | int }}
      targetPort: http
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "clawql-mcp.tikaName" . }}
  labels:
    {{- include "clawql-mcp.labels" . | nindent 4 }}
    app.kubernetes.io/component: tika
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "clawql-mcp.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: tika
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "clawql-mcp.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: tika
    spec:
      containers:
        - name: tika
          image: "{{ .Values.documentPipeline.tika.image.repository }}:{{ .Values.documentPipeline.tika.image.tag }}"
          imagePullPolicy: {{ .Values.documentPipeline.tika.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.documentPipeline.tika.service.port | int }}
              protocol: TCP
          resources:
            {{- toYaml .Values.documentPipeline.tika.resources | nindent 12 }}
{{- if .Values.documentPipeline.docling.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "clawql-mcp.doclingName" . }}
  labels:
    {{- include "clawql-mcp.labels" . | nindent 4 }}
    app.kubernetes.io/component: docling
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ include "clawql-mcp.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: docling
  ports:
    - name: http
      port: {{ .Values.documentPipeline.docling.service.port | int }}
      targetPort: http
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "clawql-mcp.doclingName" . }}
  labels:
    {{- include "clawql-mcp.labels" . | nindent 4 }}
    app.kubernetes.io/component: docling
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "clawql-mcp.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: docling
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "clawql-mcp.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: docling
    spec:
      containers:
        - name: docling
          image: "{{ .Values.documentPipeline.docling.image.repository }}:{{ .Values.documentPipeline.docling.image.tag }}"
          imagePullPolicy: {{ .Values.documentPipeline.docling.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.documentPipeline.docling.service.port | int }}
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            {{- toYaml .Values.documentPipeline.docling.resources | nindent 12 }}
{{- end }}
{{- if .Values.documentPipeline.classifier.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "clawql-mcp.classifierName" . }}
  labels:
    {{- include "clawql-mcp.labels" . | nindent 4 }}
    app.kubernetes.io/component: classifier
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ include "clawql-mcp.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: classifier
  ports:
    - name: http
      port: {{ .Values.documentPipeline.classifier.service.port | int }}
      targetPort: http
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "clawql-mcp.classifierName" . }}
  labels:
    {{- include "clawql-mcp.labels" . | nindent 4 }}
    app.kubernetes.io/component: classifier
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "clawql-mcp.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: classifier
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "clawql-mcp.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: classifier
    spec:
      containers:
        - name: classifier
          image: "{{ .Values.documentPipeline.classifier.image.repository }}:{{ .Values.documentPipeline.classifier.image.tag }}"
          imagePullPolicy: {{ .Values.documentPipeline.classifier.image.pullPolicy }}
          env:
            - name: MODEL_VERSION
              value: {{ default .Values.documentPipeline.classifier.image.tag .Values.documentPipeline.classifier.env.modelVersion | quote }}
            - name: CLASSIFIER_MIN_CONFIDENCE
              value: {{ .Values.documentPipeline.classifier.env.minConfidence | quote }}
            {{- if .Values.documentPipeline.classifier.env.modelPath }}
            - name: MODEL_PATH
              value: {{ .Values.documentPipeline.classifier.env.modelPath | quote }}
            {{- else if .Values.documentPipeline.classifier.model.existingClaim }}
            - name: MODEL_PATH
              value: {{ .Values.documentPipeline.classifier.model.mountPath | quote }}
            {{- end }}
            - name: PORT
              value: {{ .Values.documentPipeline.classifier.service.port | quote }}
          ports:
            - name: http
              containerPort: {{ .Values.documentPipeline.classifier.service.port | int }}
              protocol: TCP
          {{- if .Values.documentPipeline.classifier.model.existingClaim }}
          volumeMounts:
            - name: classifier-model
              mountPath: {{ .Values.documentPipeline.classifier.model.mountPath | quote }}
              readOnly: true
          {{- end }}
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml .Values.documentPipeline.classifier.resources | nindent 12 }}
      {{- if .Values.documentPipeline.classifier.model.existingClaim }}
      volumes:
        - name: classifier-model
          persistentVolumeClaim:
            claimName: {{ .Values.documentPipeline.classifier.model.existingClaim | quote }}
      {{- end }}
{{- end }}
