{{- if and .Values.openclaw.enabled (not .Values.openclaw.existingSecret) }}
{{- $_ := required "openclaw.gatewayToken is required when openclaw.enabled is true and openclaw.existingSecret is empty (generate: openssl rand -hex 24)" .Values.openclaw.gatewayToken }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "clawql-mcp.openclawSecretName" . }}
  labels:
    {{- include "clawql-mcp.openclawLabels" . | nindent 4 }}
type: Opaque
stringData:
  OPENCLAW_GATEWAY_TOKEN: {{ .Values.openclaw.gatewayToken | quote }}
  {{- if .Values.openclaw.anthropicApiKey }}
  ANTHROPIC_API_KEY: {{ .Values.openclaw.anthropicApiKey | quote }}
  {{- end }}
  {{- if .Values.openclaw.openaiApiKey }}
  OPENAI_API_KEY: {{ .Values.openclaw.openaiApiKey | quote }}
  {{- end }}
  {{- if .Values.openclaw.geminiApiKey }}
  GEMINI_API_KEY: {{ .Values.openclaw.geminiApiKey | quote }}
  {{- end }}
  {{- if .Values.openclaw.openrouterApiKey }}
  OPENROUTER_API_KEY: {{ .Values.openclaw.openrouterApiKey | quote }}
  {{- end }}
  {{- if and .Values.openclaw.clawqlMcp.enabled .Values.openclaw.clawqlMcp.bearerToken (not .Values.openclaw.clawqlMcp.bearerTokenSecret.name) }}
  CLAWQL_MCP_BEARER_TOKEN: {{ .Values.openclaw.clawqlMcp.bearerToken | quote }}
  {{- end }}
{{- end }}
