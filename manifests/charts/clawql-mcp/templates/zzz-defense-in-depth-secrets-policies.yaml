{{- /*
Defense-in-depth: Vault-backed MCP env sourcing is required by default (`secretSourcing.requireVaultBackedSecrets: true`).
Set `requireVaultBackedSecrets: false` only for lab/dev overlays that accept plaintext env sourcing.
*/}}
{{- $requireVaultBacked := true }}
{{- if and .Values.secretSourcing (hasKey .Values.secretSourcing "requireVaultBackedSecrets") }}
{{- $requireVaultBacked = index .Values.secretSourcing "requireVaultBackedSecrets" }}
{{- end }}
{{- $bundledVault := true }}
{{- if .Values.hashicorpvault }}
{{- if hasKey .Values.hashicorpvault "enabled" }}
{{- $bundledVault = index .Values.hashicorpvault "enabled" }}
{{- end }}
{{- end }}
{{- if eq $bundledVault false }}
{{- fail "hashicorpvault.enabled=false is not supported: this chart always bundles the HashiCorp Vault Helm subchart. Remove overrides that disable vault." }}
{{- end }}
