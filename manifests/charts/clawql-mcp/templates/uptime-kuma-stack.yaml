{{- if .Values.uptimeKuma.enabled }}
{{- if and .Values.uptimeKuma.persistence.enabled (not .Values.uptimeKuma.persistence.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "clawql-mcp.uptimeKumaPvcName" . }}
  labels:
    {{- include "clawql-mcp.uptimeKumaLabels" . | nindent 4 }}
spec:
  accessModes:
    {{- toYaml .Values.uptimeKuma.persistence.accessModes | nindent 4 }}
  resources:
    requests:
      storage: {{ .Values.uptimeKuma.persistence.size }}
  {{- if .Values.uptimeKuma.persistence.storageClass }}
  storageClassName: {{ .Values.uptimeKuma.persistence.storageClass | quote }}
  {{- end }}
---
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "clawql-mcp.uptimeKumaName" . }}
  labels:
    {{- include "clawql-mcp.uptimeKumaLabels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.uptimeKuma.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "clawql-mcp.uptimeKumaSelectorLabels" . | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "clawql-mcp.uptimeKumaName" . }}
  labels:
    {{- include "clawql-mcp.uptimeKumaLabels" . | nindent 4 }}
spec:
  replicas: {{ .Values.uptimeKuma.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "clawql-mcp.uptimeKumaSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "clawql-mcp.uptimeKumaSelectorLabels" . | nindent 8 }}
      {{- with .Values.uptimeKuma.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.uptimeKuma.podSecurityContext | nindent 8 }}
      containers:
        - name: uptime-kuma
          image: "{{ .Values.uptimeKuma.image.repository }}:{{ .Values.uptimeKuma.image.tag }}"
          imagePullPolicy: {{ .Values.uptimeKuma.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.uptimeKuma.service.targetPort }}
              protocol: TCP
          {{- with .Values.uptimeKuma.extraEnv }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: {{ .Values.uptimeKuma.persistence.mountPath }}
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            {{- toYaml .Values.uptimeKuma.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.uptimeKuma.securityContext | nindent 12 }}
      volumes:
        - name: data
          {{- if .Values.uptimeKuma.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ default (include "clawql-mcp.uptimeKumaPvcName" .) .Values.uptimeKuma.persistence.existingClaim }}
          {{- else }}
          emptyDir: {}
          {{- end }}
{{- if .Values.uptimeKuma.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "clawql-mcp.uptimeKumaName" . }}
  labels:
    {{- include "clawql-mcp.uptimeKumaLabels" . | nindent 4 }}
  {{- with .Values.uptimeKuma.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.uptimeKuma.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.uptimeKuma.ingress.tls }}
  tls:
    {{- range .Values.uptimeKuma.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .Values.uptimeKuma.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ include "clawql-mcp.uptimeKumaName" $ }}
                port:
                  number: {{ $.Values.uptimeKuma.service.port }}
          {{- end }}
    {{- end }}
{{- end }}
{{- end }}
