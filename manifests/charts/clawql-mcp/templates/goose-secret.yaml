{{- if and .Values.goose.enabled (not .Values.goose.existingSecret) }}
{{- if or .Values.goose.openaiApiKey .Values.goose.anthropicApiKey }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "clawql-mcp.gooseSecretName" . }}
  labels:
    {{- include "clawql-mcp.gooseLabels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.goose.openaiApiKey }}
  OPENAI_API_KEY: {{ .Values.goose.openaiApiKey | quote }}
  {{- end }}
  {{- if .Values.goose.anthropicApiKey }}
  ANTHROPIC_API_KEY: {{ .Values.goose.anthropicApiKey | quote }}
  {{- end }}
{{- end }}
{{- end }}
