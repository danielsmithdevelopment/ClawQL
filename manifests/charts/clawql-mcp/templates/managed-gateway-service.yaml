{{- if .Values.managedGateway.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "clawql-mcp.managedGatewayName" . }}
  labels:
    {{- include "clawql-mcp.labels" . | nindent 4 }}
    app.kubernetes.io/component: managed-gateway
  {{- with .Values.managedGateway.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.managedGateway.service.type }}
  selector:
    {{- include "clawql-mcp.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: managed-gateway
  ports:
    - name: http
      port: {{ .Values.managedGateway.service.http.port }}
      targetPort: http
      protocol: TCP
{{- end }}
