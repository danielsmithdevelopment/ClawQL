# Regulated-tier Helm overlay (audit 7.04 / 7.05).
#
# Usage:
#   helm upgrade --install clawql ./manifests/charts/clawql-mcp \
#     -n clawql --create-namespace \
#     -f manifests/charts/clawql-mcp/values-regulated.yaml \
#     -f path/to/hosts-and-secret-refs.yaml
#
# Replace the example IdP / S3 host values in your host overlay. Do NOT set
# devAllowWeakSecrets. Do NOT commit production secrets here.

pluginTiers:
  tier: regulated

devAllowWeakSecrets: false

service:
  type: ClusterIP

# OIDC is mandatory on the regulated path (audit 7.04).
gatewayAuth:
  mode: oidc

networkPolicy:
  defaultDeny:
    enabled: true

# Runtime + compliance flags (Pass 6 / Pass 7).
# CLAWQL_TIER comes from pluginTiers.tier in the Deployment template — do not
# also set it here (duplicate env keys break Kubernetes server-side apply).
extraEnv:
  - name: CLAWQL_WORM_REQUIRED
    value: "1"
  - name: CLAWQL_WORM_ENABLED
    value: "1"
  - name: CLAWQL_WORM_REMOTE
    value: s3
  - name: CLAWQL_WORM_S3_OBJECT_LOCK
    value: compliance
  - name: CLAWQL_WORM_S3_VERIFY_OBJECT_LOCK
    value: "1"
  # REPLACE in host overlay with your IdP:
  - name: CLAWQL_AUTH_OIDC_JWKS_URL
    value: https://idp.example.com/.well-known/jwks.json
  - name: CLAWQL_AUTH_OIDC_ISSUER
    value: https://idp.example.com
  - name: CLAWQL_AUTH_OIDC_AUDIENCE
    value: clawql-mcp
  - name: CLAWQL_INFERENCE_LOCAL_ONLY
    value: "1"
  - name: CLAWQL_INFERENCE_KEYS_ENABLED
    value: "1"
  - name: CLAWQL_PANGUARD_PROXY_PLUGIN
    value: "1"
  - name: CLAWQL_PANGUARD_IN_PROCESS
    value: "1"

# MCP proxy chokepoint (Gateway → proxy → clawql-mcp-http ordering / HA).
# Default mode is nginx passthrough — proves path ordering and NetworkPolicy
# allowlists; it does NOT terminate JWT/ATR. For JWT/ATR edge use
# mcpProxy.mode=custom with a gateway image (see docs/security/mcp-proxy-jwt-atr.md).
mcpProxy:
  enabled: true
  mode: nginx
  image:
    repository: nginx
    tag: "1.27-alpine"
    digest: sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    pullPolicy: IfNotPresent

managedGateway:
  networkPolicy:
    enabled: true

# Document pipeline / Onyx stay opt-in with existingSecret — no chart passwords.
documentPipeline:
  enabled: false

# Third-party images: pin by digest (index digests verified 2026-11-26 from Docker Hub / GHCR).
# Templates use repo:tag@digest via clawql-mcp.imageRef. Re-pin when rotating upstream.
webSearch:
  searxng:
    image:
      digest: sha256:a7fc607aa6723f5a8982105bcc5ffba4d1b9fc7c6922a31a88d6e4cba49ef12a

webBrowser:
  chromium:
    image:
      digest: sha256:381353d3530ab9d579d2fe8b9c0f4519c995617f5a71daf6bb649e2d12005bd9

onyx:
  enabled: false
  api:
    image:
      digest: sha256:5c50b2c74d9e73a8e70b5113a0a8060e51a3b5463e56cb32b04ca628eee55fcc
  web:
    image:
      digest: sha256:8bf2eb34e389eaf41ad6f2a259f5742ab02f1c0bd28770109444905f10140877
  modelServer:
    image:
      digest: sha256:3db4f73e776fdebc7c83544f77a255e6ae4fb1084fdf2c463df49099db9eb0ab

goose:
  image:
    digest: sha256:150b632f732904006fd87d5c5a63005b01743e6d82c583d2b5afbda2d4173047

sandboxDocker:
  enabled: false
  allowHostDockerSocket: false

secretSourcing:
  requireVaultBackedSecrets: true

# Supply chain (audit 7.05) — digest pin + Cosign on the regulated path.
image:
  tag: "8.0.0"
  pullPolicy: IfNotPresent

ui:
  image:
    tag: "8.0.0"

dashboard:
  image:
    tag: "8.0.0"

kyverno:
  imageSignaturePolicy:
    enabled: true
    verifyDigest: true
    mutateDigest: true
    cosign:
      subjectRegExp: "^https://github\\.com/danielsmithdevelopment/ClawQL/\\.github/workflows/docker-publish\\.yml@refs/(heads/main|tags/v.*)$"

security:
  kata:
    enabled: true
    runtimeClassName: kata-qemu
