# Regulated-tier Helm overlay (audit 7.04 / 7.05).
#
# Usage:
#   helm upgrade --install clawql ./manifests/charts/clawql-mcp \
#     -n clawql --create-namespace \
#     -f manifests/charts/clawql-mcp/values-regulated.yaml \
#     -f path/to/hosts-and-secret-refs.yaml
#
# Replace the example IdP / S3 host values in your host overlay. Do NOT set
# devAllowWeakSecrets. Do NOT commit production secrets here.

pluginTiers:
  tier: regulated

devAllowWeakSecrets: false

service:
  type: ClusterIP

# OIDC is mandatory on the regulated path (audit 7.04).
gatewayAuth:
  mode: oidc

networkPolicy:
  defaultDeny:
    enabled: true

# Runtime + compliance flags (Pass 6 / Pass 7).
extraEnv:
  - name: CLAWQL_TIER
    value: regulated
  - name: CLAWQL_WORM_REQUIRED
    value: "1"
  - name: CLAWQL_WORM_ENABLED
    value: "1"
  - name: CLAWQL_WORM_REMOTE
    value: s3
  - name: CLAWQL_WORM_S3_OBJECT_LOCK
    value: compliance
  - name: CLAWQL_WORM_S3_VERIFY_OBJECT_LOCK
    value: "1"
  # REPLACE in host overlay with your IdP:
  - name: CLAWQL_AUTH_OIDC_JWKS_URL
    value: https://idp.example.com/.well-known/jwks.json
  - name: CLAWQL_AUTH_OIDC_ISSUER
    value: https://idp.example.com
  - name: CLAWQL_AUTH_OIDC_AUDIENCE
    value: clawql-mcp
  - name: CLAWQL_INFERENCE_LOCAL_ONLY
    value: "1"
  - name: CLAWQL_INFERENCE_KEYS_ENABLED
    value: "1"
  - name: CLAWQL_PANGUARD_PROXY_PLUGIN
    value: "1"
  - name: CLAWQL_PANGUARD_IN_PROCESS
    value: "1"

# Prefer JWT/ATR edge when the cluster runs the managed gateway / MCP proxy.
mcpProxy:
  enabled: true

managedGateway:
  networkPolicy:
    enabled: true

# Document pipeline / Onyx stay opt-in with existingSecret — no chart passwords.
documentPipeline:
  enabled: false

onyx:
  enabled: false

sandboxDocker:
  enabled: false
  allowHostDockerSocket: false

secretSourcing:
  requireVaultBackedSecrets: true

# Supply chain (audit 7.05) — digest pin + Cosign on the regulated path.
image:
  tag: "8.0.0"
  pullPolicy: IfNotPresent

ui:
  image:
    tag: "8.0.0"

dashboard:
  image:
    tag: "8.0.0"

kyverno:
  imageSignaturePolicy:
    enabled: true
    verifyDigest: true
    mutateDigest: true
    cosign:
      subjectRegExp: "^https://github\\.com/danielsmithdevelopment/ClawQL/\\.github/workflows/docker-publish\\.yml@refs/(heads/main|tags/v.*)$"

security:
  kata:
    enabled: true
    runtimeClassName: kata-qemu
