# CI overlay for regulated kind job (D2 / D2b).
# Allowed keys only — scripts/kubernetes/check-regulated-kind-overlay.sh fails
# the job if any other top-level or nested key is introduced.
#
# This overlay must not weaken the regulated profile beyond:
# - Kata off (kind has no Kata runtime)
# - Kyverno image signature off (PR image is unsigned; D3 covers signing)
# - Local image repo/tag
# - Host values: OIDC, LocalStack Object Lock S3, secret refs, CLAWQL_HOME
# - NetworkPolicy extraEgress for in-cluster JWKS + LocalStack (private IPs)
# - gRPC on with a self-signed TLS Secret created by the kind driver
#
# IMPORTANT: Helm replaces lists rather than merging them. Do NOT set
# `extraEnv` here — that would wipe WORM / inference flags from
# values-regulated.yaml. Host overrides go in `extraEnvAppend`; the chart
# merges by env name (append wins) so OIDC placeholders are overridden without
# duplicate keys (Kubernetes SSA rejects duplicate env names).

security:
  kata:
    enabled: false

kyverno:
  imageSignaturePolicy:
    enabled: false

image:
  repository: clawql-mcp
  tag: regulated-kind
  pullPolicy: Never

# Regulated gRPC requires TLS cert/key. Kind creates Secret/clawql-grpc-tls
# (self-signed) before helm install; chart mounts it and sets GRPC_TLS_*.
enableGrpc: true
clawql-mcp-grpc:
  enabled: true
grpcTls:
  existingSecret: clawql-grpc-tls

# Allow MCP pods to reach in-cluster JWKS (80), LocalStack S3 (4566), wire sink (8080).
# Base default-deny only permits HTTP(S) to non-RFC1918 destinations.
networkPolicy:
  defaultDeny:
    extraEgress:
      - to:
          - podSelector: {}
        ports:
          - protocol: TCP
            port: 80
          - protocol: TCP
            port: 4566
          - protocol: TCP
            port: 8080
    # D5: same-ns ingress to WORM HTTP (wire rows 7/12).
    extraIngressPorts:
      - protocol: TCP
        port: 9090

# D5: expose WORM HTTP beside MCP HTTP (Helm-rendered — no live Service patch).
service:
  extraPorts:
    - name: worm-http
      port: 9090
      targetPort: 9090

# Wire row 9 webhook path needs HITL in the instance spec.
enableHitlLabelStudio: true

# Host / secret plumbing for the kind Job.
# CLAWQL_HOME=/vault uses the chart emptyDir (readOnlyRootFilesystem).
extraEnvAppend:
  - name: CLAWQL_HOME
    value: /vault
  - name: CLAWQL_AUTH_OIDC_JWKS_URL
    value: http://clawql-jwks.clawql.svc.cluster.local/.well-known/jwks.json
  - name: CLAWQL_AUTH_OIDC_ISSUER
    value: http://clawql-jwks.clawql.svc.cluster.local
  - name: CLAWQL_AUTH_OIDC_AUDIENCE
    value: clawql-mcp
  - name: CLAWQL_WORM_S3_ENDPOINT
    value: http://clawql-localstack.clawql.svc.cluster.local:4566
  - name: CLAWQL_WORM_S3_BUCKET
    value: clawql-worm
  - name: CLAWQL_WORM_S3_FORCE_PATH_STYLE
    value: "1"
  - name: CLAWQL_WORM_S3_REGION
    value: us-east-1
  # D5 in-cluster wire — rendered by Helm (P3: no live Deployment env patch).
  - name: CLAWQL_SPEC_URL
    value: http://clawql-jwks.clawql.svc.cluster.local/petstore-patch.json
  - name: CLAWQL_API_BASE_URL
    value: http://clawql-wire-sink.clawql.svc.cluster.local:8080
  - name: API_BASE_URL
    value: http://clawql-wire-sink.clawql.svc.cluster.local:8080
  - name: CLAWQL_PENDING_STORE
    value: sqlite
  - name: CLAWQL_SECRET_STORE
    value: memory
  - name: CLAWQL_STREAMABLE_HTTP_JSON_RESPONSE
    value: "1"
  - name: CLAWQL_HTTP_SKIP_PAYMENTS
    value: "1"
  - name: CLAWQL_HTTP_SKIP_GRAPHQL
    value: "1"
  - name: CLAWQL_WORM_HTTP_PORT
    value: "9090"
  - name: CLAWQL_AUDIT_API_KEY
    value: kind-wire-audit-key
  # Pause background outbox drain during kind wire rows (append + reconciler share one SQLite).
  - name: CLAWQL_WORM_RECONCILE_MS
    value: "0"

envFromSecret: clawql-provider-env
