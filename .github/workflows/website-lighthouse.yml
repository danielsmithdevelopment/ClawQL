# Lab Lighthouse against a production `next build` + `next start` server (not Cloudflare Workers).
# Catches client-side / HTML regressions, WCAG-ish accessibility, SEO metadata, and best-practices headers.
# See docs/website/website-performance-workers-guardrails.md for what this does *not* cover (Worker CPU, waitUntil).

name: Website Lighthouse

on:
  pull_request:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/website-lighthouse.yml"
      - "scripts/dev/assert-lighthouse-scores.mjs"
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/website-lighthouse.yml"
      - "scripts/dev/assert-lighthouse-scores.mjs"
  workflow_dispatch:

concurrency:
  group: website-lighthouse-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lighthouse:
    name: Lighthouse (Next production server)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "25"
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install website dependencies
        run: npm ci --prefix website

      - name: Build docs site
        env:
          # Must match the URL Lighthouse uses below; otherwise canonical / OG
          # metadata use localhost while the page is served on 127.0.0.1 and SEO drops.
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
        run: npm run build --prefix website

      - name: Start server, run Lighthouse, assert scores
        env:
          PORT: "3000"
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
          # WCAG-oriented lab gate: accessibility must be perfect (1.0). Performance floor raised after home/header SSR (override locally with LH_MIN_*).
          LH_MIN_A11Y: "1"
          LH_MIN_PERF: "0.70"
        run: |
          set -euo pipefail
          cd website
          ./node_modules/.bin/next start -p "${PORT}" &
          PID=$!
          cleanup() { kill "$PID" 2>/dev/null || true; }
          trap cleanup EXIT

          for i in $(seq 1 60); do
            if curl -sf "http://127.0.0.1:${PORT}/api/health" >/dev/null; then
              echo "Server ready."
              break
            fi
            if ! kill -0 "$PID" 2>/dev/null; then
              echo "next start exited early."
              exit 1
            fi
            sleep 2
            if [ "$i" -eq 60 ]; then
              echo "Timeout waiting for /api/health"
              exit 1
            fi
          done

          BASE="http://127.0.0.1:${PORT}"
          LH_URLS=(
            "${BASE}/"
            "${BASE}/quickstart"
            "${BASE}/inference/clawql-inference"
            "${BASE}/getting-started/for-teams"
            "${BASE}/reference/protocol"
            "${BASE}/security/best-practices"
          )

          run_lighthouse() {
            local url="$1"
            local out="$2"
            shift 2
            echo "Lighthouse desktop: ${url}"
            npx --yes lighthouse@13.1.0 "${url}" \
              --preset=desktop \
              --only-categories=performance,accessibility,best-practices,seo \
              --chrome-flags="--headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage" \
              --output=json \
              --output-path="${out}" \
              --quiet \
              "$@"
            node ../scripts/dev/assert-lighthouse-scores.mjs "${out}"
          }

          idx=0
          for url in "${LH_URLS[@]}"; do
            run_lighthouse "${url}" "lighthouse-ci-${idx}.json"
            idx=$((idx + 1))
          done

          # Mobile throttling: stricter performance floor; same a11y/SEO/BP gates as desktop.
          # Lighthouse 13+ removed --preset=mobile; use --form-factor=mobile (+ screen emulation).
          echo "Lighthouse mobile: ${BASE}/"
          npx --yes lighthouse@13.1.0 "${BASE}/" \
            --form-factor=mobile \
            --screenEmulation.mobile \
            --only-categories=performance,accessibility,best-practices,seo \
            --chrome-flags="--headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage" \
            --output=json \
            --output-path=lighthouse-ci-mobile.json \
            --quiet

          LH_MIN_PERF=0.52 node ../scripts/dev/assert-lighthouse-scores.mjs lighthouse-ci-mobile.json
