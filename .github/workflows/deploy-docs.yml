# Deploy the Next.js + OpenNext docs app (Worker `clawql-docs` → https://docs.clawql.com).
# Manual procedure and history: https://github.com/danielsmithdevelopment/ClawQL/issues/87
name: Deploy docs (Cloudflare)

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "packages/mcp-api-adapter/src/executor-cmp-trace-demo.ts"
      - "packages/mcp-api-adapter/src/mcp-ui-trace-html.ts"
      - "packages/mcp-api-adapter/scripts/generate-executor-cmp-compare-static.mjs"
      - ".github/workflows/deploy-docs.yml"
  workflow_dispatch:

concurrency:
  group: deploy-docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "25"
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install website dependencies
        run: npm ci --prefix website

      - name: OpenNext build
        working-directory: website
        env:
          NEXT_PUBLIC_SITE_URL: https://docs.clawql.com
        run: npx opennextjs-cloudflare build

      - name: Fail if Worker gzip ≥ 3 MiB (free-plan limit)
        working-directory: website
        run: node scripts/check-worker-gzip-limit.mjs

      - name: wrangler deploy
        working-directory: website
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEXT_PUBLIC_SITE_URL: https://docs.clawql.com
        run: npx wrangler deploy
