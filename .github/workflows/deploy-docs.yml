# Deploy the Astro docs site (Worker Assets `clawql-docs-astro` → https://docs.clawql.com).
# ADR 0018 cutover: replaces OpenNext Worker `clawql-docs` (no RSC / _rsc surface).
# Manual procedure: scripts/deploy/deploy-docs-to-cloudflare.sh
name: Deploy docs (Cloudflare)

on:
  push:
    branches: [main]
    paths:
      - "apps/docs-astro/**"
      - "apps/docs/src/app/**"
      - "apps/docs/src/generated/**"
      - "apps/docs/content/**"
      - ".github/workflows/deploy-docs.yml"
      - "scripts/deploy/deploy-docs-to-cloudflare.sh"
      - "scripts/deploy/ensure-cloudflare-pages-project.sh"
  workflow_dispatch:

concurrency:
  group: deploy-docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "25"
          cache: npm
          cache-dependency-path: |
            apps/docs-astro/package-lock.json

      - name: Install docs-astro dependencies
        run: npm ci --prefix apps/docs-astro

      - name: Astro build
        working-directory: apps/docs-astro
        env:
          PUBLIC_SITE_URL: https://docs.clawql.com
        run: npm run build

      - name: wrangler deploy (Worker Assets)
        working-directory: apps/docs-astro
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Attach docs.clawql.com custom domain + route
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLAWQL_DOCS_DEPLOY_PAGES_PREVIEW: "0"
        # Re-uses script attach logic; skip rebuild by pointing at already-built dist.
        # Script rebuilds when invoked fully — for CI we only need domain/route ensure after wrangler deploy.
        run: |
          set -euo pipefail
          API=https://api.cloudflare.com/client/v4
          TOKEN="${CLOUDFLARE_API_TOKEN}"
          ACCOUNT_ID="${CLOUDFLARE_ACCOUNT_ID}"
          APEX=clawql.com
          HOSTNAME=docs.clawql.com
          WORKER_NAME=clawql-docs-astro
          cf() { curl -sS -H "Authorization: Bearer ${TOKEN}" -H "Content-Type: application/json" "$@"; }
          ZONE_ID="$(cf "${API}/zones?name=${APEX}" | jq -r '.result[0].id')"
          EXISTING_ID="$(cf "${API}/accounts/${ACCOUNT_ID}/workers/domains?per_page=100" \
            | jq -r --arg h "$HOSTNAME" '.result[]? | select(.hostname==$h) | .id // empty')"
          EXISTING_SVC="$(cf "${API}/accounts/${ACCOUNT_ID}/workers/domains?per_page=100" \
            | jq -r --arg h "$HOSTNAME" '.result[]? | select(.hostname==$h) | .service // empty')"
          if [[ -n "$EXISTING_ID" && "$EXISTING_SVC" != "$WORKER_NAME" ]]; then
            cf -X DELETE "${API}/accounts/${ACCOUNT_ID}/workers/domains/${EXISTING_ID}" >/dev/null || true
          fi
          BODY="$(jq -n --arg h "$HOSTNAME" --arg s "$WORKER_NAME" --arg zid "$ZONE_ID" --arg zn "$APEX" \
            '{hostname:$h,service:$s,environment:"production",zone_id:$zid,zone_name:$zn}')"
          ATTACH="$(curl -sS -X PUT "${API}/accounts/${ACCOUNT_ID}/workers/domains" \
            -H "Authorization: Bearer ${TOKEN}" -H "Content-Type: application/json" -d "$BODY")"
          echo "$ATTACH" | jq .
          test "$(echo "$ATTACH" | jq -r '.success')" = "true"
          ROUTE_ID="$(cf "${API}/zones/${ZONE_ID}/workers/routes" \
            | jq -r --arg p "${HOSTNAME}/*" '.result[]? | select(.pattern==$p) | .id // empty')"
          if [[ -n "$ROUTE_ID" ]]; then
            CUR="$(cf "${API}/zones/${ZONE_ID}/workers/routes" \
              | jq -r --arg p "${HOSTNAME}/*" --arg s "$WORKER_NAME" \
                '.result[]? | select(.pattern==$p) | .script')"
            if [[ "$CUR" != "$WORKER_NAME" ]]; then
              cf -X DELETE "${API}/zones/${ZONE_ID}/workers/routes/${ROUTE_ID}" >/dev/null || true
              curl -sS -X POST "${API}/zones/${ZONE_ID}/workers/routes" \
                -H "Authorization: Bearer ${TOKEN}" -H "Content-Type: application/json" \
                -d "$(jq -n --arg p "${HOSTNAME}/*" --arg s "$WORKER_NAME" '{pattern:$p,script:$s}')" | jq .
            fi
          else
            curl -sS -X POST "${API}/zones/${ZONE_ID}/workers/routes" \
              -H "Authorization: Bearer ${TOKEN}" -H "Content-Type: application/json" \
              -d "$(jq -n --arg p "${HOSTNAME}/*" --arg s "$WORKER_NAME" '{pattern:$p,script:$s}')" | jq .
          fi

      - name: Smoke https://docs.clawql.com
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/docs-home.html -w "%{http_code}" -L --max-time 30 -A "Mozilla/5.0" https://docs.clawql.com/)
          echo "HTTP $code"
          test "$code" = "200"
          grep -q '_astro/' /tmp/docs-home.html
          grep -q 'ClawQL' /tmp/docs-home.html
          rsc=$(curl -sS -o /dev/null -w "%{http_code}" -L --max-time 20 https://docs.clawql.com/_rsc || true)
          echo "_rsc HTTP $rsc (expect 404)"
          test "$rsc" = "404"
