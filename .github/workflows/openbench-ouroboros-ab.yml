# OpenBench A/B: ouroboros-on vs ouroboros-off (stagnation / oscillation escape).
#
# Spend-safe defaults (doom_loop OpenCode guard OFF so thrash can appear):
#   - trials=1, timeout=180s, turns≤50 hard-fail, tokens≤8000, maxGenerations≤4
#   - workflow_dispatch by default (not on every PR push)
#   - PR/push only when Ouroboros or this task changes
#
# Same cheap OpenRouter model as the main OpenBench matrix.

name: OpenBench A/B (ouroboros on vs off)

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Cheap OpenRouter default — or any openrouter/* / BYOK id"
        required: true
        type: string
        default: openrouter/deepseek/deepseek-chat
      trials:
        description: Trials per arm (keep at 1 unless investigating noise)
        required: true
        type: choice
        options:
          - "1"
          - "2"
        default: "1"
      timeout_s:
        description: Per-arm agent timeout (hard-capped at 180 for this task)
        required: true
        type: string
        default: "180"
      arms:
        description: Which arms to run
        required: true
        type: choice
        options:
          - ouroboros-on,ouroboros-off
          - ouroboros-on
          - ouroboros-off
        default: ouroboros-on,ouroboros-off
      inference_port:
        description: Local clawql-inference port
        required: true
        type: string
        default: "8080"
  pull_request:
    paths:
      - "openbench/tasks/ouroboros-oscillation-escape/**"
      - "openbench/scripts/run-ab-compare.py"
      - "packages/clawql-ouroboros/**"
      - "src/onboarding/harness-cli.ts"
      - ".github/workflows/openbench-ouroboros-ab.yml"
      - "docs/benchmarks/openbench-ouroboros*.md"
  push:
    branches: [main]
    paths:
      - "openbench/tasks/ouroboros-oscillation-escape/**"
      - "openbench/scripts/run-ab-compare.py"
      - "packages/clawql-ouroboros/**"
      - "src/onboarding/harness-cli.ts"
      - ".github/workflows/openbench-ouroboros-ab.yml"
      - "docs/benchmarks/openbench-ouroboros*.md"

permissions:
  contents: read

concurrency:
  group: openbench-ouroboros-ab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ab-compare:
    name: A/B ouroboros-oscillation-escape
    runs-on: ubuntu-latest
    # Wall budget: ~2 arms × 180s + setup. Fail closed before runaway spend.
    timeout-minutes: 40
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENBENCH_TASK: ouroboros-oscillation-escape
      OPENBENCH_MODEL: ${{ inputs.model || 'openrouter/deepseek/deepseek-chat' }}
      OPENBENCH_TRIALS: ${{ inputs.trials || '1' }}
      OPENBENCH_TIMEOUT_S: ${{ inputs.timeout_s || '180' }}
      OPENBENCH_ARMS: ${{ inputs.arms || 'ouroboros-on,ouroboros-off' }}
      CLAWQL_INFERENCE_PORT: ${{ inputs.inference_port || '8080' }}
      CLAWQL_OPENBENCH: "1"
      CLAWQL_HARNESS_ALLOW_UNSANDBOXED: "1"
      CLAWQL_OPENBENCH_HARNESS: "opencode"
      # Prove thrash without OpenCode's identical-tool guard; 50-turn hard cap binds spend.
      CLAWQL_OPENBENCH_DOOM_LOOP: "allow"
      CLAWQL_OPENROUTER_HTTP_REFERER: https://clawql.com
      CLAWQL_OPENROUTER_APP_TITLE: ClawQL OpenBench Ouroboros
      # Server-side evolutionary loop ceiling (defense in depth vs agent args).
      CLAWQL_OUROBOROS_MAX_GENERATIONS: "4"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Credential preflight
        id: preflight
        run: |
          set -euo pipefail
          MODEL="${OPENBENCH_MODEL}"
          run_benchmark=false
          reason=""

          has_byok=false
          if [ -n "${DEEPSEEK_API_KEY:-}" ] || [ -n "${GROQ_API_KEY:-}" ] \
            || [ -n "${OPENAI_API_KEY:-}" ] || [ -n "${ANTHROPIC_API_KEY:-}" ]; then
            has_byok=true
          fi

          if [[ "$MODEL" == openrouter/* ]]; then
            if [ -n "${OPENROUTER_API_KEY:-}" ]; then
              run_benchmark=true
              reason="OpenRouter key for $MODEL (ouroboros oscillation A/B)"
            else
              reason="Model '$MODEL' needs repository secret OPENROUTER_API_KEY."
            fi
          elif [ "$has_byok" = true ]; then
            run_benchmark=true
            reason="Direct BYOK credentials for clawql-inference ($MODEL)"
          else
            reason="Add OPENROUTER_API_KEY or a vendor BYOK secret."
          fi

          # Hard spend clamp — never allow dispatch to raise above 180s for this task.
          if [ "${OPENBENCH_TIMEOUT_S}" -gt 180 ]; then
            echo "OPENBENCH_TIMEOUT_S=${OPENBENCH_TIMEOUT_S} clamped to 180" >> "$GITHUB_STEP_SUMMARY"
            echo "OPENBENCH_TIMEOUT_S=180" >> "$GITHUB_ENV"
          fi

          echo "run_benchmark=${run_benchmark}" >> "$GITHUB_OUTPUT"
          {
            echo "## OpenBench Ouroboros A/B preflight"
            echo ""
            echo "- Task: \`ouroboros-oscillation-escape\`"
            echo "- Model: \`${OPENBENCH_MODEL}\`"
            echo "- Arms: \`${OPENBENCH_ARMS}\`"
            echo "- Trials/arm: \`${OPENBENCH_TRIALS}\`"
            echo "- Timeout (s): \`${OPENBENCH_TIMEOUT_S}\` (hard max 180)"
            echo "- Hard caps: turns≤50, tokens≤8000, maxGenerations≤4"
            echo "- OpenCode doom_loop: **allow** (thrash visible; turn cap is spend backstop)"
            echo "- Run live benchmark: \`${run_benchmark}\`"
            echo "- Note: ${reason}"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$run_benchmark" != "true" ]; then
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              echo "::error::${reason}"
              exit 1
            fi
            echo "::notice::Skipping live Ouroboros A/B — ${reason}"
          fi

      - name: Validate task checkers (offline)
        run: python3 openbench/validate_tasks.py

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        if: steps.preflight.outputs.run_benchmark == 'true'
        with:
          node-version: "22"
          cache: npm

      - name: Install ClawQL (workspace)
        if: steps.preflight.outputs.run_benchmark == 'true'
        run: |
          npm ci
          npm run build
          echo "CLAWQL_BIN=$GITHUB_WORKSPACE/bin/clawql.mjs" >> "$GITHUB_ENV"
          node bin/clawql.mjs --version

      - name: Install OpenCode CLI
        if: steps.preflight.outputs.run_benchmark == 'true'
        run: |
          npm install -g opencode-ai@latest 2>/dev/null \
            || npm install -g @opencode-ai/cli@latest 2>/dev/null \
            || npm install -g opencode@latest
          command -v opencode
          opencode --version || true

      - name: Start clawql-inference
        if: steps.preflight.outputs.run_benchmark == 'true'
        run: |
          mkdir -p "artifacts/openbench-ouroboros-ab/${OPENBENCH_TASK}"
          PORT="${CLAWQL_INFERENCE_PORT}"
          node bin/clawql.mjs inference serve --port "$PORT" \
            > "artifacts/openbench-ouroboros-ab/${OPENBENCH_TASK}/inference.log" 2>&1 &
          echo $! > /tmp/clawql-inference.pid
          for i in $(seq 1 60); do
            if curl -sf "http://127.0.0.1:${PORT}/healthz" >/dev/null; then
              echo "clawql-inference healthy after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::clawql-inference failed to become healthy"
          tail -n 120 "artifacts/openbench-ouroboros-ab/${OPENBENCH_TASK}/inference.log" || true
          exit 1

      - name: Run Ouroboros A/B compare
        id: ab
        if: steps.preflight.outputs.run_benchmark == 'true'
        env:
          CLAWQL_BIN: ${{ env.CLAWQL_BIN }}
          CLAWQL_INFERENCE_URL: http://127.0.0.1:${{ env.CLAWQL_INFERENCE_PORT }}/v1
        run: |
          OUT="artifacts/openbench-ouroboros-ab/${OPENBENCH_TASK}/results.json"
          SUM="artifacts/openbench-ouroboros-ab/${OPENBENCH_TASK}/summary.md"
          python3 openbench/scripts/run-ab-compare.py \
            --task "${OPENBENCH_TASK}" \
            --model "${OPENBENCH_MODEL}" \
            --inference-url "http://127.0.0.1:${CLAWQL_INFERENCE_PORT}/v1" \
            --trials "${OPENBENCH_TRIALS}" \
            --timeout "${OPENBENCH_TIMEOUT_S}" \
            --arms "${OPENBENCH_ARMS}" \
            --out "$OUT" \
            --summary-md "$SUM"
          {
            echo "## OpenBench Ouroboros A/B — \`${OPENBENCH_TASK}\`"
            echo ""
            echo "- Run: [\`${{ github.run_id }}\`](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
            echo "- Caps: 180s wall / 50 turns / 8000 tokens / maxGenerations≤4 (doom_loop allow)"
            echo ""
            cat "$SUM"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Stop clawql-inference
        if: always() && steps.preflight.outputs.run_benchmark == 'true'
        run: |
          if [ -f /tmp/clawql-inference.pid ]; then
            kill "$(cat /tmp/clawql-inference.pid)" 2>/dev/null || true
          fi

      - name: Upload artifacts
        if: always() && steps.preflight.outputs.run_benchmark == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: openbench-ouroboros-ab-${{ github.run_id }}
          path: artifacts/openbench-ouroboros-ab/
          if-no-files-found: ignore
