# OpenBench A/B: ouroboros-on vs ouroboros-off (stagnation / oscillation escape).
#
# RETIRED from PR/push auto-runs (claim verified + replicated). Re-enable only via
# workflow_dispatch when you intentionally want another cell. See
# openbench/ci-matrix.json → retired.ouroboros-oscillation-escape /
# ouroboros_pr_enabled=false.
#
# Matrix over OpenCode doom_loop:
#   - allow — thrash study (identical-tool spam visible)
#   - deny  — additive value with production guard on (strategy A↔B)
#
# Spend-safe defaults:
#   - trials=1 (dispatch may raise to 3), timeout=180s, turns≤50, tokens≤8000
#   - maxGenerations≤4
#
# Same cheap OpenRouter model as the main OpenBench matrix.

name: OpenBench A/B (ouroboros on vs off)

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Cheap OpenRouter default — or any openrouter/* / BYOK id"
        required: true
        type: string
        default: openrouter/deepseek/deepseek-chat
      trials:
        description: Trials per arm (use 3 for doom_loop=deny confidence)
        required: true
        type: choice
        options:
          - "1"
          - "2"
          - "3"
        default: "1"
      timeout_s:
        description: Per-arm agent timeout (hard-capped at 180 for this task)
        required: true
        type: string
        default: "180"
      arms:
        description: Which arms to run
        required: true
        type: choice
        options:
          - ouroboros-on,ouroboros-off
          - ouroboros-on
          - ouroboros-off
        default: ouroboros-on,ouroboros-off
      doom_loop:
        description: OpenCode doom_loop mode (or both)
        required: true
        type: choice
        options:
          - both
          - allow
          - deny
        default: both
      inference_port:
        description: Local clawql-inference port
        required: true
        type: string
        default: "8080"

permissions:
  contents: read

concurrency:
  group: openbench-ouroboros-ab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  resolve-matrix:
    name: Resolve doom_loop matrix
    runs-on: ubuntu-latest
    outputs:
      modes: ${{ steps.set.outputs.modes }}
    steps:
      - id: set
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MODE="${{ inputs.doom_loop }}"
            if [ "$MODE" = "both" ] || [ -z "$MODE" ]; then
              echo 'modes=["allow","deny"]' >> "$GITHUB_OUTPUT"
            else
              echo "modes=[\"${MODE}\"]" >> "$GITHUB_OUTPUT"
            fi
          else
            # PR/push: both cells (1 trial each via OPENBENCH_TRIALS default).
            echo 'modes=["allow","deny"]' >> "$GITHUB_OUTPUT"
          fi

  ab-compare:
    name: A/B ouroboros (${{ matrix.doom_loop }})
    needs: resolve-matrix
    runs-on: ubuntu-latest
    # Wall budget: ~2 arms × 180s × trials + setup. Fail closed before runaway spend.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        doom_loop: ${{ fromJson(needs.resolve-matrix.outputs.modes) }}
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENBENCH_TASK: ouroboros-oscillation-escape
      OPENBENCH_MODEL: ${{ inputs.model || 'openrouter/deepseek/deepseek-chat' }}
      OPENBENCH_TRIALS: ${{ inputs.trials || '1' }}
      OPENBENCH_TIMEOUT_S: ${{ inputs.timeout_s || '180' }}
      OPENBENCH_ARMS: ${{ inputs.arms || 'ouroboros-on,ouroboros-off' }}
      CLAWQL_INFERENCE_PORT: ${{ inputs.inference_port || '8080' }}
      CLAWQL_OPENBENCH: "1"
      CLAWQL_HARNESS_ALLOW_UNSANDBOXED: "1"
      CLAWQL_OPENBENCH_HARNESS: "opencode"
      CLAWQL_OPENBENCH_DOOM_LOOP: ${{ matrix.doom_loop }}
      CLAWQL_OPENROUTER_HTTP_REFERER: https://clawql.com
      CLAWQL_OPENROUTER_APP_TITLE: ClawQL OpenBench Ouroboros
      CLAWQL_OUROBOROS_MAX_GENERATIONS: "4"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Credential preflight
        id: preflight
        run: |
          set -euo pipefail
          MODEL="${OPENBENCH_MODEL}"
          run_benchmark=false
          reason=""

          has_byok=false
          if [ -n "${DEEPSEEK_API_KEY:-}" ] || [ -n "${GROQ_API_KEY:-}" ] \
            || [ -n "${OPENAI_API_KEY:-}" ] || [ -n "${ANTHROPIC_API_KEY:-}" ]; then
            has_byok=true
          fi

          if [[ "$MODEL" == openrouter/* ]]; then
            if [ -n "${OPENROUTER_API_KEY:-}" ]; then
              run_benchmark=true
              reason="OpenRouter key for $MODEL (ouroboros oscillation A/B)"
            else
              reason="Model '$MODEL' needs repository secret OPENROUTER_API_KEY."
            fi
          elif [ "$has_byok" = true ]; then
            run_benchmark=true
            reason="Direct BYOK credentials for clawql-inference ($MODEL)"
          else
            reason="Add OPENROUTER_API_KEY or a vendor BYOK secret."
          fi

          if [ "${OPENBENCH_TIMEOUT_S}" -gt 180 ]; then
            echo "OPENBENCH_TIMEOUT_S=${OPENBENCH_TIMEOUT_S} clamped to 180" >> "$GITHUB_STEP_SUMMARY"
            echo "OPENBENCH_TIMEOUT_S=180" >> "$GITHUB_ENV"
          fi

          echo "run_benchmark=${run_benchmark}" >> "$GITHUB_OUTPUT"
          {
            echo "## OpenBench Ouroboros A/B preflight"
            echo ""
            echo "- Task: \`ouroboros-oscillation-escape\`"
            echo "- doom_loop: \`${{ matrix.doom_loop }}\`"
            echo "- Model: \`${OPENBENCH_MODEL}\`"
            echo "- Arms: \`${OPENBENCH_ARMS}\`"
            echo "- Trials/arm: \`${OPENBENCH_TRIALS}\`"
            echo "- Timeout (s): \`${OPENBENCH_TIMEOUT_S}\` (hard max 180)"
            echo "- Hard caps: turns≤50, tokens≤8000, maxGenerations≤4"
            echo "- Run live benchmark: \`${run_benchmark}\`"
            echo "- Note: ${reason}"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$run_benchmark" != "true" ]; then
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              echo "::error::${reason}"
              exit 1
            fi
            echo "::notice::Skipping live Ouroboros A/B — ${reason}"
          fi

      - name: Validate task checkers (offline)
        run: python3 openbench/validate_tasks.py

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        if: steps.preflight.outputs.run_benchmark == 'true'
        with:
          node-version: "22"
          cache: npm

      - name: Install ClawQL (workspace)
        if: steps.preflight.outputs.run_benchmark == 'true'
        run: |
          npm ci
          npm run build
          echo "CLAWQL_BIN=$GITHUB_WORKSPACE/bin/clawql.mjs" >> "$GITHUB_ENV"
          node bin/clawql.mjs --version

      - name: Install OpenCode CLI
        if: steps.preflight.outputs.run_benchmark == 'true'
        run: |
          OPENCODE_PKG_VERSION="${OPENBENCH_OPENCODE_VERSION:-1.18.11}"
          npm install -g "opencode-ai@${OPENCODE_PKG_VERSION}" 2>/dev/null \
            || npm install -g "@opencode-ai/cli@${OPENCODE_PKG_VERSION}" 2>/dev/null \
            || npm install -g "opencode@${OPENCODE_PKG_VERSION}"
          command -v opencode
          npm ls -g opencode-ai --depth=0 || true
          opencode --version || true

      - name: Configure inference call store (fine-tune traces)
        if: steps.preflight.outputs.run_benchmark == 'true'
        run: |
          set -euo pipefail
          ARTIFACT_DIR="${GITHUB_WORKSPACE}/artifacts/openbench-ouroboros-ab/${OPENBENCH_TASK}-${{ matrix.doom_loop }}"
          CALL_STORE="${ARTIFACT_DIR}/call-store/calls.jsonl"
          mkdir -p "${ARTIFACT_DIR}/call-store"
          {
            echo "OPENBENCH_ARTIFACT_DIR=${ARTIFACT_DIR}"
            echo "CLAWQL_INFERENCE_STORE=jsonl"
            echo "CLAWQL_INFERENCE_STORE_PATH=${CALL_STORE}"
          } >> "$GITHUB_ENV"
          echo "::notice::Inference call store → ${CALL_STORE}"

      - name: Start clawql-inference
        if: steps.preflight.outputs.run_benchmark == 'true'
        run: |
          ART="artifacts/openbench-ouroboros-ab/${OPENBENCH_TASK}-${{ matrix.doom_loop }}"
          mkdir -p "$ART"
          PORT="${CLAWQL_INFERENCE_PORT}"
          # Offset port per matrix cell to avoid collisions when jobs share a runner pool.
          if [ "${{ matrix.doom_loop }}" = "deny" ]; then
            PORT=$((PORT + 1))
            echo "CLAWQL_INFERENCE_PORT=${PORT}" >> "$GITHUB_ENV"
          fi
          node bin/clawql.mjs inference serve --port "$PORT" \
            > "$ART/inference.log" 2>&1 &
          echo $! > /tmp/clawql-inference-${{ matrix.doom_loop }}.pid
          for i in $(seq 1 60); do
            if curl -sf "http://127.0.0.1:${PORT}/healthz" >/dev/null; then
              echo "clawql-inference healthy after ${i}s on :${PORT}"
              exit 0
            fi
            sleep 1
          done
          echo "::error::clawql-inference failed to become healthy"
          tail -n 120 "$ART/inference.log" || true
          exit 1

      - name: Run Ouroboros A/B compare
        id: ab
        if: steps.preflight.outputs.run_benchmark == 'true'
        env:
          CLAWQL_BIN: ${{ env.CLAWQL_BIN }}
          CLAWQL_INFERENCE_URL: http://127.0.0.1:${{ env.CLAWQL_INFERENCE_PORT }}/v1
          CLAWQL_OPENBENCH_DOOM_LOOP: ${{ matrix.doom_loop }}
        run: |
          ART="artifacts/openbench-ouroboros-ab/${OPENBENCH_TASK}-${{ matrix.doom_loop }}"
          OUT="$ART/results.json"
          SUM="$ART/summary.md"
          python3 openbench/scripts/run-ab-compare.py \
            --task "${OPENBENCH_TASK}" \
            --model "${OPENBENCH_MODEL}" \
            --inference-url "http://127.0.0.1:${CLAWQL_INFERENCE_PORT}/v1" \
            --trials "${OPENBENCH_TRIALS}" \
            --timeout "${OPENBENCH_TIMEOUT_S}" \
            --arms "${OPENBENCH_ARMS}" \
            --out "$OUT" \
            --summary-md "$SUM"
          {
            echo "## OpenBench Ouroboros A/B — \`${OPENBENCH_TASK}\` (doom_loop=${{ matrix.doom_loop }})"
            echo ""
            echo "- Run: [\`${{ github.run_id }}\`](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
            echo "- Caps: 180s wall / 50 turns / 8000 tokens / maxGenerations≤4"
            echo ""
            cat "$SUM"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Stop clawql-inference
        if: always() && steps.preflight.outputs.run_benchmark == 'true'
        run: |
          if [ -f /tmp/clawql-inference-${{ matrix.doom_loop }}.pid ]; then
            kill "$(cat /tmp/clawql-inference-${{ matrix.doom_loop }}.pid)" 2>/dev/null || true
          fi
          sleep 1

      - name: Build publish-ready traces + sync durable R2
        if: always() && steps.preflight.outputs.run_benchmark == 'true' && steps.ab.outcome != 'skipped'
        env:
          CLAWQL_R2_TRACES_BUCKET: ${{ secrets.CLAWQL_R2_TRACES_BUCKET }}
          CLAWQL_OPENBENCH_R2_BUCKET: ${{ secrets.CLAWQL_OPENBENCH_R2_BUCKET }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLAWQL_CLOUDFLARE_API_TOKEN: ${{ secrets.CLAWQL_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLAWQL_R2_ACCOUNT_ID: ${{ secrets.CLAWQL_R2_ACCOUNT_ID }}
          CLAWQL_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLAWQL_CLOUDFLARE_ACCOUNT_ID }}
          CLAWQL_SYNC_ACCESS_KEY_ID: ${{ secrets.CLAWQL_SYNC_ACCESS_KEY_ID }}
          CLAWQL_SYNC_SECRET_ACCESS_KEY: ${{ secrets.CLAWQL_SYNC_SECRET_ACCESS_KEY }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CLAWQL_ENABLE_PRESIDIO: ${{ vars.CLAWQL_ENABLE_PRESIDIO }}
        uses: ./.github/actions/openbench-durable-traces
        with:
          artifact_dir: ${{ github.workspace }}/artifacts/openbench-ouroboros-ab/${{ env.OPENBENCH_TASK }}-${{ matrix.doom_loop }}
          run_id: ${{ github.run_id }}
          task: ${{ env.OPENBENCH_TASK }}-${{ matrix.doom_loop }}
          model: ${{ env.OPENBENCH_MODEL }}
          clawql_version: ${{ github.sha }}
          require_durable: ${{ vars.CLAWQL_OPENBENCH_REQUIRE_DURABLE_TRACES || '1' }}

      - name: Upload artifacts
        if: always() && steps.preflight.outputs.run_benchmark == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: openbench-ouroboros-ab-${{ matrix.doom_loop }}-${{ github.run_id }}
          path: artifacts/openbench-ouroboros-ab/
          if-no-files-found: ignore
          retention-days: 90
