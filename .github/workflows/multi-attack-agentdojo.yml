# AgentDojo matrix — stacked OpenAPPA Layer 5 + session IFC vs none, via OpenRouter.
#
# Publishes AgentDojo ASR + utility-under-attack (their metrics) alongside
# ClawQL sink-block / OpenAPPA deny counts. Never invents scores when the secret
# is missing.
#
# Default defended arm: clawql_data_flow_openappa (sidecar + IFC).
# IFC-only ablation (clawql_data_flow) available via workflow_dispatch defenses=.
# Panguard is MCP-gateway only — not in this FunctionsRuntime harness.
#
# Secrets:
#   OPENROUTER_API_KEY — required (same secret as OpenBench / Decision-1)
#
# Trigger:
#   workflow_dispatch (default smoke subset)
#   Optional path filter on agentdojo harness changes (dispatch still needed for keys)

name: Multi-attack AgentDojo matrix

on:
  # workflow_dispatch works once this file is on the default branch.
  # Until then, same-repo PRs that touch the harness run the smoke matrix
  # (OPENROUTER_API_KEY is available for non-fork PRs).
  pull_request:
    paths:
      - ".github/workflows/multi-attack-agentdojo.yml"
      - "scripts/benchmarks/multi-attack-injection/agentdojo/**"
      - "packages/clawql-api/openappa/**"
      - "docs/benchmarks/security-suite/multi-attack-injection/AGENTDOJO.md"
      - "docs/benchmarks/security-suite/multi-attack-injection/results-agentdojo.json"
  workflow_dispatch:
    inputs:
      mode:
        description: "smoke = small task subset; full = all user×injection pairs per suite"
        type: choice
        options: [smoke, full]
        default: full
      suites:
        description: "Comma-separated AgentDojo suites"
        type: string
        default: workspace,slack,banking,travel
      defenses:
        description: "Comma-separated defense arms (none, clawql_data_flow, clawql_data_flow_openappa)"
        type: string
        default: none,clawql_data_flow_openappa
      models:
        description: "Comma-separated OpenRouter model ids (no openrouter/ prefix needed). Federal-facing default excludes DeepSeek."
        type: string
        default: openai/gpt-4o-mini
      attack:
        description: "AgentDojo attack"
        type: string
        default: important_instructions
      force_rerun:
        description: "Force re-run cached AgentDojo logs"
        type: boolean
        default: true

permissions:
  contents: read
  actions: read

concurrency:
  group: multi-attack-agentdojo-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Credential gate
    runs-on: ubuntu-latest
    outputs:
      can_run: ${{ steps.gate.outputs.can_run }}
      skip_reason: ${{ steps.gate.outputs.skip_reason }}
      matrix_json: ${{ steps.matrix.outputs.matrix_json }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - id: secret
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -n "${OPENROUTER_API_KEY:-}" ]; then
            echo "has_openrouter=true" >>"$GITHUB_OUTPUT"
          else
            echo "has_openrouter=false" >>"$GITHUB_OUTPUT"
          fi

      - id: gate
        env:
          HAS_OR: ${{ steps.secret.outputs.has_openrouter }}
        run: |
          if [ "$HAS_OR" = "true" ]; then
            echo "can_run=true" >>"$GITHUB_OUTPUT"
            echo "skip_reason=" >>"$GITHUB_OUTPUT"
          else
            echo "can_run=false" >>"$GITHUB_OUTPUT"
            echo "skip_reason=Repository secret OPENROUTER_API_KEY is not set." >>"$GITHUB_OUTPUT"
            echo "::notice::AgentDojo matrix skipped — add OPENROUTER_API_KEY (same secret as OpenBench)."
          fi

      - id: matrix
        if: steps.gate.outputs.can_run == 'true'
        env:
          # PR path: full suites × gpt-4o-mini × (none + stacked OpenAPPA+IFC).
          # DeepSeek is lab-only — not in the default federal-facing matrix.
          # workflow_dispatch honors inputs when available on main.
          MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'full' }}
          SUITES: ${{ github.event_name == 'workflow_dispatch' && inputs.suites || 'workspace,slack,banking,travel' }}
          DEFENSES: ${{ github.event_name == 'workflow_dispatch' && inputs.defenses || 'none,clawql_data_flow_openappa' }}
          MODELS: ${{ github.event_name == 'workflow_dispatch' && inputs.models || 'openai/gpt-4o-mini' }}
          ATTACK: ${{ github.event_name == 'workflow_dispatch' && inputs.attack || 'important_instructions' }}
        run: |
          python3 <<'PY'
          import json, os
          suites = [s.strip() for s in os.environ["SUITES"].split(",") if s.strip()]
          models = [m.strip().removeprefix("openrouter/") for m in os.environ["MODELS"].split(",") if m.strip()]
          defenses = [d.strip() for d in os.environ["DEFENSES"].split(",") if d.strip()]
          allowed = {"none", "clawql_data_flow", "clawql_data_flow_openappa", "clawql_stack"}
          bad = [d for d in defenses if d not in allowed]
          if bad:
            raise SystemExit(f"unknown defenses: {bad}; allowed={sorted(allowed)}")
          attack = os.environ["ATTACK"]
          mode = os.environ["MODE"]
          include = []
          for suite in suites:
            for model in models:
              for defense in defenses:
                include.append({
                  "suite": suite,
                  "model": model,
                  "defense": defense,
                  "attack": attack,
                  "mode": mode,
                  "cell": f"{suite}__{defense}__{model.replace('/', '_')}",
                })
          print(f"cells={len(include)} defenses={defenses}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
            fh.write("matrix_json=" + json.dumps({"include": include}) + "\n")
          PY

  agentdojo:
    name: ${{ matrix.cell }}
    needs: gate
    if: needs.gate.outputs.can_run == 'true'
    runs-on: ubuntu-latest
    # Full workspace alone is ~560 pairs; allow long OpenRouter runs.
    timeout-minutes: 360
    strategy:
      fail-fast: false
      # Serialize: OpenRouter rate limits (same pattern as openbench-ab).
      max-parallel: 1
      matrix: ${{ fromJson(needs.gate.outputs.matrix_json) }}
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      CLAWQL_OPENROUTER_HTTP_REFERER: https://clawql.com
      CLAWQL_OPENROUTER_APP_TITLE: ClawQL AgentDojo
      MAI_AGENTDOJO: "1"
      MAI_AGENTDOJO_SUITE: ${{ matrix.suite }}
      MAI_AGENTDOJO_MODEL: ${{ matrix.model }}
      MAI_AGENTDOJO_DEFENSE: ${{ matrix.defense }}
      MAI_AGENTDOJO_ATTACK: ${{ matrix.attack }}
      MAI_AGENTDOJO_FORCE: "1"
      MAI_AGENTDOJO_OUT: ${{ github.workspace }}/agentdojo-cells/${{ matrix.cell }}.json
      MAI_AGENTDOJO_LOGDIR: ${{ github.workspace }}/agentdojo-logs/${{ matrix.cell }}
      # Stacked arm: OpenAPPA sidecar (bench timeout > production 250ms — long trajectories).
      CLAWQL_OPENAPPA_URL: http://127.0.0.1:8789
      CLAWQL_OPENAPPA_MCP_SERVER: agentdojo
      CLAWQL_OPENAPPA_TIMEOUT_MS: "2000"
      CLAWQL_OPENAPPA_POLICY_EPOCH: agentdojo-v1
      APPA_VERSION: "0.37.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install AgentDojo
        run: pip install -r scripts/benchmarks/multi-attack-injection/agentdojo/requirements.txt

      - name: Install OpenAPPA appa
        if: matrix.defense == 'clawql_data_flow_openappa' || matrix.defense == 'clawql_stack'
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/archestra-ai/OpenAPPA/releases/download/v${APPA_VERSION}/appa-install.sh \
            | APPA_VERSION="v${APPA_VERSION}" APPA_INSTALL_DIR="$HOME/.local/bin" sh
          echo "$HOME/.local/bin" >>"$GITHUB_PATH"
          appa --version

      - name: Start OpenAPPA sidecar
        if: matrix.defense == 'clawql_data_flow_openappa' || matrix.defense == 'clawql_stack'
        run: |
          set -euo pipefail
          rm -f /tmp/clawql-appa-agentdojo.db
          appa runtime --adapter opencode --listen 127.0.0.1:8789 \
            --config packages/clawql-api/openappa/appa-agentdojo.toml \
            --db /tmp/clawql-appa-agentdojo.db \
            > /tmp/appa-agentdojo.log 2>&1 &
          echo $! > /tmp/appa-agentdojo.pid
          # Wait until session_start ack
          for i in $(seq 1 60); do
            if python3 - <<'PY'
          import json, urllib.request
          body=json.dumps({
            "protocol":1,"adapter":"opencode","event":"session_start",
            "root_id":"ci-health"
          }).encode()
          req=urllib.request.Request(
            "http://127.0.0.1:8789/hook", data=body,
            headers={"Content-Type":"application/json"}, method="POST")
          try:
            with urllib.request.urlopen(req, timeout=2) as r:
              d=json.loads(r.read().decode())
            raise SystemExit(0 if d.get("decision") in ("ack","context") else 1)
          except Exception:
            raise SystemExit(1)
          PY
            then
              echo "OpenAPPA sidecar ready"
              exit 0
            fi
            sleep 1
          done
          echo "::error::OpenAPPA sidecar failed to become ready"
          cat /tmp/appa-agentdojo.log || true
          exit 1

      - name: Smoke task subset
        if: matrix.mode == 'smoke'
        run: |
          {
            echo "MAI_AGENTDOJO_USER_TASKS=user_task_0,user_task_1,user_task_2,user_task_3"
            echo "MAI_AGENTDOJO_INJECTION_TASKS=injection_task_0,injection_task_1,injection_task_2"
          } >>"$GITHUB_ENV"
          echo "::notice::smoke subset — 4 user × 3 injection tasks"

      - name: Full suite notice
        if: matrix.mode == 'full'
        run: |
          echo "::notice::FULL AgentDojo — all user×injection pairs for suite=${{ matrix.suite }} defense=${{ matrix.defense }} model=${{ matrix.model }}"

      - name: OpenRouter key probe
        run: |
          set -euo pipefail
          code="$(curl -sS -o /tmp/or-key.json -w '%{http_code}' \
            -H "Authorization: Bearer ${OPENROUTER_API_KEY}" \
            https://openrouter.ai/api/v1/key || true)"
          echo "openrouter_key_http=${code}"
          if [ "$code" != "200" ]; then
            echo "::error::OpenRouter key probe failed (HTTP ${code})"
            cat /tmp/or-key.json || true
            exit 1
          fi

      - name: Run AgentDojo cell
        working-directory: scripts/benchmarks/multi-attack-injection/agentdojo
        run: |
          mkdir -p "$(dirname "$MAI_AGENTDOJO_OUT")" "$MAI_AGENTDOJO_LOGDIR"
          python3 run_benchmark.py
          python3 - <<'PY'
          import json, os
          p = os.environ["MAI_AGENTDOJO_OUT"]
          r = json.load(open(p))
          print("status", r.get("status"))
          mr = r.get("must_report") or {}
          ar = r.get("also_report") or {}
          print("asr", mr.get("agentdojo_asr"), "utility", mr.get("agentdojo_utility_under_attack"))
          print("openappa_denies", ar.get("openappa_denies"), "sink_blocks", ar.get("clawql_sink_blocks"))
          if r.get("status") != "measured":
            raise SystemExit(f"cell not measured: {r.get('status')} {r.get('error')}")
          PY

      - name: Stop OpenAPPA sidecar
        if: always() && (matrix.defense == 'clawql_data_flow_openappa' || matrix.defense == 'clawql_stack')
        run: |
          if [ -f /tmp/appa-agentdojo.pid ]; then
            kill "$(cat /tmp/appa-agentdojo.pid)" 2>/dev/null || true
          fi
          appa runtime stop --listen 127.0.0.1:8789 2>/dev/null || true
          tail -n 80 /tmp/appa-agentdojo.log || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agentdojo-cell-${{ matrix.cell }}
          path: |
            agentdojo-cells/${{ matrix.cell }}.json
            agentdojo-logs/${{ matrix.cell }}/
          if-no-files-found: warn
          retention-days: 14

  aggregate:
    name: Aggregate matrix
    needs: [gate, agentdojo]
    if: always() && needs.gate.outputs.can_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v4
        with:
          pattern: agentdojo-cell-*
          path: agentdojo-download
          merge-multiple: true

      - name: Collect cell JSON
        run: |
          set -euo pipefail
          mkdir -p agentdojo-cells-agg
          # Only per-cell reports under agentdojo-cells/ — not nested log trajectories.
          find agentdojo-download -path '*/agentdojo-cells/*.json' -print0 | while IFS= read -r -d '' f; do
            base="$(basename "$f")"
            cp "$f" "agentdojo-cells-agg/$base"
          done
          # Fallback: top-level suite__defense__model.json if layout differs
          if [ -z "$(ls -A agentdojo-cells-agg 2>/dev/null || true)" ]; then
            find agentdojo-download -maxdepth 2 -name '*__*__*.json' -print0 | while IFS= read -r -d '' f; do
              cp "$f" "agentdojo-cells-agg/$(basename "$f")"
            done
          fi
          ls -la agentdojo-cells-agg || true

      - name: Aggregate
        run: |
          set +e
          python3 scripts/benchmarks/multi-attack-injection/agentdojo/aggregate_matrix.py \
            agentdojo-cells-agg \
            docs/benchmarks/security-suite/multi-attack-injection/results-agentdojo.json
          agg_rc=$?
          set -e
          python3 - <<'PY'
          import json
          r = json.load(open("docs/benchmarks/security-suite/multi-attack-injection/results-agentdojo.json"))
          print(json.dumps({"status": r["status"], "n_measured": r["n_measured"], "rows": r["rows"]}, indent=2))
          PY
          # Incomplete (no measured cells) still uploads the report; fail the job so CI is red.
          exit "$agg_rc"

      - uses: actions/upload-artifact@v4
        with:
          name: agentdojo-matrix-results
          path: |
            docs/benchmarks/security-suite/multi-attack-injection/results-agentdojo.json
            agentdojo-cells-agg/
          retention-days: 30

  skip-notice:
    name: Skip notice
    needs: gate
    if: needs.gate.outputs.can_run != 'true'
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "::notice::${{ needs.gate.outputs.skip_reason }}"
          echo "AgentDojo matrix not run."
