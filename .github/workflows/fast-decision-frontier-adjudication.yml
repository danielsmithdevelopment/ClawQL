# Optional §7.2 frontier adjudication (Sonnet / OpenRouter) + optional live GLiNER2.
#
# Does NOT run on every PR. Triggers:
#   - Marker PR/push (Harvey LAB style): path-filtered on
#       packages/clawql-core/src/classifier/held-out/.run-frontier-adjudication
#     First non-comment line = suite (v0.1 | v0.2-harvey | v0.3-routing-fresh |
#     v0.4-routing-fresh | v0.5-routing-fresh | v0.6-routing-fresh). Absent/empty → skip.
#   - schedule (daily) — produces live labels when repo secrets exist; otherwise
#     credential-gate skip-notice (same Harvey LAB pattern). Removes need for
#     agent `actions:write` to dispatch once secrets are installed.
#   - workflow_dispatch (Actions UI / `gh workflow run` with actions:write)
#   - repository_dispatch type `frontier-adjudication` (PAT / app token)
#
# Credential gate (same pattern as harvey-lab-firm-knowledge.yml). When secrets
# are present, starts the HTTP frontier-judge sidecar and runs
# scripts/run-held-out-adjudication.mts. When with_gliner=true (default on
# schedule / dispatch / marker PR), also starts a live GLiNER2 sidecar so the
# same artifact can report scorerBackend=gliner2 (productionTrusted still needs
# criteria).
#
# Secrets (either):
#   ANTHROPIC_API_KEY  — preferred for claude-sonnet-4-6
#   OPENROUTER_API_KEY — alternate / Claude via OpenRouter when
#                        CLAWQL_FRONTIER_JUDGE_VIA_OPENROUTER=1
# Optional: HF_TOKEN (faster/gated HF downloads for live GLiNER)
#
# Operator (Harvey-style, no actions:write needed):
#   1. Branch from main; set packages/clawql-core/src/classifier/held-out/.run-frontier-adjudication
#      to `v0.5-routing-fresh` (or v0.4-routing-fresh / v0.2-harvey / v0.3 / v0.1).
#   2. Open PR → this workflow runs on the PR (same-repo secrets).
#   3. After labels land:
#        SUITE=v0.5-routing-fresh RESCORE=1 bash scripts/fetch-frontier-adjudication-artifact.sh
#   4. Remove/empty the marker in a follow-up commit (do not leave sticky on main).
#
# Operator (actions:write):
#   gh workflow run fast-decision-frontier-adjudication.yml --ref main \
#     -f judge_model=claude-sonnet-4-6 -f via_openrouter=false -f with_gliner=true \
#     -f suite=v0.5-routing-fresh
#   # repository_dispatch client_payload.suite also accepted (default v0.1).
#
# Honesty: uploaded labels are live-judge provenance. productionTrusted requires
# adjudicationKind=live + backendId=gliner2 + calibration criteria.

name: Fast Decision frontier adjudication

on:
  schedule:
    # Daily — skip-notice when secrets absent; live labels (+ GLiNER) when present.
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      judge_model:
        description: Judge model id (Anthropic or OpenRouter)
        required: true
        default: claude-sonnet-4-6
        type: string
      via_openrouter:
        description: Prefer OpenRouter for Claude judge
        required: true
        default: false
        type: boolean
      with_gliner:
        description: Co-run live GLiNER2 sidecar for scorerBackend=gliner2
        required: true
        default: true
        type: boolean
      suite:
        description: Held-out suite name (v0.1 | v0.2-harvey | v0.3-routing-fresh | v0.4-routing-fresh | v0.5-routing-fresh | v0.6-routing-fresh)
        required: true
        default: v0.1
        type: choice
        options:
          - v0.1
          - v0.2-harvey
          - v0.3-routing-fresh
          - v0.4-routing-fresh
          - v0.5-routing-fresh
          - v0.6-routing-fresh
  repository_dispatch:
    types: [frontier-adjudication]
  pull_request:
    paths:
      - "packages/clawql-core/src/classifier/held-out/.run-frontier-adjudication"
      - ".github/workflows/fast-decision-frontier-adjudication.yml"
  push:
    branches: [main]
    paths:
      - "packages/clawql-core/src/classifier/held-out/.run-frontier-adjudication"
      - ".github/workflows/fast-decision-frontier-adjudication.yml"

permissions:
  contents: read

concurrency:
  group: frontier-adjudication-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Credential gate
    runs-on: ubuntu-latest
    outputs:
      can_run: ${{ steps.gate.outputs.can_run }}
      skip_reason: ${{ steps.gate.outputs.skip_reason }}
      via_openrouter: ${{ steps.gate.outputs.via_openrouter }}
      judge_model: ${{ steps.gate.outputs.judge_model }}
      with_gliner: ${{ steps.gate.outputs.with_gliner }}
      suite: ${{ steps.gate.outputs.suite }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - id: marker
        run: |
          set -euo pipefail
          MARKER="packages/clawql-core/src/classifier/held-out/.run-frontier-adjudication"
          SUITE_FROM_MARKER=""
          if [ -f "${MARKER}" ]; then
            SUITE_FROM_MARKER="$(
              awk 'NF && $1 !~ /^#/ { print $1; exit }' "${MARKER}" || true
            )"
          fi
          {
            echo "suite=${SUITE_FROM_MARKER}"
            if [ -n "${SUITE_FROM_MARKER}" ]; then
              echo "present=true"
            else
              echo "present=false"
            fi
          } >>"$GITHUB_OUTPUT"
          echo "::notice::marker suite='${SUITE_FROM_MARKER}' present=$([ -n "${SUITE_FROM_MARKER}" ] && echo true || echo false)"

      - id: secret
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          {
            if [ -n "${OPENROUTER_API_KEY:-}" ]; then
              echo "has_openrouter=true"
            else
              echo "has_openrouter=false"
            fi
            if [ -n "${ANTHROPIC_API_KEY:-}" ]; then
              echo "has_anthropic=true"
            else
              echo "has_anthropic=false"
            fi
          } >>"$GITHUB_OUTPUT"

      - id: gate
        env:
          HAS_OR: ${{ steps.secret.outputs.has_openrouter }}
          HAS_AN: ${{ steps.secret.outputs.has_anthropic }}
          WANT_OR: ${{ inputs.via_openrouter || false }}
          JUDGE_MODEL: ${{ inputs.judge_model || 'claude-sonnet-4-6' }}
          EVENT_NAME: ${{ github.event_name }}
          WANT_GLINER: ${{ inputs.with_gliner }}
          INPUT_SUITE: ${{ inputs.suite || '' }}
          PAYLOAD_SUITE: ${{ github.event.client_payload.suite || '' }}
          MARKER_SUITE: ${{ steps.marker.outputs.suite }}
          MARKER_PRESENT: ${{ steps.marker.outputs.present }}
        run: |
          set -euo pipefail
          VIA_OR=false
          if [ "${WANT_OR}" = "true" ]; then
            VIA_OR=true
          fi
          CAN=true
          REASON=""
          if [ "${VIA_OR}" = "true" ]; then
            if [ "${HAS_OR}" != "true" ]; then
              CAN=false
              REASON="OPENROUTER_API_KEY missing (via_openrouter=true)"
            fi
          else
            if [ "${HAS_AN}" != "true" ] && [ "${HAS_OR}" != "true" ]; then
              CAN=false
              REASON="ANTHROPIC_API_KEY and OPENROUTER_API_KEY both missing"
            fi
            if [ "${HAS_AN}" != "true" ] && [ "${HAS_OR}" = "true" ]; then
              VIA_OR=true
              echo "::notice::No ANTHROPIC_API_KEY — falling back to OpenRouter"
            fi
          fi
          # Schedule / repository_dispatch / marker PR default with_gliner=true;
          # workflow_dispatch honors input.
          WITH_GLINER=true
          if [ "${EVENT_NAME}" = "workflow_dispatch" ] && [ "${WANT_GLINER}" = "false" ]; then
            WITH_GLINER=false
          fi
          # Suite priority:
          #   workflow_dispatch input > repository_dispatch payload >
          #   marker file (PR/push) > schedule default (v0.2-harvey primary) >
          #   v0.1 fallback.
          # For pull_request/push: marker must be present or we skip (Harvey style).
          SUITE="v0.1"
          if [ -n "${INPUT_SUITE}" ]; then
            SUITE="${INPUT_SUITE}"
          elif [ -n "${PAYLOAD_SUITE}" ]; then
            SUITE="${PAYLOAD_SUITE}"
          elif [ "${EVENT_NAME}" = "pull_request" ] || [ "${EVENT_NAME}" = "push" ]; then
            if [ "${MARKER_PRESENT}" != "true" ] || [ -z "${MARKER_SUITE}" ]; then
              CAN=false
              REASON="marker packages/clawql-core/src/classifier/held-out/.run-frontier-adjudication missing or empty (Harvey-style gate)"
            else
              SUITE="${MARKER_SUITE}"
            fi
          elif [ "${EVENT_NAME}" = "schedule" ]; then
            SUITE="v0.2-harvey"
          elif [ -n "${MARKER_SUITE}" ]; then
            SUITE="${MARKER_SUITE}"
          fi
          case "${SUITE}" in
            v0.1|v0.2-harvey|v0.3-routing-fresh|v0.4-routing-fresh|v0.5-routing-fresh|v0.6-routing-fresh) ;;
            *)
              CAN=false
              REASON="unsupported suite '${SUITE}' (want v0.1 … v0.6-routing-fresh)"
              ;;
          esac
          {
            echo "can_run=${CAN}"
            echo "skip_reason=${REASON}"
            echo "via_openrouter=${VIA_OR}"
            echo "judge_model=${JUDGE_MODEL}"
            echo "with_gliner=${WITH_GLINER}"
            echo "suite=${SUITE}"
          } >>"$GITHUB_OUTPUT"
          if [ "${CAN}" = "true" ]; then
            echo "::notice::Credential gate passed (via_openrouter=${VIA_OR}, with_gliner=${WITH_GLINER}, suite=${SUITE})"
          else
            echo "::warning::Credential gate blocked frontier adjudication: ${REASON}"
          fi

  skip-notice:
    name: Skip (missing credentials)
    needs: gate
    if: needs.gate.outputs.can_run != 'true'
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "::warning::Frontier adjudication skipped: ${{ needs.gate.outputs.skip_reason }}"
          echo "Install ANTHROPIC_API_KEY or OPENROUTER_API_KEY as repo Actions secrets, then re-dispatch."

  adjudicate:
    name: Held-out frontier adjudicate (${{ matrix.suite }})
    needs: gate
    if: needs.gate.outputs.can_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # Schedule covers both suites; dispatch/payload uses the gated suite only.
        suite: ${{ github.event_name == 'schedule' && fromJSON('["v0.1","v0.2-harvey"]') || fromJSON(format('["{0}"]', needs.gate.outputs.suite)) }}
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      CLAWQL_FAST_DECISION_JUDGE_MODEL: ${{ needs.gate.outputs.judge_model }}
      CLAWQL_FRONTIER_JUDGE_VIA_OPENROUTER: ${{ needs.gate.outputs.via_openrouter }}
      CLAWQL_OPENROUTER_HTTP_REFERER: https://clawql.com
      CLAWQL_OPENROUTER_APP_TITLE: ClawQL Fast Decision Judge
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HUGGING_FACE_HUB_TOKEN: ${{ secrets.HF_TOKEN }}
      CLAWQL_FAST_DECISION_GLINER_MODEL: ${{ vars.CLAWQL_FAST_DECISION_GLINER_MODEL || 'fastino/GLiNER2.5-Decide' }}
      HELD_OUT_SUITE: ${{ matrix.suite }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          cache: npm

      - name: Install workspace
        run: npm ci

      - name: Build clawql-merkle + clawql-core
        run: npm run build -w clawql-merkle -w clawql-core

      - uses: actions/setup-python@v6
        if: needs.gate.outputs.with_gliner == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: infra/gliner-sidecar/requirements.txt

      - name: Install live GLiNER2 + torch (CPU)
        if: needs.gate.outputs.with_gliner == 'true'
        run: |
          set -euo pipefail
          python -m pip install -U pip
          python -m pip install -r infra/gliner-sidecar/requirements.txt
          python -m pip install "gliner2>=1.0.0" peft tiktoken protobuf torch --extra-index-url https://download.pytorch.org/whl/cpu

      - name: GLiNER sidecar unit tests (mock + multilabel mapping)
        if: needs.gate.outputs.with_gliner == 'true'
        run: |
          set -euo pipefail
          cd infra/gliner-sidecar
          python -m unittest test_app.py -v

      - name: Cache Hugging Face hub
        if: needs.gate.outputs.with_gliner == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/huggingface
          key: hf-gliner2-${{ env.CLAWQL_FAST_DECISION_GLINER_MODEL }}-${{ runner.os }}
          restore-keys: |
            hf-gliner2-${{ env.CLAWQL_FAST_DECISION_GLINER_MODEL }}-
            hf-gliner2-

      - name: Start live GLiNER2 sidecar
        if: needs.gate.outputs.with_gliner == 'true'
        run: |
          set -euo pipefail
          mkdir -p artifacts
          export CLAWQL_GLINER_SIDECAR_MODE=gliner2
          export CLAWQL_GLINER_SIDECAR_HOST=127.0.0.1
          export CLAWQL_GLINER_SIDECAR_PORT=18081
          export CLAWQL_FAST_DECISION_GLINER_MODEL="${CLAWQL_FAST_DECISION_GLINER_MODEL:-fastino/GLiNER2.5-Decide}"
          HEALTHZ="${{ github.workspace }}/artifacts/gliner2-healthz.json"
          (
            cd infra/gliner-sidecar
            python -m uvicorn app:app --host 127.0.0.1 --port 18081 \
              >"${RUNNER_TEMP}/gliner2.log" 2>&1 &
            echo $! >"${RUNNER_TEMP}/gliner2.pid"
          )
          for _ in $(seq 1 180); do
            if curl -sf "http://127.0.0.1:18081/healthz" >/dev/null; then
              curl -sf "http://127.0.0.1:18081/healthz" | tee "${HEALTHZ}"
              node -e "const s=require(process.argv[1]); if(s.backend!=='gliner2') process.exit(2); console.log('gliner', s.mode, s.backend)" "${HEALTHZ}"
              exit 0
            fi
            sleep 2
          done
          echo "::error::gliner2 sidecar failed to become healthy"
          cat "${RUNNER_TEMP}/gliner2.log" || true
          exit 1

      - name: Resolve GLiNER URL
        id: gliner_url
        run: |
          set -euo pipefail
          if [ "${{ needs.gate.outputs.with_gliner }}" = "true" ]; then
            echo "url=http://127.0.0.1:18081" >>"$GITHUB_OUTPUT"
          else
            echo "url=${{ vars.CLAWQL_FAST_DECISION_GLINER_URL }}" >>"$GITHUB_OUTPUT"
          fi

      - name: Start frontier-judge HTTP sidecar
        run: |
          set -euo pipefail
          npx tsx scripts/frontier-judge-http-server.mts \
            >"${RUNNER_TEMP}/frontier-judge.log" 2>&1 &
          echo $! >"${RUNNER_TEMP}/frontier-judge.pid"
          for _ in $(seq 1 60); do
            if curl -sf "http://127.0.0.1:18765/healthz" >/dev/null; then
              echo "judge healthy"
              curl -sf "http://127.0.0.1:18765/healthz"
              echo
              exit 0
            fi
            sleep 1
          done
          echo "::error::frontier-judge failed to become healthy"
          cat "${RUNNER_TEMP}/frontier-judge.log" || true
          exit 1

      - name: Run held-out adjudication (live judge ± live GLiNER)
        env:
          CLAWQL_FAST_DECISION_JUDGE_URL: http://127.0.0.1:18765/v1/fast-decision/adjudicate
          CLAWQL_FAST_DECISION_GLINER_URL: ${{ steps.gliner_url.outputs.url }}
          CLAWQL_FAST_DECISION_GLINER_TIMEOUT_MS: "120000"
          WITH_GLINER: ${{ needs.gate.outputs.with_gliner }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          SUITE="${HELD_OUT_SUITE:-v0.1}"
          echo "::notice::adjudicating suite=${SUITE}"
          npx tsx scripts/run-held-out-adjudication.mts \
            --suite "${SUITE}" \
            --out "artifacts/held-out-frontier-labels-${SUITE}.json" \
            | tee "artifacts/held-out-frontier-summary-${SUITE}.json"
          # Stable names for the primary suite artifact (fetch script + audits).
          cp -f "artifacts/held-out-frontier-labels-${SUITE}.json" artifacts/held-out-frontier-labels.json
          cp -f "artifacts/held-out-frontier-summary-${SUITE}.json" artifacts/held-out-frontier-summary.json
          MODE="$(node -e "const s=require('./artifacts/held-out-frontier-summary.json'); if(s.adjudicationMode!=='live') process.exit(2); if(!s.scorerBackend) process.exit(3); console.log(s.adjudicationMode,s.judgeModel,s.labelCount,s.scorerBackend,s.suiteId)")"
          echo "::notice::adjudication ${MODE}"
          if [ "${WITH_GLINER}" = "true" ]; then
            node -e "const s=require('./artifacts/held-out-frontier-summary.json'); if(s.scorerBackend!=='gliner2') { console.error('expected scorerBackend=gliner2, got', s.scorerBackend); process.exit(4); }"
            echo "::notice::live gliner2 scorer confirmed"
          fi

      - name: Stop sidecars
        if: always()
        run: |
          if [ -f "${RUNNER_TEMP}/frontier-judge.pid" ]; then
            kill "$(cat "${RUNNER_TEMP}/frontier-judge.pid")" 2>/dev/null || true
          fi
          if [ -f "${RUNNER_TEMP}/gliner2.pid" ]; then
            kill "$(cat "${RUNNER_TEMP}/gliner2.pid")" 2>/dev/null || true
          fi
          cat "${RUNNER_TEMP}/frontier-judge.log" || true
          cat "${RUNNER_TEMP}/gliner2.log" || true

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: held-out-frontier-adjudication-${{ matrix.suite }}
          path: |
            artifacts/held-out-frontier-labels.json
            artifacts/held-out-frontier-summary.json
            artifacts/held-out-frontier-labels-${{ matrix.suite }}.json
            artifacts/held-out-frontier-summary-${{ matrix.suite }}.json
            artifacts/gliner2-healthz.json
          if-no-files-found: warn
