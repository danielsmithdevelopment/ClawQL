# B-2.3 IDP pipeline smoke (scheduled / dispatch)
#
# Proves IDP **wiring** and optional local/remote vendor hops outside OpenBench
# `pr_active`. Stubbed orchestration remains `idp-safe-pipeline-lite` (retired WIN).
#
# - schedule: weekly (Mondays 14:00 UTC)
# - workflow_dispatch: pick tier offline | compose | live
# - Never burns PR OpenBench tokens

name: IDP pipeline smoke (B-2.3)

on:
  schedule:
    - cron: "0 14 * * 1"
  workflow_dispatch:
    inputs:
      tier:
        description: "offline = Helm+vitest; compose = + Tika/Gotenberg; live = + remote webhooks"
        required: true
        type: choice
        options:
          - offline
          - compose
          - live
        default: offline

permissions:
  contents: read

concurrency:
  group: idp-pipeline-b23-smoke
  cancel-in-progress: true

jobs:
  smoke:
    name: IDP B-2.3 smoke (${{ github.event.inputs.tier || 'offline' }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "25"
          cache: npm

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310
        with:
          version: v3.16.3

      - name: Install dependencies
        run: npm ci

      - name: Build clawql-documents (pipeline packages)
        run: |
          npm run build -w clawql-core
          npm run build -w clawql-auth
          npm run build -w clawql-api
          npm run build -w clawql-documents

      - name: Resolve smoke tier
        id: tier
        env:
          REQ_TIER: ${{ github.event.inputs.tier || 'offline' }}
          CLAWQL_HTTP_BASE: ${{ secrets.CLAWQL_HTTP_BASE }}
          CLAWQL_NEXTCLOUD_WEBHOOK_TOKEN: ${{ secrets.CLAWQL_NEXTCLOUD_WEBHOOK_TOKEN }}
          CLAWQL_CONESHARE_WEBHOOK_TOKEN: ${{ secrets.CLAWQL_CONESHARE_WEBHOOK_TOKEN }}
        run: |
          set -euo pipefail
          TIER="${REQ_TIER}"
          if [ "${TIER}" = "live" ]; then
            if [ -z "${CLAWQL_HTTP_BASE:-}" ] || {
              [ -z "${CLAWQL_NEXTCLOUD_WEBHOOK_TOKEN:-}" ] &&
                [ -z "${CLAWQL_CONESHARE_WEBHOOK_TOKEN:-}" ]
            }; then
              echo "::notice::live tier requested but webhook secrets missing — falling back to compose"
              TIER=compose
            fi
          fi
          echo "tier=${TIER}" >> "$GITHUB_OUTPUT"
          echo "IDP_SMOKE_TIER=${TIER}" >> "$GITHUB_ENV"

      - name: Run B-2.3 smoke script
        env:
          CLAWQL_HTTP_BASE: ${{ secrets.CLAWQL_HTTP_BASE }}
          CLAWQL_NEXTCLOUD_WEBHOOK_TOKEN: ${{ secrets.CLAWQL_NEXTCLOUD_WEBHOOK_TOKEN }}
          CLAWQL_CONESHARE_WEBHOOK_TOKEN: ${{ secrets.CLAWQL_CONESHARE_WEBHOOK_TOKEN }}
          IDP_SMOKE_OUT_DIR: ${{ github.workspace }}/artifacts/idp-b23-smoke
        run: bash scripts/dev/smoke-idp-pipeline-b23.sh

      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: idp-b23-smoke-${{ github.run_id }}
          path: artifacts/idp-b23-smoke/
          if-no-files-found: warn
