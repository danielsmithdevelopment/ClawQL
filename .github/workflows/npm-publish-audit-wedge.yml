# Publish clawql-merkle then clawql-audit only (standalone WORM wedge).
# Use when clawql-mcp@7.2.0 is already on npm and you need first-time package names.
# Requires npm trusted publishing (OIDC) and/or NPM_TOKEN.
name: npm publish audit wedge

on:
  workflow_dispatch:

concurrency:
  group: npm-publish-audit-wedge-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish-wedge:
    name: Pack smoke + publish clawql-merkle → clawql-audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "25"
          registry-url: https://registry.npmjs.org
          cache: npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Pack smoke (merkle + audit)
        run: bash scripts/dev/test-npm-pack-audit-wedge.sh

      - name: Publish wedge (merkle then audit)
        run: node scripts/release/npm-publish-audit-wedge.mjs
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
