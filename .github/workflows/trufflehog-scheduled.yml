# Historical secret scan — weekly + manual; complements mandatory Gitleaks in CI (#283).
# Excludes bundled upstream specs under providers/ (vendor examples / placeholders).
# TruffleHog --exclude-paths expects a file of newline-separated regexes, not an inline pattern.
name: TruffleHog

on:
  schedule:
    - cron: "15 8 * * 3"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trufflehog:
    name: TruffleHog (git history)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # actions/checkout@v6.0.2
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0

      # trufflesecurity/trufflehog@v3.95.3 (tag → commit pin for supply chain)
      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@37b77001d0174ebec2fcca2bd83ff83a6d45a3ab
        with:
          path: ./
          extra_args: --exclude-paths=.github/trufflehog-exclude-paths.txt
