# Historical secret scan — weekly + manual; complements mandatory Gitleaks in CI (#283).
# Excludes bundled upstream specs under providers/ (vendor examples / placeholders).
# TruffleHog --exclude-paths expects a file of newline-separated regexes, not an inline pattern.
name: TruffleHog

on:
  schedule:
    - cron: "15 8 * * 3"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trufflehog:
    name: TruffleHog (git history)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # actions/checkout@v7.0.0
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0

      # trufflesecurity/trufflehog@v3.95.6 (tag → commit pin for supply chain)
      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@30d5bb91af1a771378349dbbb0c82129392acf70
        with:
          path: ./
          extra_args: --exclude-paths=.github/trufflehog-exclude-paths.txt
