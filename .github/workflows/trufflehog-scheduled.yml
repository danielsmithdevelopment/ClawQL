# Historical secret scan — weekly + manual; complements mandatory Gitleaks in CI (#283).
# Excludes bundled upstream specs under providers/ (vendor examples / placeholders).
# TruffleHog --exclude-paths expects a file of newline-separated regexes, not an inline pattern.
name: TruffleHog

on:
  schedule:
    - cron: "15 8 * * 3"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trufflehog:
    name: TruffleHog (git history)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # actions/checkout@v7.0.0
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0

      # trufflesecurity/trufflehog@v3.95.9 (tag → commit pin for supply chain)
      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@6f3c981e7b77f235fd2702dd74af25fc4b72bf11
        with:
          path: ./
          extra_args: --exclude-paths=.github/trufflehog-exclude-paths.txt --only-verified
