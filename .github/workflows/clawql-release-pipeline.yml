# Layer 0 immutable release pipeline — parallel workspaces + dry-run permanence.
# No wallets / spendable keys. IPFS + Lit + Arweave run in local dry-run mode.

name: clawql-release pipeline

on:
  pull_request:
    branches: [main]
    paths:
      - "packages/clawql-release/**"
      - "scripts/release/**"
      - ".github/workflows/clawql-release-pipeline.yml"
      - "docs/getting-started/clawql-release-mvp.md"
  push:
    branches: [main]
    paths:
      - "packages/clawql-release/**"
      - "scripts/release/**"
      - ".github/workflows/clawql-release-pipeline.yml"
  workflow_dispatch:

concurrency:
  group: clawql-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    name: Parallel workspaces + dry-run permanence
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLAWQL_RELEASE_DRY_RUN: "1"
      CLAWQL_RELEASE_MODE: local
      # Explicitly unset wallet-related vars so CI never accidentally spends
      CLAWQL_ARWEAVE_WALLET_JWK: ""
      CLAWQL_ARIO_TURBO_URL: ""
      CLAWQL_X402_ENFORCE: "0"
      CLAWQL_LIT_NETWORK: ""
    steps:
      # actions/checkout@v7.0.0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1

      # actions/setup-node@v6.3.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "25"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build clawql-core + clawql-release
        run: |
          npm run build -w clawql-merkle -w clawql-core
          npm run build -w clawql-release

      - name: Unit tests (clawql-release)
        run: npx vitest run packages/clawql-release/src

      - name: Configure git identity (worktrees + signed-commit setup)
        run: |
          git config user.email "clawql-release-ci@users.noreply.github.com"
          git config user.name "clawql-release-ci"

      - name: E2E pipeline (parallel workspaces + dry-run IPFS/Lit/Arweave)
        run: node scripts/release/ci-pipeline-e2e.mjs

      - name: Upload e2e report
        if: always()
        # actions/upload-artifact@v6.0.0 — pin by digest when upgrading
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: clawql-release-e2e-report
          path: |
            .clawql/e2e-report.json
            .clawql/github-mirror/BANNER.md
            releases/v0.0.0-e2e/manifest.json
          if-no-files-found: warn
