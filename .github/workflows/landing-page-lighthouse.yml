# Lab Lighthouse against landing-page production build served statically.
name: Landing page Lighthouse

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/www/**"
      - ".github/workflows/landing-page-lighthouse.yml"
      - "scripts/dev/assert-lighthouse-scores.mjs"
  push:
    branches: [main]
    paths:
      - "apps/www/**"
      - ".github/workflows/landing-page-lighthouse.yml"
      - "scripts/dev/assert-lighthouse-scores.mjs"
  workflow_dispatch:

concurrency:
  group: landing-page-lighthouse-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lighthouse:
    name: Lighthouse (landing page static)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "25"
          cache: npm
          cache-dependency-path: apps/www/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: apps/www

      - name: Build landing page
        env:
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:4321
        run: npm run build
        working-directory: apps/www

      - name: Serve out/, run Lighthouse, assert scores
        env:
          LH_MIN_A11Y: "1"
          LH_MIN_SEO: "1"
          LH_MIN_BP: "1"
          LH_MIN_PERF: "0.70"
        run: |
          set -euo pipefail
          cd apps/www
          test -d out
          test -f out/index.html
          # Prefetch so the background start is not racing a cold npm registry
          # download (30s wait previously timed out under slow npx).
          npm install --no-save --no-package-lock --prefix /tmp/lh-serve serve@14
          SERVE_BIN=/tmp/lh-serve/node_modules/.bin/serve
          test -x "$SERVE_BIN"
          # Bind loopback explicitly; -n skips clipboard (can hang in headless CI).
          "$SERVE_BIN" out -l tcp://127.0.0.1:4321 -n >serve.log 2>&1 &
          PID=$!
          cleanup() { kill "$PID" 2>/dev/null || true; }
          trap cleanup EXIT

          for i in $(seq 1 60); do
            if curl -sf "http://127.0.0.1:4321/" >/dev/null; then
              echo "Server ready."
              break
            fi
            if ! kill -0 "$PID" 2>/dev/null; then
              echo "serve exited early. Log:"
              cat serve.log || true
              exit 1
            fi
            sleep 1
            if [ "$i" -eq 60 ]; then
              echo "Timeout waiting for static server. Log:"
              cat serve.log || true
              exit 1
            fi
          done

          run_lh() {
            local path="$1"
            local report="$2"
            npx --yes lighthouse@13.1.0 "http://127.0.0.1:4321${path}" \
              --preset=desktop \
              --only-categories=performance,accessibility,best-practices,seo \
              --chrome-flags="--headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage" \
              --output=json \
              --output-path="$report" \
              --quiet
          }

          for path in "/" "/streams/"; do
            safe_name="$(echo "$path" | tr '/' '_' | sed 's/^_//;s/_$//;s/^$/home/')"
            report="lighthouse-ci-${safe_name}.json"
            echo "Lighthouse: ${path}"
            # One retry — desktop Lighthouse perf occasionally flakes under CI load.
            if ! run_lh "$path" "$report" || ! node ../../scripts/dev/assert-lighthouse-scores.mjs "$report"; then
              echo "Retrying Lighthouse for ${path}..."
              run_lh "$path" "$report"
              node ../../scripts/dev/assert-lighthouse-scores.mjs "$report"
            fi
          done
