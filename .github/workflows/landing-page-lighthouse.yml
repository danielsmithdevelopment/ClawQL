# Lab Lighthouse against landing-page production build served statically.
name: Landing page Lighthouse

on:
  pull_request:
    branches: [main]
    paths:
      - "landing-page/**"
      - ".github/workflows/landing-page-lighthouse.yml"
      - "scripts/dev/assert-lighthouse-scores.mjs"
  push:
    branches: [main]
    paths:
      - "landing-page/**"
      - ".github/workflows/landing-page-lighthouse.yml"
      - "scripts/dev/assert-lighthouse-scores.mjs"
  workflow_dispatch:

concurrency:
  group: landing-page-lighthouse-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lighthouse:
    name: Lighthouse (landing page static)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "25"
          cache: npm
          cache-dependency-path: landing-page/demo/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: landing-page/demo

      - name: Build landing page
        env:
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:4321
        run: npm run build
        working-directory: landing-page/demo

      - name: Serve out/, run Lighthouse, assert scores
        env:
          LH_MIN_A11Y: "1"
          LH_MIN_SEO: "1"
          LH_MIN_BP: "1"
          LH_MIN_PERF: "0.70"
        run: |
          set -euo pipefail
          cd landing-page/demo
          npx --yes serve@14 out -l 4321 &
          PID=$!
          cleanup() { kill "$PID" 2>/dev/null || true; }
          trap cleanup EXIT

          for i in $(seq 1 30); do
            if curl -sf "http://127.0.0.1:4321/" >/dev/null; then
              echo "Server ready."
              break
            fi
            sleep 1
            if [ "$i" -eq 30 ]; then
              echo "Timeout waiting for static server"
              exit 1
            fi
          done

          for path in "/" "/streams/"; do
            safe_name="$(echo "$path" | tr '/' '_' | sed 's/^_//;s/_$//;s/^$/home/')"
            report="lighthouse-ci-${safe_name}.json"
            echo "Lighthouse: ${path}"
            npx --yes lighthouse@13.1.0 "http://127.0.0.1:4321${path}" \
              --preset=desktop \
              --only-categories=performance,accessibility,best-practices,seo \
              --chrome-flags="--headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage" \
              --output=json \
              --output-path="$report" \
              --quiet

            node ../../scripts/dev/assert-lighthouse-scores.mjs "$report"
          done
