# Mirror selected third-party container images into this org's GHCR.
#
# Gate policy (vendor-only — differs from first-party docker-publish):
#   - Trivy on the exact OCI bytes pulled, then skopeo copy, then Cosign keyless
#     (v2, --recursive for multi-arch indexes). If Trivy fails, nothing is pushed.
#   - Severity: **CRITICAL only** (+ `.trivyignore` / `.trivyignore-openclaw-vendor`).
#     WHY: we copy upstream OpenClaw `:slim` bytes verbatim and cannot rebuild or
#     patch Debian/npm trees inside the vendor image. Checked `:slim` and newer
#     dated/beta slim tags (e.g. `2026.10.1-beta.1-slim`) — none scan clean for
#     HIGH; staying on HIGH would keep nightly permanently red on third-party CVEs.
#     First-party images (docker-publish) still fail closed on HIGH + CRITICAL.
#   - Documented CRITICAL vendor ignores remain for Debian perl packages that
#     upstream has not refreshed yet (see `.trivyignore-openclaw-vendor`).
#
# Pair with Helm `openclaw.image.repository: ghcr.io/danielsmithdevelopment/openclaw-vendor`
# and Kyverno `imageReferences` including `ghcr.io/danielsmithdevelopment/openclaw-vendor*`.
name: Container mirror (vendor images)

on:
  schedule:
    # Daily, after docker-publish (06:00 UTC) — adjust if both compete for quota.
    - cron: "45 7 * * *"
  workflow_dispatch:

concurrency:
  group: container-mirror-${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  id-token: write

env:
  TRIVY_SCAN_IMAGE: ghcr.io/aquasecurity/trivy:0.59.1
  # Destination registry/package for OpenClaw mirror (must match Kyverno imageReferences glob).
  OPENCLAW_MIRROR_IMAGE: ghcr.io/danielsmithdevelopment/openclaw-vendor

jobs:
  mirror-openclaw-slim:
    name: Mirror OpenClaw slim
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install skopeo
        run: sudo apt-get update && sudo apt-get install -y skopeo

      - name: Copy upstream image to local OCI layout (no GHCR write yet)
        run: |
          set -euo pipefail
          SRC_UPSTREAM="docker://ghcr.io/openclaw/openclaw:slim"
          DEST_LOCAL="oci:${RUNNER_TEMP}/openclaw-mirror-oci"
          rm -rf "${RUNNER_TEMP}/openclaw-mirror-oci"
          skopeo copy --all "${SRC_UPSTREAM}" "${DEST_LOCAL}"

      - name: Trivy scan OCI layout (CRITICAL — vendor gate before registry push)
        run: |
          set -euo pipefail
          ignorefile="${RUNNER_TEMP}/trivyignore-openclaw-vendor"
          cat "${GITHUB_WORKSPACE}/.trivyignore" "${GITHUB_WORKSPACE}/.trivyignore-openclaw-vendor" > "${ignorefile}"
          # CRITICAL-only for third-party mirrors (see workflow header). First-party
          # docker-publish jobs keep HIGH,CRITICAL.
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/repo:ro" \
            -v "${RUNNER_TEMP}/openclaw-mirror-oci:/work/oci:ro" \
            -v "${ignorefile}:/work/trivyignore:ro" \
            "${{ env.TRIVY_SCAN_IMAGE }}" \
            image \
            --scanners vuln \
            --severity CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            --ignorefile /work/trivyignore \
            --input /work/oci

      - name: Push scanned bytes to GHCR (skopeo — same layout Trivy scanned)
        id: push
        run: |
          set -euo pipefail
          AUTH=(--authfile "${DOCKER_CONFIG:-$HOME/.docker}/config.json")
          SRC="oci:${RUNNER_TEMP}/openclaw-mirror-oci"
          DEST_BASE="${{ env.OPENCLAW_MIRROR_IMAGE }}"
          DATE_TAG="$(date -u +%Y%m%d)"
          # Rolling tag that tracks upstream :slim; digest is the verification unit for Cosign/Kyverno.
          skopeo copy "${AUTH[@]}" --all "${SRC}" "docker://${DEST_BASE}:slim"
          DIGEST="$(skopeo inspect "${AUTH[@]}" "docker://${DEST_BASE}:slim" --format '{{.Digest}}')"
          # Additional labels on the same digest (no second upload of layer bytes).
          skopeo copy "${AUTH[@]}" "docker://${DEST_BASE}@${DIGEST}" "docker://${DEST_BASE}:mirror-${DATE_TAG}"
          skopeo copy "${AUTH[@]}" "docker://${DEST_BASE}@${DIGEST}" "docker://${DEST_BASE}:run-${{ github.run_id }}"
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Install Cosign
        uses: sigstore/cosign-installer@b5e753ae2d39589c7b38850b463739151fc67f07
        with:
          cosign-release: v2.4.3

      - name: Cosign sign (keyless, recursive — same identity as docker-publish / Kyverno policy)
        if: ${{ steps.push.outputs.digest != '' }}
        run: cosign sign --yes --recursive "${{ env.OPENCLAW_MIRROR_IMAGE }}@${{ steps.push.outputs.digest }}"
