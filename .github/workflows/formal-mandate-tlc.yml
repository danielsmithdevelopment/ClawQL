# Model-check mandate lifecycle: atomic must pass; weak must counterexample.
name: Formal mandate TLC

on:
  push:
    paths:
      - "formal/tla/mandate/**"
      - "scripts/formal/run-mandate-tlc.sh"
      - ".github/workflows/formal-mandate-tlc.yml"
  pull_request:
    branches: [main]
    paths:
      - "formal/tla/mandate/**"
      - "scripts/formal/run-mandate-tlc.sh"
      - ".github/workflows/formal-mandate-tlc.yml"
      - "packages/clawql-api/src/pending/**"
  workflow_dispatch:

concurrency:
  group: formal-mandate-tlc-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tlc:
    name: Mandate TLC (atomic pass + weak counterexample)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install Temurin JRE 21
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-21-jre-headless
          java -version

      - name: Run mandate TLC dual configs
        run: bash scripts/formal/run-mandate-tlc.sh
