# Model-check mandate (+ event) TLC dual configs; Lean no-sorry gate.
name: Formal mandate TLC

on:
  push:
    paths:
      - "formal/**"
      - "scripts/formal/**"
      - ".github/workflows/formal-mandate-tlc.yml"
  pull_request:
    branches: [main]
    paths:
      - "formal/**"
      - "scripts/formal/**"
      - ".github/workflows/formal-mandate-tlc.yml"
      - "packages/clawql-api/src/pending/**"
      - "packages/clawql-api/src/policy/**"
      - "packages/clawql-api/src/ifc/**"
      - "packages/clawql-payments/src/credits/**"
      - "packages/clawql-payments/src/compensation/**"
      - "packages/clawql-payments/src/acp/**"
      - "packages/clawql-payments/src/stripe/**"
  workflow_dispatch:

concurrency:
  group: formal-mandate-tlc-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tlc:
    name: Mandate TLC (atomic pass + weak counterexample)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install Temurin JRE 21
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-21-jre-headless
          java -version

      - name: Lean no-sorry / no-admit
        run: bash scripts/formal/check-lean-no-sorry.sh

      - name: Run mandate TLC dual configs
        run: bash scripts/formal/run-mandate-tlc.sh

      - name: Run batch Merkle mandate TLC (ADR 0015)
        run: bash scripts/formal/run-batch-mandate-tlc.sh

      - name: Run event-delivery TLC dual configs
        run: |
          set -euo pipefail
          JAR=/tmp/tla2tools.jar
          curl -fsSL -o "$JAR" \
            "https://github.com/tlaplus/tlaplus/releases/download/v1.8.0/tla2tools.jar"
          WORK=$(mktemp -d)
          cp formal/tla/events/* "$WORK/"
          cd "$WORK"
          java -XX:+UseParallelGC -cp "$JAR" tlc2.TLC -config EventDelivery.cfg EventDelivery
          set +e
          java -XX:+UseParallelGC -cp "$JAR" tlc2.TLC -config EventDeliveryWeak.cfg EventDelivery
          WEAK=$?
          set -e
          if [[ "$WEAK" -eq 0 ]]; then
            echo "FAIL: weak event config (WeakNoDedup) must counterexample" >&2
            exit 1
          fi
          echo "OK: event at-least-once+dedup green; weak counterexample (exit=$WEAK)"

      - name: Run program-resume TLC dual configs
        run: bash scripts/formal/run-program-resume-tlc.sh

      - name: Run payments hold+compensation TLC dual configs
        run: bash scripts/formal/run-payments-hold-tlc.sh

      - name: Run payments Stripe write-ahead TLC dual configs
        run: bash scripts/formal/run-payments-stripe-tlc.sh

      - name: Run lease-sweep expiry≠dead TLC (target + weak counterexample)
        run: bash scripts/formal/run-lease-sweep-expiry-tlc.sh

      - name: Run OAuth PKCE auth-code TLC dual configs
        run: bash scripts/formal/run-oauth-pkce-tlc.sh

      - name: Run OAuth device authorization TLC dual configs
        run: bash scripts/formal/run-oauth-device-tlc.sh

      - name: Run pending-source status TLC dual configs
        run: bash scripts/formal/run-pending-source-tlc.sh

      - name: Run WebMCP draft candidate TLC dual configs
        run: bash scripts/formal/run-webmcp-draft-tlc.sh

      - name: Run Agent Substrate session TLC dual configs
        run: bash scripts/formal/run-agent-substrate-session-tlc.sh

      - name: Run HITL resume idempotency TLC dual configs
        run: bash scripts/formal/run-hitl-resume-idempotency-tlc.sh

      - name: Run account-deletion vs WORM TLC dual configs
        run: bash scripts/formal/run-account-deletion-worm-tlc.sh

      - name: Run program-proposal graph TLC dual configs
        run: bash scripts/formal/run-program-proposal-tlc.sh

      - name: Run money-request status TLC dual configs
        run: bash scripts/formal/run-money-request-tlc.sh

      - name: Run ACP checkout status TLC dual configs
        run: bash scripts/formal/run-acp-checkout-tlc.sh

      - name: Run payments ledger lock TLC dual configs
        run: bash scripts/formal/run-payments-ledger-lock-tlc.sh
