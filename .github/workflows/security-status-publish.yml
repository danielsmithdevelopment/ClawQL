# Append CI security-scan-run-record artifacts into website/public/security-scan-history.json.
# Scheduled separately from the scan job so a compromised scan step cannot suppress its own record.
# See docs/design/security-status-page-spec.md
name: Security status publish

on:
  schedule:
    - cron: "15 */6 * * *"
  workflow_dispatch:

concurrency:
  group: security-status-publish
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  publish:
    name: Publish scan history to docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "25"

      - name: Merge CI scan records into published history
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/ci/publish-security-scan-history.mjs

      - name: Commit and push if history changed
        run: |
          if git diff --quiet website/public/security-scan-history.json; then
            echo "No scan history changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add website/public/security-scan-history.json
          git commit -m "chore(security): update published scan history"
          git push
