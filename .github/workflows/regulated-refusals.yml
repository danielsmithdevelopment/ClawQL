# Audit synthesis dynamic pass — regulated-profile refusals
# (process-level + wire-level with Object Lock S3).
# Path-filtered. See scripts/security/README.md.

name: Regulated refusals

on:
  pull_request:
    paths:
      - "scripts/security/**"
      - "src/composition/process-worm-host.ts"
      - "src/composition/regulated-profile.ts"
      - "src/http/mcp-http-auth-bind.ts"
      - "src/http/mcp-http-graphql-gate.ts"
      - "src/http/mcp-http-server.ts"
      - "src/http/webhooks/webhook-token-auth.ts"
      - "packages/clawql-api/src/execute/resume-core.ts"
      - "packages/clawql-api/src/pending/**"
      - "packages/clawql-inference/src/policy/local-only.ts"
      - "packages/clawql-audit/src/**"
      - "packages/clawql-payments/src/x402/**"
      - "vitest.e2e.config.ts"
      - "docs/security/secure-defaults.md"
      - ".github/workflows/regulated-refusals.yml"
      - "package.json"
      - "src/server-http.ts"
  push:
    branches: [main]
    paths:
      - "scripts/security/**"
      - "src/composition/process-worm-host.ts"
      - "src/composition/regulated-profile.ts"
      - "src/http/mcp-http-auth-bind.ts"
      - "src/http/mcp-http-graphql-gate.ts"
      - "src/http/mcp-http-server.ts"
      - "src/http/webhooks/webhook-token-auth.ts"
      - "packages/clawql-api/src/execute/resume-core.ts"
      - "packages/clawql-api/src/pending/**"
      - "packages/clawql-inference/src/policy/local-only.ts"
      - "packages/clawql-audit/src/**"
      - "packages/clawql-payments/src/x402/**"
      - "vitest.e2e.config.ts"
      - "docs/security/secure-defaults.md"
      - ".github/workflows/regulated-refusals.yml"
      - "package.json"
      - "src/server-http.ts"
  workflow_dispatch:

concurrency:
  group: regulated-refusals-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  process-level:
    name: Process-level regulated refusals
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "25"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build workspace deps
        # Match ci.yml / program-durability workspace build order for clawql-api imports.
        run: npm run build -w clawql-merkle -w clawql-gdp -w clawql-core -w clawql-audit -w clawql-auth -w clawql-api

      - name: Regulated refusals e2e (process-level)
        run: npm run test:regulated-refusals

  wire-level:
    name: Wire-level regulated refusals (HTTP + Object Lock)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "25"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build root + workspace (dist/server-http.js)
        # Full monorepo build order (payments needs clawql-supabase, etc.).
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: npm run build

      - name: Start LocalStack S3 (Object Lock stand-in)
        run: |
          # Prefer MinIO with Object Lock when pullable. Anonymous pulls of
          # minio/minio (Docker Hub) and quay.io/minio/minio fail on GHA runners
          # (see ci.yml / a2b1ce8f1). LocalStack is the digest-pinned stand-in.
          docker run -d --name clawql-wire-localstack \
            -p 4566:4566 \
            -e SERVICES=s3 \
            -e DEBUG=0 \
            localstack/localstack:4.3.0@sha256:f3cb1a79f3add997575e859c3a2808e6dae4b0de836661de255baa2b576868f8
          for _ in $(seq 1 90); do
            if curl -sf http://127.0.0.1:4566/_localstack/health | grep -E '"s3": "(available|running)"' >/dev/null; then
              echo "LocalStack S3 ready"
              exit 0
            fi
            sleep 1
          done
          echo "LocalStack failed to become ready" >&2
          docker logs clawql-wire-localstack >&2 || true
          exit 1

      - name: Regulated wire e2e (spawn dist/server-http.js)
        env:
          CLAWQL_WIRE_REQUIRED: "1"
          CLAWQL_WORM_S3_ENDPOINT: http://127.0.0.1:4566
          CLAWQL_WORM_S3_ACCESS_KEY_ID: test
          CLAWQL_WORM_S3_SECRET_ACCESS_KEY: test
          CLAWQL_WORM_S3_IT_ENDPOINT: http://127.0.0.1:4566
          CLAWQL_WORM_S3_IT_ACCESS_KEY: test
          CLAWQL_WORM_S3_IT_SECRET_KEY: test
        run: npm run test:regulated-wire
