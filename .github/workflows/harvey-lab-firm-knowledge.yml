# Harvey LAB × ClawQL — firm-knowledge matrix (GHA).
#
# OpenBench-style:
#   - pull_request / push (path-filtered): default Nemotron ± ClawQL (OpenRouter)
#   - Marker file integrations/harvey-labs/.run-opus-ledger on the PR branch:
#       Opus 4.8 baseline vs Opus 4.8 + ClawQL via OpenRouter, Sonnet 4.6 judge
#       (small validation; larger Nemotron sweeps also stay on OpenRouter)
#   - workflow_dispatch: pick task / arms / models; use_openrouter=0 for direct Anthropic
#
# Secrets:
#   OPENROUTER_API_KEY — Nemotron + OpenRouter Claude validation (default)
#   ANTHROPIC_API_KEY  — optional; required only when use_openrouter=0

name: Harvey LAB firm-knowledge (ClawQL vs baseline)

on:
  workflow_dispatch:
    inputs:
      task:
        description: "Harvey LAB task id under tasks/"
        required: true
        type: string
        default: firm-knowledge/tasks/001
      model:
        description: "Claude short id for baseline/clawql arms only"
        required: true
        type: string
        default: claude-opus-4-8
      nemotron_model:
        description: "OpenRouter model id for Nemotron arms"
        required: true
        type: string
        default: nvidia/nemotron-3.5-lightning
      max_turns:
        description: "Agent max turns (15 debug / 40 fuller)"
        required: true
        type: string
        default: "40"
      arms:
        description: "Comma-separated arms (default = Nemotron ± ClawQL)"
        required: true
        type: choice
        options:
          - nemotron,nemotron-clawql
          - nemotron-clawql
          - nemotron
          - baseline,clawql
          - baseline,clawql,nemotron-clawql
          - baseline
          - clawql
        default: baseline,clawql
      judge_model:
        description: "Judge — claude-sonnet-4-6 (Anthropic ledger); openai/gpt-5.4-mini (OpenRouter)"
        required: true
        type: string
        default: claude-sonnet-4-6
      max_matters:
        description: "Optional DMS ingest cap (0 = all). PR smoke uses 0 for ontology."
        required: true
        type: string
        default: "0"
      use_openrouter:
        description: "1 = OpenRouter (validation default); 0 = direct Anthropic"
        required: true
        type: string
        default: "1"
  pull_request:
    paths:
      - "integrations/harvey-labs/**"
      - "scripts/start-clawql-for-lab.sh"
      - ".github/workflows/harvey-lab-firm-knowledge.yml"
  push:
    branches: [main]
    paths:
      - "integrations/harvey-labs/**"
      - "scripts/start-clawql-for-lab.sh"
      - ".github/workflows/harvey-lab-firm-knowledge.yml"

concurrency:
  group: harvey-lab-fk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  resolve-matrix:
    name: Resolve arm matrix
    runs-on: ubuntu-latest
    outputs:
      arms: ${{ steps.set.outputs.arms }}
      has_arms: ${{ steps.set.outputs.has_arms }}
      task: ${{ steps.set.outputs.task }}
      model: ${{ steps.set.outputs.model }}
      nemotron_model: ${{ steps.set.outputs.nemotron_model }}
      max_turns: ${{ steps.set.outputs.max_turns }}
      judge_model: ${{ steps.set.outputs.judge_model }}
      max_matters: ${{ steps.set.outputs.max_matters }}
      use_openrouter: ${{ steps.set.outputs.use_openrouter }}
      needs_anthropic: ${{ steps.set.outputs.needs_anthropic }}
      needs_openrouter: ${{ steps.set.outputs.needs_openrouter }}
      has_openrouter: ${{ steps.secret.outputs.has_openrouter }}
      has_anthropic: ${{ steps.secret.outputs.has_anthropic }}
      can_run: ${{ steps.gate.outputs.can_run }}
      skip_reason: ${{ steps.gate.outputs.skip_reason }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - id: secret
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "${OPENROUTER_API_KEY:-}" ]; then
            echo "has_openrouter=true" >>"$GITHUB_OUTPUT"
          else
            echo "has_openrouter=false" >>"$GITHUB_OUTPUT"
          fi
          if [ -n "${ANTHROPIC_API_KEY:-}" ]; then
            echo "has_anthropic=true" >>"$GITHUB_OUTPUT"
          else
            echo "has_anthropic=false" >>"$GITHUB_OUTPUT"
          fi

      - id: set
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ARMS_CSV="${{ inputs.arms }}"
            TASK="${{ inputs.task }}"
            MODEL="${{ inputs.model }}"
            NEMO="${{ inputs.nemotron_model }}"
            TURNS="${{ inputs.max_turns }}"
            JUDGE="${{ inputs.judge_model }}"
            MATTERS="${{ inputs.max_matters }}"
            USE_OR="${{ inputs.use_openrouter }}"
          elif [ -f integrations/harvey-labs/.run-opus-ledger ]; then
            # PR / push Opus validation — OpenRouter Opus ± ClawQL, Sonnet 4.6 judge
            ARMS_CSV="baseline,clawql"
            TASK="firm-knowledge/tasks/001"
            MODEL="claude-opus-4-8"
            NEMO="nvidia/nemotron-3.5-lightning"
            TURNS="40"
            JUDGE="claude-sonnet-4-6"
            MATTERS="0"
            USE_OR="1"
            echo "::notice::Detected integrations/harvey-labs/.run-opus-ledger → Opus A/B via OpenRouter"
          else
            # PR / push smoke — Nemotron ± ClawQL only (OpenRouter-only)
            ARMS_CSV="nemotron,nemotron-clawql"
            TASK="firm-knowledge/tasks/001"
            MODEL="claude-sonnet-4-6"
            NEMO="nvidia/nemotron-3.5-lightning"
            TURNS="40"
            JUDGE="openai/gpt-5.4-mini"
            MATTERS="0"
            USE_OR="1"
          fi
          ARMS_JSON="$(
            ARMS_CSV="${ARMS_CSV}" python3 -c \
              'import json,os; print(json.dumps([a.strip() for a in os.environ["ARMS_CSV"].split(",") if a.strip()]))'
          )"
          NEEDS_ANTHROPIC=false
          NEEDS_OPENROUTER=false
          case ",${ARMS_CSV}," in
            *,baseline,*|*,clawql,*)
              if [[ "${USE_OR}" == "1" ]]; then
                NEEDS_OPENROUTER=true
              else
                NEEDS_ANTHROPIC=true
              fi
              ;;
          esac
          case ",${ARMS_CSV}," in
            *,nemotron,*|*,nemotron-clawql,*|*,nemotron-baseline,*|*,clawql-nemotron,*)
              NEEDS_OPENROUTER=true
              ;;
          esac
          # Claude judge: OpenRouter path needs OR key; direct needs Anthropic.
          if [[ "${JUDGE}" == claude* ]]; then
            if [[ "${USE_OR}" == "1" ]]; then
              NEEDS_OPENROUTER=true
            else
              NEEDS_ANTHROPIC=true
            fi
          fi
          if [[ "${JUDGE}" == openai/* ]] || [[ "${JUDGE}" == openrouter/* ]]; then
            NEEDS_OPENROUTER=true
          fi
          {
            echo "arms=${ARMS_JSON}"
            echo "has_arms=true"
            echo "task=${TASK}"
            echo "model=${MODEL}"
            echo "nemotron_model=${NEMO}"
            echo "max_turns=${TURNS}"
            echo "judge_model=${JUDGE}"
            echo "max_matters=${MATTERS}"
            echo "use_openrouter=${USE_OR}"
            echo "needs_anthropic=${NEEDS_ANTHROPIC}"
            echo "needs_openrouter=${NEEDS_OPENROUTER}"
          } >>"$GITHUB_OUTPUT"
          echo "::notice::Harvey LAB matrix arms=${ARMS_JSON} model=${MODEL} judge=${JUDGE} use_openrouter=${USE_OR}"

      - id: gate
        env:
          HAS_OR: ${{ steps.secret.outputs.has_openrouter }}
          HAS_AN: ${{ steps.secret.outputs.has_anthropic }}
          NEED_OR: ${{ steps.set.outputs.needs_openrouter }}
          NEED_AN: ${{ steps.set.outputs.needs_anthropic }}
        run: |
          set -euo pipefail
          CAN=true
          REASON=""
          if [ "${NEED_AN}" = "true" ] && [ "${HAS_AN}" != "true" ]; then
            CAN=false
            REASON="ANTHROPIC_API_KEY missing (required for Opus/Sonnet arms or Sonnet judge)"
          fi
          if [ "${NEED_OR}" = "true" ] && [ "${HAS_OR}" != "true" ]; then
            CAN=false
            if [ -n "${REASON}" ]; then
              REASON="${REASON}; OPENROUTER_API_KEY missing"
            else
              REASON="OPENROUTER_API_KEY missing (required for Nemotron / OpenRouter judge)"
            fi
          fi
          echo "can_run=${CAN}" >>"$GITHUB_OUTPUT"
          echo "skip_reason=${REASON}" >>"$GITHUB_OUTPUT"
          if [ "${CAN}" = "true" ]; then
            echo "::notice::Credential gate passed"
          else
            echo "::warning::Credential gate blocked live LAB: ${REASON}"
          fi

  lab-arm:
    name: LAB ${{ matrix.arm }}
    needs: resolve-matrix
    if: needs.resolve-matrix.outputs.can_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        arm: ${{ fromJson(needs.resolve-matrix.outputs.arms) }}
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAWQL_LAB_USE_OPENROUTER: ${{ needs.resolve-matrix.outputs.use_openrouter }}
      CLAWQL_LAB_ALLOW_CLAUDE_JUDGE_VIA_OPENROUTER: "1"
      CLAWQL_OPENROUTER_HTTP_REFERER: https://clawql.com
      CLAWQL_OPENROUTER_APP_TITLE: ClawQL Harvey LAB
      LAB_TASK: ${{ needs.resolve-matrix.outputs.task }}
      LAB_MODEL: ${{ needs.resolve-matrix.outputs.model }}
      LAB_NEMOTRON_MODEL: ${{ needs.resolve-matrix.outputs.nemotron_model }}
      LAB_MAX_TURNS: ${{ needs.resolve-matrix.outputs.max_turns }}
      LAB_ARMS: ${{ matrix.arm }}
      LAB_JUDGE_MODEL: ${{ needs.resolve-matrix.outputs.judge_model }}
      CLAWQL_LAB_MAX_MATTERS: ${{ needs.resolve-matrix.outputs.max_matters }}
      CLAWQL_ENABLE_MEMORY: "1"
      CLAWQL_ONTOLOGY_DB: "1"
      CLAWQL_ONTOLOGY_LLM_EXTRACTION: "0"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Guard credentials for this arm
        run: |
          set -euo pipefail
          echo "::notice::Arm=${LAB_ARMS} model=${LAB_MODEL} judge=${LAB_JUDGE_MODEL} use_openrouter=${CLAWQL_LAB_USE_OPENROUTER}"
          if echo "${LAB_ARMS}" | tr ',' '\n' | grep -qxE 'baseline|clawql'; then
            if [ "${CLAWQL_LAB_USE_OPENROUTER}" = "0" ] || [ "${CLAWQL_LAB_USE_OPENROUTER}" = "false" ]; then
              if [ -z "${ANTHROPIC_API_KEY:-}" ]; then
                echo "::error::Claude ledger arms require ANTHROPIC_API_KEY (direct Anthropic)."
                exit 1
              fi
            elif [ -z "${ANTHROPIC_API_KEY:-}" ] && [ -z "${OPENROUTER_API_KEY:-}" ]; then
              echo "::error::Claude arms require ANTHROPIC_API_KEY or OPENROUTER_API_KEY."
              exit 1
            fi
          fi
          if echo "${LAB_ARMS}" | tr ',' '\n' | grep -qE '^nemotron'; then
            if [ -z "${OPENROUTER_API_KEY:-}" ]; then
              echo "::error::Nemotron arms require OPENROUTER_API_KEY."
              exit 1
            fi
          fi
          if [[ "${LAB_JUDGE_MODEL}" == claude* ]]; then
            if [ "${CLAWQL_LAB_USE_OPENROUTER}" = "0" ] || [ "${CLAWQL_LAB_USE_OPENROUTER}" = "false" ]; then
              if [ -z "${ANTHROPIC_API_KEY:-}" ]; then
                echo "::error::Sonnet/Claude judge with direct Anthropic requires ANTHROPIC_API_KEY."
                exit 1
              fi
            elif [ -z "${OPENROUTER_API_KEY:-}" ]; then
              echo "::error::Sonnet/Claude judge via OpenRouter requires OPENROUTER_API_KEY."
              exit 1
            fi
          fi

      - name: Setup Node (ClawQL MCP)
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: npm ci (for local clawql-mcp-http)
        run: npm ci --ignore-scripts

      - name: Build ClawQL (MCP HTTP needs dist/server-http.js)
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=8192

      - name: Run Harvey LAB arm
        run: bash integrations/harvey-labs/scripts/run-lab-gha.sh

      - name: Upload scorecard + arm artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harvey-lab-${{ matrix.arm }}-${{ github.run_id }}
          path: integrations/harvey-labs/results/
          if-no-files-found: warn
          retention-days: 30

  lab-skip:
    name: Skip (missing credentials)
    needs: resolve-matrix
    if: needs.resolve-matrix.outputs.can_run != 'true'
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "::warning::Skipped Harvey LAB live matrix — ${{ needs.resolve-matrix.outputs.skip_reason }}"
          echo "::error::Set the missing GitHub Actions secret(s), then re-run. OpenRouter validation needs OPENROUTER_API_KEY; direct Anthropic ledger needs ANTHROPIC_API_KEY with use_openrouter=0."
          exit 1
