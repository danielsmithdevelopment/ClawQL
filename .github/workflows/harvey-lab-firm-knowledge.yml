# Harvey LAB × ClawQL — firm-knowledge runs (GHA / OpenRouter).
#
# Nemotron pair (OpenRouter-only, no Anthropic):
#   nemotron            — Nemotron 3.5 Lightning, no ClawQL
#   nemotron-clawql     — Nemotron 3.5 Lightning + ClawQL
# Judge default: openai/gpt-5.4-mini (OpenRouter)
#
# Claude pair (needs Anthropic or Claude-on-OpenRouter):
#   baseline / clawql
#
# Same secret pattern as OpenBench: OPENROUTER_API_KEY from repo secrets.
# workflow_dispatch only — full firm-knowledge is 250 tasks; keep runs intentional.

name: Harvey LAB firm-knowledge (ClawQL vs baseline)

on:
  workflow_dispatch:
    inputs:
      task:
        description: "Harvey LAB task id under tasks/"
        required: true
        type: string
        default: firm-knowledge/tasks/001
      model:
        description: "Claude short id for baseline/clawql arms only"
        required: true
        type: string
        default: claude-sonnet-4-6
      nemotron_model:
        description: "OpenRouter model id for Nemotron arms"
        required: true
        type: string
        default: nvidia/nemotron-3.5-lightning:free
      max_turns:
        description: "Agent max turns (15 debug / 40 fuller)"
        required: true
        type: string
        default: "15"
      arms:
        description: "Comma-separated arms (default = Nemotron ± ClawQL, OpenRouter-only)"
        required: true
        type: choice
        options:
          - nemotron,nemotron-clawql
          - nemotron-clawql
          - nemotron
          - baseline,clawql
          - baseline,clawql,nemotron-clawql
          - baseline
          - clawql
        default: nemotron,nemotron-clawql
      judge_model:
        description: "Judge — openai/gpt-5.4-mini (OpenRouter, no Anthropic); claude-sonnet-4-6 when Anthropic available"
        required: true
        type: string
        default: openai/gpt-5.4-mini
      max_matters:
        description: "Optional DMS ingest cap (0 = all matters). Use 5–20 for cheap smoke."
        required: true
        type: string
        default: "5"

concurrency:
  group: harvey-lab-fk-${{ github.workflow }}-${{ github.ref }}-${{ inputs.task }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lab-arms:
    name: LAB ${{ inputs.task }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAWQL_LAB_USE_OPENROUTER: "1"
      CLAWQL_OPENROUTER_HTTP_REFERER: https://clawql.com
      CLAWQL_OPENROUTER_APP_TITLE: ClawQL Harvey LAB
      LAB_TASK: ${{ inputs.task }}
      LAB_MODEL: ${{ inputs.model }}
      LAB_NEMOTRON_MODEL: ${{ inputs.nemotron_model }}
      LAB_MAX_TURNS: ${{ inputs.max_turns }}
      LAB_ARMS: ${{ inputs.arms }}
      LAB_JUDGE_MODEL: ${{ inputs.judge_model }}
      CLAWQL_LAB_MAX_MATTERS: ${{ inputs.max_matters }}
      CLAWQL_ENABLE_MEMORY: "1"
      CLAWQL_ONTOLOGY_DB: "1"
      CLAWQL_ONTOLOGY_LLM_EXTRACTION: "0"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Require OpenRouter (or Anthropic) secret
        run: |
          if [ -z "${OPENROUTER_API_KEY:-}" ] && [ -z "${ANTHROPIC_API_KEY:-}" ]; then
            echo "::error::Set repository secret OPENROUTER_API_KEY (preferred, same as OpenBench) or ANTHROPIC_API_KEY."
            exit 1
          fi
          if echo "${LAB_ARMS}" | tr ',' '\n' | grep -qxE 'baseline|clawql'; then
            if [ -z "${ANTHROPIC_API_KEY:-}" ] && [ -z "${OPENROUTER_API_KEY:-}" ]; then
              echo "::error::Claude arms require ANTHROPIC_API_KEY or OPENROUTER_API_KEY."
              exit 1
            fi
            if [ -z "${ANTHROPIC_API_KEY:-}" ]; then
              echo "::notice::Claude arms without ANTHROPIC_API_KEY — will attempt Claude via OpenRouter."
            fi
          fi
          if echo "${LAB_ARMS}" | tr ',' '\n' | grep -qE '^nemotron'; then
            if [ -z "${OPENROUTER_API_KEY:-}" ]; then
              echo "::error::Nemotron arms require OPENROUTER_API_KEY."
              exit 1
            fi
            echo "::notice::Nemotron path: OpenRouter agent + OpenRouter judge (no Anthropic required)."
          fi
          if [ -n "${OPENROUTER_API_KEY:-}" ]; then
            echo "::notice::Using OPENROUTER_API_KEY for Harvey LAB (GHA path)."
          fi

      - name: Setup Node (ClawQL MCP)
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: npm ci (for local clawql-mcp-http)
        run: npm ci --ignore-scripts

      - name: Run Harvey LAB arms
        run: bash integrations/harvey-labs/scripts/run-lab-gha.sh

      - name: Upload scorecard + arm artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harvey-lab-${{ inputs.task }}-${{ github.run_id }}
          path: integrations/harvey-labs/results/
          if-no-files-found: warn
          retention-days: 30
