# Harvey LAB × ClawQL — firm-knowledge three-arm runs (GHA / OpenRouter).
#
# Arms:
#   A baseline          — Claude (no ClawQL)
#   B clawql            — Claude + ClawQL
#   C nemotron-clawql   — Nemotron 3.5 Lightning + ClawQL (OpenRouter chat)
#
# Same secret pattern as OpenBench: OPENROUTER_API_KEY from repo secrets.
# workflow_dispatch only — full firm-knowledge is 250 tasks; keep runs intentional.

name: Harvey LAB firm-knowledge (ClawQL vs baseline)

on:
  workflow_dispatch:
    inputs:
      task:
        description: "Harvey LAB task id under tasks/"
        required: true
        type: string
        default: firm-knowledge/tasks/001
      model:
        description: "Claude short id for Arms A/B (OpenRouter anthropic/*)"
        required: true
        type: string
        default: claude-sonnet-4-6
      nemotron_model:
        description: "OpenRouter model id for Arm C (Nemotron + ClawQL)"
        required: true
        type: string
        default: nvidia/nemotron-3.5-lightning:free
      max_turns:
        description: "Agent max turns (15 debug / 40 fuller)"
        required: true
        type: string
        default: "15"
      arms:
        description: "Comma-separated arms (prefer nemotron-clawql first — OpenRouter-only)"
        required: true
        type: choice
        options:
          - nemotron-clawql
          - baseline,clawql
          - baseline,clawql,nemotron-clawql
          - baseline
          - clawql
        default: nemotron-clawql
      judge_model:
        description: "Judge id — openai/gpt-5.4-mini for Arm C (OpenRouter); claude-sonnet-4-6 when Anthropic available"
        required: true
        type: string
        default: openai/gpt-5.4-mini
      max_matters:
        description: "Optional DMS ingest cap (0 = all matters). Use 5–20 for cheap smoke."
        required: true
        type: string
        default: "5"

concurrency:
  group: harvey-lab-fk-${{ github.workflow }}-${{ github.ref }}-${{ inputs.task }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lab-arms:
    name: LAB ${{ inputs.task }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAWQL_LAB_USE_OPENROUTER: "1"
      CLAWQL_OPENROUTER_HTTP_REFERER: https://clawql.com
      CLAWQL_OPENROUTER_APP_TITLE: ClawQL Harvey LAB
      LAB_TASK: ${{ inputs.task }}
      LAB_MODEL: ${{ inputs.model }}
      LAB_NEMOTRON_MODEL: ${{ inputs.nemotron_model }}
      LAB_MAX_TURNS: ${{ inputs.max_turns }}
      LAB_ARMS: ${{ inputs.arms }}
      LAB_JUDGE_MODEL: ${{ inputs.judge_model }}
      CLAWQL_LAB_MAX_MATTERS: ${{ inputs.max_matters }}
      CLAWQL_ENABLE_MEMORY: "1"
      CLAWQL_ONTOLOGY_DB: "1"
      CLAWQL_ONTOLOGY_LLM_EXTRACTION: "0"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Require OpenRouter (or Anthropic) secret
        run: |
          if [ -z "${OPENROUTER_API_KEY:-}" ] && [ -z "${ANTHROPIC_API_KEY:-}" ]; then
            echo "::error::Set repository secret OPENROUTER_API_KEY (preferred, same as OpenBench) or ANTHROPIC_API_KEY."
            exit 1
          fi
          if echo "${LAB_ARMS}" | grep -qE 'baseline|clawql'; then
            # Arms A/B need Claude — Anthropic direct or Claude-capable OpenRouter.
            if [ -z "${ANTHROPIC_API_KEY:-}" ] && [ -z "${OPENROUTER_API_KEY:-}" ]; then
              echo "::error::Arms A/B require Anthropic (ANTHROPIC_API_KEY or Claude via OPENROUTER_API_KEY)."
              exit 1
            fi
            if echo "${LAB_ARMS}" | grep -qv 'nemotron' && [ -z "${ANTHROPIC_API_KEY:-}" ]; then
              echo "::notice::Arms A/B without ANTHROPIC_API_KEY — will attempt Claude via OpenRouter."
            fi
          fi
          if echo "${LAB_ARMS}" | grep -q 'nemotron'; then
            if [ -z "${OPENROUTER_API_KEY:-}" ]; then
              echo "::error::Arm C (nemotron-clawql) requires OPENROUTER_API_KEY."
              exit 1
            fi
            echo "::notice::Arm C path uses OpenRouter for agent (+ OpenRouter chat judge if judge_model is non-Claude)."
          fi
          if [ -n "${OPENROUTER_API_KEY:-}" ]; then
            echo "::notice::Using OPENROUTER_API_KEY for Harvey LAB (GHA path)."
          fi

      - name: Setup Node (ClawQL MCP)
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: npm ci (for local clawql-mcp-http)
        run: npm ci --ignore-scripts

      - name: Run Harvey LAB arms
        run: bash integrations/harvey-labs/scripts/run-lab-gha.sh

      - name: Upload scorecard + arm artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harvey-lab-${{ inputs.task }}-${{ github.run_id }}
          path: integrations/harvey-labs/results/
          if-no-files-found: warn
          retention-days: 30
