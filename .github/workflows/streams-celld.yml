# Streams / celld lab smokes — path-filtered.
# These are expensive (celld install + full MCP stack) and must not run on every PR.
# Trigger when streams-celld examples, streams-slim core, or related Helm charts change.

name: Streams celld

on:
  pull_request:
    paths:
      - "docs/examples/streams-celld/**"
      - "packages/clawql-core/src/streams-slim*"
      - "packages/clawql-core/src/**/streams*"
      - "manifests/charts/clawql-celld/**"
      - "manifests/charts/**/celld*"
      - "vendor/celld/**"
      - ".github/workflows/streams-celld.yml"
      - ".github/workflows/celld-vendor-release.yml"
  push:
    branches: [main]
    paths:
      - "docs/examples/streams-celld/**"
      - "packages/clawql-core/src/streams-slim*"
      - "packages/clawql-core/src/**/streams*"
      - "manifests/charts/clawql-celld/**"
      - "manifests/charts/**/celld*"
      - "vendor/celld/**"
      - ".github/workflows/streams-celld.yml"
      - ".github/workflows/celld-vendor-release.yml"
  workflow_dispatch:

concurrency:
  group: streams-celld-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  streams-celld-evidence:
    name: Streams celld evidence
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "25"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build clawql-merkle + clawql-core
        run: npm run build -w clawql-merkle -w clawql-core

      - name: streams-slim unit tests
        run: npx vitest run packages/clawql-core/src/streams-slim.test.ts

      - name: MCP + adapter + worm fetch unit tests
        run: |
          node docs/examples/streams-celld/scripts/mcp-fetch.test.mjs
          node docs/examples/streams-celld/scripts/adapter-fetch.test.mjs
          node docs/examples/streams-celld/scripts/worm-fetch.test.mjs
          node docs/examples/streams-celld/scripts/significance-filter.test.mjs
          node docs/examples/streams-celld/scripts/core-catalog.test.mjs
          node docs/examples/streams-celld/scripts/openapi-pack.test.mjs
          node docs/examples/streams-celld/scripts/program-cell-resume.test.mjs

      - name: Intent durable before send (expected fail until celld gate)
        # REQUIRED assertion: intent present after kill-after-fetch + slow storage.
        # Currently expected-fail until vendor/celld fenced-ack + incarnation fencing
        # is the board binary. Then set CLAWQL_REQUIRE_OUTPUT_GATE=1 and remove continue-on-error.
        continue-on-error: true
        run: node docs/examples/streams-celld/scripts/intent-durable-before-send.test.mjs

      - name: Stale incarnation blocked from send (expected fail until celld gate)
        continue-on-error: true
        run: node docs/examples/streams-celld/scripts/stale-incarnation-send.test.mjs

      - name: Bundle size gate (≤64 MiB)
        run: node docs/examples/streams-celld/scripts/bundle-check.mjs

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310
        with:
          version: v3.17.0

      - name: Helm celld template tests
        run: make helm-celld-template-tests

  streams-celld-smoke:
    name: Streams celld smoke (celld)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "25"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build clawql-merkle + clawql-core
        run: npm run build -w clawql-merkle -w clawql-core

      - name: Install esbuild + celld v0.4.0
        run: |
          npm install -g esbuild
          curl -fsSL https://celld.dev/install.sh | CELLD_VERSION=v0.4.0 sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$HOME/bin:$PATH"
          command -v esbuild
          command -v celld
          celld --version | tee /dev/stderr | grep -E '0\.4\.0'

      - name: Fail-closed local E2E smoke
        env:
          STREAMS_CELLD_SMOKE_REQUIRED: "1"
        run: bash docs/examples/streams-celld/scripts/smoke.sh

      - name: Core-in-celld smoke (CoreToolsDO)
        env:
          STREAMS_CELLD_SMOKE_REQUIRED: "1"
        run: bash docs/examples/streams-celld/scripts/smoke-core-in-celld.sh

      - name: ProgramCellDO isolate kill-node (ADR 0015)
        env:
          STREAMS_CELLD_SMOKE_REQUIRED: "1"
        run: bash docs/examples/streams-celld/scripts/smoke-program-cell-kill.sh

      - name: ProgramCellDO fleet peer kill (Tier C soft-skip without bucket)
        # Measures only when CELLD_BUCKET + conforming store; otherwise writes not_measured evidence.
        run: bash docs/examples/streams-celld/scripts/smoke-program-cell-fleet-kill.sh

      - name: Upload ProgramCellDO kill evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: program-cell-isolate-kill-evidence
          path: |
            docs/benchmarks/program-cell-isolate-kill/evidence.json
            docs/benchmarks/program-cell-fleet-kill/evidence.json
          if-no-files-found: warn

  streams-celld-full-stack:
    name: Streams celld full-stack
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "25"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build MCP host + adapter + streams packages
        run: |
          npm run build
          npm run build -w clawql-merkle -w clawql-core -w mcp-api-adapter -w clawql-audit

      - name: Install esbuild + celld v0.4.0
        run: |
          npm install -g esbuild
          curl -fsSL https://celld.dev/install.sh | CELLD_VERSION=v0.4.0 sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$HOME/bin:$PATH"
          command -v esbuild
          command -v celld
          celld --version | tee /dev/stderr | grep -E '0\.4\.0'

      - name: Fail-closed full-stack smoke (real MCP + adapter)
        env:
          STREAMS_CELLD_SMOKE_REQUIRED: "1"
        run: bash docs/examples/streams-celld/scripts/full-stack-smoke.sh
