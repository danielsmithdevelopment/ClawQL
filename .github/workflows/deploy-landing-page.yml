# Deploy landing-page/demo (static export) to Cloudflare Pages → https://clawql.com
# Replaces GitHub Pages so Link headers, Markdown negotiation, and _headers work.
name: Deploy landing page (Cloudflare Pages)

on:
  push:
    branches: [main]
    paths:
      - "landing-page/**"
      - ".github/workflows/deploy-landing-page.yml"
  workflow_dispatch:

concurrency:
  group: deploy-landing-page-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "25"
          cache: npm
          cache-dependency-path: landing-page/demo/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: landing-page/demo

      - name: Build static site
        working-directory: landing-page/demo
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ vars.LANDING_PAGE_BASE_PATH || '' }}
          NEXT_PUBLIC_SITE_URL: https://clawql.com
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@6a6c3a8fbb837218b1a676c348aa5de81a9c3066
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Run from landing-page/demo so sibling functions/ is bundled with out/.
          workingDirectory: landing-page/demo
          command: pages deploy out --project-name=clawql-website --branch=main

      - name: Ensure DNS-AID records (optional)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLAWQL_APEX_DOMAIN: clawql.com
        run: bash scripts/deploy/ensure-dns-aid-records.sh
        continue-on-error: true
