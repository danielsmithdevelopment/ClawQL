# Static export of landing-page/demo → GitHub Pages (https://clawql.com).
# Enable: repo Settings → Pages → Build and deployment → Source: GitHub Actions.
name: Deploy landing page (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - "landing-page/**"
      - ".github/workflows/deploy-landing-page.yml"
  workflow_dispatch:

concurrency:
  group: deploy-landing-page-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build static site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "25"
          cache: npm
          cache-dependency-path: landing-page/demo/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: landing-page/demo

      - name: Build (static export)
        working-directory: landing-page/demo
        env:
          # Custom domain at repo root. For project Pages only, set to /ClawQL in repo vars.
          NEXT_PUBLIC_BASE_PATH: ${{ vars.LANDING_PAGE_BASE_PATH || '' }}
          NEXT_PUBLIC_SITE_URL: https://clawql.com
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e60203658a72b9b32c0479be6a04d492
        with:
          path: landing-page/demo/out

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5e628ed4e8ac69b3d7bf06b669c0e
