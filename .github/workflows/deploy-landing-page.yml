# Static export of landing-page/demo → GitHub Pages (https://clawql.com) by default.
# When CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID are set, also deploy to Cloudflare
# Pages (Link headers + Markdown negotiation via functions/) and configure agent edge.
# Set LANDING_PAGE_CLOUDFLARE_DEPLOY=false to skip Cloudflare Pages even if secrets exist.
name: Deploy landing page

on:
  push:
    branches: [main]
    paths:
      - "landing-page/**"
      - "packages/mcp-api-adapter/src/executor-cmp-trace-demo.ts"
      - "packages/mcp-api-adapter/src/mcp-ui-trace-html.ts"
      - "packages/mcp-api-adapter/scripts/generate-executor-cmp-compare-static.mjs"
      - "scripts/deploy/ensure-dns-aid-records.sh"
      - "scripts/deploy/ensure-clawql-com-agent-edge.sh"
      - ".github/workflows/deploy-landing-page.yml"
  workflow_dispatch:

concurrency:
  group: deploy-landing-page-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build static site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "25"
          cache: npm
          cache-dependency-path: landing-page/demo/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: landing-page/demo

      - name: Build (static export)
        working-directory: landing-page/demo
        env:
          # Custom domain at repo root. For project Pages only, set to /ClawQL in repo vars.
          NEXT_PUBLIC_BASE_PATH: ${{ vars.LANDING_PAGE_BASE_PATH || '' }}
          NEXT_PUBLIC_SITE_URL: https://clawql.com
        run: npm run build

      - name: Verify SEO/agent static assets
        working-directory: landing-page/demo
        run: |
          set -euo pipefail
          test -f out/.well-known/api-catalog
          test -f out/.well-known/agent-card.json
          test -f out/.well-known/mcp/server-card.json
          test -f out/.well-known/oauth-protected-resource
          test -f out/.well-known/oauth-authorization-server
          test -f out/.well-known/openid-configuration
          test -f out/.well-known/agent-skills/index.json
          test -f out/.well-known/payments.json
          test -f out/.well-known/ucp
          test -f out/.well-known/acp.json
          test -f out/.nojekyll
          test -f out/install
          test -f out/og-image.png
          test -f out/favicon.ico
          test -f out/robots.txt
          test -f out/sitemap.xml
          test -f out/auth.md
          test -f out/agent-markdown.json
          test -f out/inference/gtm/index.html
          test -f out/enterprise/gtm/index.html
          test -f out/mcp-ui/trace/compare/executor/index.html
          test -f out/mcp-ui/trace/compare/executor/compare.json
          test -f out/benchmarks/executor-comparison/index.html
          grep -qi 'Agentic Gateway for Auditable Production AI' out/llms.txt
          grep -q 'inference/gtm' out/llms.txt
          grep -q 'inference/gtm' out/sitemap.xml
          grep -q 'enterprise/gtm' out/sitemap.xml
          # Ensure install script is shell, not HTML
          head -1 out/install | grep -q '^#!/usr/bin/env bash'
          # Guard against reintroducing the hidden-file Pages artifact bug
          python3 - <<'PY'
          import tarfile, io, subprocess, os
          # Mimic actions/upload-pages-artifact default exclude of .[^/]*
          proc = subprocess.run(
              ["tar", "--dereference", "--hard-dereference", "-cf", "-",
               "--exclude=.git", "--exclude=.github", "--exclude=.[^/]*", "."],
              cwd="out", capture_output=True, check=True,
          )
          with tarfile.open(fileobj=io.BytesIO(proc.stdout), mode="r:") as tf:
              names = set(tf.getnames())
          assert "./.well-known/mcp/server-card.json" not in names and ".well-known/mcp/server-card.json" not in names, names
          print("confirmed: default tar exclude drops .well-known (workflow must set include-hidden-files: true)")
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: landing-page/demo/out
          # Required: default false drops .well-known and .nojekyll from the Pages deploy.
          include-hidden-files: true

      - name: Upload build artifact (Cloudflare)
        uses: actions/upload-artifact@v7
        with:
          name: landing-page-out
          path: landing-page/demo/out
          retention-days: 1
          include-hidden-files: true

  deploy-github-pages:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages (attempt 1)
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128
        continue-on-error: true
      - name: Deploy to GitHub Pages (attempt 2)
        id: deployment_retry_2
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128
        continue-on-error: true
      - name: Deploy to GitHub Pages (attempt 3)
        id: deployment_retry_3
        if: steps.deployment.outcome == 'failure' && steps.deployment_retry_2.outcome == 'failure'
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128
      - name: Verify deploy succeeded
        if: steps.deployment.outcome == 'failure' && steps.deployment_retry_2.outcome == 'failure' && steps.deployment_retry_3.outcome == 'failure'
        run: |
          echo "GitHub Pages deploy failed after 3 attempts"
          exit 1

  deploy-cloudflare-pages:
    name: Deploy to Cloudflare Pages
    needs: build
    # Job-level `if` cannot use `secrets` when `needs` is set (actionlint). Opt out with
    # LANDING_PAGE_CLOUDFLARE_DEPLOY=false; skip inside the job when secrets are absent.
    if: ${{ vars.LANDING_PAGE_CLOUDFLARE_DEPLOY != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check Cloudflare credentials
        id: cf
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "${CLOUDFLARE_API_TOKEN}" ] && [ -n "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "SKIP: CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not set — Cloudflare Pages deploy skipped."
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        if: steps.cf.outputs.enabled == 'true'

      - name: Download build artifact
        if: steps.cf.outputs.enabled == 'true'
        uses: actions/download-artifact@v8
        with:
          name: landing-page-out
          path: landing-page/demo/out

      - name: Deploy to Cloudflare Pages
        if: steps.cf.outputs.enabled == 'true'
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Run from landing-page/demo so sibling functions/ is bundled with out/.
          workingDirectory: landing-page/demo
          command: pages deploy out --project-name=clawql-website --branch=main

  configure-agent-edge:
    name: Configure Cloudflare agent edge
    needs: [deploy-github-pages]
    if: ${{ always() && needs.deploy-github-pages.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check Cloudflare credentials
        id: cf
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "SKIP: CLOUDFLARE_API_TOKEN unset — agent edge not configured."
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        if: steps.cf.outputs.enabled == 'true'

      - name: Ensure agent edge (proxy, markdown, Link, DNS-AID)
        if: steps.cf.outputs.enabled == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLAWQL_APEX_DOMAIN: clawql.com
        run: bash scripts/deploy/ensure-clawql-com-agent-edge.sh
        continue-on-error: true
