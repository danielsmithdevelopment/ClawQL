# Code scanning for JavaScript/TypeScript — https://docs.github.com/code-security/code-scanning
# Kept separate from ci.yml so scheduled runs do not execute the full test matrix.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # Docs / prose-only PRs still hit full CI lint; skip CodeQL there to save minutes.
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "apps/docs/content/**"
      - "apps/www/**"
  schedule:
    - cron: "0 6 * * 1"

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # actions/checkout@v7.0.0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # github/codeql-action@v4.39.1 — bump init/autobuild/analyze together (split Dependabot PRs mismatch).
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370
        with:
          languages: javascript-typescript
          config-file: ./.github/codeql/codeql-config.yml

      - uses: github/codeql-action/autobuild@9b3254085494b55a0f7c4c2b3d2d52cc712ce370

      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370
