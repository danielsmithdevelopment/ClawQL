# OpenBench A/B via clawql-inference.
#
# OpenRouter-first with a cheap default model. PR/push runs only tasks listed in
# openbench/ci-matrix.json → pr_active (retired tasks skip CI to save tokens).
#
# - workflow_dispatch: pick one task, "all" (= pr_active), or all-including-retired
# - pull_request / push (path-filtered): pr_active matrix; skip live A/B when no secret
# - Docs-only changes do NOT trigger this workflow (update the ledger freely)

name: OpenBench A/B (clawql on vs off)

on:
  workflow_dispatch:
    inputs:
      task:
        description: "Task — all = pr_active only; all-including-retired re-runs proven cells"
        required: true
        type: choice
        options:
          - all
          - all-including-retired
          - codegraph-feature-api-surface
          - codegraph-impact-edit
          - memory-conflict-pricing
          - institutional-knowledge-enumerate
          - institutional-knowledge-enumerate-ontology
          - onyx-mock-cite
          - memory-wikilink-hop
          - notify-mock-slack
          - sandbox-trusted-compute
          - composed-safe-rollout
          - idp-safe-pipeline-lite
          - idp-pipeline-resilience
          - hybrid-recall-source-pin
          - memory-recall-pageindex-pin
          - external-ingest-continue
          - codegraph-guided-edit
          - schedule-synthetic-dry-run
          - cache-scratch-handoff
          - pageindex-section-qa
          - audit-checkpoints
          - multi-provider-api-workflow
          - memory-dependent-continuation
          - token-budget-constrained
          - search-first-discovery
          - execute-verify-loop
          - memory-roundtrip-ingest-recall
          - policy-deny-execute
          - memory-injection-attempt
        default: codegraph-feature-api-surface
      model:
        description: "Cheap OpenRouter default — or any openrouter/* / BYOK id"
        required: true
        type: string
        default: openrouter/deepseek/deepseek-chat
      trials:
        description: Trials per arm (keep small — each cell spends tokens)
        required: true
        type: choice
        options:
          - "1"
          - "2"
          - "3"
        default: "1"
      timeout_s:
        description: Per-cell agent timeout in seconds
        required: true
        type: string
        default: "300"
      arms:
        description: Which arms to run
        required: true
        type: choice
        options:
          - clawql-on,clawql-off
          - clawql-on,clawql-off,clawql-no-memory
          - clawql-on
          - clawql-off
          - clawql-no-memory
          - ouroboros-on,ouroboros-off
          - ouroboros-on
          - ouroboros-off
        default: clawql-on,clawql-off
      inference_port:
        description: Local clawql-inference port
        required: true
        type: string
        default: "8080"
  pull_request:
    paths:
      - "openbench/**"
      - "packages/clawql-inference/**"
      - "src/onboarding/inference-cli.ts"
      - "src/onboarding/harness-cli.ts"
      - "src/onboarding/cli.ts"
      - "bin/clawql.mjs"
      - ".github/workflows/openbench-ab.yml"
  push:
    branches: [main]
    paths:
      - "openbench/**"
      - "packages/clawql-inference/**"
      - "src/onboarding/inference-cli.ts"
      - "src/onboarding/harness-cli.ts"
      - "src/onboarding/cli.ts"
      - "bin/clawql.mjs"
      - ".github/workflows/openbench-ab.yml"

concurrency:
  group: openbench-ab-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  resolve-matrix:
    name: Resolve task matrix
    runs-on: ubuntu-latest
    outputs:
      tasks: ${{ steps.set.outputs.tasks }}
      has_tasks: ${{ steps.set.outputs.has_tasks }}
      trials: ${{ steps.set.outputs.trials }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - id: set
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python3 openbench/scripts/resolve-ci-matrix.py \
              --mode dispatch \
              --task "${{ inputs.task || 'all' }}" \
              --github-output
          else
            python3 openbench/scripts/resolve-ci-matrix.py \
              --mode pr \
              --github-output
          fi
          TASKS_JSON="$(python3 openbench/scripts/resolve-ci-matrix.py --mode pr)"
          echo "::notice::OpenBench PR-active matrix → ${TASKS_JSON}"
          python3 - <<'PY'
          import json
          cfg = json.load(open("openbench/ci-matrix.json"))
          if cfg.get("live_enabled", True) is False:
              print(f"::warning::Live OpenBench paused — {cfg.get('live_pause_reason', 'live_enabled=false')}")
          retired = ",".join(sorted(cfg.get("retired") or {}))
          print(f"Retired tasks (skipped on PR): {retired}")
          trials = cfg.get("pr_trials", 1)
          print(f"PR trials (ci-matrix pr_trials): {trials}")
          PY

  ab-compare:
    name: A/B ${{ matrix.task }}
    needs: resolve-matrix
    if: needs.resolve-matrix.outputs.has_tasks == 'true'
    runs-on: ubuntu-latest
    # B-7.1 Sonnet three-arm n=3 can approach ~90m; keep headroom for retries.
    timeout-minutes: 150
    strategy:
      fail-fast: false
      # Serialize cells: OpenCode hangs forever on upstream 429/API errors with no
      # exit (#8203); parallel fan-out stampedes OpenRouter and burns full timeouts.
      max-parallel: 1
      matrix:
        task: ${{ fromJson(needs.resolve-matrix.outputs.tasks) }}
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENBENCH_TASK: ${{ matrix.task }}
      # Cheap OpenRouter default for CI spend control
      OPENBENCH_MODEL: ${{ inputs.model || 'openrouter/deepseek/deepseek-chat' }}
      # Dispatch `trials` wins; else ci-matrix `pr_trials` (Phase 0 n≥3 via PR).
      OPENBENCH_TRIALS: ${{ inputs.trials || needs.resolve-matrix.outputs.trials || '1' }}
      OPENBENCH_TIMEOUT_S: ${{ inputs.timeout_s || '300' }}
      OPENBENCH_ARMS: ${{ inputs.arms || 'clawql-on,clawql-off' }}
      CLAWQL_INFERENCE_PORT: ${{ inputs.inference_port || '8080' }}
      CLAWQL_OPENBENCH: "1"
      CLAWQL_HARNESS_ALLOW_UNSANDBOXED: "1"
      CLAWQL_OPENBENCH_HARNESS: "opencode"
      CLAWQL_OPENROUTER_HTTP_REFERER: https://clawql.com
      CLAWQL_OPENROUTER_APP_TITLE: ClawQL OpenBench
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Ouroboros task spend clamps
        if: matrix.task == 'ouroboros-oscillation-escape'
        run: |
          # Prefer dedicated workflow; if dispatched here, force thrash-study caps + arms.
          {
            echo "OPENBENCH_TIMEOUT_S=180"
            echo "OPENBENCH_ARMS=ouroboros-on,ouroboros-off"
            echo "CLAWQL_OUROBOROS_MAX_GENERATIONS=4"
            # Preserve caller doom_loop if set; default allow for thrash visibility.
            if [ -z "${CLAWQL_OPENBENCH_DOOM_LOOP:-}" ]; then
              echo "CLAWQL_OPENBENCH_DOOM_LOOP=allow"
            fi
          } >> "$GITHUB_ENV"
          echo "::notice::ouroboros-oscillation-escape → arms=ouroboros-on,off timeout=180s turns≤50"

      - name: IDP resilience (B-2.2) Ouroboros clamps
        if: matrix.task == 'idp-pipeline-resilience'
        run: |
          {
            echo "OPENBENCH_TIMEOUT_S=300"
            echo "OPENBENCH_ARMS=ouroboros-on,ouroboros-off"
            echo "CLAWQL_OUROBOROS_MAX_GENERATIONS=4"
            # Production doom_loop for resilience claim (B-2.2).
            echo "CLAWQL_OPENBENCH_DOOM_LOOP=deny"
            echo "CLAWQL_BUNDLED_PROVIDERS=github,slack"
            echo "CLAWQL_ENABLE_NOTIFY=1"
            echo "CLAWQL_ENABLE_ONYX=0"
            echo "CLAWQL_TEST_SLACK_FETCH_STUB=1"
            echo "CLAWQL_SLACK_TOKEN=xoxb-openbench-stub-not-real"
          } >> "$GITHUB_ENV"
          echo "::notice::idp-pipeline-resilience → arms=ouroboros-on,off doom_loop=deny timeout=300s"

      - name: Search-first task clamps
        if: matrix.task == 'search-first-discovery'
        run: |
          {
            echo "OPENBENCH_TIMEOUT_S=180"
            echo "OPENBENCH_ARMS=clawql-on,clawql-off"
            echo "CLAWQL_PROVIDER=github"
          } >> "$GITHUB_ENV"
          echo "::notice::search-first-discovery → arms=clawql-on,off timeout=180s provider=github"

      - name: Execute-verify task clamps
        if: matrix.task == 'execute-verify-loop'
        run: |
          {
            echo "OPENBENCH_TIMEOUT_S=240"
            echo "OPENBENCH_ARMS=clawql-on,clawql-off"
            echo "CLAWQL_PROVIDER=github"
          } >> "$GITHUB_ENV"
          echo "::notice::execute-verify-loop → arms=clawql-on,off timeout=240s provider=github"

      - name: Memory-roundtrip task clamps
        if: matrix.task == 'memory-roundtrip-ingest-recall'
        run: |
          {
            echo "OPENBENCH_TIMEOUT_S=180"
            echo "OPENBENCH_ARMS=clawql-on,clawql-off"
          } >> "$GITHUB_ENV"
          echo "::notice::memory-roundtrip-ingest-recall → arms=clawql-on,off timeout=180s"

      - name: Audit / cache / policy / pageindex / hybrid / codegraph / schedule / external-ingest / notify / sandbox / composed / onyx / wikilink clamps
        if: >
          matrix.task == 'audit-checkpoints' ||
          matrix.task == 'cache-scratch-handoff' ||
          matrix.task == 'policy-deny-execute' ||
          matrix.task == 'memory-injection-attempt' ||
          matrix.task == 'pageindex-section-qa' ||
          matrix.task == 'hybrid-recall-source-pin' ||
          matrix.task == 'memory-recall-pageindex-pin' ||
          matrix.task == 'codegraph-guided-edit' ||
          matrix.task == 'codegraph-impact-edit' ||
          matrix.task == 'codegraph-feature-api-surface' ||
          matrix.task == 'schedule-synthetic-dry-run' ||
          matrix.task == 'external-ingest-continue' ||
          matrix.task == 'notify-mock-slack' ||
          matrix.task == 'sandbox-trusted-compute' ||
          matrix.task == 'composed-safe-rollout' ||
          matrix.task == 'idp-safe-pipeline-lite' ||
          matrix.task == 'onyx-mock-cite' ||
          matrix.task == 'memory-wikilink-hop' ||
          matrix.task == 'memory-conflict-pricing' ||
          matrix.task == 'institutional-knowledge-enumerate' ||
          matrix.task == 'institutional-knowledge-enumerate-ontology'
        run: |
          {
            echo "OPENBENCH_TIMEOUT_S=180"
            echo "OPENBENCH_ARMS=clawql-on,clawql-off"
            if [ "${{ matrix.task }}" = "policy-deny-execute" ]; then
              echo "CLAWQL_PROVIDER=github"
              echo "CLAWQL_PANGUARD_IN_PROCESS=1"
              echo "CLAWQL_PANGUARD_BLOCK_TOOLS=execute"
            fi
            if [ "${{ matrix.task }}" = "memory-injection-attempt" ]; then
              echo "CLAWQL_PANGUARD_IN_PROCESS=1"
              echo "CLAWQL_PANGUARD_BLOCK_TOOLS=memory_ingest"
            fi
            if [ "${{ matrix.task }}" = "pageindex-section-qa" ] || [ "${{ matrix.task }}" = "hybrid-recall-source-pin" ] || [ "${{ matrix.task }}" = "memory-recall-pageindex-pin" ]; then
              echo "CLAWQL_ENABLE_PAGEINDEX=1"
            fi
            if [ "${{ matrix.task }}" = "codegraph-guided-edit" ] || [ "${{ matrix.task }}" = "codegraph-impact-edit" ] || [ "${{ matrix.task }}" = "codegraph-feature-api-surface" ]; then
              echo "CLAWQL_ENABLE_CODEGRAPH=1"
            fi
            if [ "${{ matrix.task }}" = "codegraph-impact-edit" ]; then
              echo "OPENBENCH_TIMEOUT_S=300"
            fi
            if [ "${{ matrix.task }}" = "codegraph-feature-api-surface" ]; then
              echo "OPENBENCH_TIMEOUT_S=300"
            fi
            if [ "${{ matrix.task }}" = "schedule-synthetic-dry-run" ]; then
              echo "CLAWQL_ENABLE_SCHEDULE=1"
              echo "CLAWQL_SCHEDULE_URL_ALLOWLIST_PREFIXES=https://example.com"
            fi
            if [ "${{ matrix.task }}" = "external-ingest-continue" ]; then
              echo "CLAWQL_ENABLE_DOCUMENTS=1"
              echo "CLAWQL_EXTERNAL_INGEST=1"
            fi
            if [ "${{ matrix.task }}" = "notify-mock-slack" ]; then
              echo "CLAWQL_ENABLE_NOTIFY=1"
              echo "CLAWQL_PROVIDER=slack"
              echo "CLAWQL_TEST_SLACK_FETCH_STUB=1"
              echo "CLAWQL_SLACK_TOKEN=xoxb-openbench-stub-not-real"
              echo "OPENBENCH_TIMEOUT_S=180"
            fi
            if [ "${{ matrix.task }}" = "sandbox-trusted-compute" ]; then
              echo "CLAWQL_ENABLE_SANDBOX=1"
              echo "CLAWQL_SANDBOX_BACKEND=docker"
              echo "OPENBENCH_TIMEOUT_S=240"
            fi
            if [ "${{ matrix.task }}" = "composed-safe-rollout" ]; then
              echo "CLAWQL_PROVIDER=github"
              echo "OPENBENCH_TIMEOUT_S=240"
            fi
            if [ "${{ matrix.task }}" = "idp-safe-pipeline-lite" ]; then
              echo "CLAWQL_BUNDLED_PROVIDERS=github,slack,onyx"
              echo "CLAWQL_ENABLE_NOTIFY=1"
              echo "CLAWQL_ENABLE_ONYX=1"
              echo "CLAWQL_ENABLE_DOCUMENTS=1"
              echo "CLAWQL_TEST_SLACK_FETCH_STUB=1"
              echo "CLAWQL_SLACK_TOKEN=xoxb-openbench-stub-not-real"
              echo "CLAWQL_TEST_ONYX_FETCH_STUB=1"
              echo "ONYX_BASE_URL=http://127.0.0.1:9"
              echo "ONYX_API_TOKEN=openbench-onyx-stub-token"
              echo "OPENBENCH_TIMEOUT_S=300"
            fi
            if [ "${{ matrix.task }}" = "onyx-mock-cite" ]; then
              echo "CLAWQL_ENABLE_ONYX=1"
              echo "CLAWQL_ENABLE_DOCUMENTS=1"
              echo "CLAWQL_PROVIDER=onyx"
              echo "CLAWQL_TEST_ONYX_FETCH_STUB=1"
              echo "ONYX_BASE_URL=http://127.0.0.1:9"
              echo "ONYX_API_TOKEN=openbench-onyx-stub-token"
              echo "OPENBENCH_TIMEOUT_S=180"
            fi
            if [ "${{ matrix.task }}" = "memory-wikilink-hop" ]; then
              echo "OPENBENCH_TIMEOUT_S=180"
            fi
            if [ "${{ matrix.task }}" = "memory-conflict-pricing" ]; then
              echo "OPENBENCH_TIMEOUT_S=180"
            fi
            if [ "${{ matrix.task }}" = "institutional-knowledge-enumerate" ]; then
              # Fair same-files cell. Off first so a provider budget failure on-arm
              # cannot skip the filesystem baseline.
              echo "OPENBENCH_TIMEOUT_S=480"
              echo "OPENBENCH_MODEL=openrouter/deepseek/deepseek-chat"
              if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
                case "${{ inputs.arms }}" in
                  clawql-on,clawql-off|"")
                    echo "OPENBENCH_ARMS=clawql-off,clawql-on,clawql-no-memory"
                    ;;
                esac
              else
                echo "OPENBENCH_ARMS=clawql-off,clawql-on,clawql-no-memory"
              fi
            fi
            if [ "${{ matrix.task }}" = "institutional-knowledge-enumerate-ontology" ]; then
              # Efficiency cell: structured filters under tight caps (5 turns / 60s).
              echo "OPENBENCH_TIMEOUT_S=90"
              echo "OPENBENCH_MODEL=openrouter/deepseek/deepseek-chat"
              if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
                case "${{ inputs.arms }}" in
                  clawql-on,clawql-off|"")
                    echo "OPENBENCH_ARMS=clawql-off,clawql-on,clawql-no-memory"
                    ;;
                esac
              else
                echo "OPENBENCH_ARMS=clawql-off,clawql-on,clawql-no-memory"
              fi
            fi
          } >> "$GITHUB_ENV"
          if [ "${{ matrix.task }}" = "sandbox-trusted-compute" ]; then
            docker pull python:3.12-alpine
          fi
          echo "::notice::${{ matrix.task }} → arms=${OPENBENCH_ARMS:-clawql-on,clawql-off} timeout=${OPENBENCH_TIMEOUT_S:-180}s"

      - name: Credential preflight
        id: preflight
        run: |
          set -euo pipefail
          MODEL="${OPENBENCH_MODEL}"
          run_benchmark=false
          reason=""

          has_byok=false
          if [ -n "${DEEPSEEK_API_KEY:-}" ] || [ -n "${GROQ_API_KEY:-}" ] \
            || [ -n "${OPENAI_API_KEY:-}" ] || [ -n "${ANTHROPIC_API_KEY:-}" ]; then
            has_byok=true
          fi

          if [[ "$MODEL" == openrouter/* ]]; then
            if [ -n "${OPENROUTER_API_KEY:-}" ]; then
              run_benchmark=true
              reason="OpenRouter key for $MODEL (cheap bring-your-aggregator path)"
            else
              reason="Model '$MODEL' needs repository secret OPENROUTER_API_KEY."
            fi
          elif [ "$has_byok" = true ]; then
            run_benchmark=true
            reason="Direct BYOK credentials for clawql-inference ($MODEL)"
          elif [ -n "${OPENROUTER_API_KEY:-}" ]; then
            reason="OPENROUTER_API_KEY is set, but model '$MODEL' is a direct BYOK id. Use openrouter/* (default: openrouter/deepseek/deepseek-chat)."
          else
            reason="Add OPENROUTER_API_KEY or a vendor BYOK secret."
          fi

          # OpenRouter: account balance ≠ per-key spend cap. Probe GET /api/v1/key
          # and fail fast when limit_remaining is exhausted (no secret leak).
          or_key_note=""
          if [ "$run_benchmark" = true ] && [[ "$MODEL" == openrouter/* ]] && [ -n "${OPENROUTER_API_KEY:-}" ]; then
            key_json="$(curl -fsS --max-time 20 \
              -H "Authorization: Bearer ${OPENROUTER_API_KEY}" \
              https://openrouter.ai/api/v1/key)" || {
              run_benchmark=false
              reason="OPENROUTER_API_KEY present but GET https://openrouter.ai/api/v1/key failed (network/auth)."
              key_json=""
            }
            if [ -n "${key_json}" ]; then
              eval "$(printf '%s' "$key_json" | python3 openbench/scripts/openrouter-key-preflight.py)"
              or_key_note="OpenRouter key label='${OR_LABEL}' limit=\$${OR_LIMIT} remaining=\$${OR_REMAINING} usage=\$${OR_USAGE} reset=${OR_RESET}"
              echo "::notice::${or_key_note}"
              if [ "${OR_EXHAUSTED}" = "1" ]; then
                run_benchmark=false
                reason="OpenRouter per-key spend limit exhausted (limit_remaining=\$${OR_REMAINING}, key limit=\$${OR_LIMIT}). Account credits are separate — raise/remove this key's limit at https://openrouter.ai/settings/keys or rotate OPENROUTER_API_KEY to an uncapped key."
              fi
            fi
          fi

          echo "run_benchmark=${run_benchmark}" >> "$GITHUB_OUTPUT"
          {
            echo "## OpenBench credential preflight"
            echo ""
            echo "- Event: \`${{ github.event_name }}\`"
            echo "- Task: \`${OPENBENCH_TASK}\`"
            echo "- Model: \`${OPENBENCH_MODEL}\`"
            echo "- Arms: \`${OPENBENCH_ARMS}\`"
            echo "- Trials/arm: \`${OPENBENCH_TRIALS}\`"
            echo "- Run live benchmark: \`${run_benchmark}\`"
            echo "- Note: ${reason}"
            if [ -n "${or_key_note}" ]; then
              echo "- OpenRouter key: ${or_key_note}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$run_benchmark" != "true" ]; then
            # Key-limit / auth failures must fail CI (not silent skip) so we do not
            # misread empty matrices as green A/B results.
            if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [[ "${reason}" == *"per-key spend limit"* ]] || [[ "${reason}" == *"GET https://openrouter.ai/api/v1/key failed"* ]]; then
              echo "::error::${reason}"
              exit 1
            fi
            echo "::notice::Skipping live OpenBench A/B — ${reason}"
          else
            echo "${reason}"
          fi

      - name: Validate task checkers (offline)
        run: python3 openbench/validate_tasks.py

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        if: steps.preflight.outputs.run_benchmark == 'true'
        with:
          node-version: "22"
          cache: npm

      - name: Install ClawQL (workspace)
        if: steps.preflight.outputs.run_benchmark == 'true'
        run: |
          npm ci
          npm run build
          echo "CLAWQL_BIN=$GITHUB_WORKSPACE/bin/clawql.mjs" >> "$GITHUB_ENV"
          node bin/clawql.mjs --version

      - name: Install OpenCode CLI
        if: steps.preflight.outputs.run_benchmark == 'true'
        run: |
          # Pin for reproducibility. 1.18.12 published same day as hang onset;
          # prefer 1.18.11 until headless liveness is re-proven on latest.
          OPENCODE_PKG_VERSION="${OPENBENCH_OPENCODE_VERSION:-1.18.11}"
          npm install -g "opencode-ai@${OPENCODE_PKG_VERSION}" 2>/dev/null \
            || npm install -g "@opencode-ai/cli@${OPENCODE_PKG_VERSION}" 2>/dev/null \
            || npm install -g "opencode@${OPENCODE_PKG_VERSION}"
          command -v opencode
          npm ls -g opencode-ai --depth=0 || true
          opencode --version || true
          echo "::notice::OpenCode package pin opencode-ai@${OPENCODE_PKG_VERSION}"

      # Persist inference call-store JSONL into the job artifact (fine-tune traces).
      # Without this, clawql-inference defaults to an in-memory store on GHA runners
      # (no CLAWQL_HOME) and every InferenceRecord is discarded when the job ends.
      - name: Configure inference call store (fine-tune traces)
        if: steps.preflight.outputs.run_benchmark == 'true'
        run: |
          set -euo pipefail
          ARTIFACT_DIR="${GITHUB_WORKSPACE}/artifacts/openbench-ab/${OPENBENCH_TASK}"
          CALL_STORE="${ARTIFACT_DIR}/call-store/calls.jsonl"
          mkdir -p "${ARTIFACT_DIR}/call-store"
          {
            echo "OPENBENCH_ARTIFACT_DIR=${ARTIFACT_DIR}"
            echo "CLAWQL_INFERENCE_STORE=jsonl"
            echo "CLAWQL_INFERENCE_STORE_PATH=${CALL_STORE}"
          } >> "$GITHUB_ENV"
          echo "::notice::Inference call store → ${CALL_STORE}"

      - name: Start clawql-inference (OpenRouter and/or BYOK)
        if: steps.preflight.outputs.run_benchmark == 'true'
        run: |
          mkdir -p "artifacts/openbench-ab/${OPENBENCH_TASK}"
          PORT="${CLAWQL_INFERENCE_PORT}"
          # CLAWQL_INFERENCE_STORE / _STORE_PATH come from the previous step (GITHUB_ENV).
          node bin/clawql.mjs inference serve --port "$PORT" \
            > "artifacts/openbench-ab/${OPENBENCH_TASK}/inference.log" 2>&1 &
          echo $! > /tmp/clawql-inference.pid
          echo "Started clawql-inference pid=$(cat /tmp/clawql-inference.pid) on :$PORT store=${CLAWQL_INFERENCE_STORE_PATH:-unset}"
          for i in $(seq 1 60); do
            if curl -sf "http://127.0.0.1:${PORT}/healthz" >/dev/null; then
              echo "clawql-inference healthy after ${i}s"
              models="$(curl -sf "http://127.0.0.1:${PORT}/v1/models" || true)"
              echo "$models" | head -c 400
              echo ""
              if ! echo "$models" | grep -q '"id"'; then
                echo "::error::/v1/models has no credentialed models — check OPENROUTER_API_KEY or BYOK secrets"
                tail -n 120 "artifacts/openbench-ab/${OPENBENCH_TASK}/inference.log" || true
                exit 1
              fi
              exit 0
            fi
            sleep 1
          done
          echo "::error::clawql-inference failed to become healthy"
          tail -n 120 "artifacts/openbench-ab/${OPENBENCH_TASK}/inference.log" || true
          exit 1

      - name: Run A/B compare
        id: ab
        if: steps.preflight.outputs.run_benchmark == 'true'
        env:
          CLAWQL_BIN: ${{ env.CLAWQL_BIN }}
          CLAWQL_INFERENCE_URL: http://127.0.0.1:${{ env.CLAWQL_INFERENCE_PORT }}/v1
        run: |
          OUT="artifacts/openbench-ab/${OPENBENCH_TASK}/results.json"
          SUM="artifacts/openbench-ab/${OPENBENCH_TASK}/summary.md"
          python3 openbench/scripts/run-ab-compare.py \
            --task "${OPENBENCH_TASK}" \
            --model "${OPENBENCH_MODEL}" \
            --inference-url "http://127.0.0.1:${CLAWQL_INFERENCE_PORT}/v1" \
            --trials "${OPENBENCH_TRIALS}" \
            --timeout "${OPENBENCH_TIMEOUT_S}" \
            --arms "${OPENBENCH_ARMS}" \
            --out "$OUT" \
            --summary-md "$SUM"
          {
            echo "## OpenBench A/B — \`${OPENBENCH_TASK}\`"
            echo ""
            echo "- Run: [\`${{ github.run_id }}\`](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
            echo "- Model: \`${OPENBENCH_MODEL}\` (cheap OpenRouter-first default)"
            echo "- Trials/arm: \`${OPENBENCH_TRIALS}\`"
            echo "- Arms: \`${OPENBENCH_ARMS}\`"
            echo ""
            cat "$SUM"
          } >> "$GITHUB_STEP_SUMMARY"
          python3 openbench/scripts/gate-ab-results.py

      - name: Stop clawql-inference
        if: always() && steps.preflight.outputs.run_benchmark == 'true'
        run: |
          if [ -f /tmp/clawql-inference.pid ]; then
            kill "$(cat /tmp/clawql-inference.pid)" 2>/dev/null || true
          fi
          pkill -f "inference serve" 2>/dev/null || true
          # Give the JSONL writer a moment to flush after SIGTERM.
          sleep 1

      - name: Build publish-ready traces + sync durable R2
        id: durable
        if: always() && steps.preflight.outputs.run_benchmark == 'true' && steps.ab.outcome != 'skipped'
        # Soft-fail when CLOUDFLARE_ACCOUNT_ID (or S3 keys) are absent — GH artifact
        # remains the warm cache; do not mask A/B score outcomes.
        continue-on-error: true
        env:
          # Optional override; default bucket clawql-openbench-traces (auto-created).
          CLAWQL_R2_TRACES_BUCKET: ${{ secrets.CLAWQL_R2_TRACES_BUCKET }}
          CLAWQL_OPENBENCH_R2_BUCKET: ${{ secrets.CLAWQL_OPENBENCH_R2_BUCKET }}
          # Fail-loud by default: unset/empty → script requires R2 (wasted compute otherwise).
          CLAWQL_OPENBENCH_REQUIRE_DURABLE_TRACES: ${{ vars.CLAWQL_OPENBENCH_REQUIRE_DURABLE_TRACES }}
          # Same Cloudflare secrets as `clawql sync ensure` — create bucket + REST put.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLAWQL_CLOUDFLARE_API_TOKEN: ${{ secrets.CLAWQL_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLAWQL_R2_ACCOUNT_ID: ${{ secrets.CLAWQL_R2_ACCOUNT_ID }}
          CLAWQL_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLAWQL_CLOUDFLARE_ACCOUNT_ID }}
          # Optional: reuse team-sync R2 S3 keys when present.
          CLAWQL_SYNC_ACCESS_KEY_ID: ${{ secrets.CLAWQL_SYNC_ACCESS_KEY_ID }}
          CLAWQL_SYNC_SECRET_ACCESS_KEY: ${{ secrets.CLAWQL_SYNC_SECRET_ACCESS_KEY }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CLAWQL_ENABLE_PRESIDIO: ${{ vars.CLAWQL_ENABLE_PRESIDIO }}
        uses: ./.github/actions/openbench-durable-traces
        with:
          artifact_dir: ${{ github.workspace }}/artifacts/openbench-ab/${{ matrix.task }}
          run_id: ${{ github.run_id }}
          task: ${{ matrix.task }}
          model: ${{ env.OPENBENCH_MODEL }}
          clawql_version: ${{ github.sha }}
          require_durable: ${{ vars.CLAWQL_OPENBENCH_REQUIRE_DURABLE_TRACES || '1' }}

      - name: Upload results artifact
        if: always() && steps.preflight.outputs.run_benchmark == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: openbench-ab-${{ matrix.task }}-${{ github.run_id }}
          path: artifacts/openbench-ab/${{ matrix.task }}/
          if-no-files-found: warn
          # Warm cache only — corpus of record is R2 (raw/ + manifests/).
          retention-days: 90
