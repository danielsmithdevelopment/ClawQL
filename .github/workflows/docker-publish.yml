# Build and push ClawQL container images (MCP, website, dashboard, Panguard bridge) to GitHub Container Registry (GHCR).
# Daily schedule keeps `latest` / `nightly` fresh; manual runs via workflow_dispatch.
#
# Golden-image pipeline (this workflow): same **repo** supply-chain gates as CI (**OSV-Scanner**, **Trivy** fs,
# **Syft** SBOM artifact); **one BuildKit build** exports a **local OCI image layout** → **Trivy** scans it → **skopeo copy**
# pushes **that same layout** to GHCR (**no second build / no drift**); **Cosign** signing (**`--recursive`** for multi-arch index + per-arch manifests) + **`imagetools`** promotion of
# **`latest`** / **`nightly`** / **`nightly-YYYYMMDD`** only after **`cosign verify`** succeeds on the pushed digest (same identity / issuer policy as Kyverno **`verifyImages`**). GitHub’s **published** Packages REST/OpenAPI defines **no** **`PATCH`** to flip container visibility — **`public`** is set in **Package settings → Danger zone** ([docs](https://docs.github.com/en/packages/learn-github-packages/configuring-a-packages-access-control-and-visibility)); orgs can default **new** packages public under **Organization settings → Packages**. Each job **fails** if **anonymous `skopeo inspect`** on **`:latest`** still does not work (Kyverno + **`docker pull`**). Images: **clawql-mcp**, **clawql-panguard-mcp-bridge**, **clawql-website**, **clawql-dashboard** (parallel jobs after **`repo-supply-chain`**).
#
# Cosign pin (**v2.x** via **`cosign-release`**): Kyverno **`verifyImages`** on typical installs expects **legacy Sigstore bundle**
# payloads; **Cosign v2** emits those by default (**no** **`--new-bundle-format`** flag — that exists only in **v3**).
# Cosign **v3** defaults / **`--new-bundle-format=true`** emit **bundle v0.3** artifacts that often fail verification in-cluster,
# and mixing **v3** CLI with **`--new-bundle-format=false`** tripped signing-config checks — so we **pin Cosign v2** and sign with **`cosign sign --recursive`** only.
name: Docker publish

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: docker-publish-${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  id-token: write # Cosign keyless (OIDC → Sigstore)

env:
  # GHCR requires lowercase; package name matches npm `clawql-mcp`.
  IMAGE_NAME: ghcr.io/danielsmithdevelopment/clawql-mcp
  PANGUARD_BRIDGE_IMAGE_NAME: ghcr.io/danielsmithdevelopment/clawql-panguard-mcp-bridge
  WEBSITE_IMAGE_NAME: ghcr.io/danielsmithdevelopment/clawql-website
  DASHBOARD_IMAGE_NAME: ghcr.io/danielsmithdevelopment/clawql-dashboard
  # Pin scanner image (public GHCR; avoids Docker Hub rate limits in CI).
  TRIVY_SCAN_IMAGE: ghcr.io/aquasecurity/trivy:0.59.1
  # Cosign verify gate — align with Kyverno verifyImages (fork-friendly repo path).
  COSIGN_VERIFY_CERT_IDENTITY_REGEXP: "^https://github.com/${{ github.repository }}/.*"
  COSIGN_VERIFY_CERT_OIDC_ISSUER_REGEXP: "^https://token\\.actions\\.githubusercontent\\.com.*"

jobs:
  # Mirrors `.github/workflows/ci.yml` **`supply-chain`**: repo lockfiles + manifests + SBOM before any push/sign.
  repo-supply-chain:
    name: Repo supply chain (OSV + Trivy fs + Syft SBOM)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: OSV-Scanner (lockfiles + manifests)
        run: docker run --rm -v "$PWD:/repo" -w /repo ghcr.io/google/osv-scanner:latest scan --recursive --config osv-scanner.toml .

      - name: Trivy filesystem (HIGH / CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: fs
          scan-ref: "."
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: "1"
          trivyignores: .trivyignore
          skip-dirs: node_modules,website/node_modules,dashboard/node_modules,dist,packages/mcp-grpc-transport/dist,packages/clawql-ouroboros/dist,packages/panguard-mcp-bridge/dist,.git

      - name: CycloneDX SBOM (Syft)
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo anchore/syft:v1.19.0 \
            scan . -o "cyclonedx-json=sbom-cyclonedx-repo.cdx.json"

      - name: Upload repository SBOM
        uses: actions/upload-artifact@v7
        with:
          name: sbom-cyclonedx-repository-docker-publish
          path: sbom-cyclonedx-repo.cdx.json
          if-no-files-found: error

  build-push-mcp:
    name: Build and push
    needs: [repo-supply-chain]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # actions/checkout@v6.0.2
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      # docker/setup-buildx-action@v4.0.0
      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd

      # docker/login-action@v4.1.0
      - uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # docker/metadata-action@v6.0.0 — only **immutable** tags on registry push; `latest` / `nightly` promoted after gates.
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Install skopeo
        run: sudo apt-get update && sudo apt-get install -y skopeo

      - name: Build OCI layout (single artifact — scanned and pushed)
        run: |
          set -euo pipefail
          # `tar=false` directory layout — Trivy supports OCI layout dirs; BuildKit OCI *tarballs* often fail Trivy (#5136).
          DEST="${RUNNER_TEMP}/clawql-mcp-oci"
          rm -rf "${DEST}"
          mkdir -p "${DEST}"
          docker buildx build \
            --file docker/Dockerfile \
            --target runtime \
            --platform linux/amd64,linux/arm64 \
            --output "type=oci,tar=false,dest=${DEST}" \
            --cache-from type=gha,scope=docker-publish-mcp \
            --cache-to type=gha,mode=max,scope=docker-publish-mcp \
            --provenance=mode=max \
            --sbom=true \
            .

      - name: Trivy scan OCI layout (HIGH / CRITICAL — before registry push)
        run: |
          set -euo pipefail
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/repo:ro" \
            -v "${RUNNER_TEMP}/clawql-mcp-oci:/work/oci:ro" \
            "${{ env.TRIVY_SCAN_IMAGE }}" \
            image \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            --ignorefile /repo/.trivyignore \
            --input /work/oci

      - name: Push OCI layout to GHCR (skopeo — same bytes Trivy scanned)
        id: oci_push
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          AUTH=(--authfile "${DOCKER_CONFIG:-$HOME/.docker}/config.json")
          SRC="oci:${RUNNER_TEMP}/clawql-mcp-oci"
          if [ -z "${IMAGE_TAGS//[$'\t\r\n ']}" ]; then
            echo "No image tags from metadata-action" >&2
            exit 1
          fi
          while IFS= read -r dest; do
            [ -z "${dest// }" ] && continue
            skopeo copy "${AUTH[@]}" --all "${SRC}" "docker://${dest}"
          done <<< "${IMAGE_TAGS}"
          FIRST="$(printf '%s\n' "${IMAGE_TAGS}" | sed '/^[[:space:]]*$/d' | head -n1)"
          DIGEST="$(skopeo inspect "${AUTH[@]}" "docker://${FIRST}" --format '{{.Digest}}')"
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

      # Pin Cosign v2 — see workflow header (Kyverno verifyImages + legacy bundle format).
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v2.4.3

      - name: Cosign sign (keyless, recursive — Kyverno-compatible legacy bundles)
        if: ${{ steps.oci_push.outputs.digest != '' }}
        run: cosign sign --yes --recursive "${{ env.IMAGE_NAME }}@${{ steps.oci_push.outputs.digest }}"

      - name: Cosign verify (publish gate — before tag promotion)
        if: ${{ steps.oci_push.outputs.digest != '' }}
        run: |
          cosign verify "${{ env.IMAGE_NAME }}@${{ steps.oci_push.outputs.digest }}" \
            --certificate-identity-regexp "${COSIGN_VERIFY_CERT_IDENTITY_REGEXP}" \
            --certificate-oidc-issuer-regexp "${COSIGN_VERIFY_CERT_OIDC_ISSUER_REGEXP}"

      - name: Promote rolling tags (latest / nightly / nightly-YYYYMMDD)
        if: ${{ steps.oci_push.outputs.digest != '' }}
        run: |
          set -euo pipefail
          SRC="${{ env.IMAGE_NAME }}@${{ steps.oci_push.outputs.digest }}"
          TAGS=(--tag "${{ env.IMAGE_NAME }}:latest" --tag "${{ env.IMAGE_NAME }}:nightly")
          if [ "${{ github.event_name }}" = "schedule" ]; then
            TAGS+=(--tag "${{ env.IMAGE_NAME }}:nightly-$(date -u +%Y%m%d)")
          fi
          docker buildx imagetools create "${TAGS[@]}" "$SRC"

      # Private GHCR manifests break Kyverno verifyImages — GitHub exposes no REST PATCH for container visibility (see workflow header).

      - name: Verify anonymous GHCR read (Kyverno + end-user pulls)
        if: ${{ steps.oci_push.outputs.digest != '' }}
        continue-on-error: true
        run: bash "${GITHUB_WORKSPACE}/scripts/ci/verify-ghcr-image-anonymous-pull.sh" "${{ env.IMAGE_NAME }}:latest"

  build-push-dashboard:
    name: Build and push dashboard
    needs: [repo-supply-chain]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd

      - uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9
        with:
          images: ${{ env.DASHBOARD_IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Install skopeo
        run: sudo apt-get update && sudo apt-get install -y skopeo

      # `dashboard/Dockerfile` copies `.env.example` into the image for `prebuild` (env catalog). Build context is `./dashboard` only, so stage the repo-root catalog source first.
      - name: Stage repo .env.example for dashboard Docker context
        run: cp "${GITHUB_WORKSPACE}/.env.example" "${GITHUB_WORKSPACE}/dashboard/.env.example"

      - name: Build OCI layout (single artifact — scanned and pushed)
        run: |
          set -euo pipefail
          DEST="${RUNNER_TEMP}/clawql-dashboard-oci"
          rm -rf "${DEST}"
          mkdir -p "${DEST}"
          docker buildx build \
            --file dashboard/Dockerfile \
            --platform linux/amd64,linux/arm64 \
            --output "type=oci,tar=false,dest=${DEST}" \
            --cache-from type=gha,scope=docker-publish-dashboard \
            --cache-to type=gha,mode=max,scope=docker-publish-dashboard \
            --provenance=mode=max \
            --sbom=true \
            ./dashboard

      - name: Trivy scan OCI layout (HIGH / CRITICAL — before registry push)
        run: |
          set -euo pipefail
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/repo:ro" \
            -v "${RUNNER_TEMP}/clawql-dashboard-oci:/work/oci:ro" \
            "${{ env.TRIVY_SCAN_IMAGE }}" \
            image \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            --ignorefile /repo/.trivyignore \
            --input /work/oci

      - name: Push OCI layout to GHCR (skopeo — same bytes Trivy scanned)
        id: oci_push
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          AUTH=(--authfile "${DOCKER_CONFIG:-$HOME/.docker}/config.json")
          SRC="oci:${RUNNER_TEMP}/clawql-dashboard-oci"
          if [ -z "${IMAGE_TAGS//[$'\t\r\n ']}" ]; then
            echo "No image tags from metadata-action" >&2
            exit 1
          fi
          while IFS= read -r dest; do
            [ -z "${dest// }" ] && continue
            skopeo copy "${AUTH[@]}" --all "${SRC}" "docker://${dest}"
          done <<< "${IMAGE_TAGS}"
          FIRST="$(printf '%s\n' "${IMAGE_TAGS}" | sed '/^[[:space:]]*$/d' | head -n1)"
          DIGEST="$(skopeo inspect "${AUTH[@]}" "docker://${FIRST}" --format '{{.Digest}}')"
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v2.4.3

      - name: Cosign sign (keyless, recursive — Kyverno-compatible legacy bundles)
        if: ${{ steps.oci_push.outputs.digest != '' }}
        run: cosign sign --yes --recursive "${{ env.DASHBOARD_IMAGE_NAME }}@${{ steps.oci_push.outputs.digest }}"

      - name: Cosign verify (publish gate — before tag promotion)
        if: ${{ steps.oci_push.outputs.digest != '' }}
        run: |
          cosign verify "${{ env.DASHBOARD_IMAGE_NAME }}@${{ steps.oci_push.outputs.digest }}" \
            --certificate-identity-regexp "${COSIGN_VERIFY_CERT_IDENTITY_REGEXP}" \
            --certificate-oidc-issuer-regexp "${COSIGN_VERIFY_CERT_OIDC_ISSUER_REGEXP}"

      - name: Promote rolling tags (latest / nightly / nightly-YYYYMMDD)
        if: ${{ steps.oci_push.outputs.digest != '' }}
        run: |
          set -euo pipefail
          SRC="${{ env.DASHBOARD_IMAGE_NAME }}@${{ steps.oci_push.outputs.digest }}"
          TAGS=(--tag "${{ env.DASHBOARD_IMAGE_NAME }}:latest" --tag "${{ env.DASHBOARD_IMAGE_NAME }}:nightly")
          if [ "${{ github.event_name }}" = "schedule" ]; then
            TAGS+=(--tag "${{ env.DASHBOARD_IMAGE_NAME }}:nightly-$(date -u +%Y%m%d)")
          fi
          docker buildx imagetools create "${TAGS[@]}" "$SRC"

      # Private GHCR manifests break Kyverno verifyImages — GitHub exposes no REST PATCH for container visibility (see workflow header).

      - name: Verify anonymous GHCR read (Kyverno + end-user pulls)
        if: ${{ steps.oci_push.outputs.digest != '' }}
        continue-on-error: true
        run: bash "${GITHUB_WORKSPACE}/scripts/ci/verify-ghcr-image-anonymous-pull.sh" "${{ env.DASHBOARD_IMAGE_NAME }}:latest"

  build-push-panguard-bridge:
    name: Build and push Panguard MCP bridge
    needs: [repo-supply-chain]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd

      - uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9
        with:
          images: ${{ env.PANGUARD_BRIDGE_IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Install skopeo
        run: sudo apt-get update && sudo apt-get install -y skopeo

      - name: Build OCI layout (single artifact — scanned and pushed)
        run: |
          set -euo pipefail
          DEST="${RUNNER_TEMP}/clawql-panguard-bridge-oci"
          rm -rf "${DEST}"
          mkdir -p "${DEST}"
          docker buildx build \
            --file docker/panguard-mcp-bridge/Dockerfile \
            --platform linux/amd64,linux/arm64 \
            --output "type=oci,tar=false,dest=${DEST}" \
            --cache-from type=gha,scope=docker-publish-panguard-bridge \
            --cache-to type=gha,mode=max,scope=docker-publish-panguard-bridge \
            --provenance=mode=max \
            --sbom=true \
            .

      - name: Trivy scan OCI layout (HIGH / CRITICAL — before registry push)
        run: |
          set -euo pipefail
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/repo:ro" \
            -v "${RUNNER_TEMP}/clawql-panguard-bridge-oci:/work/oci:ro" \
            "${{ env.TRIVY_SCAN_IMAGE }}" \
            image \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            --ignorefile /repo/.trivyignore \
            --input /work/oci

      - name: Push OCI layout to GHCR (skopeo — same bytes Trivy scanned)
        id: oci_push
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          AUTH=(--authfile "${DOCKER_CONFIG:-$HOME/.docker}/config.json")
          SRC="oci:${RUNNER_TEMP}/clawql-panguard-bridge-oci"
          if [ -z "${IMAGE_TAGS//[$'\t\r\n ']}" ]; then
            echo "No image tags from metadata-action" >&2
            exit 1
          fi
          while IFS= read -r dest; do
            [ -z "${dest// }" ] && continue
            skopeo copy "${AUTH[@]}" --all "${SRC}" "docker://${dest}"
          done <<< "${IMAGE_TAGS}"
          FIRST="$(printf '%s\n' "${IMAGE_TAGS}" | sed '/^[[:space:]]*$/d' | head -n1)"
          DIGEST="$(skopeo inspect "${AUTH[@]}" "docker://${FIRST}" --format '{{.Digest}}')"
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v2.4.3

      - name: Cosign sign (keyless, recursive — Kyverno-compatible legacy bundles)
        if: ${{ steps.oci_push.outputs.digest != '' }}
        run: cosign sign --yes --recursive "${{ env.PANGUARD_BRIDGE_IMAGE_NAME }}@${{ steps.oci_push.outputs.digest }}"

      - name: Cosign verify (publish gate — before tag promotion)
        if: ${{ steps.oci_push.outputs.digest != '' }}
        run: |
          cosign verify "${{ env.PANGUARD_BRIDGE_IMAGE_NAME }}@${{ steps.oci_push.outputs.digest }}" \
            --certificate-identity-regexp "${COSIGN_VERIFY_CERT_IDENTITY_REGEXP}" \
            --certificate-oidc-issuer-regexp "${COSIGN_VERIFY_CERT_OIDC_ISSUER_REGEXP}"

      - name: Promote rolling tags (latest / nightly / nightly-YYYYMMDD)
        if: ${{ steps.oci_push.outputs.digest != '' }}
        run: |
          set -euo pipefail
          SRC="${{ env.PANGUARD_BRIDGE_IMAGE_NAME }}@${{ steps.oci_push.outputs.digest }}"
          TAGS=(--tag "${{ env.PANGUARD_BRIDGE_IMAGE_NAME }}:latest" --tag "${{ env.PANGUARD_BRIDGE_IMAGE_NAME }}:nightly")
          if [ "${{ github.event_name }}" = "schedule" ]; then
            TAGS+=(--tag "${{ env.PANGUARD_BRIDGE_IMAGE_NAME }}:nightly-$(date -u +%Y%m%d)")
          fi
          docker buildx imagetools create "${TAGS[@]}" "$SRC"

      # Private GHCR manifests break Kyverno verifyImages — GitHub exposes no REST PATCH for container visibility (see workflow header).

      - name: Verify anonymous GHCR read (Kyverno + end-user pulls)
        if: ${{ steps.oci_push.outputs.digest != '' }}
        continue-on-error: true
        run: bash "${GITHUB_WORKSPACE}/scripts/ci/verify-ghcr-image-anonymous-pull.sh" "${{ env.PANGUARD_BRIDGE_IMAGE_NAME }}:latest"

  build-push-website:
    name: Build and push website
    needs: [repo-supply-chain]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # actions/checkout@v6.0.2
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      # docker/setup-buildx-action@v4.0.0
      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd

      # docker/login-action@v4.1.0
      - uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read package metadata
        id: pkg
        run: |
          echo "version=$(node -e 'console.log(require(\"./website/package.json\").version)')" >> "$GITHUB_OUTPUT"
          echo "description=$(node -e 'console.log(require(\"./website/package.json\").description)')" >> "$GITHUB_OUTPUT"

      # docker/metadata-action@v6.0.0 — immutable **`sha-*`** only until promotion (same as MCP image).
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9
        with:
          images: ${{ env.WEBSITE_IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Install skopeo
        run: sudo apt-get update && sudo apt-get install -y skopeo

      - name: Build OCI layout (single artifact — scanned and pushed)
        run: |
          set -euo pipefail
          DEST="${RUNNER_TEMP}/clawql-website-oci"
          rm -rf "${DEST}"
          mkdir -p "${DEST}"
          docker buildx build \
            --file website/Dockerfile \
            --platform linux/amd64,linux/arm64 \
            --output "type=oci,tar=false,dest=${DEST}" \
            --cache-from type=gha,scope=docker-publish-website \
            --cache-to type=gha,mode=max,scope=docker-publish-website \
            --provenance=mode=max \
            --sbom=true \
            --build-arg "CLAWQL_PACKAGE_VERSION=${{ steps.pkg.outputs.version }}" \
            --build-arg "CLAWQL_PACKAGE_DESCRIPTION=${{ steps.pkg.outputs.description }}" \
            ./website

      - name: Trivy scan OCI layout (HIGH / CRITICAL — before registry push)
        run: |
          set -euo pipefail
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/repo:ro" \
            -v "${RUNNER_TEMP}/clawql-website-oci:/work/oci:ro" \
            "${{ env.TRIVY_SCAN_IMAGE }}" \
            image \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            --ignorefile /repo/.trivyignore \
            --input /work/oci

      - name: Push OCI layout to GHCR (skopeo — same bytes Trivy scanned)
        id: oci_push
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          AUTH=(--authfile "${DOCKER_CONFIG:-$HOME/.docker}/config.json")
          SRC="oci:${RUNNER_TEMP}/clawql-website-oci"
          if [ -z "${IMAGE_TAGS//[$'\t\r\n ']}" ]; then
            echo "No image tags from metadata-action" >&2
            exit 1
          fi
          while IFS= read -r dest; do
            [ -z "${dest// }" ] && continue
            skopeo copy "${AUTH[@]}" --all "${SRC}" "docker://${dest}"
          done <<< "${IMAGE_TAGS}"
          FIRST="$(printf '%s\n' "${IMAGE_TAGS}" | sed '/^[[:space:]]*$/d' | head -n1)"
          DIGEST="$(skopeo inspect "${AUTH[@]}" "docker://${FIRST}" --format '{{.Digest}}')"
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

      # Pin Cosign v2 — see workflow header (Kyverno verifyImages + legacy bundle format).
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v2.4.3

      - name: Cosign sign (keyless, recursive — Kyverno-compatible legacy bundles)
        if: ${{ steps.oci_push.outputs.digest != '' }}
        run: cosign sign --yes --recursive "${{ env.WEBSITE_IMAGE_NAME }}@${{ steps.oci_push.outputs.digest }}"

      - name: Cosign verify (publish gate — before tag promotion)
        if: ${{ steps.oci_push.outputs.digest != '' }}
        run: |
          cosign verify "${{ env.WEBSITE_IMAGE_NAME }}@${{ steps.oci_push.outputs.digest }}" \
            --certificate-identity-regexp "${COSIGN_VERIFY_CERT_IDENTITY_REGEXP}" \
            --certificate-oidc-issuer-regexp "${COSIGN_VERIFY_CERT_OIDC_ISSUER_REGEXP}"

      - name: Promote rolling tags (latest / nightly / nightly-YYYYMMDD)
        if: ${{ steps.oci_push.outputs.digest != '' }}
        run: |
          set -euo pipefail
          SRC="${{ env.WEBSITE_IMAGE_NAME }}@${{ steps.oci_push.outputs.digest }}"
          TAGS=(--tag "${{ env.WEBSITE_IMAGE_NAME }}:latest" --tag "${{ env.WEBSITE_IMAGE_NAME }}:nightly")
          if [ "${{ github.event_name }}" = "schedule" ]; then
            TAGS+=(--tag "${{ env.WEBSITE_IMAGE_NAME }}:nightly-$(date -u +%Y%m%d)")
          fi
          docker buildx imagetools create "${TAGS[@]}" "$SRC"

      # Private GHCR manifests break Kyverno verifyImages — GitHub exposes no REST PATCH for container visibility (see workflow header).

      - name: Verify anonymous GHCR read (Kyverno + end-user pulls)
        if: ${{ steps.oci_push.outputs.digest != '' }}
        continue-on-error: true
        run: bash "${GITHUB_WORKSPACE}/scripts/ci/verify-ghcr-image-anonymous-pull.sh" "${{ env.WEBSITE_IMAGE_NAME }}:latest"
