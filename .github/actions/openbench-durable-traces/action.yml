# Build + validate OpenBenchTrace v1 dataset and sync to durable R2.
#
# Inputs expect an artifact dir that already contains results.json and
# optionally call-store/calls.jsonl (from CLAWQL_INFERENCE_STORE_PATH).
name: openbench-durable-traces
description: Validate, scrub, and upload OpenBench traces to R2 (corpus of record)
inputs:
  artifact_dir:
    description: Path to openbench artifact directory for this cell
    required: true
  run_id:
    description: GitHub Actions run id
    required: true
  task:
    description: Task id
    required: true
  model:
    description: Model id
    required: true
  clawql_version:
    description: Git SHA
    required: true
  require_durable:
    description: Fail if R2 secrets missing (default true)
    required: false
    default: "1"
runs:
  using: composite
  steps:
    - name: Install jsonschema
      shell: bash
      run: pip install --user jsonschema -q

    - name: Build + validate + scrub dataset
      shell: bash
      env:
        CLAWQL_ENABLE_PRESIDIO: ${{ env.CLAWQL_ENABLE_PRESIDIO }}
      run: |
        set -euo pipefail
        python3 openbench/scripts/package-openbench-traces.py \
          --artifact-dir "${{ inputs.artifact_dir }}" \
          --run-id "${{ inputs.run_id }}" \
          --task "${{ inputs.task }}" \
          --model "${{ inputs.model }}" || true
        python3 openbench/scripts/build-openbench-dataset.py \
          --artifact-dir "${{ inputs.artifact_dir }}" \
          --run-id "${{ inputs.run_id }}" \
          --task "${{ inputs.task }}" \
          --model "${{ inputs.model }}" \
          --clawql-version "${{ inputs.clawql_version }}" \
          --require-nonempty

    - name: Sync durable pack to R2
      shell: bash
      env:
        CLAWQL_R2_TRACES_BUCKET: ${{ env.CLAWQL_R2_TRACES_BUCKET }}
        CLAWQL_OPENBENCH_R2_BUCKET: ${{ env.CLAWQL_OPENBENCH_R2_BUCKET }}
        CLAWQL_SYNC_BUCKET: ${{ env.CLAWQL_SYNC_BUCKET }}
        CLAWQL_OPENBENCH_REQUIRE_DURABLE_TRACES: ${{ inputs.require_durable }}
        CLOUDFLARE_ACCOUNT_ID: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
        CLAWQL_R2_ACCOUNT_ID: ${{ env.CLAWQL_R2_ACCOUNT_ID }}
        CLAWQL_SYNC_ACCESS_KEY_ID: ${{ env.CLAWQL_SYNC_ACCESS_KEY_ID }}
        CLAWQL_SYNC_SECRET_ACCESS_KEY: ${{ env.CLAWQL_SYNC_SECRET_ACCESS_KEY }}
        R2_ACCESS_KEY_ID: ${{ env.R2_ACCESS_KEY_ID }}
        R2_SECRET_ACCESS_KEY: ${{ env.R2_SECRET_ACCESS_KEY }}
      run: |
        set -euo pipefail
        chmod +x openbench/scripts/sync-openbench-traces-durable.sh
        openbench/scripts/sync-openbench-traces-durable.sh \
          --artifact-dir "${{ inputs.artifact_dir }}" \
          --run-id "${{ inputs.run_id }}" \
          --task "${{ inputs.task }}" \
          --sha "${{ inputs.clawql_version }}"
