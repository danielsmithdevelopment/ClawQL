# Persist Harvey LAB harness traces to Cloudflare R2 (corpus of record).
# GitHub artifacts remain a 30-day warm cache.
name: harvey-lab-durable-traces
description: Upload Harvey LAB cell traces to R2
inputs:
  results_dir:
    description: Path to integrations/harvey-labs/results (or one arm subtree)
    required: true
  arm:
    description: Arm id (nemotron, nemotron-clawql, _other, …)
    required: true
  task_id:
    description: Task id (009 or firm-knowledge/tasks/009)
    required: true
  run_id:
    description: GitHub Actions run id (or local shard)
    required: true
  source:
    description: gha or local
    required: false
    default: gha
  require_durable:
    description: Fail if R2 secrets missing (default true)
    required: false
    default: "1"
  call_store:
    description: Optional clawql-inference calls.jsonl path
    required: false
    default: ""
  other_name:
    description: If set, upload under _other/<name> (sweep summaries)
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Sync Harvey LAB traces to R2
      shell: bash
      env:
        CLAWQL_R2_TRACES_BUCKET: ${{ env.CLAWQL_R2_TRACES_BUCKET }}
        CLAWQL_OPENBENCH_R2_BUCKET: ${{ env.CLAWQL_OPENBENCH_R2_BUCKET }}
        CLOUDFLARE_API_TOKEN: ${{ env.CLOUDFLARE_API_TOKEN }}
        CLAWQL_CLOUDFLARE_API_TOKEN: ${{ env.CLAWQL_CLOUDFLARE_API_TOKEN }}
        CLOUDFLARE_ACCOUNT_ID: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
        CLAWQL_R2_ACCOUNT_ID: ${{ env.CLAWQL_R2_ACCOUNT_ID }}
        CLAWQL_CLOUDFLARE_ACCOUNT_ID: ${{ env.CLAWQL_CLOUDFLARE_ACCOUNT_ID }}
        PYTHONUNBUFFERED: "1"
      run: |
        set -euo pipefail
        EXTRA=()
        if [ "${{ inputs.require_durable }}" = "0" ] || [ "${{ inputs.require_durable }}" = "false" ]; then
          EXTRA+=(--allow-missing-r2)
        fi
        if [ -n "${{ inputs.call_store }}" ] && [ -f "${{ inputs.call_store }}" ]; then
          EXTRA+=(--call-store "${{ inputs.call_store }}")
        fi
        if [ -n "${{ inputs.other_name }}" ]; then
          EXTRA+=(--other-name "${{ inputs.other_name }}")
        fi
        if ! python3 scripts/dev/upload-harvey-lab-cell-to-r2.py \
          --results-dir "${{ inputs.results_dir }}" \
          --arm "${{ inputs.arm }}" \
          --task-id "${{ inputs.task_id }}" \
          --run-id "${{ inputs.run_id }}" \
          --source "${{ inputs.source }}" \
          "${EXTRA[@]}"; then
          {
            echo "### Harvey LAB durable R2 sync failed"
            echo ""
            echo "Warm GH artifact still uploaded (30-day cache). Corpus-of-record R2 did **not** land."
            echo "Set \`CLOUDFLARE_ACCOUNT_ID\` (or \`CLAWQL_R2_ACCOUNT_ID\`) alongside \`CLOUDFLARE_API_TOKEN\`."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::Harvey LAB durable R2 sync failed — traces not persisted to Cloudflare"
          exit 1
        fi
        echo "Durable R2 sync OK arm=${{ inputs.arm }} task=${{ inputs.task_id }} run=${{ inputs.run_id }}" >> "$GITHUB_STEP_SUMMARY"
