<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Approve merge — artifacts-attempts</title>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Syne:wght@700&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg: #101418;
        --fg: #e8eef4;
        --muted: #8b9aab;
        --accent: #3d9a6a;
        --danger: #c44c4c;
        --line: #243040;
      }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: "IBM Plex Mono", monospace;
        color: var(--fg);
        background:
          radial-gradient(800px 400px at 20% 0%, #1b2e24 0%, transparent 55%),
          linear-gradient(180deg, #0c1014, var(--bg));
      }
      main { max-width: 560px; margin: 0 auto; padding: 3rem 1.25rem; }
      h1 { font-family: Syne, sans-serif; font-size: 1.75rem; margin: 0 0 0.5rem; }
      p { color: var(--muted); line-height: 1.45; }
      pre {
        background: rgba(20, 28, 36, 0.8);
        border: 1px solid var(--line);
        padding: 0.85rem 1rem;
        overflow: auto;
        font-size: 0.78rem;
      }
      .row { display: flex; gap: 0.75rem; margin-top: 1.25rem; }
      button {
        font: inherit;
        border: 1px solid var(--line);
        background: transparent;
        color: var(--fg);
        padding: 0.55rem 1rem;
        cursor: pointer;
      }
      button.ok { border-color: var(--accent); color: var(--accent); }
      button.bad { border-color: var(--danger); color: var(--danger); }
      #status { margin-top: 1rem; font-size: 0.85rem; }
    </style>
  </head>
  <body>
    <main>
      <h1>Approve merge</h1>
      <p>Uncalibrated decisions land here. Review the pending winner, then approve or decline.</p>
      <pre id="summary">Loading…</pre>
      <div class="row">
        <button class="ok" id="approve" type="button">Approve</button>
        <button class="bad" id="decline" type="button">Decline</button>
        <a id="board" href="/" style="color: var(--muted); align-self: center; font-size: 0.85rem;">← board</a>
      </div>
      <p id="status"></p>
    </main>
    <script type="module">
      const params = new URLSearchParams(location.search);
      const taskId = params.get("task");
      const summary = document.getElementById("summary");
      const status = document.getElementById("status");
      const board = document.getElementById("board");
      if (!taskId) {
        summary.textContent = "Add ?task=tsk_…";
      } else {
        board.href = `/?task=${encodeURIComponent(taskId)}`;
        const res = await fetch(`/tasks/${encodeURIComponent(taskId)}`);
        if (!res.ok) {
          summary.textContent = `task ${taskId}: ${res.status}`;
        } else {
          const view = await res.json();
          summary.textContent = JSON.stringify(
            {
              task: view.task?.id,
              status: view.task?.status,
              pendingApproval: view.pendingApproval,
              autoMerge: view.autoMerge,
              trustReason: view.trustReason,
              decision: view.decision,
              canary: view.canary
                ? {
                    mode: view.canary.mode,
                    canaryPercent: view.canary.canaryPercent,
                    rollbackTrigger: view.canary.rollbackTrigger,
                  }
                : undefined,
              attempts: (view.attempts ?? []).map((a) => ({
                id: a.id,
                status: a.status,
              })),
            },
            null,
            2
          );
        }
        document.getElementById("approve").onclick = async () => {
          const r = await fetch(`/tasks/${encodeURIComponent(taskId)}/approve`, { method: "POST" });
          status.textContent = r.ok ? "Approved → merging" : `Approve failed: ${r.status}`;
        };
        document.getElementById("decline").onclick = async () => {
          const r = await fetch(`/tasks/${encodeURIComponent(taskId)}/decline`, { method: "POST" });
          status.textContent = r.ok ? "Declined" : `Decline failed: ${r.status}`;
        };
      }
    </script>
  </body>
</html>
