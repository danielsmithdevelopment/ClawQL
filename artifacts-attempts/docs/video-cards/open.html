<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>artifacts-attempts — open</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --ink: #0e1419;
        --foam: #e8f0f4;
        --signal: #1f8a70;
        --ember: #c45c26;
      }
      * { box-sizing: border-box; margin: 0; }
      html, body { height: 100%; }
      body {
        font-family: "IBM Plex Mono", monospace;
        color: var(--foam);
        background:
          radial-gradient(1200px 700px at 15% 10%, #1a3a42 0%, transparent 55%),
          radial-gradient(900px 600px at 90% 80%, #3a2218 0%, transparent 50%),
          linear-gradient(160deg, #0a1014 0%, #121c22 45%, #0e1419 100%);
        overflow: hidden;
        display: grid;
        place-items: center;
      }
      .stage {
        width: min(92vw, 1100px);
        padding: 4rem 2rem;
        animation: rise 1.1s cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      .brand {
        font-family: "Fraunces", serif;
        font-size: clamp(2.8rem, 8vw, 5.5rem);
        font-weight: 700;
        letter-spacing: -0.03em;
        line-height: 0.95;
        animation: brandIn 1.4s 0.15s cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      .brand span { color: var(--signal); }
      .thesis {
        margin-top: 1.75rem;
        max-width: 34ch;
        font-size: clamp(1.05rem, 2.4vw, 1.45rem);
        line-height: 1.45;
        color: #c5d5dc;
        animation: thesisIn 1.2s 0.55s ease both;
      }
      .rule {
        margin-top: 2.25rem;
        height: 3px;
        width: 0;
        background: linear-gradient(90deg, var(--signal), var(--ember));
        animation: rule 1s 1.1s ease forwards;
      }
      @keyframes rise {
        from { opacity: 0; transform: translateY(24px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes brandIn {
        from { opacity: 0; letter-spacing: 0.08em; filter: blur(6px); }
        to { opacity: 1; letter-spacing: -0.03em; filter: blur(0); }
      }
      @keyframes thesisIn {
        from { opacity: 0; transform: translateY(12px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes rule {
        to { width: min(42vw, 280px); }
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <h1 class="brand">artifacts<span>-attempts</span></h1>
      <p class="thesis">Parallel agents. Evidence picks the winner. The merge is permanent.</p>
      <div class="rule" aria-hidden="true"></div>
    </div>
  </body>
</html>
