target: all

multitenancy_enabled: false

server:
  http_listen_port: 9009

blocks_storage:
  backend: filesystem
  filesystem:
    dir: /data/blocks

compactor:
  data_dir: /data/compactor

distributor:
  ring:
    kvstore:
      store: memberlist

ingester:
  ring:
    kvstore:
      store: memberlist

memberlist:
  join_members:
    - mimir:7946

limits:
  ingestion_rate: 10000
  ingestion_burst_size: 200000
