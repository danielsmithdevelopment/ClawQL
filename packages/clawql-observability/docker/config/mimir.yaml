# Monolithic single-node Mimir for local LGTM+ compose and CI smoke tests.
# Do not use this configuration in production.
target: all

multitenancy_enabled: false

server:
  http_listen_port: 9009

blocks_storage:
  backend: filesystem
  filesystem:
    dir: /data/blocks

compactor:
  data_dir: /data/compactor
  sharding_ring:
    kvstore:
      store: memberlist

distributor:
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: memberlist

ingester:
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: memberlist
    replication_factor: 1
    zone_awareness_enabled: false

store_gateway:
  sharding_ring:
    replication_factor: 1
    zone_awareness_enabled: false
    kvstore:
      store: memberlist

memberlist:
  join_members:
    - mimir:7946

limits:
  ingestion_rate: 10000
  ingestion_burst_size: 200000
