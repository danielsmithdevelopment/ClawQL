# LGTM+ local stack: Loki, Grafana, Tempo, Mimir, Pyroscope + Grafana Alloy collector.
# Grafana UI: http://localhost:3000 (anonymous admin for local dev only)
# Alloy OTLP: grpc localhost:4317 · http localhost:4318
# Alloy Faro (private): http localhost:8027/collect — fronted by Worker in production
#
#   npm run compose:up -w clawql-observability
#   npm run compose:down -w clawql-observability
services:
  alloy:
    image: grafana/alloy:v1.8.2
    command: run --server.http.listen-addr=0.0.0.0:12345 --storage.path=/var/lib/alloy/data /etc/alloy/config.alloy
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8027:8027"
      - "12345:12345"
    volumes:
      - ../alloy/config.river:/etc/alloy/config.alloy:ro
    depends_on:
      - loki
      - tempo
      - mimir
    restart: unless-stopped

  loki:
    image: grafana/loki:3.4.2
    command: -config.file=/etc/loki/config.yaml
    ports:
      - "3100:3100"
    volumes:
      - ./config/loki.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki
    restart: unless-stopped

  tempo:
    image: grafana/tempo:2.7.1
    command: -config.file=/etc/tempo/config.yaml
    ports:
      - "3200:3200"
      - "4319:4318"
    volumes:
      - ./config/tempo.yaml:/etc/tempo/config.yaml:ro
      - tempo-data:/var/tempo
    restart: unless-stopped

  mimir:
    image: grafana/mimir:2.15.0
    command: -config.file=/etc/mimir/config.yaml
    ports:
      - "9009:9009"
    volumes:
      - ./config/mimir.yaml:/etc/mimir/config.yaml:ro
      - mimir-data:/data
    restart: unless-stopped

  pyroscope:
    image: grafana/pyroscope:1.10.0
    ports:
      - "4040:4040"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.6.0
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_FEATURE_TOGGLES_ENABLE: tempoSearch tempoBackendSearch traceqlEditor
    volumes:
      - ../dashboards/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - loki
      - tempo
      - mimir
      - pyroscope
    restart: unless-stopped

volumes:
  loki-data:
  tempo-data:
  mimir-data:
  grafana-data:
