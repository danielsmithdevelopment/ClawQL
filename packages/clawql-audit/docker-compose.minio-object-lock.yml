# MinIO with Object Lock for clawql-audit WORM tests.
# Usage:
#   docker compose -f packages/clawql-audit/docker-compose.minio-object-lock.yml up -d
#   export CLAWQL_WORM_MINIO_ENDPOINT=http://127.0.0.1:9000
#   npm test -w clawql-audit -- src/storage/s3-object-lock
services:
  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    # Image is minimal (no curl). Wait from the host:
    #   until curl -sf http://127.0.0.1:9000/minio/health/live; do sleep 1; done
