# AgentDojo FunctionsRuntime tool contracts for OpenAPPA (benchmark arm).
# Canonical ids: mcp/agentdojo/<fn>. Wire (opencode): mcp__agentdojo__<fn>.
#
# Ownership: OpenAPPA = may this caller invoke this tool at all.
# Session IFC (clawql_tools_executor) = given untrusted reads, may data reach this sink.
# Most restrictive wins in the AgentDojo stacked defense.
#
# Reads use empty delta (session IFC owns taint in this harness — OpenAPPA trust
# remedies need a human/host accept loop we do not simulate). Privileged /
# destructive sinks require human attention (AgentDojo → park). Conditional
# sinks stay allow_call so IFC can apply destination policy.

[policy]
version = 2

# --- Untrusted / attacker-influenced reads (taint sources) ---

[[policy.tool]]
name = "mcp/agentdojo/get_unread_emails"
delta = {}

