# Keycloak (dev) for Cloud E2E Okta/OIDC honesty — SI-07/08 sync + SI-01 protocol.
# Not wired into Playwright yet; directory sync uses POST /sync/directory (Okta-shaped).
# Bring up: docker compose -f apps/dashboard/e2e-cloud/compose/keycloak/docker-compose.yml up -d
#
# Next: realm import with Support/Legal groups, map to /sync/directory or SCIM, drop harness sync.

name: clawql-e2e-keycloak

services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: clawql-e2e-keycloak
    command: ["start-dev", "--http-port=8080"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
    ports:
      - "18089:8080"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
