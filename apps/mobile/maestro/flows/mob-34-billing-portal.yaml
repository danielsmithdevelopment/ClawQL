# MOB-34 — Plan read-only honesty (store builds sell nothing in-app)
appId: com.clawql.app
---
- launchApp
- tapOn:
    id: "sign-in-fixture"
- openLink: clawql://spend
- assertVisible:
    id: "spend-screen"
- assertVisible:
    id: "spend-plan-readonly"
- assertVisible:
    id: "spend-plan-readonly-note"
- tapOn:
    id: "tab-profile"
- assertVisible:
    id: "profile-screen"
- scrollUntilVisible:
    element:
      id: "profile-plan-billing"
- assertVisible:
    id: "profile-plan-honesty"
