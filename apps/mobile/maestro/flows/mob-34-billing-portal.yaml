# MOB-34 — Billing portal CTA honesty (fixture) — Spend + Profile
appId: com.clawql.app
---
- launchApp
- tapOn:
    id: "sign-in-fixture"
- openLink: clawql://spend
- assertVisible:
    id: "spend-screen"
- assertVisible:
    id: "spend-billing-portal"
- tapOn:
    id: "spend-open-billing-portal"
- assertVisible:
    id: "spend-billing-portal-note"
- tapOn:
    id: "tab-profile"
- assertVisible:
    id: "profile-screen"
- scrollUntilVisible:
    element:
      id: "profile-plan-billing"
- tapOn:
    id: "profile-open-billing-portal"
- assertVisible:
    id: "profile-billing-portal-note"
