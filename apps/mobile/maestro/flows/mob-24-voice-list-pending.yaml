# MOB-24 — Voice assistant list pending (fixture typed dictate)
appId: com.clawql.app
---
- launchApp
- tapOn:
    id: "sign-in-fixture"
- tapOn:
    id: "tab-profile"
- tapOn:
    id: "profile-open-voice"
- assertVisible:
