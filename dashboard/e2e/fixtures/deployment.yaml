apiVersion: apps/v1
kind: Deployment
metadata:
  name: clawql-dashboard-e2e-target
  namespace: clawql-dashboard-e2e
  labels:
    app.kubernetes.io/name: clawql-dashboard-e2e
spec:
  replicas: 1
  selector:
    matchLabels:
      app: clawql-dashboard-e2e-target
  template:
    metadata:
      labels:
        app: clawql-dashboard-e2e-target
    spec:
      containers:
        - name: pause
          image: registry.k8s.io/pause:3.9
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
