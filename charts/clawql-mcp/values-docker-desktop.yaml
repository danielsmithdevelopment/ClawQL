# Used by scripts/kubernetes/local-k8s-docker-desktop.sh — Docker Desktop + Rancher / k3s.
# Default Istio is ambient: north-south is **deployment/clawql-mcp-ingress** (LoadBalancer→localhost on docker/rancher kube contexts; hostNetwork on other locals) + Gateway/Vs
# (**http://localhost/mcp**, **http://clawql.localhost/**, …). When Istio gateway is enabled, install-istio + local-k8s
# skip ingress-nginx and disable chart Ingress manifests (see docker/README.md).
# Ingress-only (`CLAWQL_LOCAL_K8S_ISTIO=0`): nginx serves **http://clawql-mcp.localhost/mcp** matching prod patterns.
# vault.hostPath.path is set by the script (--set-string).

fullnameOverride: clawql-mcp-http

# Single-node: never run two MCP pods during upgrade (avoids Insufficient memory while RollingUpdate overlaps).
# If upgrading from a cluster that already had this Deployment with RollingUpdate, delete the Deployment once
# so Helm does not three-way-merge stale rollingUpdate with type Recreate (invalid).
deploymentStrategy:
  type: Recreate

provider: all-providers

image:
  repository: ghcr.io/danielsmithdevelopment/clawql-mcp
  tag: latest
  pullPolicy: Always

service:
  type: LoadBalancer
  http:
    port: 8080
    targetPort: 8080
  grpc:
    port: 50051
    targetPort: 50051

# Ingress-nginx → clawql-mcp-http (same hostname + /mcp pattern as prod behind Ingress / Gateway).
ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
  hosts:
    - host: clawql-mcp.localhost
      paths:
        - path: /
          pathType: Prefix

# Heap vs cgroup request: all-providers loads 60+ discovery specs; 512Mi heap reliably OOMs during startup.
# If the pod stays Pending, raise Rancher VM RAM or scale flink taskmanager to 0 temporarily.
nodeOptions: "--max-old-space-size=768"

# Istio ambient (namespace istio.io/dataplane-mode=ambient): keep legacy Envoy sidecars off the MCP pod so
# ztunnel owns mesh traffic and kubelet probes hit the app container directly.
podAnnotations:
  sidecar.istio.io/inject: "false"

# Enable all MCP/local feature flags for Docker Desktop local-k8s-up.
enableGrpc: true
enableGrpcReflection: true
enableSandbox: true
enableNotify: true
enableOnyx: true
enableOuroboros: true

# Local defaults; override via env/secret for real integrations.
# Full Onyx is heavy: give Docker Desktop Kubernetes enough RAM (e.g. 12–16 GiB in
# Settings → Resources) or lower onyx.*.resources.requests below further.
#
# Right-sizing: requests track minimum stable scheduling (Flink JVM vs cgroup, Node heap vs
# pod memory). Limits stay higher for burst. CPU requests stay modest; raise if you see
# throttling (kubectl describe pod → CPUThrottling).
onyx:
  enabled: true
  fullVectorStack: true
  # Same as root podAnnotations: some clusters still run the sidecar injector for third-party images unless opted out.
  podAnnotations:
    sidecar.istio.io/inject: "false"
  authType: basic
  userAuthSecret: "clawql-local-onyx-auth-secret"
  # Onyx setup_onyx() retries document index (Vespa/OpenSearch); default 10 is tight on cold single-node clusters.
  api:
    extraEnv:
      - name: NUM_RETRIES_ON_STARTUP
        value: "120"
  postgres:
    auth:
      password: "change-me"
    persistence:
      enabled: true
    resources:
      requests:
        cpu: 25m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 1Gi
  opensearch:
    javaOpts: "-Xms256m -Xmx256m"
    persistence:
      enabled: true
    resources:
      requests:
        cpu: 50m
        memory: 384Mi
      limits:
        cpu: "2"
        memory: 1536Mi
  vespa:
    # Docker Desktop reports lower available memory to container guardrails; allow Vespa startup.
    ignoreNotEnoughMemory: true
    persistence:
      enabled: true
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 1536Mi
  minio:
    persistence:
      enabled: true
    resources:
      requests:
        cpu: 25m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 1Gi
  dragonfly:
    resources:
      requests:
        cpu: 15m
        memory: 128Mi
      limits:
        cpu: "1"
        memory: 512Mi
  modelServer:
    resources:
      requests:
        cpu: 50m
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 2Gi
  # background.requests.cpu: omit here — chart default 250m; workload often uses more (burst via limits).
  resources:
    requests:
      cpu: 15m
      memory: 384Mi
    limits:
      cpu: "1"
      memory: 1Gi

ouroborosPostgres:
  enabled: true
  auth:
    password: "change-me"
  resources:
    requests:
      cpu: 25m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

nats:
  enabled: true
  resources:
    requests:
      cpu: 25m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

flink:
  enabled: true
  # Flink 1.19+ enforces minimum JVM/network fractions; 768m TM process violates them (IllegalConfigurationException).
  # Config only via FLINK_PROPERTIES (no read-only flink-conf.yaml mount — entrypoint must rewrite conf).
  jobManagerMemoryProcessSize: "1024m"
  # Keep below TM cgroup request after trimming for single-node scheduling headroom.
  taskManagerMemoryProcessSize: "1536m"
  jobManager:
    resources:
      requests:
        cpu: 100m
        memory: 1280Mi
      limits:
        cpu: "1"
        memory: 2Gi
  taskManager:
    # Single TM cuts scheduler RAM on 4c/16Gi local nodes; slots still allow modest parallelism.
    replicas: 1
    taskSlots: 2
    resources:
      requests:
        cpu: 100m
        # Free ~800Mi allocatable on tight single-node (Rancher) so MCP+Istio can schedule.
        memory: 1792Mi
      limits:
        cpu: "2"
        memory: 3Gi

resources:
  # With Istio sidecar, total pod request must fit ~free allocatable on a 16GiB single-node (full stack).
  # Heap 768Mi needs matching cgroup headroom (512Mi heap OOMs loading all-providers discovery specs).
  requests:
    cpu: 50m
    memory: 768Mi
  limits:
    cpu: "1"
    memory: 1792Mi

# Distroless image runs as nonroot GID 65532 (USER nonroot). HostPath hides the image's /vault chown;
# fsGroup lets kubelet adjust mount permissions so /vault (~/.ClawQL on the Mac) is writable.
podSecurityContext:
  fsGroup: 65532

# Obsidian memory Markdown on disk (`memory_ingest` / `memory_recall`). Chart key `vault` is not HC Vault — #161.
# `local-k8s-docker-desktop.sh` enables hostPath and sets path (default $HOME/.ClawQL). Disabled here so
# `helm template` / lint can run without --set; install uses emptyDir until the script applies overrides.
vault:
  hostPath:
    enabled: false
    path: ""
    type: DirectoryOrCreate

ui:
  enabled: true
  image:
    repository: ghcr.io/danielsmithdevelopment/clawql-website
    tag: latest
    pullPolicy: Always
  resources:
    requests:
      cpu: 25m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  ingress:
    enabled: true
    className: nginx
    hosts:
      - host: docs.localhost
        paths:
          - path: /
            pathType: Prefix

dashboard:
  enabled: true
  image:
    repository: ghcr.io/danielsmithdevelopment/clawql-dashboard
    tag: latest
    pullPolicy: Always
  allowSync: true
  k8s:
    namespace: clawql
    secretName: clawql-provider-env
    deploymentName: clawql-mcp-http
  vault:
    namespace: clawql
    pod: clawql-vault-0
    addr: http://127.0.0.1:8200
    mount: secret
    path: provider/env
  resources:
    requests:
      cpu: 25m
      memory: 192Mi
    limits:
      cpu: 500m
      memory: 768Mi
  ingress:
    enabled: true
    className: nginx
    hosts:
      - host: clawql.localhost
        paths:
          - path: /
            pathType: Prefix

providerIngress:
  enabled: true
  className: nginx
  paperless:
    host: paperless.localhost
  stirling:
    host: stirling.localhost
  tika:
    host: tika.localhost
  gotenberg:
    host: gotenberg.localhost
  flink:
    host: flink.localhost
  natsMonitor:
    host: nats.localhost
  onyx:
    host: onyx.localhost

# MCP provider tokens — Kubernetes Secret synced from Vault (External Secrets Operator). Bootstrap:
# docs/deployment/external-secrets-operator-install.md (ClusterSecretStore + ExternalSecret **`clawql-provider-env`**).
envFromSecret: clawql-provider-env

# Same production posture as **values.yaml**: Vault-backed **`envFromSecret`** is mandatory (`requireVaultBackedSecrets`).
secretSourcing:
  requireVaultBackedSecrets: true

# Bundled HashiCorp Vault (same dependency as CI/prod — not optional). Desktop uses **standalone + file storage +
# PVC** so KV survives pod restarts (dev mode is in-memory). First **`make bootstrap-vault-eso`** initializes Vault,
# unseals with a single key, and stores **root-token** + **unseal-key** in **Secret/clawql-vault-local-bootstrap**
# (local dev only — rotate/delete for anything beyond single-user Docker Desktop).
hashicorpvault:
  injector:
    enabled: false
  server:
    dev:
      enabled: false
    standalone:
      enabled: true
    dataStorage:
      enabled: true
      size: 10Gi
    resources:
      requests:
        cpu: 50m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 768Mi

# sandbox_exec via host Docker daemon (docker run …). InitContainer installs static docker CLI into distroless MCP image.
sandboxDocker:
  enabled: true
  runAsRootForDockerSocket: true

documentPipeline:
  tika:
    resources:
      requests:
        cpu: 15m
        memory: 128Mi
      limits:
        cpu: 300m
        memory: 512Mi
  gotenberg:
    resources:
      requests:
        cpu: 15m
        memory: 192Mi
      limits:
        cpu: 500m
        memory: 768Mi
  stirling:
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 2Gi
    security:
      enableLogin: true
      disableAdditionalFeatures: false
  paperless:
    resources:
      requests:
        cpu: 50m
        memory: 384Mi
      limits:
        cpu: "1"
        memory: 1Gi
    auth:
      adminUser: admin
      adminPassword: admin
      adminMail: admin@localhost

stores:
  postgres:
    resources:
      requests:
        cpu: 25m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 768Mi
  dragonfly:
    resources:
      requests:
        cpu: 15m
        memory: 128Mi
      limits:
        cpu: 300m
        memory: 384Mi

# Cursor and some ingress setups mishandle per-request SSE; JSON POST responses are spec-supported by the MCP SDK client.
extraEnv:
  - name: CLAWQL_STREAMABLE_HTTP_JSON_RESPONSE
    value: "1"

# local-k8s-up: Kyverno verifies Cosign (keyless) for ClawQL GHCR images (mcp, bridge, website, dashboard) in this namespace.
# Images must be signed in docker-publish.yml and the GHCR packages must allow anonymous manifest reads (public packages).
kyverno:
  imageSignaturePolicy:
    enabled: true
    matchReleaseNamespaceOnly: true

# Optional: MCP OTLP traces → ClawQL collector → Tempo (Docker Desktop + CLAWQL_LOCAL_K8S_ISTIO + heavy observability addons).
# extraEnv:
#   - name: CLAWQL_ENABLE_OTEL_TRACING
#     value: "1"
#   - name: OTEL_EXPORTER_OTLP_ENDPOINT
#     value: "http://clawql-otel-collector.istio-system.svc:4318/v1/traces"
