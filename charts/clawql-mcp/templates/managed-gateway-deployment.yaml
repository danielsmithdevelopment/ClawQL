{{- if .Values.managedGateway.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "clawql-mcp.managedGatewayName" . }}
  labels:
    {{- include "clawql-mcp.labels" . | nindent 4 }}
    app.kubernetes.io/component: managed-gateway
spec:
  replicas: {{ .Values.managedGateway.replicaCount }}
  selector:
    matchLabels:
      {{- include "clawql-mcp.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: managed-gateway
  template:
    metadata:
      {{- with .Values.managedGateway.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "clawql-mcp.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: managed-gateway
        service.istio.io/canonical-name: {{ include "clawql-mcp.managedGatewayName" . | quote }}
        {{- with .Values.managedGateway.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.managedGateway.podSecurityContext | nindent 8 }}
      containers:
        - name: managed-gateway
          image: "{{ .Values.managedGateway.image.repository }}:{{ .Values.managedGateway.image.tag }}"
          imagePullPolicy: {{ .Values.managedGateway.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.managedGateway.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.managedGateway.service.http.targetPort }}
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: nginx-cache
              mountPath: /var/cache/nginx
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: {{ .Values.managedGateway.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.managedGateway.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.managedGateway.probes.readiness.timeoutSeconds }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: {{ .Values.managedGateway.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.managedGateway.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.managedGateway.probes.liveness.timeoutSeconds }}
          resources:
            {{- toYaml .Values.managedGateway.resources | nindent 12 }}
      volumes:
        - name: nginx-config
          configMap:
            name: {{ include "clawql-mcp.managedGatewayName" . }}-config
        - name: tmp
          emptyDir: {}
        - name: nginx-cache
          emptyDir: {}
{{- end }}
