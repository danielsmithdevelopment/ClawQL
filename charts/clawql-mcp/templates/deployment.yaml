apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "clawql-mcp.fullname" . }}
  labels:
    {{- include "clawql-mcp.labels" . | nindent 4 }}
    app: {{ include "clawql-mcp.fullname" . }}
spec:
  replicas: {{ .Values.replicaCount }}
  {{- with .Values.deploymentStrategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "clawql-mcp.selectorLabels" . | nindent 6 }}
      app: {{ include "clawql-mcp.fullname" . }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "clawql-mcp.selectorLabels" . | nindent 8 }}
        app: {{ include "clawql-mcp.fullname" . }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "clawql-mcp.serviceAccountName" . }}
      {{- if .Values.security.kata.enabled }}
      runtimeClassName: {{ .Values.security.kata.runtimeClassName | quote }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if and .Values.enableSandbox .Values.sandboxDocker.enabled }}
      initContainers:
        - name: clawql-docker-static-cli
          image: {{ .Values.sandboxDocker.initImage | quote }}
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 256Mi
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              ARCH=$(uname -m)
              case "$ARCH" in
                aarch64|arm64) DARCH=aarch64 ;;
                x86_64|amd64) DARCH=x86_64 ;;
                *) echo "clawql sandbox init: unsupported arch: $ARCH" >&2; exit 1 ;;
              esac
              VER="{{ .Values.sandboxDocker.staticCliVersion }}"
              URL="https://download.docker.com/linux/static/stable/${DARCH}/docker-${VER}.tgz"
              echo "clawql sandbox init: fetching ${URL}"
              # Use /export (emptyDir) only — readOnlyRootFilesystem leaves /tmp unusable on some runtimes.
              mkdir -p /export/stage
              curl -fsSL "$URL" | tar xz -C /export/stage docker/docker
              mv /export/stage/docker/docker /export/docker
              rm -rf /export/stage
              chmod 0555 /export/docker
              # Do not run `docker version` here — init has no docker.sock; it would fail under set -e.
              /export/docker --version
          volumeMounts:
            - name: clawql-docker-cli-static
              mountPath: /export
      {{- end }}
      containers:
        - name: {{ include "clawql-mcp.fullname" . }}
          securityContext:
            {{- if and .Values.enableSandbox .Values.sandboxDocker.enabled .Values.sandboxDocker.runAsRootForDockerSocket }}
            runAsUser: 0
            runAsNonRoot: false
            {{- else }}
            {{- toYaml .Values.securityContext | nindent 12 }}
            {{- end }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.http.targetPort | int }}
              protocol: TCP
            - name: grpc
              containerPort: {{ .Values.service.grpc.targetPort | int }}
              protocol: TCP
          env:
            - name: CLAWQL_PROVIDER
              value: {{ .Values.provider | quote }}
            - name: CLAWQL_OBSIDIAN_VAULT_PATH
              value: {{ .Values.obsidianVaultPath | quote }}
            - name: PORT
              value: {{ .Values.port | quote }}
            - name: MCP_PATH
              value: {{ .Values.mcpPath | quote }}
            - name: CLAWQL_BUNDLED_OFFLINE
              value: {{ .Values.bundledOffline | quote }}
            - name: NODE_OPTIONS
              value: {{ .Values.nodeOptions | quote }}
            {{- if .Values.enableGrpc }}
            - name: ENABLE_GRPC
              value: "1"
            {{- end }}
            {{- if .Values.enableGrpcReflection }}
            - name: ENABLE_GRPC_REFLECTION
              value: "1"
            {{- end }}
            {{- if not .Values.enableMemory }}
            - name: CLAWQL_ENABLE_MEMORY
              value: "0"
            {{- end }}
            {{- if not .Values.enableDocuments }}
            - name: CLAWQL_ENABLE_DOCUMENTS
              value: "0"
            {{- end }}
            {{- if .Values.enableSandbox }}
            - name: CLAWQL_ENABLE_SANDBOX
              value: "1"
            {{- end }}
            {{- if and .Values.enableSandbox .Values.sandboxDocker.enabled }}
            - name: CLAWQL_SANDBOX_BACKEND
              value: "docker"
            - name: CLAWQL_SANDBOX_DOCKER_BIN
              value: "/opt/clawql-docker/docker"
            {{- end }}
            {{- if .Values.enableNotify }}
            - name: CLAWQL_ENABLE_NOTIFY
              value: "1"
            {{- end }}
            {{- if .Values.enableHitlLabelStudio }}
            - name: CLAWQL_ENABLE_HITL_LABEL_STUDIO
              value: "1"
            {{- end }}
            {{- if .Values.enableOnyx }}
            - name: CLAWQL_ENABLE_ONYX
              value: "1"
            {{- end }}
            {{- if .Values.onyxBaseUrl }}
            - name: ONYX_BASE_URL
              value: {{ .Values.onyxBaseUrl | quote }}
            {{- else if .Values.onyx.enabled }}
            - name: ONYX_BASE_URL
              value: "http://{{ include "clawql-mcp.onyxName" . }}:{{ .Values.onyx.service.port }}"
            {{- end }}
            {{- if .Values.enableOuroboros }}
            - name: CLAWQL_ENABLE_OUROBOROS
              value: "1"
            {{- end }}
            {{- if .Values.ouroborosDatabaseUrl }}
            - name: CLAWQL_OUROBOROS_DATABASE_URL
              value: {{ .Values.ouroborosDatabaseUrl | quote }}
            {{- end }}
            {{- if and .Values.ouroborosPostgres.enabled (not .Values.ouroborosDatabaseUrl) }}
            - name: CLAWQL_OUROBOROS_DB_HOST
              value: {{ include "clawql-mcp.ouroborosPostgresName" . | quote }}
            - name: CLAWQL_OUROBOROS_DB_PORT
              value: {{ .Values.ouroborosPostgres.service.port | quote }}
            - name: CLAWQL_OUROBOROS_DB_USER
              value: {{ .Values.ouroborosPostgres.auth.username | quote }}
            - name: CLAWQL_OUROBOROS_DB_NAME
              value: {{ .Values.ouroborosPostgres.auth.database | quote }}
            - name: CLAWQL_OUROBOROS_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "clawql-mcp.ouroborosPostgresSecretName" . }}
                  key: password
            {{- end }}
            {{- if .Values.nats.url }}
            - name: CLAWQL_NATS_URL
              value: {{ .Values.nats.url | quote }}
            {{- else if .Values.nats.enabled }}
            - name: CLAWQL_NATS_URL
              value: "nats://{{ include "clawql-mcp.natsName" . }}:{{ .Values.nats.service.clientPort }}"
            {{- end }}
            {{- if and .Values.nats.enabled .Values.nats.jetStream.enabled }}
            - name: CLAWQL_NATS_JETSTREAM
              value: "1"
            {{- end }}
            {{- if .Values.documentPipeline.enabled }}
            - name: TIKA_BASE_URL
              value: "http://{{ include "clawql-mcp.tikaName" . }}:{{ .Values.documentPipeline.tika.service.port }}"
            - name: GOTENBERG_BASE_URL
              value: "http://{{ include "clawql-mcp.gotenbergName" . }}:{{ .Values.documentPipeline.gotenberg.service.port }}"
            - name: STIRLING_BASE_URL
              value: "http://{{ include "clawql-mcp.stirlingName" . }}:{{ .Values.documentPipeline.stirling.service.port }}"
            {{- if .Values.documentPipeline.paperless.enabled }}
            - name: PAPERLESS_BASE_URL
              value: "http://{{ include "clawql-mcp.paperlessName" . }}:{{ .Values.documentPipeline.paperless.service.port }}"
            {{- end }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- if and .Values.secretSourcing.requireVaultBackedSecrets (not .Values.envFromSecret) (eq (len .Values.envFromSecrets) 0) }}
          {{- fail "secretSourcing.requireVaultBackedSecrets=true requires envFromSecret or envFromSecrets (Vault-synced Kubernetes Secret names)." }}
          {{- end }}
          {{- if or .Values.envFromSecret (gt (len .Values.envFromSecrets) 0) }}
          envFrom:
            {{- if .Values.envFromSecret }}
            - secretRef:
                name: {{ .Values.envFromSecret }}
            {{- end }}
            {{- range .Values.envFromSecrets }}
            - secretRef:
                name: {{ . | quote }}
            {{- end }}
          {{- end }}
          startupProbe:
            {{- toYaml .Values.startupProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: obsidian-vault
              mountPath: {{ .Values.obsidianVaultPath }}
            {{- if and .Values.enableSandbox .Values.sandboxDocker.enabled }}
            - name: clawql-docker-cli-static
              mountPath: /opt/clawql-docker
              readOnly: true
            - name: docker-sock
              mountPath: /var/run/docker.sock
            {{- end }}
      volumes:
        {{- if and .Values.enableSandbox .Values.sandboxDocker.enabled }}
        - name: clawql-docker-cli-static
          emptyDir: {}
        - name: docker-sock
          hostPath:
            path: {{ .Values.sandboxDocker.hostSocketPath | quote }}
            {{- /* Sprig `default` treats false as "empty" — use hasKey so explicit false omits type (Docker Desktop). */}}
            {{- $enforceSocketType := true }}
            {{- if hasKey .Values.sandboxDocker "enforceHostPathSocketType" }}
            {{- $enforceSocketType = .Values.sandboxDocker.enforceHostPathSocketType }}
            {{- end }}
            {{- if $enforceSocketType }}
            type: Socket
            {{- end }}
        {{- end }}
        {{- /* Volume "obsidian-vault": Obsidian Markdown memory (.Values.vault / persistence), not HashiCorp Vault — #161 */}}
        - name: obsidian-vault
          {{- if .Values.persistence.enabled }}
          {{- if .Values.persistence.existingClaim }}
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim }}
          {{- else }}
          persistentVolumeClaim:
            claimName: {{ include "clawql-mcp.fullname" . }}-vault
          {{- end }}
          {{- else if .Values.vault.hostPath.enabled }}
          hostPath:
            path: {{ quote (required "vault.hostPath.path is required when vault.hostPath.enabled" .Values.vault.hostPath.path) }}
            type: {{ .Values.vault.hostPath.type | default "DirectoryOrCreate" }}
          {{- else }}
          emptyDir: {}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
