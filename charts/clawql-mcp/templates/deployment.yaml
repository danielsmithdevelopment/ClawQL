apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "clawql-mcp.fullname" . }}
  labels:
    {{- include "clawql-mcp.labels" . | nindent 4 }}
    app: {{ include "clawql-mcp.fullname" . }}
spec:
  replicas: {{ .Values.replicaCount }}
  {{- with .Values.deploymentStrategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "clawql-mcp.selectorLabels" . | nindent 6 }}
      app: {{ include "clawql-mcp.fullname" . }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "clawql-mcp.selectorLabels" . | nindent 8 }}
        app: {{ include "clawql-mcp.fullname" . }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "clawql-mcp.serviceAccountName" . }}
      {{- if .Values.security.kata.enabled }}
      runtimeClassName: {{ .Values.security.kata.runtimeClassName | quote }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if and .Values.enableSandbox .Values.sandboxDocker.enabled }}
      initContainers:
        - name: clawql-docker-static-cli
          image: {{ .Values.sandboxDocker.initImage | quote }}
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 256Mi
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              ARCH=$(uname -m)
              case "$ARCH" in
                aarch64|arm64) DARCH=aarch64 ;;
                x86_64|amd64) DARCH=x86_64 ;;
                *) echo "clawql sandbox init: unsupported arch: $ARCH" >&2; exit 1 ;;
              esac
              VER="{{ .Values.sandboxDocker.staticCliVersion }}"
              URL="https://download.docker.com/linux/static/stable/${DARCH}/docker-${VER}.tgz"
              echo "clawql sandbox init: fetching ${URL}"
              # Use /export (emptyDir) only — readOnlyRootFilesystem leaves /tmp unusable on some runtimes.
              mkdir -p /export/stage
              curl -fsSL "$URL" | tar xz -C /export/stage docker/docker
              mv /export/stage/docker/docker /export/docker
              rm -rf /export/stage
              chmod 0555 /export/docker
              # Do not run `docker version` here — init has no docker.sock; it would fail under set -e.
              /export/docker --version
          volumeMounts:
            - name: clawql-docker-cli-static
              mountPath: /export
      {{- end }}
      containers:
        - name: {{ include "clawql-mcp.fullname" . }}
          securityContext:
            {{- if and .Values.enableSandbox .Values.sandboxDocker.enabled .Values.sandboxDocker.runAsRootForDockerSocket }}
            runAsUser: 0
            runAsNonRoot: false
            {{- else }}
            {{- toYaml .Values.securityContext | nindent 12 }}
            {{- end }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.http.targetPort | int }}
              protocol: TCP
            - name: grpc
              containerPort: {{ .Values.service.grpc.targetPort | int }}
              protocol: TCP
          env:
            - name: CLAWQL_PROVIDER
              value: {{ .Values.provider | quote }}
            - name: CLAWQL_OBSIDIAN_VAULT_PATH
              value: {{ .Values.obsidianVaultPath | quote }}
            - name: PORT
              value: {{ .Values.port | quote }}
            - name: MCP_PATH
              value: {{ .Values.mcpPath | quote }}
            - name: CLAWQL_BUNDLED_OFFLINE
              value: {{ .Values.bundledOffline | quote }}
            - name: NODE_OPTIONS
              value: {{ .Values.nodeOptions | quote }}
            {{- $enableGrpc := or .Values.enableGrpc (dig "clawql-mcp-grpc" "enabled" false .Values) }}
            {{- if $enableGrpc }}
            - name: ENABLE_GRPC
              value: "1"
            - name: GRPC_MAX_MESSAGE_LENGTH
              value: {{ (.Values.grpcMaxMessageLength | default 67108864) | int | quote }}
            {{- end }}
            {{- if .Values.enableGrpcReflection }}
            - name: ENABLE_GRPC_REFLECTION
              value: "1"
            {{- end }}
            {{- if not .Values.enableMemory }}
            - name: CLAWQL_ENABLE_MEMORY
              value: "0"
            {{- end }}
            # Always set so chart intent wins over duplicate keys from envFrom Secret (e.g. clawql-provider-env).
            - name: CLAWQL_ENABLE_DOCUMENTS
              value: {{ ternary "1" "0" .Values.enableDocuments | quote }}
            {{- if .Values.enableIdpClassifier }}
            - name: CLAWQL_ENABLE_IDP_CLASSIFIER
              value: "1"
            {{- end }}
            {{- if .Values.enableLangextract }}
            - name: CLAWQL_ENABLE_LANGEXTRACT
              value: "1"
            {{- end }}
            {{- if .Values.enablePrivacyFilter }}
            - name: CLAWQL_ENABLE_PRIVACY_FILTER
              value: "1"
            {{- end }}
            {{- if .Values.enablePdfInspector }}
            - name: CLAWQL_ENABLE_PDF_INSPECTOR
              value: "1"
            {{- end }}
            {{- if .Values.enableAnydoc }}
            - name: CLAWQL_ENABLE_ANYDOC
              value: "1"
            {{- end }}
            {{- if .Values.enableIdpPipeline }}
            - name: CLAWQL_ENABLE_IDP_PIPELINE
              value: "1"
            {{- end }}
            - name: CLAWQL_ENABLE_GOOGLE
              value: {{ ternary "1" "0" (.Values.enableGoogle | default false) | quote }}
            - name: CLAWQL_ENABLE_CLOUDFLARE
              value: {{ ternary "1" "0" (.Values.enableCloudflare | default true) | quote }}
            - name: CLAWQL_ENABLE_AWS
              value: {{ ternary "1" "0" (.Values.enableAws | default false) | quote }}
            {{- if .Values.enableSandbox }}
            - name: CLAWQL_ENABLE_SANDBOX
              value: "1"
            {{- end }}
            {{- if .Values.enableData }}
            - name: CLAWQL_ENABLE_DATA
              value: "1"
            {{- end }}
            {{- if and .Values.enableSandbox .Values.sandboxKata.enabled (not .Values.sandboxDocker.enabled) }}
            - name: CLAWQL_SANDBOX_BACKEND
              value: "kata"
            - name: CLAWQL_SANDBOX_KATA_RUNTIME_CLASS
              value: {{ .Values.sandboxKata.runtimeClassName | default .Values.security.kata.runtimeClassName | quote }}
            {{- if .Values.sandboxKata.namespace }}
            - name: CLAWQL_SANDBOX_KATA_NAMESPACE
              value: {{ .Values.sandboxKata.namespace | quote }}
            {{- end }}
            {{- if .Values.sandboxKata.serviceAccount }}
            - name: CLAWQL_SANDBOX_KATA_SERVICE_ACCOUNT
              value: {{ .Values.sandboxKata.serviceAccount | quote }}
            {{- end }}
            {{- else if and .Values.enableSandbox .Values.security.kata.enabled (not .Values.sandboxDocker.enabled) (not .Values.sandboxKata.enabled) }}
            - name: CLAWQL_SANDBOX_BACKEND
              value: "kata"
            - name: CLAWQL_SANDBOX_KATA_RUNTIME_CLASS
              value: {{ .Values.security.kata.runtimeClassName | quote }}
            {{- end }}
            {{- if and .Values.enableSandbox .Values.sandboxDocker.enabled }}
            - name: CLAWQL_SANDBOX_BACKEND
              value: "docker"
            - name: CLAWQL_SANDBOX_DOCKER_BIN
              value: "/opt/clawql-docker/docker"
            {{- end }}
            {{- if .Values.enableNotify }}
            - name: CLAWQL_ENABLE_NOTIFY
              value: "1"
            {{- end }}
            {{- if .Values.enableWorkflow }}
            - name: CLAWQL_ENABLE_WORKFLOW
              value: "1"
            - name: CLAWQL_WORKFLOW_NAMESPACE_ALLOWLIST
              value: {{ include "clawql-mcp.workflowNamespaceList" . | quote }}
            - name: CLAWQL_WORKFLOW_DEFAULT_NAMESPACE
              value: {{ include "clawql-mcp.workflowDefaultNamespace" . | quote }}
            {{- if .Values.workflow.templateAllowlist }}
            - name: CLAWQL_WORKFLOW_TEMPLATE_ALLOWLIST
              value: {{ .Values.workflow.templateAllowlist | quote }}
            {{- end }}
            {{- if .Values.workflow.argoUiBaseUrl }}
            - name: CLAWQL_WORKFLOW_ARGO_UI_BASE_URL
              value: {{ .Values.workflow.argoUiBaseUrl | quote }}
            {{- end }}
            {{- if .Values.workflow.allowDelete }}
            - name: CLAWQL_WORKFLOW_ALLOW_DELETE
              value: "1"
            {{- end }}
            - name: CLAWQL_WORKFLOW_LOG_TAIL_MAX
              value: {{ .Values.workflow.logTailMax | int | quote }}
            - name: CLAWQL_WORKFLOW_WAIT_TIMEOUT_SECONDS
              value: {{ .Values.workflow.waitTimeoutSeconds | int | quote }}
            - name: CLAWQL_WORKFLOW_WAIT_POLL_SECONDS
              value: {{ .Values.workflow.waitPollSeconds | int | quote }}
            - name: CLAWQL_WORKFLOW_GENERATE_NAME_PREFIX
              value: {{ .Values.workflow.generateNamePrefix | quote }}
            {{- if .Values.workflow.notifyOnTerminal }}
            - name: CLAWQL_WORKFLOW_NOTIFY_ON_TERMINAL
              value: "1"
            {{- end }}
            {{- if .Values.workflow.notifyChannel }}
            - name: CLAWQL_WORKFLOW_NOTIFY_CHANNEL
              value: {{ .Values.workflow.notifyChannel | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.enableArgoCd }}
            - name: CLAWQL_ENABLE_ARGO_CD
              value: "1"
            - name: CLAWQL_ARGO_CD_NAMESPACE_ALLOWLIST
              value: {{ include "clawql-mcp.argocdNamespaceList" . | quote }}
            - name: CLAWQL_ARGO_CD_DEFAULT_NAMESPACE
              value: {{ include "clawql-mcp.argocdDefaultNamespace" . | quote }}
            {{- if .Values.argocd.allowSync }}
            - name: CLAWQL_ARGO_CD_ALLOW_SYNC
              value: "1"
            {{- end }}
            {{- end }}
            {{- if .Values.enableHitlLabelStudio }}
            - name: CLAWQL_ENABLE_HITL_LABEL_STUDIO
              value: "1"
            {{- end }}
            {{- if .Values.enableOnyx }}
            - name: CLAWQL_ENABLE_ONYX
              value: "1"
            {{- end }}
            {{- if .Values.onyxBaseUrl }}
            - name: ONYX_BASE_URL
              value: {{ .Values.onyxBaseUrl | quote }}
            {{- else if .Values.onyx.enabled }}
            - name: ONYX_BASE_URL
              value: "http://{{ include "clawql-mcp.onyxName" . }}:{{ .Values.onyx.service.port }}"
            {{- end }}
            {{- /* clawql-web — docs/web/clawql-web.md */ -}}
            {{- if .Values.enableWeb }}
            - name: CLAWQL_ENABLE_WEB
              value: "1"
            {{- end }}
            {{- if .Values.webSearch.provider }}
            - name: CLAWQL_WEB_SEARCH_PROVIDER
              value: {{ .Values.webSearch.provider | quote }}
            {{- end }}
            {{- if .Values.webBrowser.provider }}
            - name: CLAWQL_WEB_BROWSER_PROVIDER
              value: {{ .Values.webBrowser.provider | quote }}
            {{- end }}
            {{- if and .Values.webSearch.searxng.enabled .Values.webSearch.searxng.bundled }}
            - name: CLAWQL_SEARXNG_URL
              value: {{ printf "http://%s-searxng:%v" (include "clawql-mcp.fullname" .) (.Values.webSearch.searxng.port | default 8080) | quote }}
            {{- end }}
            {{- if and .Values.webSearch.opensearch.enabled .Values.webSearch.opensearch.url }}
            - name: CLAWQL_OPENSEARCH_URL
              value: {{ .Values.webSearch.opensearch.url | quote }}
            {{- end }}
            {{- if and .Values.webSearch.opensearch.enabled .Values.webSearch.opensearch.index }}
            - name: CLAWQL_OPENSEARCH_INDEX
              value: {{ .Values.webSearch.opensearch.index | quote }}
            {{- end }}
            {{- if and .Values.webBrowser.chromium.enabled .Values.webBrowser.chromium.bundled }}
            - name: CLAWQL_CHROMIUM_CDP_URL
              value: {{ printf "http://%s-chromium:%v" (include "clawql-mcp.fullname" .) (.Values.webBrowser.chromium.port | default 9222) | quote }}
            {{- end }}
            {{- if .Values.webAuditStore }}
            - name: CLAWQL_WEB_AUDIT_STORE
              value: {{ .Values.webAuditStore | quote }}
            {{- end }}
            {{- if .Values.enableOuroboros }}
            - name: CLAWQL_ENABLE_OUROBOROS
              value: "1"
            {{- end }}
            {{- if .Values.enableLangfuseEval }}
            - name: CLAWQL_ENABLE_LANGFUSE_EVAL
              value: "1"
            {{- end }}
            {{- if and .Values.instanceSpec.enabled .Values.instanceSpec.configMapName }}
            - name: CLAWQL_INSTANCE_SPEC_FILE
              value: {{ printf "%s/horizontalTierSpec.json" (.Values.instanceSpec.mountPath | default "/etc/clawql/instance") | quote }}
            {{- end }}
            {{- if .Values.ouroborosDatabaseUrl }}
            - name: CLAWQL_OUROBOROS_DATABASE_URL
              value: {{ .Values.ouroborosDatabaseUrl | quote }}
            {{- end }}
            {{- if and .Values.ouroborosPostgres.enabled (not .Values.ouroborosDatabaseUrl) }}
            - name: CLAWQL_OUROBOROS_DB_HOST
              value: {{ include "clawql-mcp.ouroborosPostgresName" . | quote }}
            - name: CLAWQL_OUROBOROS_DB_PORT
              value: {{ .Values.ouroborosPostgres.service.port | quote }}
            - name: CLAWQL_OUROBOROS_DB_USER
              value: {{ .Values.ouroborosPostgres.auth.username | quote }}
            - name: CLAWQL_OUROBOROS_DB_NAME
              value: {{ .Values.ouroborosPostgres.auth.database | quote }}
            - name: CLAWQL_OUROBOROS_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "clawql-mcp.ouroborosPostgresSecretName" . }}
                  key: password
            {{- end }}
            {{- if .Values.nats.url }}
            - name: CLAWQL_NATS_URL
              value: {{ .Values.nats.url | quote }}
            {{- else if .Values.nats.enabled }}
            - name: CLAWQL_NATS_URL
              value: "nats://{{ include "clawql-mcp.natsName" . }}:{{ .Values.nats.service.clientPort }}"
            {{- end }}
            {{- if and .Values.nats.enabled .Values.nats.jetStream.enabled }}
            - name: CLAWQL_NATS_JETSTREAM
              value: "1"
            {{- end }}
            {{- if and (include "clawql-mcp.natsConfigured" .) .Values.nats.appIntegration.publish }}
            - name: CLAWQL_NATS_ENABLE_PUBLISH
              value: "1"
            {{- end }}
            {{- if and (include "clawql-mcp.natsConfigured" .) .Values.nats.appIntegration.embeddedConsumer (not .Values.nats.worker.enabled) }}
            {{- if or .Values.enableWorkflow .Values.nats.worker.idpPipeline .Values.nats.worker.coneshareFollowup }}
            - name: CLAWQL_NATS_ENABLE_CONSUMER
              value: "1"
            {{- end }}
            {{- if .Values.enableWorkflow }}
            - name: CLAWQL_NATS_CONSUMER_RESUME_WORKFLOW
              value: "1"
            {{- end }}
            {{- if .Values.nats.worker.idpPipeline }}
            - name: CLAWQL_NATS_CONSUMER_IDP_PIPELINE
              value: "1"
            {{- end }}
            {{- if .Values.nats.worker.coneshareFollowup }}
            - name: CLAWQL_NATS_CONSUMER_CONESHARE_FOLLOWUP
              value: "1"
            {{- end }}
            {{- end }}
            {{- if .Values.documentPipeline.enabled }}
            - name: TIKA_BASE_URL
              value: "http://{{ include "clawql-mcp.tikaName" . }}:{{ .Values.documentPipeline.tika.service.port }}"
            {{- if .Values.documentPipeline.docling.enabled }}
            - name: DOCLING_BASE_URL
              value: "http://{{ include "clawql-mcp.doclingName" . }}:{{ .Values.documentPipeline.docling.service.port }}"
            {{- end }}
            {{- if .Values.documentPipeline.classifier.enabled }}
            - name: CLASSIFIER_BASE_URL
              value: "http://{{ include "clawql-mcp.classifierName" . }}:{{ .Values.documentPipeline.classifier.service.port }}"
            - name: CLASSIFIER_MIN_CONFIDENCE
              value: {{ .Values.documentPipeline.classifier.env.minConfidence | quote }}
            {{- end }}
            {{- if .Values.documentPipeline.langextract.enabled }}
            - name: LANGEXTRACT_BASE_URL
              value: "http://{{ include "clawql-mcp.langextractName" . }}:{{ .Values.documentPipeline.langextract.service.port }}"
            {{- end }}
            {{- if .Values.documentPipeline.privacyFilter.enabled }}
            - name: CLAWQL_PRIVACY_FILTER_URL
              value: "http://{{ include "clawql-mcp.privacyFilterName" . }}:{{ .Values.documentPipeline.privacyFilter.service.port }}"
            - name: CLAWQL_PRIVACY_FILTER_FAILURE_POLICY
              value: "warn"
            {{- end }}
            - name: GOTENBERG_BASE_URL
              value: "http://{{ include "clawql-mcp.gotenbergName" . }}:{{ .Values.documentPipeline.gotenberg.service.port }}"
            - name: STIRLING_BASE_URL
              value: "http://{{ include "clawql-mcp.stirlingName" . }}:{{ .Values.documentPipeline.stirling.service.port }}"
            {{- if .Values.documentPipeline.paperless.enabled }}
            - name: PAPERLESS_BASE_URL
              value: "http://{{ include "clawql-mcp.paperlessName" . }}:{{ .Values.documentPipeline.paperless.service.port }}"
            {{- end }}
            {{- end }}
            {{- if .Values.idpCollaboration.enabled }}
            {{- if .Values.idpCollaboration.nextcloud.enabled }}
            - name: NEXTCLOUD_BASE_URL
              value: "http://{{ include "clawql-mcp.nextcloudName" . }}:{{ .Values.idpCollaboration.nextcloud.service.port }}"
            {{- end }}
            {{- if or .Values.idpCollaboration.coneshare.enabled .Values.idpCollaboration.coneshare.externalUrl }}
            - name: CONESHARE_BASE_URL
              value: {{ default (printf "http://%s:%d" (include "clawql-mcp.coneshareName" .) (.Values.idpCollaboration.coneshare.service.port | int)) .Values.idpCollaboration.coneshare.externalUrl | quote }}
            - name: CLAWQL_ENABLE_CONESHARE
              value: "1"
            {{- end }}
            {{- end }}
            {{- if .Values.teamSync.enabled }}
            {{- if not .Values.teamSync.bucket }}
            {{- fail "teamSync.enabled requires teamSync.bucket" }}
            {{- end }}
            - name: CLAWQL_SYNC_PROVIDER
              value: {{ .Values.teamSync.provider | default "r2" | quote }}
            - name: CLAWQL_SYNC_BUCKET
              value: {{ .Values.teamSync.bucket | quote }}
            {{- if .Values.teamSync.prefix }}
            - name: CLAWQL_SYNC_PREFIX
              value: {{ .Values.teamSync.prefix | quote }}
            {{- end }}
            - name: CLAWQL_SYNC_REGION
              value: {{ .Values.teamSync.region | default "auto" | quote }}
            {{- if .Values.teamSync.endpoint }}
            - name: CLAWQL_SYNC_ENDPOINT
              value: {{ .Values.teamSync.endpoint | quote }}
            {{- else if eq (.Values.teamSync.provider | default "r2") "gcs" }}
            - name: CLAWQL_SYNC_ENDPOINT
              value: "https://storage.googleapis.com"
            {{- end }}
            {{- if .Values.teamSync.autoPush }}
            - name: CLAWQL_SYNC_AUTO
              value: "1"
            - name: CLAWQL_SYNC_AUTO_DEBOUNCE_MS
              value: {{ (.Values.teamSync.autoPushDebounceMs | default 2000) | int | quote }}
            - name: CLAWQL_SYNC_AUTO_PUSH_MIN_MS
              value: {{ (.Values.teamSync.autoPushMinMs | default 30000) | int | quote }}
            {{- end }}
            {{- if .Values.teamSync.autoPull }}
            - name: CLAWQL_SYNC_AUTO_PULL
              value: "1"
            - name: CLAWQL_SYNC_AUTO_PULL_MIN_MS
              value: {{ (.Values.teamSync.autoPullMinMs | default 60000) | int | quote }}
            {{- end }}
            {{- if .Values.teamSync.autoPullOnStart }}
            - name: CLAWQL_SYNC_AUTO_PULL_ON_START
              value: "1"
            {{- end }}
            {{- if .Values.teamSync.r2.accountId }}
            - name: CLAWQL_R2_ACCOUNT_ID
              value: {{ .Values.teamSync.r2.accountId | quote }}
            {{- end }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- $dpEnabled := .Values.documentPipeline.enabled }}
          {{- $paperlessSecretManaged := and $dpEnabled .Values.documentPipeline.paperless.enabled (not .Values.documentPipeline.paperless.auth.existingSecret) }}
          {{- $stirlingSecretManaged := and $dpEnabled (not .Values.documentPipeline.stirling.auth.existingSecret) (ne .Values.documentPipeline.stirling.auth.apiKey "") }}
          {{- $chartDocPipelineAuthSecret := or $paperlessSecretManaged $stirlingSecretManaged }}
          {{- $idpSecretManaged := and .Values.idpCollaboration.enabled (or (and .Values.idpCollaboration.nextcloud.enabled (not .Values.idpCollaboration.nextcloud.auth.existingSecret) (ne .Values.idpCollaboration.nextcloud.auth.adminPassword "")) (and .Values.idpCollaboration.coneshare.enabled (not .Values.idpCollaboration.coneshare.auth.existingSecret) (ne .Values.idpCollaboration.coneshare.auth.apiToken ""))) }}
          {{- if and .Values.secretSourcing.requireVaultBackedSecrets (not .Values.envFromSecret) (eq (len .Values.envFromSecrets) 0) (not $chartDocPipelineAuthSecret) (not $idpSecretManaged) }}
          {{- fail "secretSourcing.requireVaultBackedSecrets=true requires envFromSecret or envFromSecrets (Vault-synced Kubernetes Secret names)." }}
          {{- end }}
          {{- if or $chartDocPipelineAuthSecret $idpSecretManaged .Values.envFromSecret (gt (len .Values.envFromSecrets) 0) }}
          envFrom:
            {{- if $chartDocPipelineAuthSecret }}
            - secretRef:
                name: {{ include "clawql-mcp.documentPipelineSecretName" . }}
            {{- end }}
            {{- if $idpSecretManaged }}
            - secretRef:
                name: {{ include "clawql-mcp.idpCollaborationSecretName" . }}
            {{- end }}
            {{- if .Values.envFromSecret }}
            - secretRef:
                name: {{ .Values.envFromSecret }}
            {{- end }}
            {{- range .Values.envFromSecrets }}
            - secretRef:
                name: {{ . | quote }}
            {{- end }}
          {{- end }}
          startupProbe:
            {{- toYaml .Values.startupProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: obsidian-vault
              mountPath: {{ .Values.obsidianVaultPath }}
            {{- if and .Values.instanceSpec.enabled .Values.instanceSpec.configMapName }}
            - name: clawql-instance-spec
              mountPath: {{ .Values.instanceSpec.mountPath | default "/etc/clawql/instance" | quote }}
              readOnly: true
            {{- end }}
            {{- if and .Values.enableSandbox .Values.sandboxDocker.enabled }}
            - name: clawql-docker-cli-static
              mountPath: /opt/clawql-docker
              readOnly: true
            - name: docker-sock
              mountPath: /var/run/docker.sock
            {{- end }}
      volumes:
        {{- if and .Values.enableSandbox .Values.sandboxDocker.enabled }}
        - name: clawql-docker-cli-static
          emptyDir: {}
        - name: docker-sock
          hostPath:
            path: {{ .Values.sandboxDocker.hostSocketPath | quote }}
            {{- /* Sprig `default` treats false as "empty" — use hasKey so explicit false omits type (Docker Desktop). */}}
            {{- $enforceSocketType := true }}
            {{- if hasKey .Values.sandboxDocker "enforceHostPathSocketType" }}
            {{- $enforceSocketType = .Values.sandboxDocker.enforceHostPathSocketType }}
            {{- end }}
            {{- if $enforceSocketType }}
            type: Socket
            {{- end }}
        {{- end }}
        {{- if and .Values.instanceSpec.enabled .Values.instanceSpec.configMapName }}
        - name: clawql-instance-spec
          configMap:
            name: {{ .Values.instanceSpec.configMapName | quote }}
        {{- end }}
        {{- /* Volume "obsidian-vault": Obsidian Markdown memory (.Values.vault / persistence), not HashiCorp Vault — #161 */}}
        - name: obsidian-vault
          {{- if .Values.persistence.enabled }}
          {{- if .Values.persistence.existingClaim }}
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim }}
          {{- else }}
          persistentVolumeClaim:
            claimName: {{ include "clawql-mcp.fullname" . }}-vault
          {{- end }}
          {{- else if .Values.vault.hostPath.enabled }}
          hostPath:
            path: {{ quote (required "vault.hostPath.path is required when vault.hostPath.enabled" .Values.vault.hostPath.path) }}
            type: {{ .Values.vault.hostPath.type | default "DirectoryOrCreate" }}
          {{- else }}
          emptyDir: {}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
