{{- if .Values.dashboard.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "clawql-mcp.dashboardName" . }}
  labels:
    {{- include "clawql-mcp.labels" . | nindent 4 }}
    app: {{ include "clawql-mcp.dashboardName" . }}
    app.kubernetes.io/component: dashboard
spec:
  replicas: {{ .Values.dashboard.replicaCount }}
  selector:
    matchLabels:
      {{- include "clawql-mcp.selectorLabels" . | nindent 6 }}
      app: {{ include "clawql-mcp.dashboardName" . }}
      app.kubernetes.io/component: dashboard
  template:
    metadata:
      labels:
        {{- include "clawql-mcp.selectorLabels" . | nindent 8 }}
        app: {{ include "clawql-mcp.dashboardName" . }}
        app.kubernetes.io/component: dashboard
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: dashboard
          image: "{{ .Values.dashboard.image.repository }}:{{ .Values.dashboard.image.tag }}"
          imagePullPolicy: {{ .Values.dashboard.image.pullPolicy }}
          env:
            {{- if .Values.dashboard.openclawChatUrl }}
            - name: CLAWQL_DASHBOARD_OPENCLAW_CHAT_URL
              value: {{ .Values.dashboard.openclawChatUrl | quote }}
            {{- end }}
            - name: CLAWQL_DASHBOARD_ALLOW_K8S_SYNC
              value: {{ ternary "1" "0" .Values.dashboard.allowSync | quote }}
            - name: CLAWQL_DASHBOARD_K8S_NAMESPACE
              value: {{ .Values.dashboard.k8s.namespace | quote }}
            - name: CLAWQL_DASHBOARD_K8S_SECRET_NAME
              value: {{ .Values.dashboard.k8s.secretName | quote }}
            - name: CLAWQL_DASHBOARD_K8S_DEPLOYMENT
              value: {{ .Values.dashboard.k8s.deploymentName | quote }}
            - name: CLAWQL_DASHBOARD_VAULT_NAMESPACE
              value: {{ .Values.dashboard.vault.namespace | quote }}
            - name: CLAWQL_DASHBOARD_VAULT_POD
              value: {{ .Values.dashboard.vault.pod | quote }}
            - name: CLAWQL_DASHBOARD_VAULT_ADDR
              value: {{ .Values.dashboard.vault.addr | quote }}
            - name: CLAWQL_DASHBOARD_VAULT_MOUNT
              value: {{ .Values.dashboard.vault.mount | quote }}
            - name: CLAWQL_DASHBOARD_VAULT_PATH
              value: {{ .Values.dashboard.vault.path | quote }}
          ports:
            - name: http
              containerPort: {{ .Values.dashboard.service.targetPort | int }}
              protocol: TCP
          startupProbe:
            {{- toYaml .Values.dashboard.startupProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.dashboard.readinessProbe | nindent 12 }}
          livenessProbe:
            {{- toYaml .Values.dashboard.livenessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.dashboard.resources | nindent 12 }}
{{- end }}
