{{- if and .Values.enableSandbox .Values.sandboxKata.enabled .Values.sandboxKata.rbac }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "clawql-mcp.fullname" . }}-sandbox-kata
  namespace: {{ default .Release.Namespace .Values.sandboxKata.namespace }}
  labels:
    {{- include "clawql-mcp.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["configmaps", "pods", "pods/log"]
    verbs: ["create", "delete", "get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "delete", "get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "clawql-mcp.fullname" . }}-sandbox-kata
  namespace: {{ default .Release.Namespace .Values.sandboxKata.namespace }}
  labels:
    {{- include "clawql-mcp.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "clawql-mcp.fullname" . }}-sandbox-kata
subjects:
  - kind: ServiceAccount
    name: {{ include "clawql-mcp.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
