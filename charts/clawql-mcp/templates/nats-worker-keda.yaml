{{- if and .Values.nats.worker.enabled .Values.nats.keda.enabled .Values.nats.enabled }}
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ include "clawql-mcp.natsWorkerName" . }}
  labels:
    {{- include "clawql-mcp.labels" . | nindent 4 }}
    app.kubernetes.io/component: nats-worker
spec:
  scaleTargetRef:
    name: {{ include "clawql-mcp.natsWorkerName" . }}
  pollingInterval: {{ .Values.nats.keda.pollingInterval }}
  cooldownPeriod: {{ .Values.nats.keda.cooldownPeriod }}
  minReplicaCount: {{ .Values.nats.keda.minReplicaCount }}
  maxReplicaCount: {{ .Values.nats.keda.maxReplicaCount }}
  triggers:
    {{- if .Values.enableWorkflow }}
    - type: nats-jetstream
      metadata:
        natsServerMonitoringEndpoint: {{ include "clawql-mcp.natsMonitoringEndpoint" . | quote }}
        account: {{ .Values.nats.keda.account | quote }}
        stream: {{ include "clawql-mcp.natsJetStreamStream" . | quote }}
        consumer: {{ include "clawql-mcp.natsJetStreamConsumer" . | quote }}
        lagThreshold: {{ .Values.nats.keda.lagThreshold | quote }}
        activationLagThreshold: {{ .Values.nats.keda.activationLagThreshold | quote }}
        useHttps: "false"
    {{- end }}
    {{- if .Values.nats.worker.idpPipeline }}
    - type: nats-jetstream
      metadata:
        natsServerMonitoringEndpoint: {{ include "clawql-mcp.natsMonitoringEndpoint" . | quote }}
        account: {{ .Values.nats.keda.account | quote }}
        stream: {{ include "clawql-mcp.natsJetStreamStream" . | quote }}
        consumer: "clawql-idp-pipeline"
        lagThreshold: {{ .Values.nats.keda.lagThreshold | quote }}
        activationLagThreshold: {{ .Values.nats.keda.activationLagThreshold | quote }}
        useHttps: "false"
    {{- end }}
    {{- if .Values.nats.worker.coneshareFollowup }}
    - type: nats-jetstream
      metadata:
        natsServerMonitoringEndpoint: {{ include "clawql-mcp.natsMonitoringEndpoint" . | quote }}
        account: {{ .Values.nats.keda.account | quote }}
        stream: {{ include "clawql-mcp.natsJetStreamStream" . | quote }}
        consumer: "clawql-coneshare-followup"
        lagThreshold: {{ .Values.nats.keda.lagThreshold | quote }}
        activationLagThreshold: {{ .Values.nats.keda.activationLagThreshold | quote }}
        useHttps: "false"
    {{- end }}
    {{- range .Values.nats.keda.extraConsumers }}
    - type: nats-jetstream
      metadata:
        natsServerMonitoringEndpoint: {{ include "clawql-mcp.natsMonitoringEndpoint" $ | quote }}
        account: {{ $.Values.nats.keda.account | quote }}
        stream: {{ include "clawql-mcp.natsJetStreamStream" $ | quote }}
        consumer: {{ . | quote }}
        lagThreshold: {{ $.Values.nats.keda.lagThreshold | quote }}
        activationLagThreshold: {{ $.Values.nats.keda.activationLagThreshold | quote }}
        useHttps: "false"
    {{- end }}
{{- end }}
