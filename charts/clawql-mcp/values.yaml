    path: /healthz
    port: http
  periodSeconds: 10
  failureThreshold: 36
  timeoutSeconds: 5

readinessProbe:
  httpGet:
    path: /healthz
    port: http
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  periodSeconds: 30
  timeoutSeconds: 5
  failureThreshold: 3

persistence:
  enabled: false
  storageClass: ""
  accessModes:
    - ReadWriteOnce
  size: 10Gi
  existingClaim: ""

# Team shared memory — sync Obsidian vault notes to object storage for multi-user recall.
# Default provider: Cloudflare R2 (bundled default stack). Credentials belong in Vault KV /
# envFromSecret — never in values:
#   r2: r2AccessKeyId, r2SecretAccessKey, cloudflareAccountId
#   s3: awsAccessKeyId, awsSecretAccessKey (+ CLAWQL_AWS_REGION via extraEnv if needed)
#   gcs: gcsHmacAccessId, gcsHmacSecret (S3-compatible HMAC interop; endpoint auto-set when provider=gcs)
# Docs: docs/getting-started/team-vault-sync.md
teamSync:
  enabled: false
  provider: r2 # r2 | s3 | gcs (S3-compatible API)
  bucket: ""
  prefix: "" # shared key prefix, e.g. teams/engineering/
  region: auto
  endpoint: "" # optional override (gcs defaults to https://storage.googleapis.com in template)
  autoPush: false # CLAWQL_SYNC_AUTO=1 — quiet debounce + min-interval push after memory_ingest; shutdown flush if dirty
  autoPushDebounceMs: 2000
  autoPushMinMs: 30000 # CLAWQL_SYNC_AUTO_PUSH_MIN_MS — min gap between pushes; shutdown flush bypasses
  autoPull: false # CLAWQL_SYNC_AUTO_PULL=1 — throttled pull before memory_recall
  autoPullMinMs: 60000
  autoPullOnStart: false # CLAWQL_SYNC_AUTO_PULL_ON_START=1 — pull once at MCP startup
  r2:
    # Non-secret account id (alternative: cloudflareAccountId in provider secret).
    accountId: ""

# Obsidian memory Markdown on disk (`memory_ingest` / `memory_recall`). Not HashiCorp Vault — #161.
# Mutually exclusive with persistence.enabled (PVC wins if both are set).
vault:
  hostPath:
    enabled: false
    path: ""
    type: DirectoryOrCreate

ingress:
  enabled: false
  className: ""
