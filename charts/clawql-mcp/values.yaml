# Default resource names match Kustomize (`clawql-mcp-http`) so kubectl snippets in docs stay familiar.
#
# Naming — Helm key **`vault`** vs **HashiCorp Vault** ([#161](https://github.com/danielsmithdevelopment/ClawQL/issues/161)):
# the **`vault`** block under this file configures Obsidian *memory* storage (Markdown on disk). It does not
# deploy HashiCorp Vault. Use **`hashicorpvault`** for the bundled Vault chart and **`envFromSecret`** /
# **`envFromSecrets`** (or External Secrets) for provider tokens.
fullnameOverride: clawql-mcp-http
nameOverride: ""

replicaCount: 1

# Optional Deployment strategy (e.g. `{ type: Recreate }` on single-node clusters to avoid two pods during rollout).
deploymentStrategy: {}

image:
  repository: ghcr.io/danielsmithdevelopment/clawql-mcp
  tag: latest
  pullPolicy: IfNotPresent

imagePullSecrets: []

serviceAccount:
  create: false
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}

# Extra labels on the MCP pod template (e.g. Istio: sidecar.istio.io/inject).
podLabels: {}

podSecurityContext: {}
securityContext: {}

# VM-level containment for MCP + sandbox workloads (#274). When enabled, the MCP Deployment pod sets
# spec.runtimeClassName — you must install a matching cluster RuntimeClass (e.g. kata-deploy → kata-qemu).
# Kyverno admission is separate: kyverno.runtimeClassPolicy (namespace-scoped). Independent of MCP proxy / JWT.
security:
  kata:
    enabled: false
    runtimeClassName: kata-qemu

service:
  type: LoadBalancer
  # Service port for HTTP (MCP + health + GraphQL). Base Kustomize uses 80 → container 8080.
  http:
    port: 80
    targetPort: 8080
  grpc:
    port: 50051
    targetPort: 50051
  # Extra annotations on the MCP Service (merged after prometheus scrape annotations when enabled).
  annotations: {}

# GET /metrics (OpenMetrics). Prometheus scrape integration — see charts/clawql-mcp/README.md.
metrics:
  # When true, annotate the MCP Service with prometheus.io/* so Prometheus deployments that honor
  # Service annotations pick up ClawQL (notably Istio samples/addons/prometheus.yaml — job
  # kubernetes-service-endpoints). Port must match the HTTP container listen port (service.http.targetPort).
  prometheusScrapeAnnotations:
    enabled: true
    path: /metrics
    port: ""
  # monitoring.coreos.com/v1 ServiceMonitor for Prometheus Operator (kube-prometheus-stack, etc.).
  # Requires the ServiceMonitor CRD; rendered only when enabled and API is available.
  serviceMonitor:
    enabled: false
    # If empty, ServiceMonitor is created in the release namespace.
    namespace: ""
    labels: {}
    interval: 30s
    scrapeTimeout: 10s

# Mirrors docker/kustomize/base/deployment-mcp-http.yaml
# Merged `CLAWQL_PROVIDER`: `default` (same opinionated stack as bare npm — Cloudflare, GitHub, Slack, Linear, Notion, Onyx).
# Use `all-providers` for every bundled vendor + Google top-50 + AWS top-50, or set extraEnv / patchDeployment with
# `CLAWQL_BUNDLED_PROVIDERS=…` and omit `CLAWQL_PROVIDER` if needed (see README "Configure the API spec").
provider: default
bundledOffline: "1"

# MCP protobuf gRPC listener (port service.grpc.port). Alias for Convergence Week blog:
# `clawql-mcp-grpc.enabled` — prefer `enableGrpc` in new values; both are honored in templates.
enableGrpc: true
enableGrpcReflection: false
clawql-mcp-grpc:
  enabled: true
obsidianVaultPath: /vault
port: "8080"
mcpPath: /mcp
nodeOptions: "--max-old-space-size=1536"

# Max protobuf send/receive per frame for MCP gRPC (`GRPC_MAX_MESSAGE_LENGTH`). Large `execute` bodies
# (e.g. base64 PDF → Tika) should use **`model_context_protocol.Mcp/CallTool`** on the gRPC port, not Streamable HTTP JSON.
grpcMaxMessageLength: 67108864

# Optional MCP chokepoint (**Deployment** + **Service**) in front of **`clawql-mcp-http`** — Istio ordering,
# JWT/ATR gateway, or **nginx** TCP/HTTP passthrough. Defaults **off**.
# See **docs/security/mcp-proxy-jwt-atr.md** and **docs/integrations/panguard-kubernetes.md**.
mcpProxy:
  enabled: false
  mode: nginx
  replicaCount: 2
  image:
    repository: nginx
    tag: "1.27-alpine"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: "1"
      memory: 256Mi
  securityContext: {}
  podAnnotations: {}
  podLabels: {}
  podSecurityContext: {}
  custom:
    image:
      repository: ""
      tag: latest
      pullPolicy: IfNotPresent
    command: []
    args: []
    extraEnv: []
    resources: {}
    securityContext: {}
    readinessProbe: {}
    livenessProbe: {}
  service:
    type: ClusterIP
    annotations: {}
    http:
      port: 80
      targetPort: 8080
    grpc:
      port: 50051
      targetPort: 50051
  slo:
    prometheusRule:
      enabled: false
      httpP99LatencyThresholdMs: 50
      forDuration: 15m
      labels: {}
      annotations: {}

# Optional clawql-inference sidecar Deployment (OpenAI-compatible /v1). Defaults **off**.
# Pair with managedGateway for one-hostname /mcp + /v1 (Managed Edge Gateway).
# See docs/getting-started/inference.md and examples/managed-gateway/.
inference:
  enabled: false
  replicaCount: 1
  # Reuses the MCP image by default; override command runs clawql-inference.
  image:
    repository: ""
    tag: ""
    pullPolicy: IfNotPresent
  command:
    - packages/clawql-inference/bin/clawql-inference.mjs
  args: []
  extraEnv: []
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "2"
      memory: 1Gi
  securityContext: {}
  podAnnotations: {}
  podLabels: {}
  podSecurityContext: {}
  service:
    type: ClusterIP
    annotations: {}
    http:
      port: 8080
      targetPort: 8080
  # Mount shared CLAWQL_HOME (virtual keys + policy) when set.
  home:
    enabled: false
    existingClaim: ""
    mountPath: /clawql-home
  # Inject CLAWQL_AUTH_MODE / keys flags for managed deployments.
  authMode: apiKey
  keysEnabled: true
  policyManifestPath: /clawql-home/Inference/policy.yaml

# Optional nginx edge in front of MCP + inference (Managed Edge Gateway). Defaults **off**.
# Requires inference.enabled=true for /v1 routes. Routes mirror examples/managed-gateway/nginx.conf.
managedGateway:
  enabled: false
  replicaCount: 1
  image:
    repository: nginx
    tag: "1.27-alpine"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: "1"
      memory: 256Mi
  securityContext: {}
  podAnnotations: {}
  podLabels: {}
  podSecurityContext: {}
  service:
    type: ClusterIP
    annotations: {}
    http:
      port: 80
      targetPort: 8080
  # Upstream service names default to chart helpers when empty.
  mcpUpstreamHost: ""
  mcpUpstreamPort: ""
  inferenceUpstreamHost: ""
  inferenceUpstreamPort: ""

# memory_ingest / memory_recall (default on). Set false to inject CLAWQL_ENABLE_MEMORY=0.
enableMemory: true
# Document stack: tika, gotenberg, paperless, stirling, onyx, nextcloud, coneshare in all-providers merge + ingest_external_knowledge + (with enableOnyx) knowledge_search_onyx. Set false to inject CLAWQL_ENABLE_DOCUMENTS=0.
enableDocuments: true
# IDP specialist MCP tools (documents tier). Default off — set true to inject CLAWQL_ENABLE_*=1.
enableIdpClassifier: false
enableLangextract: false
# Local Privacy Filter gateway backup ([#245]). Default off — set true to inject CLAWQL_ENABLE_PRIVACY_FILTER=1.
enablePrivacyFilter: false
# In-process Firecrawl pdf-inspector (`inspect_pdf`). No sidecar; ships in clawql-documents.
enablePdfInspector: false
# In-process Firecrawl anydoc (`convert_document`). No sidecar; ships in clawql-documents.
enableAnydoc: false
enableIdpPipeline: false

# Optional ClawQLInstance tier-spec overlay (#255). Default off — Helm `enable*` env flags remain authoritative unless this mount is enabled.
instanceSpec:
  enabled: false
  configMapName: ""
  mountPath: /etc/clawql/instance

# Bundled cloud APIs — add Google/AWS to the default install stack; omit Cloudflare with enableCloudflare: false.
# all-providers always includes Google, AWS, and Cloudflare regardless of these values.
enableGoogle: false
enableCloudflare: true
enableAws: false

# MCP sandbox_exec — isolated snippets (Kata default in-cluster, Docker, Seatbelt, bridge; #207). Default off.
enableSandbox: false

# sandbox_exec **Kata Containers** backend (recommended production): ephemeral Jobs with runtimeClassName.
# Requires enableSandbox: true, cluster RuntimeClass (e.g. kata-qemu), and RBAC for Jobs/ConfigMaps/Pods/logs.
# When security.kata.enabled is true and sandboxDocker.enabled is false, chart sets CLAWQL_SANDBOX_BACKEND=kata.
sandboxKata:
  enabled: false
  runtimeClassName: kata-qemu
  namespace: ""
  serviceAccount: ""
  rbac: true

# sandbox_exec **docker** backend on Kubernetes: mount host Docker socket + static `docker` CLI (initContainer).
# Requires enableSandbox: true. Local single-node clusters only (Docker Desktop / Rancher Desktop). See charts/clawql-mcp/README.md.
sandboxDocker:
  enabled: false
  hostSocketPath: /var/run/docker.sock
  # When true, docker-sock hostPath uses type: Socket (kubelet rejects if the path is not a socket). Docker Desktop
  # Kubernetes sometimes fails this check even with a valid socket — set false in values-docker-desktop.yaml.
  enforceHostPathSocketType: true
  # https://download.docker.com/linux/static/stable/<arch>/docker-<version>.tgz
  staticCliVersion: "27.4.1"
  initImage: curlimages/curl:8.11.1
  # Host sockets are often root:docker 660; run MCP container as root so docker CLI can connect (local dev only).
  runAsRootForDockerSocket: false

# MCP notify tool — Slack chat.postMessage (#77). Requires Slack in provider merge + CLAWQL_SLACK_TOKEN (via extraEnv / secret).
enableNotify: false

# MCP workflow tool — Argo Workflows submit/observe (#243, ADR 0004). Requires Argo Workflows ≥ 3.4.0 in cluster.
enableWorkflow: false

# When enableWorkflow: true — namespace allowlist, RBAC Role/RoleBinding, and workflow env vars.
workflow:
  rbac: true
  # Empty = release namespace only. Each entry gets a Role + RoleBinding for the MCP ServiceAccount.
  namespaceAllowlist: []
  defaultNamespace: ""
  templateAllowlist: ""
  argoUiBaseUrl: ""
  allowDelete: false
  logTailMax: 200
  waitTimeoutSeconds: 600
  waitPollSeconds: 5
  generateNamePrefix: clawql-
  # Grant get/list on ClusterWorkflowTemplate (cluster-scoped read).
  clusterTemplates: true
  # Optional Slack when `wait` completes (requires CLAWQL_SLACK_TOKEN; does not require enableNotify).
  notifyOnTerminal: false
  notifyChannel: ""

# MCP argocd tool — Argo CD Application observe/sync (#244). Requires Argo CD in cluster.
enableArgoCd: false
argocd:
  rbac: true
  # Namespaces where Application CRs are managed (often `argocd`).
  namespaceAllowlist: []
  defaultNamespace: ""
  allowSync: false

# MCP hitl_enqueue_label_studio — Label Studio HITL bridge (#228). Requires CLAWQL_LABEL_STUDIO_* via extraEnv / secret.
# Label Studio itself is BYO (not bundled). RBAC: docs/mcp/hitl-label-studio.md#14-multi-reviewer-rbac-ce-vs-enterprise (#249).
#   CE: heartexlabs/label-studio or pip install label-studio — no native multi-reviewer RBAC.
#   Enterprise: https://docs.humansignal.com/guide/install — SAML/RBAC; license required; not redistributed in this chart.
enableHitlLabelStudio: false

# clawql-web — pluggable web_search / web_fetch (docs/web/clawql-web.md).
# enableWeb auto-on when a provider/key is set; set false to force off in regulated clusters
# (search disabled, no external SaaS; self-host Chromium only if policy allows).
# webSearch.searxng.bundled / webBrowser.chromium.bundled deploy in-chart Deployments
# (templates/web-stack.yaml) — not external Helm subchart deps. OpenSearch for web: BYO or reuse Onyx.
enableWeb: false
webSearch:
  provider: none # tavily|brave|searxng|opensearch|none
  searxng:
    enabled: false
    bundled: false # when true (+ enabled), deploy SearXNG and inject CLAWQL_SEARXNG_URL
    replicas: 1
    port: 8080
    image:
      repository: searxng/searxng
      tag: latest
      pullPolicy: IfNotPresent
    resources: {}
  opensearch:
    enabled: false
    bundled: false # not wired — reuse onyx OpenSearch or BYO CLAWQL_OPENSEARCH_URL
webBrowser:
  provider: kitesurf # kitesurf|chromium|playwright|puppeteer|firecrawl|none
  chromium:
    enabled: false
    bundled: false # when true (+ enabled), deploy headless Chromium and inject CLAWQL_CHROMIUM_CDP_URL
    replicas: 1
    port: 9222
    image:
      repository: chromedp/headless-shell
      tag: latest
      pullPolicy: IfNotPresent
    # Omit or set null to use template defaults (--remote-debugging-port=9222, headless, etc.)
    args: null
    resources: {}
# Durable web audit: memory (default) | jsonl (when CLAWQL_HOME set) | off
webAuditStore: ""

# MCP knowledge_search_onyx — Onyx POST /search/send-search-message (#118). Requires onyx in provider merge + ONYX_BASE_URL + Bearer token (extraEnv / secret).
enableOnyx: false
# When set, injects ONYX_BASE_URL (non-secret). Prefer extraEnv / envFromSecret for ONYX_API_TOKEN.
onyxBaseUrl: ""
onyx:
  enabled: false
  # When true (default), deploy Vespa + OpenSearch + Dragonfly + MinIO + model servers + background worker
  # (matches upstream docker-compose). When false, deploy a minimal postgres-backed API (vector search disabled).
  fullVectorStack: true
  # Merged into every Onyx stack Pod template (Deployments + Vespa StatefulSet), e.g. sidecar.istio.io/inject=false for Istio ambient.
  podAnnotations: {}
  api:
    image:
      repository: onyxdotapp/onyx-backend
      tag: latest
      pullPolicy: IfNotPresent
    # Extra env for onyx-api (Deployment). Example: NUM_RETRIES_ON_STARTUP for slow Vespa/OpenSearch on cold local clusters.
    extraEnv: []
  web:
    image:
      repository: onyxdotapp/onyx-web-server
      tag: latest
      pullPolicy: IfNotPresent
    service:
      port: 3000
  service:
    port: 8080
  authType: basic
  userAuthSecret: "change-me-onyx-user-auth-secret"
  # S3 / MinIO object store (full stack).
  s3:
    fileStoreBucketName: onyx-file-store-bucket
  dragonfly:
    # DragonflyDB only (Redis OSS is not a supported in-chart broker). Celery/Paperless still use redis:// URLs (wire protocol).
    image:
      repository: docker.dragonflydb.io/dragonflydb/dragonfly
      tag: v1.37.2
      pullPolicy: IfNotPresent
    # Passed to the dragonfly binary; empty uses image defaults (--port defaults to 6379).
    args:
      - --logtostderr
    service:
      port: 6379
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: "1"
        memory: 512Mi
  opensearch:
    image:
      repository: opensearchproject/opensearch
      tag: "3.4.0"
      pullPolicy: IfNotPresent
    service:
      port: 9200
    # JVM heap for OpenSearch (raise for production).
    javaOpts: "-Xms512m -Xmx512m"
    # Do not set DISABLE_INSTALL_DEMO_CONFIG=true with OPENSEARCH_INITIAL_ADMIN_PASSWORD:
    # the security plugin then loads without demo TLS and fails ("No SSL configuration found").
    auth:
      adminPassword: "StrongPassword123!"
      existingSecret: ""
      existingSecretPasswordKey: password
    persistence:
      enabled: false
      storageClass: ""
      accessModes:
        - ReadWriteOnce
      size: 10Gi
      existingClaim: ""
    resources:
      requests:
        cpu: 250m
        memory: 1536Mi
      limits:
        cpu: "2"
        memory: 3Gi
  vespa:
    image:
      repository: vespaengine/vespa
      tag: "8.609.39"
      pullPolicy: IfNotPresent
    skipUpgradeCheck: "true"
    # Vespa container startup guard; keep false by default for safety.
    ignoreNotEnoughMemory: false
    persistence:
      enabled: false
      storageClass: ""
      accessModes:
        - ReadWriteOnce
      size: 10Gi
      existingClaim: ""
    resources:
      requests:
        cpu: 500m
        memory: 2Gi
      limits:
        cpu: "4"
        memory: 6Gi
  minio:
    image:
      repository: minio/minio
      tag: RELEASE.2025-07-23T15-54-02Z-cpuv1
      pullPolicy: IfNotPresent
    service:
      apiPort: 9000
      consolePort: 9001
    auth:
      rootUser: minioadmin
      rootPassword: minioadmin
      existingSecret: ""
      existingSecretUserKey: root-user
      existingSecretPasswordKey: root-password
    persistence:
      enabled: false
      storageClass: ""
      accessModes:
        - ReadWriteOnce
      size: 20Gi
      existingClaim: ""
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 1Gi
  modelServer:
    image:
      repository: onyxdotapp/onyx-model-server
      tag: latest
      pullPolicy: IfNotPresent
    service:
      port: 9000
    resources:
      requests:
        cpu: 250m
        memory: 2Gi
      limits:
        cpu: "2"
        memory: 8Gi
  background:
    enabled: true
    resources:
      requests:
        cpu: 250m
        memory: 1Gi
      limits:
        cpu: "2"
        memory: 3Gi
  postgres:
    image:
      repository: postgres
      tag: "16-alpine"
      pullPolicy: IfNotPresent
    service:
      port: 5432
    auth:
      database: onyx
      username: onyx
      password: "change-me"
      existingSecret: ""
    persistence:
      enabled: false
      storageClass: ""
      accessModes:
        - ReadWriteOnce
      size: 10Gi
      existingClaim: ""
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 1Gi
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 2Gi

# MCP ouroboros_* tools — clawql-ouroboros evolutionary loop (#141). Optional Postgres for durable events (#142).
enableOuroboros: false
# Langfuse eval webhook + ouroboros_propose_seed_revision_from_eval (#250). Requires enableOuroboros.
enableLangfuseEval: false
# When set, injects CLAWQL_OUROBOROS_DATABASE_URL. Prefer envFromSecret / extraEnv if the URL contains credentials.
ouroborosDatabaseUrl: ""
# Optional in-cluster Postgres for Ouroboros event lineage (#142), deployed alongside clawql-mcp.
# When enabled, the chart injects CLAWQL_OUROBOROS_DB_* env vars into clawql-mcp.
ouroborosPostgres:
  enabled: false
  image:
    repository: postgres
    tag: "16-alpine"
    pullPolicy: IfNotPresent
  service:
    port: 5432
  auth:
    database: clawql_ouroboros
    username: clawql
    # Used only when existingSecret is empty. Set via values file / --set-file / secret management, not plaintext in git.
    password: ""
    # Existing secret with key `password`.
    existingSecret: ""
  persistence:
    enabled: false
    storageClass: ""
    accessModes:
      - ReadWriteOnce
    size: 10Gi
    existingClaim: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

# Optional full-stack document pipeline topology (#113).
# When enabled, this chart can co-deploy intake/conversion/archive services
# plus their minimal backing stores for integrated local/self-hosted workflows.
documentPipeline:
  enabled: true
  docling:
    # Layout-aware parse ([#248](https://github.com/danielsmithdevelopment/ClawQL/issues/248)). Large CPU image (~4 GiB); opt-in.
    enabled: false
    image:
      repository: quay.io/docling-project/docling-serve-cpu
      tag: v1.14.3
      pullPolicy: IfNotPresent
    service:
      port: 5001
    resources:
      requests:
        cpu: 250m
        memory: 2Gi
      limits:
        cpu: "2"
        memory: 6Gi
    auth:
      apiKey: ""
      existingSecret: ""
  # Reference classifier HTTP ([#248]) — Compose sample image; opt-in.
  # Pin contract: image.tag (+ env.modelVersion). Optional modelPath / PVC for BYO weights.
  classifier:
    enabled: false
    image:
      repository: ghcr.io/danielsmithdevelopment/clawql-classifier-http
      tag: latest
      pullPolicy: IfNotPresent
    # When empty, chart builds from deployment/samples/classifier-http via values override / local image.
    service:
      port: 8080
    env:
      modelVersion: ""
      minConfidence: "0.85"
      # Optional filesystem pin for BYO weights (sidecar must load MODEL_PATH).
      modelPath: ""
    model:
      # Optional PVC mount for exported weights (joblib/ONNX). Empty = bake into image.
      existingClaim: ""
      mountPath: /models/current
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
  # LangExtract sidecar ([#246]) — reference sample image; opt-in.
  langextract:
    enabled: false
    image:
      repository: ghcr.io/danielsmithdevelopment/clawql-langextract-http
      tag: latest
      pullPolicy: IfNotPresent
    service:
      port: 8090
    env:
      mode: demo
      backend: openrouter
      modelId: deepseek/deepseek-chat
    resources:
      requests:
        cpu: 50m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 1Gi
  # Local Privacy Filter sidecar ([#245]) — backup after Presidio; demo by default.
  privacyFilter:
    enabled: false
    image:
      repository: ghcr.io/danielsmithdevelopment/clawql-privacy-filter-http
      tag: latest
      pullPolicy: IfNotPresent
    service:
      port: 8091
    env:
      mode: demo
      device: cpu
      modelId: openai/privacy-filter
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: "1"
        memory: 4Gi
  tika:
    image:
      repository: apache/tika
      tag: "2.9.2.1"
      pullPolicy: IfNotPresent
    service:
      port: 9998
    resources:
      requests:
        cpu: 50m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 1Gi
  gotenberg:
    image:
      repository: gotenberg/gotenberg
      tag: "8.8"
      pullPolicy: IfNotPresent
    service:
      port: 3000
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 1Gi
  stirling:
    image:
      repository: frooodle/s-pdf
      tag: "latest"
      pullPolicy: IfNotPresent
    service:
      port: 8080
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 2Gi
    auth:
      apiKey: ""
      existingSecret: ""
    security:
      # Enables Stirling user auth/admin features.
      enableLogin: false
      # Keep extra enterprise/admin features available when login is enabled.
      disableAdditionalFeatures: false
  paperless:
    enabled: true
    image:
      repository: ghcr.io/paperless-ngx/paperless-ngx
      # OpenAPI `/api/schema/` (drf-spectacular) exists from v2.15 onward; older tags return SPA login (302).
      tag: "2.15.0"
      pullPolicy: IfNotPresent
    service:
      port: 8000
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: "2"
        memory: 2Gi
    auth:
      apiToken: ""
      secretKey: ""
      # Optional admin bootstrap for paperless-ngx. On startup, the container creates
      # the admin user when it does not already exist.
      adminUser: ""
      adminPassword: ""
      adminMail: ""
      existingSecret: ""
    persistence:
      mediaSize: 20Gi
      dataSize: 10Gi
      consumeSize: 10Gi
      storageClass: ""
      existingMediaClaim: ""
      existingDataClaim: ""
      existingConsumeClaim: ""

# Nextcloud + ConeShare collaboration layer (IDP storage + secure sharing).
# Enable with `idpCollaboration.enabled=true`. Nextcloud uses SQLite in-pod for lab installs;
# point `coneshare.externalUrl` at an existing ConeShare instance or co-deploy `coneshare.enabled`.
idpCollaboration:
  enabled: false
  nextcloud:
    enabled: true
    image:
      repository: nextcloud
      tag: "29-apache"
      pullPolicy: IfNotPresent
    service:
      port: 8080
    auth:
      adminUser: admin
      adminPassword: ""
      existingSecret: ""
    persistence:
      size: 20Gi
      storageClass: ""
      existingClaim: ""
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: "2"
        memory: 2Gi
  coneshare:
    enabled: false
    externalUrl: ""
    image:
      repository: conesharedev/coneshare
      tag: rolling
      pullPolicy: IfNotPresent
    service:
      port: 80
    auth:
      apiToken: ""
      existingSecret: ""
    resources:
