# Default resource names match Kustomize (`clawql-mcp-http`) so kubectl snippets in docs stay familiar.
#
# Naming — Helm key **`vault`** vs **HashiCorp Vault** ([#161](https://github.com/danielsmithdevelopment/ClawQL/issues/161)):
# the **`vault`** block under this file configures Obsidian *memory* storage (Markdown on disk). It does not
# deploy HashiCorp Vault. Use **`hashicorpvault`** for the bundled Vault chart and **`envFromSecret`** /
# **`envFromSecrets`** (or External Secrets) for provider tokens.
fullnameOverride: clawql-mcp-http
nameOverride: ""

replicaCount: 1

# Optional Deployment strategy (e.g. `{ type: Recreate }` on single-node clusters to avoid two pods during rollout).
deploymentStrategy: {}

image:
  repository: ghcr.io/danielsmithdevelopment/clawql-mcp
  tag: latest
  pullPolicy: IfNotPresent

imagePullSecrets: []

serviceAccount:
  create: false
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}

# Extra labels on the MCP pod template (e.g. Istio: sidecar.istio.io/inject).
podLabels: {}

podSecurityContext: {}
securityContext: {}

# VM-level containment for MCP + sandbox workloads (#274). When enabled, the MCP Deployment pod sets
# spec.runtimeClassName — you must install a matching cluster RuntimeClass (e.g. kata-deploy → kata-qemu).
# Kyverno admission is separate: kyverno.runtimeClassPolicy (namespace-scoped). Independent of MCP proxy / JWT.
security:
  kata:
    enabled: false
    runtimeClassName: kata-qemu

service:
  type: LoadBalancer
  # Service port for HTTP (MCP + health + GraphQL). Base Kustomize uses 80 → container 8080.
  http:
    port: 80
    targetPort: 8080
  grpc:
    port: 50051
    targetPort: 50051
  # Extra annotations on the MCP Service (merged after prometheus scrape annotations when enabled).
  annotations: {}

# GET /metrics (OpenMetrics). Prometheus scrape integration — see charts/clawql-mcp/README.md.
metrics:
  # When true, annotate the MCP Service with prometheus.io/* so Prometheus deployments that honor
  # Service annotations pick up ClawQL (notably Istio samples/addons/prometheus.yaml — job
  # kubernetes-service-endpoints). Port must match the HTTP container listen port (service.http.targetPort).
  prometheusScrapeAnnotations:
    enabled: true
    path: /metrics
    port: ""
  # monitoring.coreos.com/v1 ServiceMonitor for Prometheus Operator (kube-prometheus-stack, etc.).
  # Requires the ServiceMonitor CRD; rendered only when enabled and API is available.
  serviceMonitor:
    enabled: false
    # If empty, ServiceMonitor is created in the release namespace.
    namespace: ""
    labels: {}
    interval: 30s
    scrapeTimeout: 10s

# Mirrors docker/kustomize/base/deployment-mcp-http.yaml
# Merged `CLAWQL_PROVIDER`: `all-providers` (default) or e.g. `google`. For a custom id list, set extraEnv / patchDeployment with
# `CLAWQL_BUNDLED_PROVIDERS=…` and omit `CLAWQL_PROVIDER` if needed (see README "Configure the API spec").
provider: all-providers
bundledOffline: "1"
obsidianVaultPath: /vault
port: "8080"
mcpPath: /mcp
nodeOptions: "--max-old-space-size=1536"

enableGrpc: false
enableGrpcReflection: false

# Optional MCP chokepoint (**Deployment** + **Service**) in front of **`clawql-mcp-http`** — Istio ordering,
# JWT/ATR gateway, or **nginx** TCP/HTTP passthrough. Defaults **off**.
# See **docs/security/mcp-proxy-jwt-atr.md** and **docs/integrations/panguard-kubernetes.md**.
mcpProxy:
  enabled: false
  mode: nginx
  replicaCount: 2
  image:
    repository: nginx
    tag: "1.27-alpine"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: "1"
      memory: 256Mi
  securityContext: {}
  podAnnotations: {}
  podLabels: {}
  podSecurityContext: {}
  custom:
    image:
      repository: ""
      tag: latest
      pullPolicy: IfNotPresent
    command: []
    args: []
    extraEnv: []
    resources: {}
    securityContext: {}
    readinessProbe: {}
    livenessProbe: {}
  service:
    type: ClusterIP
    annotations: {}
    http:
      port: 80
      targetPort: 8080
    grpc:
      port: 50051
      targetPort: 50051
  slo:
    prometheusRule:
      enabled: false
      httpP99LatencyThresholdMs: 50
      forDuration: 15m
      labels: {}
      annotations: {}

# memory_ingest / memory_recall (default on). Set false to inject CLAWQL_ENABLE_MEMORY=0.
enableMemory: true
# Document stack: tika, gotenberg, paperless, stirling, onyx in all-providers merge + ingest_external_knowledge + (with enableOnyx) knowledge_search_onyx. Set false to inject CLAWQL_ENABLE_DOCUMENTS=0.
enableDocuments: true

# MCP sandbox_exec — isolated snippets (bridge / Seatbelt / Docker; #207). Default off; set true + bridge URL/token (or CLAWQL_SANDBOX_BACKEND) via extraEnv.
enableSandbox: false

# sandbox_exec **docker** backend on Kubernetes: mount host Docker socket + static `docker` CLI (initContainer).
# Requires enableSandbox: true. Local single-node clusters only (Docker Desktop / Rancher Desktop). See charts/clawql-mcp/README.md.
sandboxDocker:
  enabled: false
  hostSocketPath: /var/run/docker.sock
  # https://download.docker.com/linux/static/stable/<arch>/docker-<version>.tgz
  staticCliVersion: "27.4.1"
  initImage: curlimages/curl:8.11.1
  # Host sockets are often root:docker 660; run MCP container as root so docker CLI can connect (local dev only).
  runAsRootForDockerSocket: false

# MCP notify tool — Slack chat.postMessage (#77). Requires Slack in provider merge + CLAWQL_SLACK_TOKEN (via extraEnv / secret).
enableNotify: false

# MCP hitl_enqueue_label_studio — Label Studio HITL bridge (#228). Requires CLAWQL_LABEL_STUDIO_* via extraEnv / secret.
enableHitlLabelStudio: false

# MCP knowledge_search_onyx — Onyx POST /search/send-search-message (#118). Requires onyx in provider merge + ONYX_BASE_URL + Bearer token (extraEnv / secret).
enableOnyx: false
# When set, injects ONYX_BASE_URL (non-secret). Prefer extraEnv / envFromSecret for ONYX_API_TOKEN.
onyxBaseUrl: ""
onyx:
  enabled: false
  # When true (default), deploy Vespa + OpenSearch + Dragonfly + MinIO + model servers + background worker
  # (matches upstream docker-compose). When false, deploy a minimal postgres-backed API (vector search disabled).
  fullVectorStack: true
  # Merged into every Onyx stack Pod template (Deployments + Vespa StatefulSet), e.g. sidecar.istio.io/inject=false for Istio ambient.
  podAnnotations: {}
  api:
    image:
      repository: onyxdotapp/onyx-backend
      tag: latest
      pullPolicy: IfNotPresent
    # Extra env for onyx-api (Deployment). Example: NUM_RETRIES_ON_STARTUP for slow Vespa/OpenSearch on cold local clusters.
    extraEnv: []
  web:
    image:
      repository: onyxdotapp/onyx-web-server
      tag: latest
      pullPolicy: IfNotPresent
    service:
      port: 3000
  service:
    port: 8080
  authType: basic
  userAuthSecret: "change-me-onyx-user-auth-secret"
  # S3 / MinIO object store (full stack).
  s3:
    fileStoreBucketName: onyx-file-store-bucket
  dragonfly:
    # DragonflyDB only (Redis OSS is not a supported in-chart broker). Celery/Paperless still use redis:// URLs (wire protocol).
    image:
      repository: docker.dragonflydb.io/dragonflydb/dragonfly
      tag: v1.37.2
      pullPolicy: IfNotPresent
    # Passed to the dragonfly binary; empty uses image defaults (--port defaults to 6379).
    args:
      - --logtostderr
    service:
      port: 6379
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: "1"
        memory: 512Mi
  opensearch:
    image:
      repository: opensearchproject/opensearch
      tag: "3.4.0"
      pullPolicy: IfNotPresent
    service:
      port: 9200
    # JVM heap for OpenSearch (raise for production).
    javaOpts: "-Xms512m -Xmx512m"
    # Do not set DISABLE_INSTALL_DEMO_CONFIG=true with OPENSEARCH_INITIAL_ADMIN_PASSWORD:
    # the security plugin then loads without demo TLS and fails ("No SSL configuration found").
    auth:
      adminPassword: "StrongPassword123!"
      existingSecret: ""
      existingSecretPasswordKey: password
    persistence:
      enabled: false
      storageClass: ""
      accessModes:
        - ReadWriteOnce
      size: 10Gi
      existingClaim: ""
    resources:
      requests:
        cpu: 250m
        memory: 1536Mi
      limits:
        cpu: "2"
        memory: 3Gi
  vespa:
    image:
      repository: vespaengine/vespa
      tag: "8.609.39"
      pullPolicy: IfNotPresent
    skipUpgradeCheck: "true"
    # Vespa container startup guard; keep false by default for safety.
    ignoreNotEnoughMemory: false
    persistence:
      enabled: false
      storageClass: ""
      accessModes:
        - ReadWriteOnce
      size: 10Gi
      existingClaim: ""
    resources:
      requests:
        cpu: 500m
        memory: 2Gi
      limits:
        cpu: "4"
        memory: 6Gi
  minio:
    image:
      repository: minio/minio
      tag: RELEASE.2025-07-23T15-54-02Z-cpuv1
      pullPolicy: IfNotPresent
    service:
      apiPort: 9000
      consolePort: 9001
    auth:
      rootUser: minioadmin
      rootPassword: minioadmin
      existingSecret: ""
      existingSecretUserKey: root-user
      existingSecretPasswordKey: root-password
    persistence:
      enabled: false
      storageClass: ""
      accessModes:
        - ReadWriteOnce
      size: 20Gi
      existingClaim: ""
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 1Gi
  modelServer:
    image:
      repository: onyxdotapp/onyx-model-server
      tag: latest
      pullPolicy: IfNotPresent
    service:
      port: 9000
    resources:
      requests:
        cpu: 250m
        memory: 2Gi
      limits:
        cpu: "2"
        memory: 8Gi
  background:
    enabled: true
    resources:
      requests:
        cpu: 250m
        memory: 1Gi
      limits:
        cpu: "2"
        memory: 3Gi
  postgres:
    image:
      repository: postgres
      tag: "16-alpine"
      pullPolicy: IfNotPresent
    service:
      port: 5432
    auth:
      database: onyx
      username: onyx
      password: "change-me"
      existingSecret: ""
    persistence:
      enabled: false
      storageClass: ""
      accessModes:
        - ReadWriteOnce
      size: 10Gi
      existingClaim: ""
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 1Gi
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 2Gi

# MCP ouroboros_* tools — clawql-ouroboros evolutionary loop (#141). Optional Postgres for durable events (#142).
enableOuroboros: false
# When set, injects CLAWQL_OUROBOROS_DATABASE_URL. Prefer envFromSecret / extraEnv if the URL contains credentials.
ouroborosDatabaseUrl: ""
# Optional in-cluster Postgres for Ouroboros event lineage (#142), deployed alongside clawql-mcp.
# When enabled, the chart injects CLAWQL_OUROBOROS_DB_* env vars into clawql-mcp.
ouroborosPostgres:
  enabled: false
  image:
    repository: postgres
    tag: "16-alpine"
    pullPolicy: IfNotPresent
  service:
    port: 5432
  auth:
    database: clawql_ouroboros
    username: clawql
    # Used only when existingSecret is empty. Set via values file / --set-file / secret management, not plaintext in git.
    password: ""
    # Existing secret with key `password`.
    existingSecret: ""
  persistence:
    enabled: false
    storageClass: ""
    accessModes:
      - ReadWriteOnce
    size: 10Gi
    existingClaim: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

# Optional full-stack document pipeline topology (#113).
# When enabled, this chart can co-deploy intake/conversion/archive services
# plus their minimal backing stores for integrated local/self-hosted workflows.
documentPipeline:
  enabled: true
  tika:
    image:
      repository: apache/tika
      tag: "2.9.2.1"
      pullPolicy: IfNotPresent
    service:
      port: 9998
    resources:
      requests:
        cpu: 50m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 1Gi
  gotenberg:
    image:
      repository: gotenberg/gotenberg
      tag: "8.8"
      pullPolicy: IfNotPresent
    service:
      port: 3000
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 1Gi
  stirling:
    image:
      repository: frooodle/s-pdf
      tag: "latest"
      pullPolicy: IfNotPresent
    service:
      port: 8080
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 2Gi
    auth:
      apiKey: ""
      existingSecret: ""
    security:
      # Enables Stirling user auth/admin features.
      enableLogin: false
      # Keep extra enterprise/admin features available when login is enabled.
      disableAdditionalFeatures: false
  paperless:
    enabled: true
    image:
      repository: ghcr.io/paperless-ngx/paperless-ngx
      tag: "2.8.1"
      pullPolicy: IfNotPresent
    service:
      port: 8000
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: "2"
        memory: 2Gi
    auth:
      apiToken: ""
      secretKey: ""
      # Optional admin bootstrap for paperless-ngx. On startup, the container creates
      # the admin user when it does not already exist.
      adminUser: ""
      adminPassword: ""
      adminMail: ""
      existingSecret: ""
    persistence:
      mediaSize: 20Gi
      dataSize: 10Gi
      consumeSize: 10Gi
      storageClass: ""
      existingMediaClaim: ""
      existingDataClaim: ""
      existingConsumeClaim: ""

stores:
  postgres:
    enabled: true
    image:
      repository: postgres
      tag: "16-alpine"
      pullPolicy: IfNotPresent
    service:
      port: 5432
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 1Gi
    auth:
      database: paperless
      username: paperless
      password: "change-me"
      existingSecret: ""
    persistence:
      enabled: true
      size: 10Gi
      storageClass: ""
      accessModes:
        - ReadWriteOnce
      existingClaim: ""
  dragonfly:
    enabled: true
    image:
      repository: docker.dragonflydb.io/dragonflydb/dragonfly
      tag: v1.37.2
      pullPolicy: IfNotPresent
    args:
      - --logtostderr
    service:
      port: 6379
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi

# Optional Apache Flink cluster for in-cluster Onyx connector jobs (#119).
# Default is internal-only networking (ClusterIP), no ingress.
flink:
  enabled: false
  image:
    repository: flink
    tag: "1.19.1-scala_2.12-java17"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    restPort: 8081
    rpcPort: 6123
    blobPort: 6124
    queryPort: 6125
  jobManager:
    replicas: 1
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 1Gi
  taskManager:
    replicas: 2
    taskSlots: 2
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: "2"
        memory: 2Gi
  # Secret with connector credentials (e.g. Slack/Confluence/Jira/Drive tokens).
  # Keys in this secret are injected only into Flink pods, not clawql-mcp.
  connectorSecret: ""
  # Optional explicit Flink process memory sizing (required by some Flink images).
  jobManagerMemoryProcessSize: ""
  taskManagerMemoryProcessSize: ""
  # Additional env entries for both JobManager and TaskManager containers.
  extraEnv: []

# Optional NATS JetStream event backbone for Ouroboros/agents/edge sync (#127).
# Deploys a lightweight single-node NATS with JetStream enabled in-cluster.
nats:
  enabled: false
  # Optional external NATS URL override (for managed/shared clusters).
  # When set, this URL is injected into clawql-mcp as CLAWQL_NATS_URL.
  url: ""
  image:
    repository: nats
    tag: "2.10.17-alpine"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    clientPort: 4222
    clusterPort: 6222
    monitorPort: 8222
  jetStream:
    enabled: true
    # NATS size format, examples: 512Mi, 2Gi.
    maxMemoryStore: 256Mi
    maxFileStore: 10Gi
  persistence:
    enabled: false
    storageClass: ""
    accessModes:
      - ReadWriteOnce
    size: 20Gi
    existingClaim: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
  # Deck-aligned subject roots for JetStream publishers/consumers ([#127](https://github.com/danielsmithdevelopment/ClawQL/issues/127)).
  # Helm deploys NATS only — streams/consumers are created by application workers (Ouroboros, agents, edge), not by templates.
  subjectConvention:
    workflow: clawql.workflow
    agent: clawql.agent
    document: clawql.document
    edge: clawql.edge

# Extra env (e.g. tokens from literal — prefer existing secrets for production).
extraEnv: []

# Optional: load env vars from an existing Secret (keys become env var names).
envFromSecret: ""

# Optional: multiple Secrets merged into envFrom (listed order). Use with External Secrets / VSO → Kubernetes Secrets.
envFromSecrets: []

# When true, chart rendering fails unless envFromSecret or envFromSecrets is set (production posture).
secretSourcing:
  requireVaultBackedSecrets: true

# Bundled HashiCorp Vault Helm chart (**always** installed — see **Chart.yaml** dependencies). Do not set
# **`hashicorpvault.enabled`** to **`false`**; template validation fails (`templates/zzz-defense-in-depth-secrets-policies.yaml`).
hashicorpvault:
  injector:
    enabled: true
  server:
    enabled: true
    dev:
      enabled: false
    # Persist Vault data on a PVC (file backend). Required for KV to survive pod reschedules.
    dataStorage:
      enabled: true
      size: 10Gi

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: "2"
    memory: 2Gi

startupProbe:
  httpGet:
    path: /healthz
    port: http
  periodSeconds: 10
  failureThreshold: 36
  timeoutSeconds: 5

readinessProbe:
  httpGet:
    path: /healthz
    port: http
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  periodSeconds: 30
  timeoutSeconds: 5
  failureThreshold: 3

persistence:
  enabled: false
  storageClass: ""
  accessModes:
    - ReadWriteOnce
  size: 10Gi
  existingClaim: ""

# Obsidian memory Markdown on disk (`memory_ingest` / `memory_recall`). Not HashiCorp Vault — #161.
# Mutually exclusive with persistence.enabled (PVC wins if both are set).
vault:
  hostPath:
    enabled: false
    path: ""
    type: DirectoryOrCreate

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: clawql.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

ui:
  enabled: false
  replicaCount: 1
  image:
    repository: ghcr.io/danielsmithdevelopment/clawql-website
    tag: latest
    pullPolicy: IfNotPresent
  service:
    port: 3000
    targetPort: 3000
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  startupProbe:
    httpGet:
      path: /api/health
      port: http
    periodSeconds: 10
    failureThreshold: 30
    timeoutSeconds: 5
  readinessProbe:
    httpGet:
      path: /api/health
      port: http
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
  livenessProbe:
    httpGet:
      path: /api/health
      port: http
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 3
  ingress:
    enabled: false
    className: nginx
    annotations: {}
    hosts:
      - host: docs.localhost
        paths:
          - path: /
            pathType: Prefix
    tls: []

dashboard:
  enabled: false
  replicaCount: 1
  allowSync: true
  # Optional in-cluster OpenClaw chat HTTP endpoint for Agent Chat.
  # Example (same namespace): http://openclaw:8787/v1/chat
  # Example (cross-namespace): http://openclaw.<ns>.svc.cluster.local:8787/v1/chat
  openclawChatUrl: ""
  image:
    repository: ghcr.io/danielsmithdevelopment/clawql-dashboard
    tag: latest
    pullPolicy: IfNotPresent
  service:
    port: 3040
    targetPort: 3040
  k8s:
    namespace: clawql
    secretName: clawql-provider-env
    deploymentName: clawql-mcp-http
  vault:
    namespace: clawql
    pod: clawql-vault-0
    addr: http://127.0.0.1:8200
    mount: secret
    path: provider/env
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 768Mi
  startupProbe:
    httpGet:
      path: /api/k8s/health
      port: http
    periodSeconds: 10
    failureThreshold: 30
    timeoutSeconds: 5
  readinessProbe:
    httpGet:
      path: /api/k8s/health
      port: http
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
  livenessProbe:
    httpGet:
      path: /api/k8s/health
      port: http
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 3
  ingress:
    enabled: false
    className: nginx
    annotations: {}
    hosts:
      - host: clawql.localhost
        paths:
          - path: /
            pathType: Prefix
    tls: []

# Optional per-service ingresses for HTTP-capable provider stacks.
# Useful for local Docker Desktop hostnames like *.localhost.
providerIngress:
  enabled: false
  className: nginx
  annotations: {}
  tls: []
  paperless:
    enabled: true
    host: paperless.localhost
    path: /
    pathType: Prefix
  stirling:
    enabled: true
    host: stirling.localhost
    path: /
    pathType: Prefix
  tika:
    enabled: true
    host: tika.localhost
    path: /
    pathType: Prefix
  gotenberg:
    enabled: true
    host: gotenberg.localhost
    path: /
    pathType: Prefix
  flink:
    enabled: true
    host: flink.localhost
    path: /
    pathType: Prefix
  natsMonitor:
    enabled: true
    host: nats.localhost
    path: /
    pathType: Prefix
  onyx:
    enabled: true
    host: onyx.localhost
    path: /
    pathType: Prefix

# Optional Istio ServiceEntry / EgressGateway allowlist for bundled SaaS provider HTTPS (#275).
# Requires cluster Istio CRDs. Install **istio-egressgateway** (chart **istio/gateway**) with selector
# **istio: egressgateway** when **throughEgressGateway** is true. See **docs/deployment/helm.md**.
istio:
  egressAllowlist:
    enabled: false
    # Gateway + mesh/egress VirtualServices (TLS passthrough). If false, only **ServiceEntry** resources
    # are created in the release namespace (REGISTRY_ONLY baseline; works with ambient without a gateway).
    throughEgressGateway: true
    egressGatewayNamespace: istio-system
    egressGatewayServiceName: istio-egressgateway
    gatewayName: clawql-provider-egress-gateway

# Kyverno ClusterPolicy: require Cosign (keyless / GitHub Actions) for ClawQL GHCR images (default on).
# Prerequisite: Kyverno installed in the cluster (CRD kyverno.io/v1 ClusterPolicy). For clusters without
# Kyverno, set kyverno.imageSignaturePolicy.enabled=false before install, or install Kyverno first.
kyverno:
  imageSignaturePolicy:
    enabled: true
    # When true, only Pods in the Helm release namespace are matched (useful on shared dev clusters).
    matchReleaseNamespaceOnly: false
    policyName: ""
    policyTitle: "ClawQL GHCR — require Cosign (keyless / GitHub Actions)"
    validationFailureAction: Enforce
    background: false
    failurePolicy: Fail
    webhookTimeoutSeconds: 30
    verifyDigest: false
    mutateDigest: false
    excludeNamespaces:
      - kube-system
      - kyverno
      - kube-public
    imageReferences:
      - "ghcr.io/danielsmithdevelopment/clawql-mcp*"
      - "ghcr.io/danielsmithdevelopment/clawql-panguard-mcp-bridge*"
      - "ghcr.io/danielsmithdevelopment/clawql-website*"
      - "ghcr.io/danielsmithdevelopment/clawql-dashboard*"
    cosign:
      subjectRegExp: "^https://github\\.com/danielsmithdevelopment/ClawQL/.*"
      issuerRegExp: "^https://token\\.actions\\.githubusercontent\\.com.*"
      rekorUrl: "https://rekor.sigstore.dev"
  # Optional ClusterPolicy: require spec.runtimeClassName per namespace lists (Kata vs gVisor tiers).
  # Prerequisite: Kyverno + matching RuntimeClass CRs on nodes. Default off — enabling without Kata/gVisor breaks scheduling.
  # Keep kataNamespaces and gvisorNamespaces disjoint. See docs/security/runtime-class-containment.md.
  runtimeClassPolicy:
    enabled: false
    policyName: ""
    policyTitle: "ClawQL — require RuntimeClass (Kata / gVisor namespaces)"
    validationFailureAction: Enforce
    background: false
    failurePolicy: Fail
    webhookTimeoutSeconds: 30
    # Pods in these namespaces must set spec.runtimeClassName to kataRuntimeClassName.
    kataNamespaces: []
    kataRuntimeClassName: kata-qemu
    # Pods in these namespaces must set spec.runtimeClassName to gvisorRuntimeClassName (lighter isolation tier).
    gvisorNamespaces: []
    gvisorRuntimeClassName: gvisor
    # When non-empty, Pods with this label (any namespace matched above) are excluded from validation.
    exemptPodLabelKey: ""
    exemptPodLabelValue: exempt

nodeSelector: {}
tolerations: []
affinity: {}
