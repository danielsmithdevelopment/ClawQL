# Optional Apache Flink cluster for in-cluster Onyx connector jobs (#119).
# Default is internal-only networking (ClusterIP), no ingress.
flink:
  enabled: false
  image:
    repository: flink
    tag: "1.19.1-scala_2.12-java17"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    restPort: 8081
    rpcPort: 6123
    blobPort: 6124
    queryPort: 6125
  jobManager:
    replicas: 1
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 1Gi
  taskManager:
    replicas: 2
    taskSlots: 2
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: "2"
        memory: 2Gi
  # Secret with connector credentials (e.g. Slack/Confluence/Jira/Drive tokens).
  # Keys in this secret are injected only into Flink pods, not clawql-mcp.
  connectorSecret: ""
  # Optional explicit Flink process memory sizing (required by some Flink images).
  jobManagerMemoryProcessSize: ""
  taskManagerMemoryProcessSize: ""
  # Additional env entries for both JobManager and TaskManager containers.
  extraEnv: []

# Optional NATS JetStream event backbone for Ouroboros/agents/edge sync (#127).
# Deploys a lightweight single-node NATS with JetStream enabled in-cluster.
nats:
  enabled: false
  # Optional external NATS URL override (for managed/shared clusters).
  # When set, this URL is injected into clawql-mcp as CLAWQL_NATS_URL.
  url: ""
  image:
    repository: nats
    tag: "2.10.17-alpine"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    clientPort: 4222
    clusterPort: 6222
    monitorPort: 8222
  jetStream:
    enabled: true
    # NATS size format, examples: 512Mi, 2Gi.
    maxMemoryStore: 256Mi
    maxFileStore: 10Gi
  persistence:
    enabled: false
    storageClass: ""
    accessModes:
      - ReadWriteOnce
    size: 20Gi
    existingClaim: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
  # Deck-aligned subject roots for JetStream publishers/consumers ([#127](https://github.com/danielsmithdevelopment/ClawQL/issues/127)).
  # Helm deploys NATS only — streams/consumers are created by application workers (Ouroboros, agents, edge), not by templates.
  subjectConvention:
    workflow: clawql.workflow
    agent: clawql.agent
    document: clawql.document
    edge: clawql.edge
  # MCP publish + optional embedded consumer ([#254]). Standalone worker + KEDA ([#257]).
  appIntegration:
    publish: false
    # When true and nats.worker.enabled=false, run consumer inside clawql-mcp-http.
    embeddedConsumer: true
  worker:
    enabled: false
    replicas: 1
    # Document JetStream consumers (Nextcloud inbox → run_idp_pipeline; Coneshare analytics follow-up).
    idpPipeline: false
    coneshareFollowup: false
    # When idpPipeline=true, worker calls MCP internal URL if documents deps are not in-process.
    mcpInternalUrl: ""
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: "1"
        memory: 512Mi
  # IDP agent bridge (#128): terminal/viewer document events → MCP memory_ingest / notify.
  # Pair with Hermes or Pi as the interactive MCP client — see deployment/samples/idp-nats-agent/.
  agentBridge:
    enabled: false
    replicas: 1
    durable: clawql-idp-agent-bridge
    # Streamable HTTP MCP (defaults to in-cluster clawql-mcp Service /mcp).
    mcpHttpUrl: ""
    # Optional Slack channel on pipeline.failed.
    notifyChannel: ""
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: "500m"
        memory: 256Mi
  keda:
    enabled: false
    # Requires KEDA (https://keda.sh) installed in the cluster.
    minReplicaCount: 0
    maxReplicaCount: 10
    lagThreshold: "5"
    activationLagThreshold: "1"
    pollingInterval: 15
    cooldownPeriod: 300
    account: "$G"
    # Defaults match clawql-automation env (CLAWQL_WORKFLOW / clawql-hitl-resume).
    stream: ""
    consumer: ""
    # Extra JetStream durables for KEDA lag (beyond HITL / idpPipeline / coneshareFollowup auto-triggers).
    extraConsumers: []
    # Pre-create JetStream consumer so KEDA can read lag before first worker pod.
    bootstrapConsumer: true

# Extra env (e.g. tokens from literal — prefer existing secrets for production).
extraEnv: []

# Optional: load env vars from an existing Secret (keys become env var names).
# Default name matches External Secrets + `make bootstrap-vault-eso` ([#241](https://github.com/danielsmithdevelopment/ClawQL/issues/241)).
envFromSecret: clawql-provider-env

# Optional: multiple Secrets merged into envFrom (listed order). Use with External Secrets / VSO → Kubernetes Secrets.
envFromSecrets: []

# Vault-backed provider credentials — production default ([#241](https://github.com/danielsmithdevelopment/ClawQL/issues/241)).
# `requireVaultBackedSecrets: true` (default) fails render without `envFromSecret` / `envFromSecrets`.
# Set `false` only in lab overlays that accept non-Vault env sourcing (not recommended for production).
secretSourcing:
  requireVaultBackedSecrets: true
  externalSecrets:
    # Render ClusterSecretStore + ExternalSecret (requires External Secrets Operator CRDs in cluster).
    enabled: false
    secretName: clawql-provider-env
    clusterSecretStoreName: ""
    vaultServer: ""
    vaultMount: secret
    vaultKvPath: clawql/providers
    vaultAuthRole: clawql-eso-read
    kubernetesAuthMount: kubernetes
    refreshInterval: 5m
    esoServiceAccount:
      name: external-secrets
      namespace: external-secrets
  # Vault KV `secret/clawql/providers` property → Kubernetes Secret key (becomes container env var).
  providerEnvMapping:
    - { property: githubToken, envKey: CLAWQL_GITHUB_TOKEN }
    - { property: slackToken, envKey: CLAWQL_SLACK_TOKEN }
    - { property: onyxApiToken, envKey: ONYX_API_TOKEN }
    - { property: paperlessApiToken, envKey: PAPERLESS_API_TOKEN }
    - { property: stirlingApiKey, envKey: STIRLING_API_KEY }
    - { property: doclingApiKey, envKey: DOCLING_API_KEY }
    - { property: nextcloudUsername, envKey: NEXTCLOUD_USERNAME }
    - { property: nextcloudAppPassword, envKey: NEXTCLOUD_APP_PASSWORD }
    - { property: coneshareApiToken, envKey: CONESHARE_API_TOKEN }
    - { property: cloudflareApiToken, envKey: CLAWQL_CLOUDFLARE_API_TOKEN }
    - { property: googleAccessToken, envKey: CLAWQL_GOOGLE_ACCESS_TOKEN }
    - { property: atlassianApiToken, envKey: CLAWQL_ATLASSIAN_TOKEN }
    - { property: labelStudioApiToken, envKey: CLAWQL_LABEL_STUDIO_API_TOKEN }
    - { property: hitlWebhookToken, envKey: CLAWQL_HITL_WEBHOOK_TOKEN }
    - { property: coneshareWebhookToken, envKey: CLAWQL_CONESHARE_WEBHOOK_TOKEN }

# Bundled HashiCorp Vault Helm chart (**always** installed — see **Chart.yaml** dependencies). Do not set
# **`hashicorpvault.enabled`** to **`false`**; template validation fails (`templates/zzz-defense-in-depth-secrets-policies.yaml`).
hashicorpvault:
  injector:
    enabled: true
  server:
    enabled: true
    dev:
      enabled: false
    # Persist Vault data on a PVC (file backend). Required for KV to survive pod reschedules.
    dataStorage:
      enabled: true
      size: 10Gi

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: "2"
    memory: 2Gi

startupProbe:
