        - ReadWriteOnce
      existingClaim: ""
  dragonfly:
    enabled: true
    image:
      repository: docker.dragonflydb.io/dragonflydb/dragonfly
      tag: v1.37.2
      pullPolicy: IfNotPresent
    args:
      - --logtostderr
    service:
      port: 6379
    resources:
