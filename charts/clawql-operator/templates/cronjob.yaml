{{- if .Values.operator.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "clawql-operator.fullname" . }}-reconcile
  labels:
    {{- include "clawql-operator.labels" . | nindent 4 }}
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            {{- include "clawql-operator.labels" . | nindent 12 }}
        spec:
          serviceAccountName: {{ include "clawql-operator.fullname" . }}
          restartPolicy: OnFailure
          containers:
            - name: operator
              image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              command: ["node", "/app/node_modules/clawql-operator/dist/cli.cjs"]
              args:
                {{- range .Values.operator.extraArgs }}
                - {{ . | quote }}
                {{- end }}
              resources:
                {{- toYaml .Values.resources | nindent 16 }}
{{- end }}
