# Tier 1 local stack — MCP + document pipeline + vault memory ([#251](https://github.com/danielsmithdevelopment/ClawQL/issues/251)).
# Run `./bootstrap.sh` first, then `docker compose up -d`.
services:
  clawql-mcp-http:
    build:
      context: ../..
      dockerfile: docker/Dockerfile
      target: runtime
    image: clawql-mcp:local-tier1
    container_name: clawql-mcp-http
    restart: unless-stopped
    depends_on:
      - tika
      - gotenberg
      - paperless-ngx
    environment:
      PORT: "8080"
      CLAWQL_PROVIDER: default
      CLAWQL_OBSIDIAN_VAULT_PATH: /vault
      CLAWQL_ENABLE_MEMORY: "1"
      CLAWQL_ENABLE_DOCUMENTS: "1"
      CLAWQL_ENABLE_PAGEINDEX: "1"
      CLAWQL_PAGEINDEX_PATH: /vault
      TIKA_BASE_URL: http://tika:9998
      GOTENBERG_BASE_URL: http://gotenberg:3000
      PAPERLESS_BASE_URL: http://paperless-ngx:8000
    volumes:
      - ${CLAWQL_VAULT_HOST_PATH:-./data/vault}:/vault
    ports:
      - "${CLAWQL_API_PORT:-8080}:8080"

  tika:
    image: apache/tika:2.9.2.1
    container_name: clawql-tika
    restart: unless-stopped
    ports:
      - "9998:9998"

  gotenberg:
    image: gotenberg/gotenberg:8.8
    container_name: clawql-gotenberg
    restart: unless-stopped
    command: ["gotenberg", "--api-timeout=60s"]
    ports:
      - "3000:3000"

  redis:
    image: redis:7-alpine
    container_name: clawql-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  postgres:
    image: postgres:16-alpine
    container_name: clawql-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: paperless
      POSTGRES_USER: paperless
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-paperless}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paperless -d paperless"]
      interval: 10s
      timeout: 5s
      retries: 5

  paperless-ngx:
    image: ghcr.io/paperless-ngx/paperless-ngx:2.15.0
    container_name: clawql-paperless-ngx
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      tika:
        condition: service_started
      gotenberg:
        condition: service_started
    environment:
      PAPERLESS_URL: http://paperless-ngx:8000
      PAPERLESS_TIKA_ENABLED: "1"
      PAPERLESS_TIKA_ENDPOINT: http://tika:9998
      PAPERLESS_TIKA_GOTENBERG_ENDPOINT: http://gotenberg:3000
      PAPERLESS_REDIS: redis://redis:6379
      PAPERLESS_DBHOST: postgres
      PAPERLESS_DBPORT: "5432"
      PAPERLESS_DBNAME: paperless
      PAPERLESS_DBUSER: paperless
      PAPERLESS_DBPASS: ${POSTGRES_PASSWORD:-paperless}
      PAPERLESS_SECRET_KEY: ${PAPERLESS_SECRET_KEY:-change-me-local-tier1}
      PAPERLESS_ADMIN_USER: ${PAPERLESS_ADMIN_USER:-admin}
      PAPERLESS_ADMIN_PASSWORD: ${PAPERLESS_ADMIN_PASSWORD:-admin}
      PAPERLESS_ADMIN_MAIL: ${PAPERLESS_ADMIN_MAIL:-admin@localhost}
    volumes:
      - paperless-data:/usr/src/paperless/data
      - paperless-media:/usr/src/paperless/media
      - paperless-consume:/usr/src/paperless/consume
    ports:
      - "8000:8000"

volumes:
  postgres-data:
  paperless-data:
  paperless-media:
  paperless-consume:
