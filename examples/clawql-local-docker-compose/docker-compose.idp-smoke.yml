# IDP B-2.3 smoke stack — compose-able DEFAULT_IDP_PIPELINE vendors.
# Used by scripts/dev/smoke-idp-pipeline-b23.sh (tier=compose).
#
# Included: tika, gotenberg, stirling, paperless (+postgres/redis), nextcloud,
#           onyx (minimal postgres-backed API — Helm fullVectorStack=false),
#           coneshare (open-source conesharedev/coneshare + postgres/redis)
# Optional profile `docling`: quay.io/docling-project/docling-serve-cpu (large ~4GiB)

name: clawql-idp-smoke

services:
  tika:
    image: apache/tika:2.9.2.1
    container_name: clawql-idp-tika
    ports:
      - "9998:9998"

  gotenberg:
    image: gotenberg/gotenberg:8.8
    container_name: clawql-idp-gotenberg
    command: ["gotenberg", "--api-timeout=60s"]
    ports:
      - "3000:3000"

  stirling:
    image: frooodle/s-pdf:0.45.0
    container_name: clawql-idp-stirling
    environment:
      DOCKER_ENABLE_SECURITY: "false"
      SECURITY_ENABLE_LOGIN: "false"
      # Match Helm lab default when auth is off — empty key is fine for smoke.
      API_KEY: ""
    ports:
      - "18080:8080"

  redis:
    image: redis:7-alpine
    container_name: clawql-idp-redis

  postgres:
    image: postgres:16-alpine
    container_name: clawql-idp-postgres
    environment:
      POSTGRES_DB: paperless
      POSTGRES_USER: paperless
      POSTGRES_PASSWORD: paperless
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paperless -d paperless"]
      interval: 5s
      timeout: 5s
      retries: 12

  paperless-ngx:
    image: ghcr.io/paperless-ngx/paperless-ngx:2.15.0
    container_name: clawql-idp-paperless
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      tika:
        condition: service_started
      gotenberg:
        condition: service_started
    environment:
      # Host URL — CSRF / absolute links when hitting published port 8000
      PAPERLESS_URL: http://127.0.0.1:8000
      PAPERLESS_CSRF_TRUSTED_ORIGINS: http://127.0.0.1:8000,http://localhost:8000
      PAPERLESS_ALLOWED_HOSTS: localhost,127.0.0.1,paperless-ngx
      PAPERLESS_TIKA_ENABLED: "1"
      PAPERLESS_TIKA_ENDPOINT: http://tika:9998
      PAPERLESS_TIKA_GOTENBERG_ENDPOINT: http://gotenberg:3000
      PAPERLESS_REDIS: redis://redis:6379
      PAPERLESS_DBHOST: postgres
      PAPERLESS_DBPORT: "5432"
      PAPERLESS_DBNAME: paperless
      PAPERLESS_DBUSER: paperless
      PAPERLESS_DBPASS: paperless
      PAPERLESS_SECRET_KEY: clawql-idp-smoke-secret
      PAPERLESS_ADMIN_USER: admin
      PAPERLESS_ADMIN_PASSWORD: admin
      PAPERLESS_ADMIN_MAIL: admin@localhost
      # Faster first boot on GHA (skip heavy OCR worker spin-up for smoke)
      PAPERLESS_WORKER_TIMEOUT: "60"
      PAPERLESS_TASK_WORKERS: "1"
      PAPERLESS_THREADS_PER_WORKER: "1"
    volumes:
      - paperless-data:/usr/src/paperless/data
      - paperless-media:/usr/src/paperless/media
      - paperless-export:/usr/src/paperless/export
      - paperless-consume:/usr/src/paperless/consume
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000"]
      interval: 10s
      timeout: 5s
      retries: 36
      start_period: 90s

  nextcloud:
    image: nextcloud:29-apache
    container_name: clawql-idp-nextcloud
    environment:
      SQLITE_DATABASE: nextcloud
      NEXTCLOUD_ADMIN_USER: admin
      NEXTCLOUD_ADMIN_PASSWORD: admin
      NEXTCLOUD_TRUSTED_DOMAINS: localhost 127.0.0.1 nextcloud
    ports:
      - "18081:80"

  # --- Onyx (minimal / Helm fullVectorStack=false) ---
  # Upsert ingestion API without OpenSearch/Vespa/model servers (fits GHA RAM).
  onyx-postgres:
    image: postgres:15.2-alpine
    container_name: clawql-idp-onyx-postgres
    environment:
      POSTGRES_DB: onyx
      POSTGRES_USER: onyx
      POSTGRES_PASSWORD: onyx
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U onyx -d onyx"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - onyx-pg-data:/var/lib/postgresql/data

  onyx-api:
    image: onyxdotapp/onyx-backend:latest
    container_name: clawql-idp-onyx-api
    depends_on:
      onyx-postgres:
        condition: service_healthy
    command:
      - /bin/sh
      - -c
      - >
        alembic upgrade head &&
        echo "Starting Onyx Api Server" &&
        uvicorn onyx.main:app --host 0.0.0.0 --port 8080
    environment:
      AUTH_TYPE: basic
      USER_AUTH_SECRET: clawql-idp-smoke-onyx-user-auth-secret
      POSTGRES_HOST: onyx-postgres
      POSTGRES_USER: onyx
      POSTGRES_PASSWORD: onyx
      POSTGRES_DB: onyx
      DISABLE_VECTOR_DB: "true"
      FILE_STORE_BACKEND: postgres
      CACHE_BACKEND: postgres
      AUTH_BACKEND: postgres
      # Skip slow document-index retries when vector DB is disabled.
      NUM_RETRIES_ON_STARTUP: "2"
      ENABLE_CRAFT: "false"
    ports:
      - "18082:8080"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')",
        ]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 180s

  # --- ConeShare (open-source: https://github.com/coneshare/coneshare-compose) ---
  coneshare-postgres:
    image: postgres:14-bullseye
    container_name: clawql-idp-coneshare-postgres
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - coneshare-pg-data:/var/lib/postgresql/data

  coneshare-redis:
    image: redis:6.2.14-alpine
    container_name: clawql-idp-coneshare-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    volumes:
      - coneshare-redis-data:/data

  coneshare-web:
    image: conesharedev/coneshare:rolling
    container_name: clawql-idp-coneshare-web
    env_file:
      - ./coneshare-smoke.env
    depends_on:
      coneshare-postgres:
        condition: service_healthy
      coneshare-redis:
        condition: service_healthy
    volumes:
      - coneshare-data:/data
      - coneshare-media:/home/coneshare/app/media
      - coneshare-logs:/home/coneshare/logs
    ports:
      - "8999:80"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1/api/v1/_health/"]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 120s

  coneshare-celery:
    image: conesharedev/coneshare:rolling
    container_name: clawql-idp-coneshare-celery
    env_file:
      - ./coneshare-smoke.env
    command: celery -A backend worker --loglevel=info -Q celery --concurrency=1
    depends_on:
      coneshare-postgres:
        condition: service_healthy
      coneshare-redis:
        condition: service_healthy
      coneshare-web:
        condition: service_started
    volumes:
      - coneshare-data:/data
      - coneshare-media:/home/coneshare/app/media
      - coneshare-logs:/home/coneshare/logs

  # Optional — enable with: docker compose --profile docling up -d
  docling:
    profiles: ["docling"]
    image: quay.io/docling-project/docling-serve-cpu:v1.14.3
    container_name: clawql-idp-docling
    ports:
      - "5001:5001"

volumes:
  paperless-data:
  paperless-media:
  paperless-export:
  paperless-consume:
  onyx-pg-data:
  coneshare-pg-data:
  coneshare-redis-data:
  coneshare-data:
  coneshare-media:
  coneshare-logs:
