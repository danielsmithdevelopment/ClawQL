# nginx edge for Managed Edge Gateway — one hostname for /mcp + /v1
worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  access_log /dev/stdout combined;
  client_max_body_size 32m;
  proxy_read_timeout 600s;
  proxy_send_timeout 600s;

  upstream clawql_mcp {
    server clawql-mcp-http:8080;
  }

  upstream clawql_inference {
    server clawql-inference:8080;
  }

  server {
    listen 8080;
    server_name _;

    location = /healthz {
      default_type application/json;
      return 200 '{"ok":true,"gateway":"managed-edge","mcp":"/mcp","inference":"/v1"}';
    }

    location /mcp {
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Authorization $http_authorization;
      proxy_set_header Connection "";
      proxy_buffering off;
      proxy_pass http://clawql_mcp;
    }

    location /v1/ {
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Authorization $http_authorization;
      proxy_set_header Connection "";
      proxy_buffering off;
      proxy_pass http://clawql_inference;
    }

    location = /v1 {
      return 301 /v1/;
    }
  }
}
