# Managed Edge Gateway — MCP (/mcp) + inference (/v1) + vault memory behind one port.
#
# Secure defaults: CLAWQL_AUTH_MODE=apiKey, CLAWQL_INFERENCE_KEYS_ENABLED=1.
# Generate materials with: clawql gateway create --profile local-docker
#
# Run from this directory:
#   docker compose --env-file .env up -d --build

services:
  gateway:
    image: nginx:1.27-alpine
    container_name: clawql-managed-gateway
    restart: unless-stopped
    depends_on:
      - clawql-mcp-http
      - clawql-inference
    ports:
      - "${CLAWQL_GATEWAY_PORT:-8080}:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro

  clawql-mcp-http:
    build:
      context: ../..
      dockerfile: docker/Dockerfile
      target: runtime
    image: clawql-mcp:managed-gateway
    container_name: clawql-managed-mcp
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      PORT: "8080"
      MCP_PATH: /mcp
      CLAWQL_PROVIDER: ${CLAWQL_PROVIDER:-default}
      CLAWQL_OBSIDIAN_VAULT_PATH: /vault
      CLAWQL_ENABLE_MEMORY: "1"
      CLAWQL_AUTH_MODE: apiKey
      CLAWQL_API_KEY: ${CLAWQL_API_KEY:?CLAWQL_API_KEY is required — run clawql gateway create}
      CLAWQL_HOME: /clawql-home
    volumes:
      - ${CLAWQL_VAULT_HOST_PATH:-./data/vault}:/vault
      - ${CLAWQL_HOME_HOST_PATH:-./data/clawql-home}:/clawql-home
    # No host ports — only reachable via gateway

  clawql-inference:
    build:
      context: ../..
      dockerfile: docker/Dockerfile
      target: runtime
    image: clawql-mcp:managed-gateway
    container_name: clawql-managed-inference
    restart: unless-stopped
    command: ["packages/clawql-inference/bin/clawql-inference.mjs"]
    expose:
      - "8080"
    environment:
      CLAWQL_HOME: /clawql-home
      CLAWQL_INFERENCE_PORT: "8080"
      CLAWQL_INFERENCE_HOST: "0.0.0.0"
      CLAWQL_INFERENCE_KEYS_ENABLED: "1"
      CLAWQL_INFERENCE_POLICY_MANIFEST: /clawql-home/Inference/policy.yaml
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      XAI_API_KEY: ${XAI_API_KEY:-}
      FIREWORKS_API_KEY: ${FIREWORKS_API_KEY:-}
      TOGETHER_API_KEY: ${TOGETHER_API_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-}
    volumes:
      - ${CLAWQL_HOME_HOST_PATH:-./data/clawql-home}:/clawql-home
