# Gitleaks configuration for ClawQL.
# Bundled OpenAPI / Discovery specs under providers/ contain vendor examples,
# JWT samples, and placeholder keys — not repository secrets.

title = "ClawQL"

[extend]
useDefault = true

# `paths` are regexes matched against the file path in each finding (see gitleaks README).
[allowlist]
description = "Upstream provider specs are vendor artifacts; OpenBench task fixtures use deliberate fake markers; build outputs and dependencies are not committed."
paths = [
  '''(^|/)providers/''',
  '''(^|/)node_modules/''',
  '''\.open-next/''',
  '''(^|/)apps/docs/\.next/''',
  '''(^|/)dist/''',
  '''(^|/)packages/[^/]+/dist/''',
  '''(^|/)coverage/''',
  '''(^|/)packages/mcp-grpc-transport/test-fixtures/''',
  '''(^|/)benchmarks/openbench/tasks/''',
  # Public IETF RFCs used as pageindex-ab hard-candidate docs (OAuth examples etc.).
  '''(^|/)benchmarks/pageindex-ab/corpus/hard-candidate/docs/rfc''',
  '''(^|/)benchmarks/pageindex-ab/corpus/seed/rfc''',
  # Rank/diagnostic fixtures quote the same RFC OAuth example tokens/section ids.
  '''(^|/)benchmarks/pageindex-ab/design/''',
  '''\.test\.ts$''',
]
