# PriorityClasses for celld burst + filler preemption
# Spec: docs/streams/aws-celld-burst.md §5.2
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: celld-critical
value: 1000000
preemptionPolicy: PreemptLowerPriority
globalDefault: false
description: celld process — never preempted; always wins the node
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: business-critical
value: 500000
preemptionPolicy: PreemptLowerPriority
globalDefault: false
description: Small set of services that cannot tolerate kill-and-reschedule
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: filler-workload
value: 100
preemptionPolicy: Never
globalDefault: true
description: Default filler — disposable; keep terminationGracePeriodSeconds short
