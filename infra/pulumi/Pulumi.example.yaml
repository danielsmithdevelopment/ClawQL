config:
  clawql:cloud:
    description: Target cloud (aws | gcp | cloudflare)
  clawql:profile:
    description: Provisioning profile (golden-host | team-vault | edge | idp-k3s | eks)
  clawql:tier:
    description: Managed tier (shared | dedicated | enterprise)
  clawql:tenantId:
    description: Tenant id (required for dedicated tier)
  clawql:syncBucket:
    description: Team vault / R2 object storage bucket name
  clawql:syncProvider:
    description: Object storage provider for team sync (r2 | s3 | gcs)
  clawql:syncPrefix:
    description: Optional override for enterprise tier sync prefix
  clawql:goldenImageId:
    description: Packer golden image id (AWS AMI id or GCP image self link) — golden-host only
  clawql:instanceType:
    description: VM instance type / machine type
  clawql:region:
    description: Cloud region (AWS/GCP)
  clawql:deployWorkerStub:
    description: edge profile — deploy health/IDP-stub WorkersScript (true/false)
  clawql:ebsVolumeSizeGb:
    description: idp-k3s data volume size (default 200)
  clawql:eksClusterName:
    description: eks profile cluster name
  clawql:subnetIds:
    description: eks profile comma-separated subnet ids
  cloudflare:accountId:
    description: Cloudflare account id (cloudflare stacks)
  gcp:project:
    description: GCP project id (gcp stacks)
