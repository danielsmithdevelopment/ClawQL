# ClawQL AppProject — destination + source allowlists for GitOps
# Apply: kubectl apply -f infra/gitops/projects/clawql.yaml -n argocd
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: clawql
  namespace: argocd
spec:
  description: ClawQL IDP + MCP + Argo Workflows (.cqw)
  # Audit 7.53: pin org repo only (no fork "*").
  sourceRepos:
    - https://github.com/danielsmithdevelopment/ClawQL.git
    - https://github.com/danielsmithdevelopment/ClawQL
  destinations:
    - namespace: clawql
      server: https://kubernetes.default.svc
    - namespace: clawql-*
      server: https://kubernetes.default.svc
    - namespace: argo
      server: https://kubernetes.default.svc
    - namespace: argocd
      server: https://kubernetes.default.svc
    - namespace: karpenter
      server: https://kubernetes.default.svc
    - namespace: infrastructure
      server: https://kubernetes.default.svc
    - namespace: pipeline
      server: https://kubernetes.default.svc
    - namespace: archive
      server: https://kubernetes.default.svc
    - namespace: tenant-*
      server: https://kubernetes.default.svc
  # Resource kind "*" is still needed for CRD/operator bootstrap; pin sources above (audit 7.53).
  # Regulated clusters should replace these with an explicit kind allowlist.
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
